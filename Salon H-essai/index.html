  /* ---------- Morceaux affichés dans l'appli ---------- */
  // Une seule ligne à la fois sur Aujourd'hui (ou rien). Elle tient sur une
  // ligne, à la place du sous-titre du bandeau : aucune hauteur ajoutée.
  // Ordre (cahier §5.8, puis les lignes du compte) : déménagement, échéance
  // (J-3 à J), grâce, paiement en vérification, paiement validé, inscription,
  // reconnexion, conditions mises à jour, saisie oubliée, sauvegarde.
  // « ✕ » (Plus tard) cache une ligne de rappel pour la journée.
  function carteAujourdhui(){
    if(!cfg) return "";
    chargerCompte();
    var l = ligneDuJour();
    if(!l) return "";
    if(l.rappel && memoire.rappelsVus[l.type] !== jourLocal()){
      memoire.rappelsVus[l.type] = jourLocal();
      compter("rappel.affiche." + l.type);
    }
    return l.html;
  }
  function cacheAujourdhui(type){
    var r = compte.rappels;
    return !!(r && r.plusTard && r.plusTard[clePlusTard(type)] === jourLocal());
  }
  function merciIci(){ var s = compte.statut; return !s || !s.formule || formuleOuvreAppli(s.formule); }
  // Une pastille (et, pour un rappel, son « ✕ » Plus tard).
  function pastilleRappel(type, action, test, texte, avecPlusTard){
    // Sur deux lignes, jamais « · Noter » seul en début de ligne, ni « 3 » séparé de « jours ».
    texte = String(texte).replace(/ · /g, "\u00a0·\u00a0").replace(/(\d) (?=[^\d])/g, "$1\u00a0");
    var b = '<button type="button" class="mdc-pastille" data-mdc="' + action + '"' + (avecPlusTard ? ' data-rappel="' + type + '"' : '') + ' data-test="' + test + '">' + esc(texte) + '</button>';
    if(!avecPlusTard) return b;
    return '<span class="mdc-ligne" data-test="ligne-rappel" data-type="' + type + '">' + b +
      '<button type="button" class="mdc-ligne-x" data-mdc="rappel-plus-tard" data-val="' + type + '" data-test="rappel-plus-tard" aria-label="Plus tard">✕</button></span>';
  }
  function ligneDuJour(){
    if(demenagementVisible()) return { type: "demenagement", html: '<button type="button" class="mdc-pastille" data-mdc="ouvrir-demenagement" data-test="carte-demenagement">MonDjai déménage · 3 gestes</button>' };
    var st = statutCourant(), enCoursP = paiementEnCoursIci(), jour = jourLocal();
    if(!enCoursP && (st.valeur === "essai" || st.valeur === "abonnee") && st.joursRestants !== null && st.joursRestants <= JOURS_AVIS_ECHEANCE && (st.source === "serveur" || st.accesFin) && !cacheAujourdhui("echeance")){
      var essai = st.valeur === "essai";
      var debutTexte = st.source === "local" ? "Votre accès finit le " : essai ? "Votre essai finit le " : "Votre abonnement finit le ";
      return { type: "echeance", rappel: true, html: pastilleRappel("echeance", "ouvrir-abonnement", "carte-echeance",
        debutTexte + dateFr(st.accesFin).slice(0, 5) + (st.dejaAbonnee ? " · Me réabonner" : " · M’abonner"), true) };
    }
    if(!enCoursP && st.valeur === "grace"){
      return { type: "grace", html: '<button type="button" class="mdc-pastille" data-mdc="ouvrir-abonnement" data-test="carte-grace">' +
        esc((st.dejaAbonnee ? "Abonnement terminé" : "Essai terminé") + " · encore " + joursLisibles(st.joursGrace) + " pour noter") + '</button>' };
    }
    if(enCoursP || st.valeur === "confiance") return { type: "verification", html: '<button type="button" class="mdc-pastille" data-mdc="ouvrir-abonnement" data-test="carte-verification">Paiement en cours de vérification</button>' };
    if(compte.merci && compte.merci.vu && compte.merci.le === jour && merciIci() && !cacheAujourdhui("paiement")){
      return { type: "paiement", rappel: true, html: pastilleRappel("paiement", "ouvrir-abonnement", "carte-merci", "Merci ! Abonnée jusqu’au " + dateFr(compte.merci.fin).slice(0, 5), true) };
    }
    if(inscriptionATerminer() && !cacheAujourdhui("inscription")) return { type: "inscription", rappel: true, html: pastilleRappel("inscription", "ouvrir-inscription", "carte-inscription", "Terminez votre inscription · 1 minute", true) };
    if(compte.id && !estConnecte()) return { type: "reconnexion", html: '<button type="button" class="mdc-pastille" data-mdc="ouvrir-reconnexion" data-test="carte-reconnexion">Reconnectez-vous · 1 minute</button>' };
    if(conditionsAAnnoncer()) return { type: "conditions", html: '<button type="button" class="mdc-pastille" data-mdc="lire-conditions-maj" data-test="carte-conditions">Conditions mises à jour · Lire</button>' };
    var n = joursSansSaisie();
    if(n >= JOURS_SANS_SAISIE && st.saisieOuverte && rappelSaisieIci() && !cacheAujourdhui("saisie")){
      return { type: "saisie", rappel: true, html: pastilleRappel("saisie", "rappel-noter", "carte-saisie", "Rien noté depuis " + n + " jours · Noter", true) };
    }
    if(joursSansSauvegarde() > JOURS_SANS_SAUVEGARDE && !cacheAujourdhui("sauvegarde")){
      return { type: "sauvegarde", rappel: true, html: pastilleRappel("sauvegarde", "rappel-sauvegarde", "carte-sauvegarde", "Sauvegardez vos données · 10 secondes", true) };
    }
    return null;
  }
  // Jours sans rien noter, jamais comptés avant le premier jour d'usage de
  // l'appli (installation). Une recette du soir compte comme une saisie.
  function joursSansSaisie(){
    var base = plusTardif(appel("derniereSaisie", null), appel("debutUsage", null));
    if(!base || !/^\d{4}-\d{2}-\d{2}$/.test(base)) return 0;
    return Math.max(0, ecartJours(base, jourLocal()));
  }
  // Jours depuis la dernière sauvegarde (en ligne ou en fichier), ou depuis le
  // premier jour d'usage s'il n'y en a jamais eu. 0 tant que rien n'est noté.
  function joursSansSauvegarde(){
    if(appel("etatVide", true) === true) return 0;
    var s = sauvegardeIci();
    var base = plusTardif(s.derniereLe || null, appel("derniereSauvegardeFichier", null)) || appel("debutUsage", null);
    if(!base || !/^\d{4}-\d{2}-\d{2}$/.test(base)) return 0;
    return Math.max(0, ecartJours(base, jourLocal()));
  }
  // Inscription faite avec le texte provisoire : une ligne, un seul jour, jamais bloquante.
  function conditionsAAnnoncer(){
    if(!compte.id || compte.conditionsVersion === CONDITIONS_VERSION) return false;
    var a = compte.conditionsAnnonce;
    if(a && (a.lue || a.le !== jourLocal())) return false;
    if(!a) modifierCompte(function(c){ c.conditionsAnnonce = { le: jourLocal(), lue: false }; });
    return true;
  }
  function ligneReglages(){
    if(!cfg) return "";
    chargerCompte();
    var c = couleursCarte();
    var pastille = '<i style="background:' + esc(c.haut) + ';color:' + esc(c.encre) + ';">';
    if(!compte.id && !compte.enAttente){
      return '<button type="button" class="mdc-reglage" data-mdc="ouvrir-inscription" data-test="reglage-compte">' + pastille + '+</i>' +
        '<span><b>Terminez votre inscription</b><small>1 minute</small></span><em aria-hidden="true">›</em></button>';
    }
    var nomComplet = (compte.prenom || "") + (compte.nom ? " " + compte.nom : "");
    return '<button type="button" class="mdc-reglage" data-mdc="ouvrir-compte" data-test="reglage-compte">' + pastille + esc((compte.prenom || "?").charAt(0).toUpperCase()) + '</i>' +
      '<span><b>' + esc(nomComplet) + '</b><small>' + esc(compte.id ? "Identifiant " + identifiantLisible(compte.id) : "Enregistrement en attente") + '</small></span><em aria-hidden="true">›</em></button>';
  }

  /* ---------- Vérifications appelées par l'appli après chaque rendu ---------- */
  function verifier(){
    if(!cfg) return;
    poserTheme();
    chargerCompte();
    // Chiffres retrouvés (copie de secours) pendant que l'écran 1 d'une
    // « nouvelle » installation était affiché, sans rien tapé : on le ferme.
    if(ecran && ecran.type === "inscription" && ((ecran.mode === "nouvelle" && ecran.etape === 1) || ecran.mode === "reconnue") && !ecran.touche && !ecran.occupe &&
       !ecran.feuille && appel("nouvelleInstallation", false) !== true){
      fermerEcran();
    }
    // « Merci ! Abonnée jusqu'au … » : dans Mon abonnement s'il est ouvert, sinon une feuille, appli au repos.
    // v4 : seulement dans une appli que la formule ouvre (l'autre appli le montrera).
    if(compte.merci && !compte.merci.vu && merciIci()){
      if(ecran && ecran.type === "abonnement" && !ecran.feuille){
        modifierCompte(function(c){ c.merci.vu = true; });
        ecran.vue = "formules";
        ecran.message = { texte: "Merci ! Abonnée jusqu’au " + dateFr(compte.merci.fin) + ".", ton: "ok" };
        dessiner();
      } else if(!ecran && appel("verrouille", false) !== true && appel("auRepos", true) === true){
        ecran = { type: "feuille", feuille: "merci" };
        dessinerFeuille();
        prevenirAppli();
        return;
      }
    }
    planifierSauvegardeAuto();
    // v3 : le guide se repose sur les éléments redessinés.
    if(guide){ positionnerGuide(); return; }
    // Notification touchée pendant qu'une feuille sans enjeu est ouverte : la feuille se ferme.
    if(memoire.ecranDemande && ecran && ecran.type === "feuille" && (ecran.feuille === "notifications" || ecran.feuille === "merci" || ecran.feuille === "conditions")){
      if(ecran.feuille === "merci") modifierCompte(function(c){ if(c.merci) c.merci.vu = true; });
      ecran = null;
      dessinerFeuille();
    }
    if(ecran) return;
    if(appel("nouvelleInstallation", false) === true){ memoire.premiereSeance = true; ouvrirInscription("nouvelle"); return; }
    if(memoire.ecranDemande && appel("verrouille", false) !== true){
      var demande = memoire.ecranDemande;
      memoire.ecranDemande = null;
      compter("notification.ouverte");
      appel("ouvrirEcran", null, demande);
      return;
    }
    if(memoire.guideDemande && appel("verrouille", false) !== true && appel("auRepos", true) === true){
      memoire.guideDemande = false;
      lancerGuide();
      return;
    }
    // v4 : la bulle du bouton de l'autre appli, s'il est apparu après le guide.
    if(!memoire.premiereSeance && lienVisible() && !(compte.lienVu && compte.lienVu[cfg.appli]) &&
       appel("verrouille", false) !== true && appel("auRepos", true) === true && document.querySelector('[data-mdc="autre-appli"]') !== null){
      if(lancerBulleLien()) return;
    }
    if(proposerNotificationsSiBesoin()) return;
    // Installation existante : l'inscription est proposée UNE fois, appli au repos.
    if(memoire.invitationTentee || !enLigne()) return;
    chargerCompte();
    if(!inscriptionATerminer() || compte.invitation[cfg.appli]) return;
    if(appel("verrouille", false) === true || appel("auRepos", true) !== true) return;
    memoire.invitationTentee = true;
    setTimeout(function(){
      chargerCompte();
      if(ecran || !inscriptionATerminer() || compte.invitation[cfg.appli]) return;
      if(appel("verrouille", false) === true || appel("auRepos", true) !== true){ memoire.invitationTentee = false; return; }
      ouvrirInscription("invitation");
    }, 500);
  }

  /* ---------- v3 : comptages anonymes (niveau 2) — mondjai_mesures_v1 ---------- */
  // Jamais de montant, de nom, de numéro ni de texte saisi : seulement des noms
  // de gestes ([a-z0-9_.], 40 caractères au plus) et des nombres. L'identifiant
  // de mesure est tiré au hasard sur le téléphone, rangé à part, sans aucun
  // lien avec le compte ; les envois partent avec la clé publique seule.
  var mesures = null;
  function chargerMesures(){
    var brut = lireStockage(CLE_MESURES), o = null;
    if(brut){ try{ o = JSON.parse(brut); }catch(e){ o = null; } }
    var m = { version: 1, idMesure: null, actif: true, jours: {}, erreurs: [], erreursDuJour: null };
    if(o && typeof o === "object"){
      if(typeof o.idMesure === "string" && /^[a-z0-9]{16,40}$/.test(o.idMesure)) m.idMesure = o.idMesure;
      m.actif = o.actif !== false;
      if(o.jours && typeof o.jours === "object" && !Array.isArray(o.jours)) m.jours = o.jours;
      if(Array.isArray(o.erreurs)) m.erreurs = o.erreurs;
      if(o.erreursDuJour && typeof o.erreursDuJour === "object") m.erreursDuJour = o.erreursDuJour;
    }
    mesures = m;
    return m;
  }
  function enregistrerMesures(){ ecrireStockage(CLE_MESURES, JSON.stringify(mesures)); }
  function idMesure(){
    if(!mesures.idMesure){ mesures.idMesure = hasard(LONGUEUR_ID_MESURE, ALPHABET_ID); enregistrerMesures(); }
    return mesures.idMesure;
  }
  function nomCompteur(nom){
    var s = String(nom === undefined || nom === null ? "" : nom).toLowerCase().replace(/[^a-z0-9_.]/g, "_").slice(0, 40);
    return /^[a-z0-9_.]{1,40}$/.test(s) ? s : null;
  }
  // Ajoute n (1 par défaut) au compteur du jour de cette appli.
  function compter(nom, n){
    if(!cfg) return;
    var k = nomCompteur(nom);
    if(!k) return;
    chargerMesures();
    if(!mesures.actif) return;
    var jour = jourLocal(), appli = cfg.appli, version = String(cfg.version || "").slice(0, 40);
    var j = mesures.jours[jour];
    if(!j || typeof j !== "object") j = mesures.jours[jour] = {};
    var a = j[appli];
    if(!a || typeof a !== "object" || !a.c) a = j[appli] = { v: version, c: {} };
    a.v = version;
    if(!Object.prototype.hasOwnProperty.call(a.c, k)){
      var nb = 0, x;
      for(x in a.c) if(Object.prototype.hasOwnProperty.call(a.c, x)) nb++;
      if(nb >= COMPTEURS_MAX) return;
      a.c[k] = 0;
    }
    var ajout = Math.round(Number(n === undefined ? 1 : n) || 0);
    if(ajout <= 0) return;
    a.c[k] = Math.min(VALEUR_COMPTEUR_MAX, (Number(a.c[k]) || 0) + ajout);
    idMesure();
    enregistrerMesures();
  }
  // Durée de saisie : du formulaire ouvert à l'enregistrement.
  var saisieEnCours = { debut: 0 };
  function debutSaisie(){ saisieEnCours.debut = maintenant(); }
  // Une saisie enregistrée (nom de la fonction, par exemple « saisie.soir »).
  function finSaisie(nomFonction){
    var d = saisieEnCours.debut ? Math.round((maintenant() - saisieEnCours.debut) / 1000) : 0;
    saisieEnCours.debut = 0;
    compter("saisies");
    if(d > 0) compter("saisie.duree_s", Math.min(d, DUREE_SAISIE_MAX_S));
    compter("heure." + new Date(maintenant()).getHours());
    if(nomFonction) compter("fonction." + nomFonction);
    // Le serveur doit connaître le jour de la dernière saisie (jamais un montant)
    // pour ne pas envoyer « Rien noté » à tort : une fois par jour au plus.
    chargerCompte();
    var n = notifsIci();
    if(n && n.autorisees && n.endpoint && rappelSaisieIci() && n.saisieEnvoyee !== jourLocal()){
      modifierCompte(function(c){ majNotifsIci(c, { saisieEnvoyee: jourLocal() }); });
      envoyerAppareil(true);
    }
  }
  // Les compteurs des jours passés, une fois par jour (au premier lancement).
  // Hors ligne, gardés 30 jours au plus : les plus vieux sont abandonnés.
  function purgerMesures(){
    var aujourdhui = jourLocal(), k, change = false;
    for(k in mesures.jours){
      if(!Object.prototype.hasOwnProperty.call(mesures.jours, k)) continue;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || ecartJours(k, aujourdhui) > JOURS_MESURES_GARDES){ delete mesures.jours[k]; change = true; }
    }
    if(change) enregistrerMesures();
  }
  function envoyerMesures(suite){
    if(!cfg || enCours.mesures){ if(suite) suite(); return; }
    chargerMesures();
    purgerMesures();
    if(!mesures.actif || !enLigne()){ if(suite) suite(); return; }
    var aujourdhui = jourLocal(), jours = [], k, change = false;
    for(k in mesures.jours){
      if(!Object.prototype.hasOwnProperty.call(mesures.jours, k)) continue;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k) || ecartJours(k, aujourdhui) > JOURS_MESURES_GARDES){ delete mesures.jours[k]; change = true; }
      else if(k < aujourdhui && mesures.jours[k] && mesures.jours[k][cfg.appli]) jours.push(k);
    }
    if(change) enregistrerMesures();
    jours.sort();
    var a = decrireAppareil();
    enCours.mesures = true;
    (function suivant(){
      if(!jours.length){ enCours.mesures = false; envoyerErreurs(suite); return; }
      var jour = jours.shift();
      chargerMesures();
      var e = mesures.jours[jour] && mesures.jours[jour][cfg.appli];
      if(!e){ suivant(); return; }
      var parametres = { p_id_mesure: idMesure(), p_appli: cfg.appli, p_version: e.v || String(cfg.version || "").slice(0, 40), p_jour: jour,
        p_compteurs: e.c || {}, p_marque: a.marque, p_systeme: a.systeme };
      appelerFonction("envoyer_mesures", parametres, { anonyme: true }, function(err){
        if(estPanne(err)){ enCours.mesures = false; if(suite) suite(); return; }
        // Reçu, ou refusé pour de bon : on ne le renvoie plus.
        chargerMesures();
        if(mesures.jours[jour]){ delete mesures.jours[jour][cfg.appli]; var reste = false, x; for(x in mesures.jours[jour]) if(Object.prototype.hasOwnProperty.call(mesures.jours[jour], x)) reste = true; if(!reste) delete mesures.jours[jour]; }
        enregistrerMesures();
        suivant();
      });
    })();
  }
  // Erreurs JavaScript : message (300 caractères, sans suite de chiffres ni
  // adresse), écran, version ; 20 par jour au plus ; gardées hors ligne.
  function nettoyerMessage(m){
    return String(m === undefined || m === null ? "?" : m).replace(/[0-9]{6,}/g, "#").replace(/[^\s@]+@[^\s@]+/g, "@").replace(/\s+/g, " ").slice(0, MESSAGE_ERREUR_MAX);
  }
  function signalerErreur(message, ecranNom){
    if(!cfg) return;
    chargerMesures();
    if(!mesures.actif) return;
    var jour = jourLocal(), ed = mesures.erreursDuJour;
    if(!ed || ed.jour !== jour) ed = { jour: jour, n: 0 };
    if(ed.n >= ERREURS_PAR_JOUR) return;
    ed.n++;
    mesures.erreursDuJour = ed;
    var a = decrireAppareil();
    mesures.erreurs.push({ appli: cfg.appli, version: String(cfg.version || "").slice(0, 40), message: nettoyerMessage(message),
      ecran: nomCompteur(ecranNom) || null, systeme: a.systeme, navigateur: a.navigateur, le: maintenant() });
    while(mesures.erreurs.length > ERREURS_PAR_JOUR) mesures.erreurs.shift();
    idMesure();
    enregistrerMesures();
    setTimeout(function(){ envoyerErreurs(); }, 0);
  }
  function envoyerErreurs(suite){
    if(!cfg || enCours.erreurs || !enLigne()){ if(suite) suite(); return; }
    chargerMesures();
    if(!mesures.actif || !mesures.erreurs.length){ if(suite) suite(); return; }
    enCours.erreurs = true;
    (function suivant(){
      chargerMesures();
      var e = mesures.erreurs[0];
      if(!e){ enCours.erreurs = false; if(suite) suite(); return; }
      appelerFonction("signaler_erreur", { p_id_mesure: idMesure(), p_appli: e.appli, p_version: e.version, p_message: e.message,
        p_ecran: e.ecran, p_systeme: e.systeme, p_navigateur: e.navigateur }, { anonyme: true }, function(err){
        if(estPanne(err)){ enCours.erreurs = false; if(suite) suite(); return; }
        chargerMesures();
        if(mesures.erreurs.length && mesures.erreurs[0].le === e.le && mesures.erreurs[0].message === e.message) mesures.erreurs.shift();
        enregistrerMesures();
        suivant();
      });
    })();
  }
  function surErreurJs(ev){
    if(memoire.dansErreur) return;
    memoire.dansErreur = true;
    try{
      var m = ev && (ev.message || (ev.error && ev.error.message)) || "erreur";
      var lieu = ev && ev.lineno ? " (ligne " + ev.lineno + ")" : "";
      signalerErreur(String(m) + lieu, appel("ecranCourant", ""));
    }catch(e){}
    memoire.dansErreur = false;
  }
  function surRejet(ev){
    if(memoire.dansErreur) return;
    memoire.dansErreur = true;
    try{
      var r = ev ? ev.reason : null;
      signalerErreur("Promesse rejetée : " + (r && r.message ? r.message : String(r)), appel("ecranCourant", ""));
    }catch(e){}
    memoire.dansErreur = false;
  }
  // Réglages › À propos › « Aider à améliorer MonDjai » (activé par défaut).
  function reglageAiderAmeliorer(){
    if(!cfg) return "";
    chargerMesures();
    return '<div class="mdc-sel" data-test="aider-ameliorer">' +
      '<button type="button" class="mdc-rang" role="switch" data-mdc="mesures-bascule" data-test="mesures-bascule" aria-checked="' + !!mesures.actif + '">Aider à améliorer MonDjai<i class="mdc-inter"></i></button>' +
      '<p>Nous comptons les gestes, jamais vos chiffres ni votre nom.</p></div>';
  }

  /* ---------- v3 : notifications appli fermée (Web Push) ---------- */
  function pushPresent(){
    try{ return !!(navigator.serviceWorker && window.PushManager && window.Notification && window.Uint8Array && typeof Promise === "function"); }
    catch(e){ return false; }
  }
  function surIphone(){ var a = decrireAppareil(); return a.marque === "iPhone" || a.marque === "iPad" || /^iOS/.test(a.systeme || ""); }
  function permissionNotifications(){
    try{ return window.Notification && window.Notification.permission ? window.Notification.permission : "default"; }catch(e){ return "default"; }
  }
  // v4 : appli ouverte hors de son adresse https (fichier reçu par WhatsApp,
  // adresse content://…) : le navigateur n'y permet jamais les notifications.
  function adresseSure(){
    try{
      if(window.isSecureContext === false) return false;
      var p = String(location.protocol || "");
      return p === "https:" || (p === "http:" && /^(localhost|127\.0\.0\.1)$/.test(String(location.hostname || "")));
    }catch(e){ return true; }
  }
  // { possible, raison: "" | "adresse" | "absent" | "iphone" | "refuse", actives }
  function etatNotifications(){
    chargerCompte();
    var n = notifsIci() || {};
    if(!adresseSure()) return { possible: false, raison: "adresse", actives: false };
    if(surIphone() && !decrireAppareil().installee) return { possible: false, raison: "iphone", actives: false };
    if(!pushPresent()) return { possible: false, raison: "absent", actives: false };
    var p = permissionNotifications();
    if(p === "denied") return { possible: false, raison: "refuse", actives: false };
    return { possible: true, raison: "", actives: p === "granted" && n.autorisees === true && !!n.endpoint };
  }
  function messageNotifications(raison){
    if(raison === "adresse") return "Ouvrez MonDjai depuis son adresse pour recevoir les notifications.";
    if(raison === "iphone") return "Sur iPhone : ajoutez d’abord l’appli à l’écran d’accueil.";
    if(raison === "refuse") return "Refusées dans les réglages du téléphone.";
    if(raison === "absent") return "Ce téléphone ne permet pas les notifications.";
    if(raison === "inscription") return "Terminez votre inscription pour les recevoir.";
    return "Les notifications n’ont pas pu être activées.";
  }
  // Ce que le serveur garde avec l'appareil (p_push) : null = rien à changer.
  // Le jour de la dernière saisie (jamais un montant) sert seulement au rappel
  // « Rien noté », et seulement si ce rappel est activé.
  function pushPourServeur(){
    var n = notifsIci();
    if(!n || n.autorisees === undefined) return null;
    if(!n.autorisees || !n.endpoint || !n.cles) return { actif: false };
    var saisie = rappelSaisieIci();
    var o = { actif: true, endpoint: n.endpoint, keys: { p256dh: n.cles.p256dh, auth: n.cles.auth }, appli: cfg.appli, saisie: saisie };
    if(saisie){
      var jour = plusTardif(appel("derniereSaisie", null), appel("debutUsage", null));
      if(jour && /^\d{4}-\d{2}-\d{2}$/.test(jour)) o.derniere_saisie = jour;
    }
    return o;
  }
  function enregistrementSw(suite){
    var fini = false, t = null;
    function rendre(r){ if(fini) return; fini = true; if(t) clearTimeout(t); suite(r); }
    try{
      if(!navigator.serviceWorker || !navigator.serviceWorker.ready){ rendre(null); return; }
      t = setTimeout(function(){ rendre(null); }, DELAI_DEMANDE_SW_MS);
      navigator.serviceWorker.ready.then(function(reg){ rendre(reg || null); }, function(){ rendre(null); });
    }catch(e){ rendre(null); }
  }
  // Abonnement Web Push (clé publique VAPID), puis envoi à enregistrer_appareil.
  function abonnerPush(suite){
    enregistrementSw(function(reg){
      if(!reg || !reg.pushManager){ suite(false, "absent"); return; }
      try{
        reg.pushManager.getSubscription().then(function(sub){
          return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: depuisBase64(VAPID_CLE_PUBLIQUE) });
        }).then(function(sub){
          var j = sub && typeof sub.toJSON === "function" ? sub.toJSON() : null;
          if(!j || !j.endpoint || !j.keys || !j.keys.p256dh || !j.keys.auth){ suite(false, "erreur"); return; }
          modifierCompte(function(c){
            majNotifsIci(c, { autorisees: true, endpoint: j.endpoint, cles: { p256dh: j.keys.p256dh, auth: j.keys.auth }, le: jourLocal() });
          });
          envoyerAppareil(true);
          suite(true, "");
        }, function(){ suite(false, "erreur"); });
      }catch(e){ suite(false, "erreur"); }
    });
  }
  // Demande du téléphone (après un toucher) ; suite(ok, raison).
  function demanderNotifications(suite){
    var et = etatNotifications();
    if(!et.possible){ suite(false, et.raison); return; }
    chargerCompte();
    if(!estInscrit() || !estConnecte()){ suite(false, "inscription"); return; }
    modifierCompte(function(c){ majNotifsIci(c, { demandeesLe: jourLocal() }); });
    var repondu = false;
    function reponse(p){
      if(repondu) return;
      repondu = true;
      if(p === "granted"){ abonnerPush(suite); return; }
      // Refus, ou fenêtre fermée sans réponse : pas de nouvelle demande avant 30 jours.
      modifierCompte(function(c){ majNotifsIci(c, { autorisees: false, refuseeLe: jourLocal() }); });
      suite(false, p === "denied" ? "refuse" : "plus_tard");
    }
    try{
      var r = window.Notification.requestPermission(function(p){ reponse(p); });   // ancien Safari
      if(r && typeof r.then === "function") r.then(reponse, function(){ reponse("default"); });
    }catch(e){ suite(false, "erreur"); }
  }
  function desactiverNotifications(){
    modifierCompte(function(c){ majNotifsIci(c, { autorisees: false, endpoint: null, cles: null }); });
    enregistrementSw(function(reg){
      try{ if(reg && reg.pushManager) reg.pushManager.getSubscription().then(function(s){ if(s) s.unsubscribe(); }, function(){}); }catch(e){}
    });
    envoyerAppareil(true);
  }
  // À l'ouverture : l'abonnement est-il toujours là, et toujours le même ?
  function maintenirAbonnementPush(){
    chargerCompte();
    var n = notifsIci();
    if(!n || !n.autorisees || !pushPresent()) return;
    if(permissionNotifications() !== "granted"){
      modifierCompte(function(c){ majNotifsIci(c, { autorisees: false, endpoint: null, cles: null }); });
      envoyerAppareil(true);
      return;
    }
    enregistrementSw(function(reg){
      if(!reg || !reg.pushManager) return;
      try{
        reg.pushManager.getSubscription().then(function(sub){
          var j = sub && typeof sub.toJSON === "function" ? sub.toJSON() : null;
          chargerCompte();
          if(!j || !j.endpoint){ abonnerPush(function(){}); return; }
          var ni = notifsIci();
          if(j.endpoint !== (ni && ni.endpoint)){
            modifierCompte(function(c){ majNotifsIci(c, { endpoint: j.endpoint, cles: { p256dh: j.keys.p256dh, auth: j.keys.auth } }); });
            envoyerAppareil(true);
          }
        }, function(){});
      }catch(e){}
    });
  }
  // Proposée une fois, appli au repos, jamais pendant la séance de
  // l'inscription (la nouvelle venue voit d'abord le guide) ; un refus est

  // Notification touchée : l'adresse porte ?ecran=… (ou le service worker

  function lireEcranDemande(){
    var m = null;
    try{ m = /[?&]ecran=([a-z_]+)/.exec(String(location.search || "")); }catch(e){}
    if(!m) return;
    memoire.ecranDemande = m[1];
    try{
      var reste = String(location.search).replace(/([?&])ecran=[a-z_]+&?/, "$1").replace(/[?&]$/, "");

  /* ---------- v3 : guide en bulles ---------- */

  var guide = null;
  function lancerGuide(){
    if(!cfg || guide) return false;
    if(ecran){
      if(ecran.type !== "feuille") return false;
      ecran = null;
      dessinerFeuille();
    }
    var g = appel("guide", null);
    if(!g || !Array.isArray(g.bulles) || !g.bulles.length) return false;
    var bulles = g.bulles.slice(0, GUIDE_BULLES_MAX), lien = lienVisible();
    // v4 : compte « les deux » : une bulle de plus, sur le bouton de l'autre appli.
    if(lien) bulles.push(bulleLien());

  function allerBulle(i){

  function dessinerGuide(){

      document.body.appendChild(el);

    var b = guide.bulles[guide.i] || {}, n = guide.bulles.length, dernier = guide.i === n - 1;
    guide.el.lastChild.innerHTML = '<p class="mdc-bulle-texte" data-test="guide-texte">' + esc(b.texte || "") + '</p>' +

  function cibleGuide(){

  }
  // Mesure l'élément après chaque rendu : la bulle se pose dessous s'il y a la
  // place, sinon dessus, sinon contre le bord le plus libre ; toujours entière
  // à l'écran, donc « Suivant » jamais caché.
  function positionnerGuide(){
    if(!guide || !guide.el) return;
    var zone = guide.el.firstChild, bulle = guide.el.lastChild, MARGE = 10, ECART = 6;
    var H = window.innerHeight || document.documentElement.clientHeight || 640;
    var W = window.innerWidth || document.documentElement.clientWidth || 360;
    var cible = cibleGuide(), r = null;
    if(cible && cible.getBoundingClientRect){
      r = cible.getBoundingClientRect();
      if(r.width < 1 && r.height < 1) r = null;
      else if(r.top < 0 || r.bottom > H){
        try{ cible.scrollIntoView({ block: "center" }); }catch(e){ try{ cible.scrollIntoView(); }catch(e2){} }
        r = cible.getBoundingClientRect();
      }
    }
    guide.el.className = "mdc-guide" + (r ? "" : " sans-zone");
    if(r){
      zone.style.display = "block";
      zone.style.top = Math.round(r.top - ECART) + "px";
      zone.style.left = Math.round(r.left - ECART) + "px";
      zone.style.width = Math.round(r.width + 2 * ECART) + "px";
      zone.style.height = Math.round(r.height + 2 * ECART) + "px";
    } else zone.style.display = "none";
    var largeur = Math.min(W - 2 * MARGE, 340);
    var gauche = r ? r.left + r.width / 2 - largeur / 2 : (W - largeur) / 2;
    gauche = Math.max(MARGE, Math.min(gauche, W - largeur - MARGE));
    bulle.style.width = Math.round(largeur) + "px";
    bulle.style.left = Math.round(gauche) + "px";
    var hb = bulle.offsetHeight || 118, haut, place;
    if(!r){ haut = (H - hb) / 2; place = "centre"; }
    else if(H - (r.bottom + ECART) >= hb + 2 * MARGE){ haut = r.bottom + ECART + MARGE; place = "dessous"; }
    else if(r.top - ECART >= hb + 2 * MARGE){ haut = r.top - ECART - MARGE - hb; place = "dessus"; }
    else { haut = H - r.bottom > r.top ? H - hb - MARGE : MARGE; place = "bord"; }
    haut = Math.max(MARGE, Math.min(haut, H - hb - MARGE));
    bulle.style.top = Math.round(haut) + "px";
    bulle.setAttribute("data-place", place);
  }

  }

  function defaultState(){

  var state = loadState();

  function todayKeyBrut(){
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1) + "-" + (d.getDate() < 10 ? "0" : "") + d.getDate();
  }

  function loadState(){
    var raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(!raw) return defaultState();
    var parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ parsed = null; }
    if(!parsed || typeof parsed !== "object"){
      // Sprint 7A : en V1.2, des données illisibles étaient remplacées sans bruit par un état
      // vide (puis écrasées). Désormais rien n'est écrit : l'écran de secours s'affiche.
      BOOT.raison = "illisible";
      throw new Error("Données enregistrées illisibles");
    }
    var base = defaultState();
    return migrerEtat({
      version: 1,
      config: Object.assign({}, base.config, parsed.config || {}),
      jours: parsed.jours || {},
      dernierMontant: parsed.dernierMontant || {},
      creances: parsed.creances || [],
      objectif: parsed.objectif || null,
      meta: Object.assign({}, base.meta, parsed.meta || {})

  // V1.2 : mise à niveau douce d'un état V1.0/V1.1 (aucune donnée supprimée).
  function migrerEtat(st){
    var cfg = st.config;
    // Rubriques : noms/icônes métier pour les rubriques préconfigurées, ajout des nouvelles.
    if(cfg.onboardingComplete && Array.isArray(cfg.rubriques)){
      RUBRIQUES_PRECONFIGUREES.forEach(function(pr){
        var ex = null;
        for(var i=0;i<cfg.rubriques.length;i++){ if(cfg.rubriques[i].id === pr.id) ex = cfg.rubriques[i]; }
        if(ex){
          if(!ex.perso){ ex.nom = pr.nom; ex.icone = pr.icone; }
        }else{
          var actif = pr.id === "cotisation" ? cfg.statut === "locataire" : !!pr.defaut;
          cfg.rubriques.push({ id:pr.id, nom:pr.nom, icone:pr.icone, couleur:pr.couleur, actif:actif, perso:false });
        }
      });
    }
    if(["jour","semaine","mois"].indexOf(cfg.loyerFrequence) === -1) cfg.loyerFrequence = "jour";
    if(!(cfg.loyerJour >= 1)) cfg.loyerJour = 1;
    // Objectif V1.0/V1.1 (pourcentage du solde net) → modèle V1.2 « Auto » (pourcentage de la recette).
    if(st.objectif && !st.objectif.mode){
      st.objectif.mode = "auto";
      st.objectif.montantJour = null;
      if(!st.objectif.pourcentage) st.objectif.pourcentage = 10;
    }
    if(st.objectif){
      var m = trouverModeleObjectif(st.objectif.modele);
      if(!st.objectif.icone) st.objectif.icone = m ? m.icone : "💰";
      if(!(st.objectif.montantCible >= 0)) st.objectif.montantCible = 0;
    }
    return st;
  }

  function saveState(){
    var secours = BOOT.secours;
    if(secours && secours.verification){
      if(!ecritureDifferee){
        ecritureDifferee = true;
        secours.apres(function(){ ecritureDifferee = false; if(!secours.restaure) saveState(); });
      }
      return;
    }
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      // stockage indisponible : on continue sans bloquer l'utilisateur
    }
    if(secours && secours.miroir) secours.miroir();   // Sprint 7B : copie 500 ms plus tard
  }

  // ---------- Utilitaires ----------

  function pad2(n){ return n < 10 ? "0" + n : "" + n; }

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function todayLabel(){
    var d = new Date();
    try{
      var s = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long" }).format(d);
      return s.charAt(0).toUpperCase() + s.slice(1);
    }catch(e){
      return todayKey();
    }
  }

  // Sprint 7C : vrai signe moins (−) à l'écran en thème clair ; le sombre garde « - » (identique à la 7B).
  var signeMoins = "-";
  function formatFCFA(n){
    var val = Math.round(Number(n) || 0);
    var sign = val < 0 ? signeMoins : "";
    var abs = Math.abs(val);
    var str = String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return sign + str + " F";
  }

  // Image partagée : ses propres textes, inchangés (« - » ordinaire), quel que soit le thème.
  function formatFCFAImage(n){
    var val = Math.round(Number(n) || 0);
    var sign = val < 0 ? "-" : "";
    var abs = Math.abs(val);
    var str = String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return sign + str + " F";
  }

  function uid(prefix){
    return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  }

  // Jour sur lequel porte la saisie de l'écran Aujourd'hui (V1.1 : un jour passé peut être choisi).
  function jourSaisieKey(){
    return ui.chargeCle || ui.jourSelection || todayKey();   // Sprint 7D : ui.chargeCle seulement pendant une feuille ouverte depuis Mes charges
  }

  function ensureJour(cle){
    var key = cle || jourSaisieKey();
    if(!state.jours[key]){
      state.jours[key] = {
        date: key,
        origine: "salon-h",
        recette: 0,
        clients: [],
        charges: [],
        creancesRecouvrees: []
      };
      if(key < todayKey()) state.jours[key].saisiApresCoup = true;
    }
    return state.jours[key];
  }

  // Lecture sans création (évite de créer des journées vides en consultant).
  function lireJour(key){
    return state.jours[key] || { date:key, origine:"salon-h", recette:0, clients:[], charges:[], creancesRecouvrees:[] };
  }

  function totalChargesJour(jour){
    return (jour.charges || []).reduce(function(s,c){ return s + c.montant; }, 0);
  }

  // Recette = clients encaissés + créances recouvrées ce jour-là.
  // Recette du jour. V1.2 : saisie une fois en fin de journée (recetteSaisie), comme Trépor.
  // Les jours V1.0/V1.1 saisis client par client restent lus via la somme des clients.
  function recalculerRecette(jour){
    var r;
    if(jour.recetteSaisie != null){ r = jour.recetteSaisie; }
    else { r = (jour.clients || []).reduce(function(s,c){ return s + c.montant; }, 0); }
    creancesRecouvreesDe(jour).forEach(function(cr){ r += cr.montant; });
    jour.recette = r;
  }

  function nbClientsJour(jour){
    if(!jour) return 0;
    if(jour.nbClients != null) return jour.nbClients;
    return (jour.clients || []).length;
  }

  // Enregistre la recette du jour (+ loyer quotidien automatique la première fois).
  // Sprint 7B : renvoie { loyerAjoute, creation, corrige, cle, annuler }.
  //  - recette déjà notée (même 0, ou anciens clients) : correction tracée sur le jour
  //    (modifieLe, versionsPrecedentes : recetteSaisie, nbClients, recette) ;
  //  - sinon : création, que « Annuler » peut retirer exactement.
  function enregistrerRecette(montant, nbClients){
    var cle = jourSaisieKey();
    var jourCree = !state.jours[cle];
    var jour = ensureJour();
    var premiere = !(jour.recette > 0);
    var nbNouveau = nbClients > 0 ? nbClients : null;
    var dejaNotee = jour.recetteSaisie != null || (jour.clients && jour.clients.length > 0);
    var corrige = false;
    if(dejaNotee && (!memeValeur(jour.recetteSaisie, montant) || !memeValeur(jour.nbClients, nbNouveau))){
      var historique = Array.isArray(jour.versionsPrecedentes) ? jour.versionsPrecedentes.slice() : [];
      historique.push({ recetteSaisie: jour.recetteSaisie != null ? jour.recetteSaisie : null, nbClients: jour.nbClients != null ? jour.nbClients : null, recette: jour.recette });
      jour.versionsPrecedentes = historique;
      jour.modifieLe = Date.now();
      corrige = true;
    }
    var avaitRS = Object.prototype.hasOwnProperty.call(jour, "recetteSaisie"), rsAvant = jour.recetteSaisie;
    var avaitNb = Object.prototype.hasOwnProperty.call(jour, "nbClients"), nbAvant = jour.nbClients;
    jour.recetteSaisie = montant;
    jour.nbClients = nbNouveau;
    recalculerRecette(jour);
    var idLoyer = null;
    var loyerAjoute = false;
    if(premiere && montant > 0 && state.config.loyerFrequence === "jour" && state.config.statut === "locataire" && state.config.cotisationHabituelle > 0){
      var rub = findRubrique("cotisation");
      var dejaLa = jour.charges.some(function(c){ return c.rubriqueId === "cotisation"; });
      if(rub && rub.actif && !dejaLa){
        idLoyer = uid("charge");
        jour.charges.push({ id: idLoyer, rubriqueId:"cotisation", montant: state.config.cotisationHabituelle, ts: Date.now(), auto:true });
        loyerAjoute = true;
      }
    }
    saveState();
    var annuler = null;
    if(!dejaNotee){
      annuler = function(){
        var j = state.jours[cle];
        if(!j) return;
        if(avaitRS) j.recetteSaisie = rsAvant; else delete j.recetteSaisie;
        if(avaitNb) j.nbClients = nbAvant; else delete j.nbClients;
        if(idLoyer) j.charges = (j.charges || []).filter(function(c){ return c.id !== idLoyer; });
        recalculerRecette(j);
        if(jourCree && jourVide(j)) delete state.jours[cle];
      };
    }
    return { loyerAjoute: loyerAjoute, creation: !dejaNotee, corrige: corrige, cle: cle, annuler: annuler };
  }

  // Tri d'affichage (V1.1, repris de Trépor) : cotisation en tête, puis montant décroissant.
  function trierCharges(liste){
    return liste.slice().sort(function(a,b){
      if(a.rubriqueId === "cotisation" && b.rubriqueId !== "cotisation") return -1;
      if(b.rubriqueId === "cotisation" && a.rubriqueId !== "cotisation") return 1;
      return b.montant - a.montant;
    });
  }

  // Montants les plus récemment encaissés (4 max, distincts), pour les boutons rapides.
  function montantsRapides(){
    var tous = [];
    Object.keys(state.jours).forEach(function(k){
      (state.jours[k].clients || []).forEach(function(c){ tous.push(c); });
    });
    tous.sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    var vus = [];
    for(var i=0;i<tous.length && vus.length<4;i++){
      if(tous[i].montant > 0 && vus.indexOf(tous[i].montant) === -1) vus.push(tous[i].montant);
    }
    return vus.sort(function(a,b){ return a - b; });
  }

  // Ajoute un client encaissé sur le jour de saisie (+ cotisation automatique si activée).
  function ajouterClient(montant){
    var jour = ensureJour();
    var premier = jour.clients.length === 0;
    jour.clients.push({ id: uid("client"), montant: montant, ts: Date.now() });
    recalculerRecette(jour);
    var cotisationAjoutee = false;
    if(premier && state.config.loyerFrequence === "jour" && state.config.statut === "locataire" && state.config.cotisationHabituelle > 0){
      var rub = findRubrique("cotisation");
      var dejaLa = jour.charges.some(function(c){ return c.rubriqueId === "cotisation"; });
      if(rub && rub.actif && !dejaLa){
        jour.charges.push({ id: uid("charge"), rubriqueId:"cotisation", montant: state.config.cotisationHabituelle, ts: Date.now(), auto:true });
        cotisationAjoutee = true;
      }
    }
    saveState();
    return cotisationAjoutee;
  }

  // Part de l'objectif (F8) pour un jour donné — même règle que montantEpargneEstime.
  // V1.2 (modèle MonDjai/Coiffure) : l'épargne est calculée sur la RECETTE du jour.
  // Auto : pourcentage de la recette. Manuel : montant fixe chaque jour travaillé (au moins un client).
  function epargneDuJour(key){
    var obj = state.objectif;
    if(!obj || key < obj.dateCreation) return 0;
    var j = state.jours[key];
    if(!j || !(j.recette > 0)) return 0;
    if(obj.mode === "manuel") return obj.montantJour > 0 ? obj.montantJour : 0;
    return Math.round(j.recette * (obj.pourcentage || 0) / 100);
  }

  function epargnePlage(startKey, endKey){
    var total = 0;
    Object.keys(state.jours).forEach(function(k){
      if(k >= startKey && k <= endKey) total += epargneDuJour(k);
    });
    return total;
  }

  // Loyer (V1.2) : dernière échéance ≤ aujourd'hui pour un loyer hebdomadaire ou mensuel.
  function derniereEcheanceLoyer(){
    var cfg = state.config;
    var d = new Date(); d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if(cfg.loyerFrequence === "semaine"){
      var cible = cfg.loyerJour % 7; // 1..6 = lundi..samedi, 7 → 0 = dimanche
      while(d.getDay() !== cible){ d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1); }
      return dateToKey(d);
    }
    if(cfg.loyerFrequence === "mois"){
      var jourMois = function(annee, mois){ return Math.min(cfg.loyerJour, new Date(annee, mois + 1, 0).getDate()); };
      var e = new Date(d.getFullYear(), d.getMonth(), jourMois(d.getFullYear(), d.getMonth()));
      if(e > d){
        var pm = new Date(d.getFullYear(), d.getMonth() - 1, 1);
        e = new Date(pm.getFullYear(), pm.getMonth(), jourMois(pm.getFullYear(), pm.getMonth()));
      }
      return dateToKey(e);
    }
    return null;
  }

  function loyerNoteDepuis(cle){
    var today = todayKey();
    return Object.keys(state.jours).some(function(k){
      return k >= cle && k <= today && (state.jours[k].charges || []).some(function(c){ return c.rubriqueId === "cotisation"; });
    });
  }

  // Bandeau « Loyer dû » : loyer hebdomadaire/mensuel, échéance atteinte, pas encore noté, pas repoussé aujourd'hui.
  function loyerDu(){
    var cfg = state.config;
    if(cfg.statut !== "locataire" || !(cfg.cotisationHabituelle > 0) || cfg.loyerFrequence === "jour") return null;
    var rub = findRubrique("cotisation");
    if(!rub || !rub.actif) return null;
    var ech = derniereEcheanceLoyer();
    if(!ech || (state.meta.creation && ech < state.meta.creation)) return null;
    if(loyerNoteDepuis(ech)) return null;
    if(state.meta.loyerRappelMasque === todayKey()) return null;
    return ech;
  }

  function libelleLoyer(){
    var cfg = state.config;
    if(cfg.loyerFrequence === "semaine") return "chaque " + JOURS_SEMAINE[(cfg.loyerJour - 1) % 7];
    if(cfg.loyerFrequence === "mois") return "le " + cfg.loyerJour + " de chaque mois";
    return "chaque jour travaillé";
  }

  function estInstallee(){
    try{
      if(window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches ||
         window.matchMedia("(display-mode: fullscreen)").matches ||
         window.matchMedia("(display-mode: minimal-ui)").matches)) return true;
    }catch(e){}
    return !!(window.navigator && window.navigator.standalone);
  }

  // Jours antérieurs au Sprint 2 : le tableau des créances recouvrées n'existe pas encore.
  function creancesRecouvreesDe(jour){
    return (jour && jour.creancesRecouvrees) || [];
  }

  function rubriquesActives(){
    return state.config.rubriques.filter(function(r){ return r.actif; });
  }

  function findRubrique(id){
    for(var i=0;i<state.config.rubriques.length;i++){
      if(state.config.rubriques[i].id === id) return state.config.rubriques[i];
    }
    return null;
  }

  function findChargeDuJour(jour, id){
    for(var i=0;i<jour.charges.length;i++){
      if(jour.charges[i].id === id) return jour.charges[i];
    }
    return null;
  }

  function findCreance(id){
    for(var i=0;i<state.creances.length;i++){
      if(state.creances[i].id === id) return state.creances[i];
    }
    return null;
  }

  function creancesEnCours(){
    return state.creances.filter(function(c){ return c.statut === "en_cours"; });
  }

  function sommeCreancesEnCours(){
    return creancesEnCours().reduce(function(s,c){ return s + c.montant; }, 0);
  }

  // ---------- Dates ----------

  function parseDateKey(key){
    var parts = String(key).split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function dateToKey(d){
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function joursDepuis(key){
    var d = parseDateKey(key);
    var now = new Date();
    var todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((todayMidnight - d) / 86400000);
  }

  function formatDateLabel(key){
    var d = parseDateKey(key);
    try{
      var s = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" }).format(d);
      return s.charAt(0).toUpperCase() + s.slice(1);
    }catch(e){
      return key;
    }
  }

  function formatDateCourte(key){
    var d = parseDateKey(key);
    try{
      return new Intl.DateTimeFormat("fr-FR", { day:"numeric", month:"short" }).format(d);
    }catch(e){
      return key;
    }
  }

  function lundiDeLaSemaine(d){
    var day = d.getDay(); // 0=dimanche .. 6=samedi
    var diff = (day === 0 ? -6 : 1 - day);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  }

  function bornesPeriode(mode, offset){
    var today = new Date();
    if(mode === "jour"){
      var dj = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset);
      return { debut: dj, fin: dj };
    }
    if(mode === "mois"){
      var refMois = new Date(today.getFullYear(), today.getMonth() + offset, 1);
      var debut = new Date(refMois.getFullYear(), refMois.getMonth(), 1);
      var fin = new Date(refMois.getFullYear(), refMois.getMonth() + 1, 0);
      return { debut: debut, fin: fin };
    }
    var refSemaine = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset * 7);
    var lundi = lundiDeLaSemaine(refSemaine);
    var dimanche = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
    return { debut: lundi, fin: dimanche };
  }

  function labelPeriode(mode, offset){
    var b = bornesPeriode(mode, offset);
    if(mode === "jour"){
      if(offset === 0) return "Aujourd’hui · " + formatDateCourte(dateToKey(b.debut));
      if(offset === -1) return "Hier · " + formatDateCourte(dateToKey(b.debut));
      return formatDateLabel(dateToKey(b.debut));
    }
    if(mode === "mois"){
      try{
        var s = new Intl.DateTimeFormat("fr-FR", { month:"long", year:"numeric" }).format(b.debut);
        return s.charAt(0).toUpperCase() + s.slice(1);
      }catch(e){
        return dateToKey(b.debut).slice(0,7);
      }
    }
    return "Semaine du " + formatDateCourte(dateToKey(b.debut)) + " au " + formatDateCourte(dateToKey(b.fin));
  }

  function calculerEtat(mode, offset){
    var b = bornesPeriode(mode, offset);
    return calculerPlage(dateToKey(b.debut), dateToKey(b.fin));
  }

  function calculerPlage(startKey, endKey){
    var nbClients = 0;
    var recetteClients = 0;
    var nbJoursTravailles = 0;
    var recetteTotale = 0;
    var chargesTotal = 0;
    var chargesParRubrique = {};
    var creancesRecouvreesTotal = 0;

    Object.keys(state.jours).forEach(function(k){
      if(k >= startKey && k <= endKey){
        var j = state.jours[k];
        nbClients += nbClientsJour(j);
        recetteTotale += j.recette;
        recetteClients += j.recette;
        if(jourADesDonnees(j)) nbJoursTravailles += 1;
        j.charges.forEach(function(c){
          chargesTotal += c.montant;
          chargesParRubrique[c.rubriqueId] = (chargesParRubrique[c.rubriqueId] || 0) + c.montant;
        });
        creancesRecouvreesDe(j).forEach(function(cr){
          creancesRecouvreesTotal += cr.montant;
        });
      }
    });

    var creancesEnCoursTotal = 0;
    state.creances.forEach(function(c){
      if(c.date >= startKey && c.date <= endKey && c.statut === "en_cours"){
        creancesEnCoursTotal += c.montant;
      }
    });

    return {
      startKey: startKey,
      endKey: endKey,
      nbClients: nbClients,
      recetteTotale: recetteTotale,
      chargesTotal: chargesTotal,
      chargesParRubrique: chargesParRubrique,
      soldeNetCumule: recetteTotale - chargesTotal,
      creancesEnCoursTotal: creancesEnCoursTotal,
      creancesRecouvreesTotal: creancesRecouvreesTotal,
      nbJoursTravailles: nbJoursTravailles,
      epargneTotal: epargnePlage(startKey, endKey),
      soldeNet: recetteTotale - chargesTotal - epargnePlage(startKey, endKey),
      ticketMoyen: nbClients > 0 ? Math.round(recetteClients / nbClients) : 0,
      moyenneJour: nbJoursTravailles > 0 ? Math.round((recetteTotale - chargesTotal) / nbJoursTravailles) : 0
    };
  }

  // Première date avec des données (borne la navigation « ‹ » de Mon état et Partager).
  function premiereDateDonnees(){
    var cles = Object.keys(state.jours).filter(function(k){ return jourADesDonnees(state.jours[k]); }).sort();
    return cles.length ? cles[0] : null;
  }

  function precedentPossible(mode, offset){
    var premiere = premiereDateDonnees();
    if(!premiere) return false;
    var b = bornesPeriode(mode, offset);
    return dateToKey(b.debut) > premiere;
  }

  // ---------- Mon objectif (F8) ----------

  function trouverModeleObjectif(id){
    for(var i=0;i<OBJECTIF_MODELES.length;i++){
      if(OBJECTIF_MODELES[i].id === id) return OBJECTIF_MODELES[i];
    }
    return null;
  }

  function jourADesDonnees(jour){
    return !!jour && (jour.recette > 0 || (jour.charges && jour.charges.length > 0));
  }

  // Cherche, en remontant semaine par semaine, les dernières semaines qui
  // contiennent réellement au moins un jour saisi (pas des semaines calendaires vides).
  function semainesRecentesAvecDonnees(limite){
    var resultats = [];
    var offset = 0;
    var essais = 0;
    while(resultats.length < limite && essais < 52){
      var b = bornesPeriode("semaine", offset);
      var startKey = dateToKey(b.debut);
      var endKey = dateToKey(b.fin);
      var aDesDonnees = Object.keys(state.jours).some(function(k){
        return k >= startKey && k <= endKey && jourADesDonnees(state.jours[k]);
      });
      if(aDesDonnees) resultats.push(offset);
      offset -= 1;
      essais += 1;
    }
    return resultats;
  }

  // Solde net moyen réel par semaine, sur les dernières semaines saisies.
  // Retourne null si aucune donnée n'est encore disponible.
  function soldeNetMoyenHebdo(){
    var semaines = semainesRecentesAvecDonnees(NB_SEMAINES_MOYENNE);
    if(semaines.length === 0) return null;
    var total = 0;
    semaines.forEach(function(offset){
      total += calculerEtat("semaine", offset).soldeNetCumule;
    });
    return total / semaines.length;
  }

  // Montant estimé mis de côté pour l'objectif actif depuis sa création :
  // le pourcentage choisi appliqué au solde net réel de chaque jour positif.
  // V1.2 : montant mis de côté depuis la création de l'objectif (recalculé, jamais stocké).
  function montantEpargneEstime(obj){
    if(!obj) return 0;
    return epargnePlage(obj.dateCreation, todayKey());
  }

  // Recette moyenne par jour travaillé sur les 4 dernières semaines saisies (null si aucune donnée).
  function recetteMoyenneJourTravaille(){
    var semaines = semainesRecentesAvecDonnees(NB_SEMAINES_MOYENNE);
    if(semaines.length === 0) return null;
    var rec = 0, jours = 0;
    semaines.forEach(function(off){
      var e = calculerEtat("semaine", off);
      rec += e.recetteTotale; jours += e.nbJoursTravailles;
    });
    return jours > 0 ? rec / jours : null;
  }

  function estimationEpargneJour(mode, pourcentage, montantJour){
    if(mode === "manuel") return montantJour > 0 ? montantJour : 0;
    var moy = recetteMoyenneJourTravaille();
    return moy ? Math.round(moy * pourcentage / 100) : 0;
  }

  function formatJoursTravailles(n){
    if(n == null) return "durée non estimable pour l’instant";
    if(n <= 0) return "objectif atteint";
    if(n === 1) return "environ 1 jour de travail";
    if(n <= 60) return "environ " + n + " jours de travail";
    var mois = Math.round(n / 26);
    return "environ " + mois + " mois de travail";
  }

  function calculerScenarios(montantCible, montantDejaEpargne, soldeHebdoMoyen){
    var montantRestant = Math.max(0, montantCible - montantDejaEpargne);
    return SCENARIOS_OBJECTIF.map(function(sc){
      var montantParSemaine = soldeHebdoMoyen > 0 ? Math.round(soldeHebdoMoyen * sc.pourcentage / 100) : 0;
      var semaines = montantParSemaine > 0 ? Math.ceil(montantRestant / montantParSemaine) : null;
      return {
        pourcentage: sc.pourcentage,
        nom: sc.nom,
        montantParSemaine: montantParSemaine,
        semaines: semaines
      };
    });
  }

  function formatDuree(semaines){
    if(semaines == null) return "durée non estimable pour l’instant";
    if(semaines <= 0) return "objectif atteint";
    if(semaines === 1) return "1 semaine";
    if(semaines < 9) return semaines + " semaines";
    var mois = Math.round(semaines / 4.345);
    if(mois < 1) mois = 1;
    if(mois < 24) return "environ " + mois + " mois";
    var ans = Math.round(mois / 12);
    return "environ " + ans + (ans > 1 ? " ans" : " an");
  }

  // ---------- Sauvegarde et restauration (F10) ----------

  function nombreJoursEnregistres(donneesJours){
    return Object.keys(donneesJours || {}).length;
  }

  function marquerSauvegardeFaite(){
    state.meta.derniereSauvegarde = todayKey();
    state.meta.dernierRappelSauvegarde = todayKey();
    saveState();
  }

  // V1.1 (repris de MonDjai/Coiffure) : choix du dossier quand le navigateur le permet,
  // sinon téléchargement classique. Une annulation volontaire ne déclenche rien.
  function sauvegarderAvecChoixDossier(){
    var nom = "mondjai-salonh-sauvegarde-" + todayKey() + ".json";
    if(typeof window.showSaveFilePicker === "function"){
      var donnees = JSON.stringify(state, null, 2);
      window.showSaveFilePicker({
        suggestedName: nom,
        types: [{ description: "Sauvegarde MonDjai/Salon H", accept: { "application/json": [".json"] } }]
      }).then(function(handle){
        return handle.createWritable().then(function(w){
          return w.write(donnees).then(function(){ return w.close(); });
        });
      }).then(function(){
        marquerSauvegardeFaite();
        afficherToast("Sauvegarde enregistrée.");
      }).catch(function(err){
        if(err && err.name === "AbortError") return;
        if(telechargerSauvegarde()) afficherToast("Sauvegarde téléchargée.");
      });
      return;
    }
    if(telechargerSauvegarde()) afficherToast("Sauvegarde téléchargée.");
  }

  function telechargerSauvegarde(){
    try{
      var donnees = JSON.stringify(state, null, 2);
      var blob = new Blob([donnees], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "mondjai-salonh-sauvegarde-" + todayKey() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      marquerSauvegardeFaite();
      return true;
    }catch(e){
      return false;
    }
  }

  function stateDepuisImport(parsed){
    var base = defaultState();
    if(!parsed || typeof parsed !== "object") return null;
    return migrerEtat({

      jours: (parsed.jours && typeof parsed.jours === "object") ? parsed.jours : {},
      dernierMontant: parsed.dernierMontant || {},
      creances: Array.isArray(parsed.creances) ? parsed.creances : [],
      objectif: parsed.objectif || null,
      meta: Object.assign({}, base.meta, parsed.meta || {})
    });
  }

  /* ================= SalonH-8A : compte en ligne ================= */

  // (ci-dessus, identique dans les trois applis). Rien ici ne touche aux

  var JOUR_BASCULE_ESSAI_LOCAL = 15;   // règle du 15 (hors ligne seulement ; le serveur fait foi)
  var CONFIG_COMPTE = {

    nouvelleInstallation: function(){ return !state.config.codeAccesOk; },

    verrouille: function(){ return porteEntreeActive(); },
    auRepos: function(){
      if(porteEntreeActive() || ui.modal || (ui.page || "jour") !== "jour" || ui.jourSelection || annulation) return false;

    },

    pinExistant: function(){ return !!(state.config.pinActif && state.config.pin); },

    ouvrirAcces: function(){

    accesLocal: function(){

  // Dernier mois civil couvert par un essai commencé ce jour-là (règle du 15).
  function moisEssaiDepuis(d){
    d = d || new Date();
    var m = d.getMonth() + 1, a = d.getFullYear();
    if(d.getDate() >= JOUR_BASCULE_ESSAI_LOCAL){ m += 1; if(m > 12){ m = 1; a += 1; } }
    return { mois: m, annee: a };
  }
  // Migration silencieuse : un coiffeur déjà installé (code d'accès du 7E validé,
  // aucune échéance) reçoit un mois d'essai complet compté depuis le jour de la
  // mise à jour (règle du 15), jamais moins. Écrit une seule fois ; rien
  // n'est effacé ni réécrit (les champs du 7F sont gardés tels quels).
  function migrerAcces8A(){
    if(!state.config.codeAccesOk || state.config.moisAccesValide) return;
    state.config.moisAccesValide = moisEssaiDepuis(new Date());
    saveState();
  }
  // Code PIN demandé à l'ouverture ? L'ancien code en clair, ou le code du
  // compte (un seul pour le compte : créé ici, dans Coiffure ou dans Mèches).
  function pinRequis(){
    return !!(state.config.pinActif && state.config.pin) || MonDjaiCompte.pinDefini();
  }
  function pinCorrect(saisie){
    if(state.config.pinActif && state.config.pin) return saisie === state.config.pin;
    return MonDjaiCompte.verifierPin(saisie);
  }
  // Contenu du fichier « Sauvegarder mes données » : l'état de Salon H, plus un
  // bloc « compte » (jamais la session ni le code PIN).
  function etatPourFichier(){
    var copie = JSON.parse(JSON.stringify(state));
    copie.compte = MonDjaiCompte.pourSauvegarde();
    return copie;
  }
  // Rien de noté : aucun jour avec une recette, un client ou une charge,
  // aucune créance, aucun objectif.
  function etatSansChiffres(s){
    if(!s || typeof s !== "object") return true;
    var j = s.jours && typeof s.jours === "object" ? s.jours : {};
    for(var k in j){ if(Object.prototype.hasOwnProperty.call(j, k) && j[k] && !jourVide(j[k])) return false; }
    return !(Array.isArray(s.creances) && s.creances.length) && !s.objectif;
  }
  // Restauration (fichier ou sauvegarde en ligne) : mêmes règles. Le bloc
  // « compte » ne rejoint jamais l'état de Salon H ; il est remis en place
  // seulement s'il manque sur ce téléphone. L'accès et le code PIN de ce
  // téléphone ne viennent jamais du fichier (une sauvegarde n'allonge rien et
  // ne remet pas un ancien code).
  function restaurerEtat(parsed){
    if(!parsed || typeof parsed !== "object" || Array.isArray(parsed) || typeof parsed.jours !== "object" || parsed.jours === null) return false;
    var copie = JSON.parse(JSON.stringify(parsed));
    var compteDuFichier = copie.compte || null;
    delete copie.compte;
    var nouvelEtat = stateDepuisImport(copie);
    if(!nouvelEtat) return false;

  // --- Redessin partiel (Sprint 7A) ---

  function premiereClasse(n){
    var c = n.getAttribute("class");
    if(!c) return "";
    c = c.replace(/^\s+/, "");
    var i = c.indexOf(" ");
    return i === -1 ? c : c.slice(0, i);
  }

  // Deux nœuds « de même nature » sont mis à jour sur place ; sinon l'ancien est remplacé.
  function memeNature(a, b){
    if(a.nodeType !== b.nodeType) return false;
    if(a.nodeType !== 1) return true;
    if(a.tagName !== b.tagName) return false;
    if((a.getAttribute("id") || "") !== (b.getAttribute("id") || "")) return false;
    if(a.tagName === "INPUT" && (a.getAttribute("type") || "") !== (b.getAttribute("type") || "")) return false;
    return premiereClasse(a) === premiereClasse(b);
  }

  function synchroniserAttributs(a, b){
    var i, at;
    for(i = a.attributes.length - 1; i >= 0; i--){
      at = a.attributes[i];
      if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    }
    for(i = 0; i < b.attributes.length; i++){
      at = b.attributes[i];
      if(a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    }
  }

  function morphNoeud(a, b){
    if(a.nodeType !== 1){
      if(a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
      return;
    }
    synchroniserAttributs(a, b);
    if(a.tagName === "INPUT"){
      if((a.getAttribute("type") || "").toLowerCase() !== "file"){
        var v = b.getAttribute("value");
        if(v === null) v = "";
        if(a.value !== v) a.value = v;
      }
      return;
    }
    if(a.tagName === "CANVAS") return; // dessiné à part (Partager)
    morphEnfants(a, b);
  }

  // Met à jour les enfants de `parent` d'après ceux de `modele`, entre deux bornes (exclues).
  function morphPlage(parent, ancien, finAncien, nouveau, finNouveau){
    while(nouveau && nouveau !== finNouveau){
      var suivantNouveau = nouveau.nextSibling;
      if(!ancien || ancien === finAncien){
        parent.insertBefore(nouveau, finAncien || null);
      }else if(memeNature(ancien, nouveau)){
        morphNoeud(ancien, nouveau);
        ancien = ancien.nextSibling;
      }else{
        var suivantAncien = ancien.nextSibling;
        parent.replaceChild(nouveau, ancien);
        ancien = suivantAncien;
      }
      nouveau = suivantNouveau;
    }
    while(ancien && ancien !== finAncien){
      var s = ancien.nextSibling;
      parent.removeChild(ancien);
      ancien = s;
    }
  }

  function dernierMenu(parent){
    for(var n = parent.lastChild; n; n = n.previousSibling){ if(n.nodeType === 1 && n.tagName === "NAV") return n; }
    return null;
  }

  // Le menu du bas sert de repère : l'écran (avant lui) et la feuille ou le message (après lui)
  // sont comparés séparément, pour que le menu reste en place quand on change d'onglet.
  function morphEnfants(parent, modele){
    var menuAncien = parent === app ? dernierMenu(parent) : null;
    var menuNouveau = menuAncien ? dernierMenu(modele) : null;
    if(menuAncien && menuNouveau && memeNature(menuAncien, menuNouveau)){
      var apresNouveau = menuNouveau.nextSibling;
      morphPlage(parent, parent.firstChild, menuAncien, modele.firstChild, menuNouveau);
      morphNoeud(menuAncien, menuNouveau);
      morphPlage(parent, menuAncien.nextSibling, null, apresNouveau, null);
    }else{
      morphPlage(parent, parent.firstChild, null, modele.firstChild, null);
    }
  }

  function appliquerRendu(html){
    if(!app.firstChild){ app.innerHTML = html; return; }
    var gabarit = document.createElement("div");
    gabarit.innerHTML = html;
    try{
      morphEnfants(app, gabarit);
    }catch(e){
      app.innerHTML = html; // filet de sécurité : redessin complet, comme en V1.2
    }
  }

  // ---------- Bouton retour du téléphone (V1.1, repris de Trépor Sprint 5A) ----------
  // Une seule entrée d'historique armée à la fois : le retour ferme la couche la plus
  // profonde (fenêtre → écran secondaire → sous-étape → onglet), jamais l'application
  // tant qu'on n'est pas revenu sur « Aujourd'hui ».

  var historiqueArme = false;

  function porteEntreeActive(){

  }

  function uiProfonde(){

  function syncHistorique(){
    if(!window.history || !history.pushState) return;

    }else if(!profonde && historiqueArme){

      ignorerProchainPop = true;

    }

  function retourArriere(){
    if(ui.modal){
      if(ui.modal === "client-edit"){ ui.modal = "clients-jour"; }
      else if(ui.chargeRetour && ui.modal !== ui.chargeRetour){ ui.modal = ui.chargeRetour; }
      else { ui.modal = null; ui.chargeRubriqueId = null; ui.chargeEditId = null; ui.chargeRetour = null; }

    // Sprint 7D : sous-niveau → écran secondaire (un à la fois) → autre onglet → Aujourd'hui.
    if(ui.page === "reglages"){
      if(ui.ajoutRubriquePerso){ ui.ajoutRubriquePerso = false; return; }
      if(ui.reglagesPinEtape){ ui.reglagesPinEtape = null; ui.pinSaisie = ""; return; }

    if(ui.page === "objectif"){
      if(ui.objConfirmSuppr){ ui.objConfirmSuppr = false; return; }
      if(ui.objDraft && ui.objDraft.edition){ ui.objDraft = null; return; }
      if(ui.objDraft && ui.objDraft.step === "form"){ ui.objDraft.step = "modele"; return; }
    }
    if(ui.page === "etat" && ui.etatSemaineOuverte){ ui.etatSemaineOuverte = null; return; }
    if(ui.page && !estOnglet(ui.page)){
      if(ui.page === "jour-detail") ui.historiqueSelection = null;
      retourSecondaire(); return;
    }
    if(ui.page && ui.page !== "jour"){ allerOnglet("jour"); return; }
    if(ui.jourSelection){ ui.jourSelection = null; return; }
  }

  window.addEventListener("popstate", function(){
    if(ignorerProchainPop){ ignorerProchainPop = false; return; }
    historiqueArme = false;
    if(MonDjaiCompte.profondeur() > 0){ MonDjaiCompte.retour(); syncHistorique(); return; }   // SalonH-8A
