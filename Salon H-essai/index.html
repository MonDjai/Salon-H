    c.memoire = (typeof memoire === "number" ? memoire + " Go" : "non indiquée") + (typeof coeurs === "number" && coeurs > 0 ? " · " + coeurs + " cœurs" : "");
    return c;
  };

  function deux(n){ return n < 10 ? "0" + n : "" + n; }

  // Texte court à envoyer par WhatsApp. Aucune donnée personnelle (ni montant, ni nom).
  B.texteDiagnostic = function(o){
    o = o || {};
    var c = B.contexte();
    var d = new Date();
    var l = [];
    l.push("MonDjai/Salon H — diagnostic");
    l.push("Version : " + (o.version || "SalonH-8A · cache 9"));
    l.push("Téléphone : " + c.telephone);
    l.push("Navigateur : " + c.navigateurComplet);
    if(c.integre) l.push("Lien ouvert depuis : " + c.integre + (c.integreSur ? " (navigateur intégré)" : ""));
    l.push("Ouverte : " + (o.ouverte || "dans le navigateur"));
    if(o.horsLigne) l.push("Hors ligne : " + o.horsLigne);
    if(B.secours && B.secours.etatTexte) l.push("Protection : " + B.secours.etatTexte());
    l.push("Mémoire : " + c.memoire);
    try{ l.push("Écran : " + window.innerWidth + "×" + window.innerHeight + " · x" + (Math.round((window.devicePixelRatio || 1) * 100) / 100)); }catch(e){}
    l.push("Animations : " + (B.modeste ? "coupées (téléphone modeste)" : (B.mouvementReduit ? "coupées (mouvement réduit)" : "normales")));
    if(o.demarrage) l.push("Démarrage : " + o.demarrage);
    if(o.erreur) l.push("Problème : " + o.erreur);
    if(B.erreurs.length) l.push("Erreurs : " + B.erreurs.join(" | "));
    l.push("Date : " + deux(d.getDate()) + "/" + deux(d.getMonth() + 1) + "/" + d.getFullYear() + " " + deux(d.getHours()) + ":" + deux(d.getMinutes()));
    l.push("UA : " + ua);
    return l.join("\n");
  };

  // Copie dans le presse-papiers : API moderne, sinon méthode ancienne ; ko() si rien ne marche.
  B.copier = function(texte, ok, ko){
    function ancienne(){
      var reussi = false;
      try{
        var t = document.createElement("textarea");
        t.value = texte; t.setAttribute("readonly", "");
        t.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;";
        document.body.appendChild(t); t.select();
        try{ t.setSelectionRange(0, texte.length); }catch(e1){}
        reussi = document.execCommand && document.execCommand("copy");
        document.body.removeChild(t);
      }catch(e){ reussi = false; }
      if(reussi){ if(ok) ok(); } else if(ko){ ko(); }
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext !== false){
        navigator.clipboard.writeText(texte).then(function(){ if(ok) ok(); }, ancienne);
        return;
      }
    }catch(e){}
    ancienne();
  };

  B.telecharger = function(nom, texte, type){
    try{
      var a = document.createElement("a");
      var url = null;
      if(window.Blob && window.URL && URL.createObjectURL){
        url = URL.createObjectURL(new Blob([texte], { type: type }));
        a.href = url;
      }else{
        a.href = "data:" + type + ";charset=utf-8," + encodeURIComponent(texte);
      }
      a.download = nom;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      if(url) setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      return true;
    }catch(e){ return false; }
  };

  B.lienApplication = function(){
    var l = window.location;
    return (l.protocol + "//" + l.host + l.pathname).replace(/index\.html$/, "");
  };

  // Android : lien « intent » qui ouvre la même adresse dans Chrome (aucun appel réseau).
  B.ouvrirDansChrome = function(){
    var l = window.location;
    if(B.contexte().plateforme !== "android" || l.protocol !== "https:") return false;
    try{ window.location.href = "intent://" + l.host + l.pathname + "#Intent;scheme=https;package=com.android.chrome;end"; return true; }
    catch(e){ return false; }
  };

  /* ---------- Écran de secours ---------- */
  function aujourdhui(){ var d = new Date(); return d.getFullYear() + "-" + deux(d.getMonth() + 1) + "-" + deux(d.getDate()); }
  function echapper(s){ return String(s).replace(/[&<>"]/g, function(ch){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }

  var TEXTES_SECOURS = {
    erreur:    ["L’application n’a pas pu démarrer", "Rien n’est effacé. Touchez Recharger. Si cela recommence, copiez le diagnostic et envoyez-le par WhatsApp."],
    illisible: ["L’application n’a pas pu démarrer", "Les données de ce téléphone sont illisibles. Rien n’est effacé : gardez-en une copie, puis restaurez votre dernière sauvegarde."],
    stockage:  ["L’application n’a pas pu démarrer", "Ce navigateur ne permet pas d’enregistrer vos données. Ouvrez le lien avec Chrome."],
    ancien:    ["L’application n’a pas pu démarrer", "Ce navigateur est trop ancien pour MonDjai. Ouvrez le lien avec Chrome."],
    operamini: ["Ce navigateur ne peut pas ouvrir MonDjai", "Ouvrez le lien avec Chrome."]
  };

  B.afficherSecours = function(raison){
    if(B.secoursAffiche) return;
    B.secoursAffiche = true;
    raison = TEXTES_SECOURS[raison] ? raison : "erreur";
    var cible = document.getElementById("app") || document.body;
    if(!cible) return;
    var brut = null, lisibles = false;
    if(raison === "erreur" || raison === "illisible"){
      try{ brut = window.localStorage.getItem(CLE_DONNEES); }catch(e){ brut = null; }
      if(brut){ try{ var p = JSON.parse(brut); lisibles = !!p && typeof p === "object"; }catch(e2){ lisibles = false; } }
      if(brut && !lisibles) raison = "illisible";
    }
    var t = TEXTES_SECOURS[raison];
    var navigateurEnCause = raison === "stockage" || raison === "ancien" || raison === "operamini";
    var android = B.contexte().plateforme === "android";
    var esp = ' style="margin-top:10px;"';
    var h = '<div class="secours" data-test="ecran-secours" data-raison="' + raison + '">';
    h += '<div class="about-mark">H</div>';
    h += '<div class="card"><div class="title-md">' + t[0] + '</div><div class="muted" style="margin-top:6px;">' + t[1] + '</div></div>';
    if(navigateurEnCause){
      h += '<div class="backup-info secours-lien">' + echapper(B.lienApplication()) + '</div>';
      h += '<button type="button" class="btn btn-primary"' + esp + ' data-secours="copier-lien">Copier le lien</button>';
      if(android && window.location.protocol === "https:") h += '<button type="button" class="btn btn-secondary"' + esp + ' data-secours="ouvrir-chrome">Ouvrir dans Chrome</button>';
      h += '<button type="button" class="btn btn-secondary"' + esp + ' data-secours="diagnostic">Copier le diagnostic</button>';
      h += '<button type="button" class="btn btn-ghost"' + esp + ' data-secours="recharger">Recharger</button>';
    }else{
      h += '<button type="button" class="btn btn-primary" data-secours="recharger">Recharger</button>';
      h += '<button type="button" class="btn btn-secondary"' + esp + ' data-secours="diagnostic">Copier le diagnostic</button>';
      if(lisibles){
        h += '<button type="button" class="btn btn-secondary"' + esp + ' data-secours="sauvegarder">💾 Sauvegarder mes données</button>';
      }else if(raison === "illisible"){
        h += '<button type="button" class="btn btn-secondary"' + esp + ' data-secours="copie-brute">Garder une copie</button>';
        h += '<label class="btn btn-secondary"' + esp + '>📂 Restaurer une sauvegarde<input type="file" id="secours-fichier" accept="application/json,.json"></label>';
        h += '<button type="button" class="btn btn-ghost"' + esp + ' data-secours="recommencer">Recommencer sans ces données</button>';
      }
    }
    h += '<div class="muted secours-msg" id="secours-msg" style="margin-top:12px;text-align:center;"></div>';
    h += '<textarea class="diag-texte" id="secours-texte" readonly style="display:none;"></textarea>';
    h += '</div>';
    cible.innerHTML = h;
    cible.oninput = null; cible.onchange = null; cible.onkeydown = null;

    var confirmerRecommencer = false;
    function message(txt){ var m = document.getElementById("secours-msg"); if(m) m.textContent = txt; }
    function montrerTexte(txt){
      var z = document.getElementById("secours-texte");
      if(!z) return;
      z.value = txt; z.style.display = "block";
      try{ z.focus(); z.select(); }catch(e){}
    }
    function texteDiag(){ return B.texteDiagnostic({ erreur: "écran de secours (" + raison + ")" }); }

    cible.onclick = function(e){
      var el = e.target;
      while(el && el !== cible && !(el.getAttribute && el.getAttribute("data-secours"))) el = el.parentNode;
      if(!el || el === cible) return;
      var a = el.getAttribute("data-secours");
      if(a === "recharger"){ try{ window.location.reload(); }catch(e1){} }
      else if(a === "diagnostic"){ var txt = texteDiag(); B.copier(txt, function(){ message("Diagnostic copié. Envoyez-le par WhatsApp."); }, function(){ message("Copiez le texte ci-dessous :"); montrerTexte(txt); }); }
      else if(a === "copier-lien"){ var lien = B.lienApplication(); B.copier(lien, function(){ message("Lien copié. Collez-le dans Chrome."); }, function(){ message("Appuyez longuement sur le lien pour le copier."); montrerTexte(lien); }); }
      else if(a === "ouvrir-chrome"){ if(!B.ouvrirDansChrome()) message("Ouvrez Chrome et collez-y le lien."); }
      else if(a === "sauvegarder"){
        var joli = brut; try{ joli = JSON.stringify(JSON.parse(brut), null, 2); }catch(e3){}
        message(B.telecharger("mondjai-salonh-sauvegarde-" + aujourdhui() + ".json", joli, "application/json") ? "Sauvegarde téléchargée." : "Téléchargement impossible sur ce navigateur.");
      }
      else if(a === "copie-brute"){
        message(B.telecharger("mondjai-salonh-donnees-illisibles-" + aujourdhui() + ".txt", brut || "", "text/plain") ? "Copie téléchargée." : "Téléchargement impossible sur ce navigateur.");
      }
      else if(a === "recommencer"){
        if(!confirmerRecommencer){ confirmerRecommencer = true; message("Touchez encore pour confirmer. Une copie reste sur ce téléphone."); return; }
        try{
          window.localStorage.setItem(CLE_COPIE_ILLISIBLE, brut || "");
          window.localStorage.removeItem(CLE_DONNEES);
        }catch(e4){ message("Impossible ici : touchez d’abord « Garder une copie »."); return; }
        if(B.secours && B.secours.effacerCopie) B.secours.effacerCopie(function(){ window.location.reload(); });
        else window.location.reload();
      }
    };
    cible.onchange = function(e){
      var f = e.target;
      if(!f || f.id !== "secours-fichier" || !f.files || !f.files[0] || !window.FileReader) return;
      var lecteur = new FileReader();
      lecteur.onload = function(ev){
        var p = null;
        try{ p = JSON.parse(ev.target.result); }catch(e5){ p = null; }
        if(!p || typeof p !== "object" || typeof p.jours !== "object" || p.jours === null){
          message("Ce fichier ne ressemble pas à une sauvegarde MonDjai/Salon H valide."); return;
        }
        try{
          if(brut) window.localStorage.setItem(CLE_COPIE_ILLISIBLE, brut);
          window.localStorage.setItem(CLE_DONNEES, JSON.stringify(p));
          message("Sauvegarde restaurée. Redémarrage…");
          setTimeout(function(){ window.location.reload(); }, 400);
        }catch(e6){ message("Restauration impossible sur ce navigateur."); }
      };
      lecteur.onerror = function(){ message("Impossible de lire ce fichier."); };
      lecteur.readAsText(f.files[0]);
    };
  };
})();
</script>
<script>
/* ==============================================================
   MonDjai/Salon H — Sprint 7B : copie de secours des données.
   Mécanisme de la famille (MDStock de MonDjai/Salaire 6B.1), adapté :
    - stockage durable demandé sans poser de question ;
    - copie de l'état (salonh_state_v1) dans IndexedDB (base
      mondjai_salonh_secours, magasin copie, clé etat), 500 ms après chaque
      enregistrement, au démarrage et quand la page passe en arrière-plan ;
    - si l'état principal manque ou est illisible et qu'une copie existe :
      remise en place, UN seul rechargement, message unique. L'écran n'est
      JAMAIS masqué : seul un court message « Récupération de vos données… »
      s'affiche par-dessus pendant l'opération ;
    - jamais d'écriture par-dessus une copie qu'on n'a pas pu lire ;
    - IndexedDB absent : l'application fonctionne comme avant.
   La clé salonh_state_v1 n'est jamais renommée. ES5 (var, function).
   ============================================================== */
(function(){
  var B = window.SALONH_BOOT;
  if(!B) return;
  var CLE = "salonh_state_v1", BD = "mondjai_salonh_secours", MAG = "copie", ENR = "etat";
  var CLE_COPIE_ILLISIBLE = "salonh_copie_illisible";
  var DRAPEAU = "salonh_restauration_auto", INFO = "salonh_restauration_info";
  var DELAI_COPIE_MS = 500;               // copie 500 ms après chaque enregistrement
  var DELAI_COPIE_DEMARRAGE_MS = 800;     // copie de démarrage, après le premier affichage
  var DELAI_MAX_VERIFICATION_MS = 2500;   // au-delà, on continue sans copie (rien n'est bloqué)
  var DUREE_MESSAGE_MS = 6000;            // « Vos données ont été retrouvées automatiquement »

  var S = B.secours = {
    disponible: !!window.indexedDB && B.bloque !== "stockage" && B.bloque !== "operamini" && B.bloque !== "ancien",
    pret: false,          // la copie peut être écrite (IndexedDB lue sans erreur)
    lue: false,           // la lecture du démarrage est terminée
    erreur: false,        // IndexedDB illisible : aucune écriture
    verification: false,  // état principal absent ou illisible : vérification en cours
    restaure: false,      // une remise en place est lancée (rechargement)
    derniere: null,       // date (ms) de la dernière copie réussie
    durable: "en attente",
    surChangement: null,  // rappel de l'application (mise à jour de Réglages)
    attente: []
  };

  function valide(txt){
    try{ var o = JSON.parse(txt); return !!o && typeof o === "object" && !Array.isArray(o); }catch(e){ return false; }
  }
  function etatPrincipal(){
    var brut = null;
    try{ brut = window.localStorage.getItem(CLE); }catch(e){ return { etat: "bloque", brut: null }; }
    if(!brut) return { etat: "absent", brut: null };
    return { etat: valide(brut) ? "ok" : "illisible", brut: brut };
  }
  function prevenir(){ try{ if(S.surChangement) S.surChangement(); }catch(e){} }

  /* --- IndexedDB, version « rappel » (aucune dépendance) --- */
  function ouvrir(ok, ko){
    var req;
    try{ req = window.indexedDB.open(BD, 1); }catch(e){ ko(e); return; }
    req.onupgradeneeded = function(){ try{ req.result.createObjectStore(MAG); }catch(e){} };
    req.onsuccess = function(){ ok(req.result); };
    req.onerror = req.onblocked = function(){ ko(req.error); };
  }
  function lire(ok, ko){
    ouvrir(function(db){
      try{
        var r = db.transaction(MAG, "readonly").objectStore(MAG).get(ENR);
        r.onsuccess = function(){ var v = r.result; db.close(); ok(v || null); };
        r.onerror = function(){ db.close(); ko(r.error); };
      }catch(e){ try{ db.close(); }catch(x){} ko(e); }
    }, ko);
  }
  function ecrire(txt){
    ouvrir(function(db){
      try{
        var tx = db.transaction(MAG, "readwrite");
        tx.objectStore(MAG).put({ texte: txt, date: Date.now() }, ENR);
        tx.oncomplete = function(){ db.close(); S.derniere = Date.now(); prevenir(); };
        tx.onerror = tx.onabort = function(){ try{ db.close(); }catch(x){} };
      }catch(e){ try{ db.close(); }catch(x){} }
    }, function(){});
  }

  /* --- copie : relit l'état principal au moment d'écrire --- */
  var minuteur = null, demandee = false;
  function copierMaintenant(){
    minuteur = null;
    if(!S.pret) return;
    var e = etatPrincipal();
    if(e.etat === "ok") ecrire(e.brut);   // jamais une copie d'un état illisible
  }
  S.miroir = function(){
    if(!S.pret){ demandee = true; return; }
    if(minuteur) return;
    minuteur = setTimeout(copierMaintenant, DELAI_COPIE_MS);
  };
  S.vider = function(){ if(minuteur){ clearTimeout(minuteur); copierMaintenant(); } };
  S.apres = function(fn){ if(!S.verification) fn(); else S.attente.push(fn); };
  // « Recommencer sans ces données » : une vraie remise à zéro retire aussi la copie.
  S.effacerCopie = function(fini){
    if(!S.disponible){ fini(); return; }
    var fait = false;
    var finir = function(){ if(!fait){ fait = true; fini(); } };
    setTimeout(finir, 1500);
    ouvrir(function(db){
      try{
        var tx = db.transaction(MAG, "readwrite");
        tx.objectStore(MAG)["delete"](ENR);
        tx.oncomplete = function(){ db.close(); finir(); };
        tx.onerror = tx.onabort = function(){ try{ db.close(); }catch(x){} finir(); };
      }catch(e){ try{ db.close(); }catch(x){} finir(); }
    }, finir);
  };
  try{
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden") S.vider(); });
    window.addEventListener("pagehide", S.vider);
  }catch(e){}

  function deux(n){ return n < 10 ? "0" + n : "" + n; }
  // Texte de la ligne « Protection » (Réglages › Sauvegarde) et du diagnostic.
  S.etatTexte = function(){
    var copie;
    if(!S.disponible) copie = "indisponible sur ce navigateur";
    else if(S.erreur) copie = "indisponible";
    else if(S.derniere){
      var d = new Date(S.derniere), a = new Date();
      copie = "à jour (" + (d.toDateString() === a.toDateString() ? deux(d.getHours()) + ":" + deux(d.getMinutes()) : deux(d.getDate()) + "/" + deux(d.getMonth() + 1)) + ")";
    }
    else if(!S.lue) copie = "vérification…";
    else copie = "en attente";
    return "copie de secours " + copie + " · stockage durable " + S.durable;
  };

  /* --- stockage durable, sans jamais déranger l'utilisateur --- */
  function demanderDurable(){
    try{
      if(!(navigator.storage && navigator.storage.persist && navigator.storage.persisted)){ S.durable = "non pris en charge"; return; }
      navigator.storage.persisted().then(function(deja){
        if(deja){ S.durable = "accordé"; prevenir(); return; }
        var installee = false;
        try{ installee = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }catch(e){}
        // Firefox pose une question : on ne la déclenche pas.
        if(/Firefox\//.test(navigator.userAgent || "") && !installee){ S.durable = "non accordé"; prevenir(); return; }
        return navigator.storage.persist().then(function(ok){ S.durable = ok ? "accordé" : "non accordé"; prevenir(); });
      }).catch(function(){ S.durable = "non accordé"; prevenir(); });
    }catch(e){ S.durable = "non pris en charge"; }
  }

  /* --- messages courts, hors de #app, par-dessus l'écran (qui n'est jamais masqué) --- */
  function message(texte, duree){
    function poser(){
      var m = document.getElementById("secours-info");
      if(!m){ m = document.createElement("div"); m.id = "secours-info"; m.setAttribute("role", "status"); m.setAttribute("data-test", "secours-info"); document.body.appendChild(m); }
      m.textContent = texte;
      if(duree) setTimeout(function(){ if(m.parentNode) m.parentNode.removeChild(m); }, duree);
    }
    if(document.body) poser(); else document.addEventListener("DOMContentLoaded", poser);
  }
  function retirerMessage(){ var m = document.getElementById("secours-info"); if(m && m.parentNode) m.parentNode.removeChild(m); }

  // Après une remise en place automatique : un seul message.
  var info = null;
  try{ info = window.sessionStorage.getItem(INFO); }catch(e){}
  if(info){
    try{ window.sessionStorage.removeItem(INFO); }catch(e){}
    message("✓ Vos données ont été retrouvées automatiquement.", DUREE_MESSAGE_MS);
  }

  if(!S.disponible){ S.lue = true; return; }
  demanderDurable();

  function finVerification(){
    S.verification = false;
    var l = S.attente; S.attente = [];
    for(var i = 0; i < l.length; i++){ try{ l[i](); }catch(e){} }
  }

  var depart = etatPrincipal();
  if(depart.etat === "absent" || depart.etat === "illisible") S.verification = true;
  var fini = false;
  var securite = setTimeout(function(){
    if(fini) return;
    fini = true; S.lue = true; S.erreur = true; // trop lent : on continue sans copie
    finVerification(); prevenir();
  }, DELAI_MAX_VERIFICATION_MS);

  lire(function(v){
    if(fini) return;
    fini = true; clearTimeout(securite);
    var copieValide = !!(v && v.texte && valide(v.texte));
    var dejaEssaye = false;
    try{ dejaEssaye = window.sessionStorage.getItem(DRAPEAU) === "1"; }catch(e){}
    if(S.verification && copieValide && !dejaEssaye){
      message("Récupération de vos données…");
      var ecrit = false;
      try{
        if(depart.etat === "illisible" && depart.brut) window.localStorage.setItem(CLE_COPIE_ILLISIBLE, depart.brut);
        window.localStorage.setItem(CLE, v.texte);
        ecrit = window.localStorage.getItem(CLE) === v.texte;
      }catch(e){ ecrit = false; }
      if(ecrit){
        S.restaure = true;
        try{ window.sessionStorage.setItem(DRAPEAU, "1"); window.sessionStorage.setItem(INFO, "1"); }catch(e){}
        window.location.reload();
        return;
      }
      retirerMessage();
    }
    S.lue = true;
    if(copieValide) S.derniere = v.date || null;
    // Jamais d'écriture par-dessus une copie qu'on n'a pas pu lire.
    S.pret = !v || copieValide;
    S.erreur = !S.pret;
    finVerification();
    prevenir();
    if(S.pret){
      setTimeout(function(){ demandee = false; S.miroir(); }, depart.etat === "ok" ? DELAI_COPIE_DEMARRAGE_MS : 0);
    }
  }, function(){
    if(fini) return;
    fini = true; clearTimeout(securite);
    S.lue = true; S.erreur = true;
    finVerification(); prevenir();
  });
})();
</script>

<noscript><style>html,body{background-color:#eff1f4 !important;}.noscript-msg{color:#151a22 !important;}</style><div class="noscript-msg">Ce navigateur ne peut pas ouvrir MonDjai. Ouvrez le lien avec Chrome.</div></noscript>

<script>
(function(){
  "use strict";

  // Sprint 7A : le script de démarrage (dans <head>) a peut-être reconnu un navigateur
  // qui ne peut pas faire tourner l'application : l'écran de secours s'affiche alors.

ble, même pour nous.","Sans code PIN, il n'y a pas de sauvegarde en ligne : seule la sauvegarde en fichier (Réglages › Sauvegarder) protège vos chiffres. Si vous perdez ou changez de téléphone sans aucune sauvegarde, nous ne pouvons pas les retrouver.","Si vous notez des informations sur vos propres clientes ou clients (nom, crédit), vous en êtes responsable. Elles ne quittent votre téléphone que dans votre copie fermée."]],["h","Article 7. Bon usage"],["p","Vous vous engagez à ne pas :"],["ul",["utiliser le compte ou le numéro d'une autre personne ;","déclarer un paiement que vous n'avez pas fait ;","copier, modifier ou revendre l'application, ou tenter de contourner ses protections ;","perturber le serveur ou tenter d'accéder aux données d'autres personnes ;","utiliser MonDjai pour une activité interdite par la loi."]],["h","Article 8. Disponibilité et mises à jour"],["p","Nous faisons de notre mieux pour que le service fonctionne tous les jours, sans pouvoir garantir l'absence de panne. Une coupure du serveur n'empêche pas la saisie sur votre téléphone. L'appli se met à jour toute seule ; une mise à jour n'efface pas vos chiffres. Nous pouvons faire évoluer les fonctions de l'appli."],["h","Article 9. Propriété intellectuelle"],["p","Le nom MonDjai, le logo, les écrans, les textes et le code appartiennent à Kham-Consulting. Vous recevez un droit d'usage personnel, non exclusif et non cessible, pour la durée de votre accès. Ce droit ne vous donne aucun droit sur l'application elle-même."],["h","Article 10. Responsabilité"],["ol",["Nous répondons du bon fonctionnement du service, dans la limite de ce qui dépend de nous.","Nous ne répondons pas : des erreurs de saisie ; des décisions prises à partir des chiffres ; des pertes de données liées au téléphone, à l'absence de sauvegarde ou à l'oubli du code PIN ; des pannes de réseau, de Wave, d'Orange Money ou d'un opérateur.","Si notre responsabilité est engagée, elle est limitée au montant que vous nous avez payé sur les 12 derniers mois, sauf faute grave ou volontaire de notre part.","Rien dans ces conditions ne retire les droits que la loi vous donne."]],["h","Article 11. Fermeture et suspension du compte"],["ol",["Vous pouvez fermer votre compte à tout moment en nous écrivant sur WhatsApp ou à contact@mondjai.ci. Les données du serveur sont alors supprimées selon la Politique de confidentialité ; les chiffres rangés sur votre téléphone y restent.","Nous pouvons suspendre ou fermer un compte en cas de fraude, de fausses déclarations de paiement répétées ou de non-respect de l'article 7. Nous vous prévenons avant, sauf urgence.","Un compte sans connexion depuis 12 mois peut être supprimé du serveur, avec sa sauvegarde en ligne. Nous vous prévenons 30 jours avant, par WhatsApp au numéro du compte et dans l'appli."]],["h","Article 12. Modification des conditions"],["p","Nous pouvons modifier ces conditions. Nous vous prévenons dans l'appli au moins 15 jours avant l'entrée en vigueur d'un changement important. Si vous continuez à utiliser le service après cette date, vous acceptez la nouvelle version. La version en vigueur est toujours sur mondjai.ci."],["h","Article 13. Droit applicable et litiges"],["p","Ces conditions sont soumises au droit ivoirien. En cas de désaccord, écrivez-nous d'abord : nous cherchons une solution amiable sous 30 jours. À défaut, le litige est porté devant les tribunaux compétents d'Abidjan."]]},{"id":"cgv","titre":"Conditions générales de vente (CGV)","blocs":[["p","Version 1.0, en vigueur le 1er décembre 2026."],["h","Article 1. Vendeur et objet"],["p","Les abonnements MonDjai sont vendus par Kham-Consulting, dont l'identité figure à l'article 1 des Conditions générales d'utilisation. Ces conditions s'appliquent à tout abonnement payé depuis une application MonDjai."],["h","Article 2. Formules et prix"],["p","Prix en vigueur au 1er décembre 2026 :"],["t",[["Formule","1 mois","3 mois","1 an"],["Coiffure (domicile, salon, onglerie)","2 000 F","5 500 F","2 riode, prend la suite de celle-ci. Après une interruption, un paiement entre le 1er et le 14 couvre le mois en cours ; à partir du 15, la période commence le mois suivant et le reste du mois en cours vous est offert.","L'abonnement ne se renouvelle pas tout seul : aucun prélèvement automatique n'est fait."]],["h","Article 6. Fin de l'abonnement ou de l'essai"],["ol",["Nous vous prévenons 3 jours avant la fin, dans l'appli, et par notification si vous l'avez autorisée.","Après la fin, vous gardez 3 jours de grâce pendant lesquels la saisie reste ouverte.","Ensuite, l'appli passe en lecture seule : vous voyez et sauvegardez vos chiffres, sans pouvoir en noter de nouveaux.","Rien n'est effacé sur votre téléphone. Dès qu'un nouveau paiement est confirmé, tout revient, et vous pouvez noter les jours passés."]],["h","Article 7. Remboursement"],["ol",["Après votre premier paiement pour une formule, vous pouvez demander le remboursement, sans donner de raison, dans les 10 jours ouvrables qui suivent la confirmation du paiement. Écrivez-nous sur WhatsApp ou à contact@mondjai.ci avec votre identifiant MonDjai.","Nous remboursons la totalité du montant payé, par le même moyen de paiement, sous 15 jours. L'appli repasse alors en lecture seule ; vos chiffres restent sur votre téléphone.","Passé ce délai, une période commencée n'est pas remboursée, même si vous n'utilisez plus l'appli.","Un paiement fait par erreur (en double, mauvais montant) est remboursé ou reporté sur la période suivante, à votre choix.","Si le service est indisponible par notre faute plus de 7 jours de suite, votre période est prolongée d'autant."]],["h","Article 8. Changement de prix"],["p","Nous pouvons changer les prix. Un nouveau prix est annoncé dans l'appli 30 jours avant. Il ne s'applique jamais à une période déjà payée."],["h","Article 9. Offre fondatrice"],["p","Les personnes qui ont testé MonDjai avant son lancement bénéficient d'une remise de 50 % pendant 12 mois à compter du début de leur test, puis de 30 % sans limite de durée. L'offre est personnelle et ne se transmet pas."],["h","Article 10. Réclamations"],["p","Pour toute question sur un paiement, écrivez-nous sur WhatsApp au +225 01 01 95 90 95 ou à contact@mondjai.ci, avec votre identifiant MonDjai et la référence de la transaction. Nous répondons sous 2 jours ouvrables. Le droit applicable et le règlement des litiges sont ceux de l'article 13 des Conditions générales d'utilisation."]]},{"id":"confidentialite","titre":"Politique de confidentialité","blocs":[["p","Version 1.0, en vigueur le 1er décembre 2026."],["h","Article 1. Qui est responsable de vos données"],["p","Le responsable du traitement de vos données est Kham-Consulting, dont l'identité figure à l'article 1 des Conditions générales d'utilisation. Contact : WhatsApp +225 01 01 95 90 95 ; e-mail contact@mondjai.ci."],["h","Article 2. Le principe"],["p","Vos chiffres restent sur votre téléphone. Si vous avez un code PIN, une copie fermée par ce code est aussi gardée sur notre serveur : nous ne pouvons pas l'ouvrir. Pour le reste, notre serveur garde seulement ce qu'il faut pour vous reconnaître, gérer votre abonnement et améliorer l'appli."],["h","Article 3. Ce que nous gardons sur le serveur"],["t",[["Données","Pourquoi","Sur quelle base","Durée"],["Compte : prénom, nom (facultatif), numéro vérifié, salon, activités, commune (facultative), parrain, identifiant MonDjai, date d'accord aux conditions","Connexion, assistance, gestion du compte","Le contrat","Tant que le compte sert ; supprimé 12 mois après la dernière connexion"],["Abonnement et paiements : formule, dates, montant, moyen, référence, reçu","Débloquer l'appli, tenir les comptes, délivrer les reçus","Le contrat ; nos obligations comptables","10 ans"],["Appareil : marque, système, navigateur, version de l'appli, adresse de notification","Assistance, compatibilité, envoi des rappels","Le contrat ; votre accord pour les notifications","Tant que le compte existe"],["Sauvegarde en ligne : copie de vos chiffres fermée par votre code PIN (la dernière et l'avant-dernière)","Retrouver vos chiffres sur un nouveau téléphone","Le contrat ; active dès que vous avez un code PIN, vous pouvez l'arrêter","Jusqu'à la fermeture du compte, ou plus tôt sur demande"],["Avis : note, commentaire, motif de désabonnement","Améliorer le service","Votre choix de répondre","3 ans"],["Comptages d'usage (article 6)","Savoir ce qui sert et ce qu'il faut simplifier","L'amélioration du service ; vous pouvez les arrêter","13 mois"],["Erreurs : message d'erreur, écran, version","Réparer les pannes","L'amélioration du service","6 mois"]]],["p","Si vous nous écrivez sur WhatsApp ou par e-mail, nous gardons l'échange le temps de traiter votre demande."],["h","Article 4. Ce que nous ne collectons jamais"],["ul",["vos chiffres sous une forme lisible : la seule copie que nous gardons est fermée par votre code PIN ;","les noms et numéros de vos clientes et clients, en dehors de cette même copie fermée ;","votre position GPS, vos contacts, vos photos ;","votre code PIN et votre empreinte : nous ne les recevons jamais ;","vos codes Wave ou Orange Money : le paiement se fait dans leur application, pas dans MonDjai."]],["h","Article 5. La sauvegarde en ligne"],["p","Si vous avez un code PIN, l'appli envoie chaque jour une copie de vos chiffres sur notre serveur, en France. Avant l'envoi, la copie est fermée sur votre téléphone avec une clé tirée de votre code PIN. Nous ne recevons que la copie fermée et nous ne connaissons pas votre code : nous ne pouvons ni la lire, ni la récupérer si vous l'oubliez."],["p","Nous voyons seulement la date de la dernière copie. Vous pouvez arrêter la sauvegarde en ligne dans Réglages, et nous demander de supprimer les copies déjà envoyées."],["h","Article 6. Les comptages d'usage"],["p","Une fois par jour, l'appli nous envoie les comptages de la veille, pour savoir ce qui sert et ce qu'il faut simplifier."],["t",[["Nous comptons","Nous ne comptons jamais"],["Ouvertures, saisies et temps passé à saisir","Les montants"],["Écrans ouverts et fonctions utilisées","Les noms"],["Étapes du guide, rappels vus, sauvegardes faites","Les numéros de téléphone"],["Heures d'utilisation","Ce que vous tapez"],["Marque et système du téléphone, version de l'appli","Votre position"]]],["p","Ces comptages partent avec un identifiant tiré au hasard sur votre téléphone, sans lien avec votre compte. Vous pouvez les arrêter à tout moment : Réglages › « Aider à améliorer MonDjai »."],["p","Plus tard, nous pourrons proposer des statistiques de métier, par exemple un prix moyen par commune. Elles ne seront calculées qu'avec votre accord, demandé à part, et après les formalités nécessaires auprès de l'ARTCI."],["h","Article 7. Qui reçoit vos données"],["p","Nous ne vendons pas vos données et nous ne les donnons à personne pour de la publicité. Seul l'administrateur de MonDjai accède aux comptes et aux abonnements. Nous faisons appel à des prestataires techniques :"],["t",[["Prestataire","Rôle","Données concernées","Lieu"],["Supabase","Base de données et connexion des comptes","Toutes les données de l'article 3","France (Paris)"],["Cloudflare","Hébergement des applications sur mondjai.ci","Données techniques de connexion (adresse IP)","Réseau mondial"],["Orange Côte d'Ivoire (API SMS)","Envoi du code de connexion","Votre numéro et le code","Côte d'Ivoire"],["Service de notification de votre téléphone (Google, Apple)","Rappels quand l'appli est fermée","Adresse de notification, texte du rappel","Selon le fabricant"]]],["p","Wave et Orange Money traitent votre paiement selon leurs propres règles ; nous recevons seulement le montant et la référence. Nous pouvons aussi devoir communiquer des données à une autorité qui le demande dans le cadre de la loi."],["h","Article 8. Hébergement hors de Côte d'Ivoire"],["p","Les données de l'article 3 sont hébergées en France, pays qui applique le règlement européen sur la protection des données."],["h","Article 9. Sécurité"],["ul",["chaque personne ne peut lire que ses propres données ;","les échanges avec le serveur sont chiffrés (HTTPS) ;","l'administration est protégée par un mot de passe et une double vérification ;","le prix et les dates d'abonnement sont calculés par le serveur, pas par le téléphone."]],["p","Aucun système n'est sûr à 100 %. En cas d'incident touchant vos données, nous vous prévenons."],["h","Article 10. Vos droits"],["p","La loi n° 2013-450 du 19 juin 2013 vous donne le droit de :"],["ul",["savoir quelles données nous avons sur vous et en recevoir une copie ;","les faire corriger, directement dans « Mon compte » ou en nous écrivant ;","les faire supprimer ;","vous opposer à un traitement, par exemple aux comptages d'usage ou aux notifications ;","retirer un accord que vous avez donné."]],["p","Pour exercer un droit, écrivez-nous sur WhatsApp depuis le numéro de votre compte, ou à contact@mondjai.ci. Nous répondons sous 30 jours. Les données de paiement sont gardées pour la comptabilité, même après une demande de suppression."],["p","Si notre réponse ne vous convient pas, vous pouvez saisir l'Autorité de protection des données : l'ARTCI (Autorité de Régulation des Télécommunications/TIC de Côte d'Ivoire), www.artci.ci."],["h","Article 11. Messages et rappels"],["p","Nous vous écrivons pour votre compte et votre abonnement : code de connexion, reçu, rappel d'échéance. Les rappels de saisie et les notifications se règlent dans Réglages. Nous ne vous envoyons pas de publicité pour d'autres produits sans votre accord."],["h","Article 12. Stockage sur votre téléphone"],["p","MonDjai n'utilise pas de cookies publicitaires ni de traceurs d'autres sociétés. L'appli range sur votre téléphone vos chiffres, votre compte et votre connexion, pour fonctionner sans Internet."],["h","Article 13. Mineurs"],["p","MonDjai s'adresse aux professionnels. Vous avez moins de 18 ans ? Inscrivez-vous avec l'accord d'un parent ou d'un tuteur."],["h","Article 14. Modification"   /* ---------- Outils ---------- */
  function maintenant(){ return new Date().getTime(); }
  function deux(n){ return n < 10 ? "0" + n : "" + n; }
  function jourLocal(ms){
    var d = ms ? new Date(ms) : new Date();
    return d.getFullYear() + "-" + deux(d.getMonth() + 1) + "-" + deux(d.getDate());
  }
  // "AAAA-MM-JJ" → "JJ/MM/AAAA"
  function dateFr(s){
    if(!s) return "";
    var p = String(s).slice(0, 10).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(s);
  }
  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function copier(o){ return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
  // Copie de a, complétée ou corrigée par b (objets simples).
  function fusion(a, b){
    var o = {}, k;
    if(a && typeof a === "object") for(k in a) if(Object.prototype.hasOwnProperty.call(a, k)) o[k] = a[k];
    if(b && typeof b === "object") for(k in b) if(Object.prototype.hasOwnProperty.call(b, k)) o[k] = b[k];
    return o;
  }
  function appel(nom, defaut){
    try{
      if(cfg && typeof cfg[nom] === "function"){
        var args = Array.prototype.slice.call(arguments, 2);
        return cfg[nom].apply(cfg, args);
      }
    }catch(e){}
    return defaut;
  }
  function hasard(n, alphabet){
    var out = "", i, octets = null;
    try{
      if(window.crypto && window.crypto.getRandomValues){
        octets = new Uint8Array(n);
        window.crypto.getRandomValues(octets);
      }
    }catch(e){ octets = null; }
    for(i = 0; i < n; i++){
      var v = octets ? octets[i] : Math.floor(Math.random() * 256);
      out += alphabet.charAt(v % alphabet.length);
    }
    return out;
  }

  // Fin de l'essai calculée sur le téléphone (règle du 15), seulement quand le
  // serveur n'a pas encore répondu. Renvoie "AAAA-MM-JJ".
  function finEssaiLocale(ms){
    var d = new Date(ms || maintenant());
    var annee = d.getFullYear(), mois = d.getMonth();
    if(d.getDate() >= JOUR_BASCULE_ESSAI) mois += 1;
    var fin = new Date(annee, mois + 1, 0);
    return fin.getFullYear() + "-" + deux(fin.getMonth() + 1) + "-" + deux(fin.getDate());
  }

  /* ---------- Numéro de téléphone ---------- */
  function chiffresDe(s){ return String(s === undefined || s === null ? "" : s).replace(/[^0-9]/g, ""); }
  // Les 10 chiffres nationaux tapés (accepte un numéro collé avec +225 ou 00225).
  function chiffresNationaux(s){
    var c = chiffresDe(s);
    if(c.length > LONGUEUR_NUMERO && c.indexOf("00225") === 0) c = c.slice(5);
    else if(c.length > LONGUEUR_NUMERO && c.indexOf("225") === 0) c = c.slice(3);
    return c.slice(0, LONGUEUR_NUMERO);
  }
  // "+225XXXXXXXXXX" ou null.
  function normaliserNumero(s){
    var c = chiffresNationaux(s);
    if(c.length !== LONGUEUR_NUMERO) return null;
    if(PREFIXES_MOBILES.indexOf(c.slice(0, 2)) === -1) return null;
    return INDICATIF + c;
  }
  // Pourquoi un numéro n'est pas accepté (message doux), ou "".
  function defautNumero(s){
    var c = chiffresNationaux(s);
    if(!c.length) return "Tapez votre numéro, 10 chiffres.";
    if(c.length >= 2 && PREFIXES_MOBILES.indexOf(c.slice(0, 2)) === -1) return "Un numéro mobile commence par " + PREFIXES_MOBILES.slice(0, -1).join(", ") + " ou " + PREFIXES_MOBILES[PREFIXES_MOBILES.length - 1] + ".";
    if(c.length < LONGUEUR_NUMERO){
      var manque = LONGUEUR_NUMERO - c.length;
      return "Il manque " + manque + (manque > 1 ? " chiffres." : " chiffre.");
    }
    return "";
  }
  // "0700000099" → "07 00 00 00 99"
  function grouperParDeux(c){
    var out = "";
    for(var i = 0; i < c.length; i += 2) out += (i ? " " : "") + c.substr(i, 2);
    return out;
  }
  function numeroLisible(tel){
    if(!tel) return "";
    return INDICATIF + " " + grouperParDeux(chiffresNationaux(tel));
  }
  // v3 : « AT2741 » s'affiche « AT 2741 » (2 lettres, espace, 4 chiffres).
  // Un identifiant d'un autre format (6 lettres d'avant S6b) reste tel quel :
  // l'appli ne vérifie jamais son format.
  function identifiantLisible(id){
    var s = String(id === undefined || id === null ? "" : id);
    return /^[A-Za-z]{2}[0-9]{4}$/.test(s) ? s.slice(0, 2).toUpperCase() + " " + s.slice(2) : s;
  }

  /* ---------- Hachage du code PIN (SHA-256, sans bibliothèque) ---------- */
  var K256 = null;
  function sha256(octets){
    var i, j;
    if(!K256){
      K256 = [];
      var n = 2, trouve = 0;
      while(trouve < 64){
        var premier = true;
        for(j = 2; j * j <= n; j++) if(n % j === 0){ premier = false; break; }
        if(premier){ K256.push((Math.pow(n, 1 / 3) % 1) * 4294967296 | 0); trouve++; }
        n++;
      }
    }
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var l = octets.length, m = octets.slice(0);
    m.push(0x80);
    while(m.length % 64 !== 56) m.push(0);
    var bits = l * 8;
    m.push(0, 0, 0, 0, (bits >>> 24) & 255, (bits >>> 16) & 255, (bits >>> 8) & 255, bits & 255);
    var w = [];
    for(i = 0; i < m.length; i += 64){
      for(j = 0; j < 16; j++) w[j] = (m[i + j * 4] << 24) | (m[i + j * 4 + 1] << 16) | (m[i + j * 4 + 2] << 8) | m[i + j * 4 + 3];
      for(j = 16; j < 64; j++){
        var x = w[j - 15], y = w[j - 2];
        var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
        var s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for(j = 0; j < 64; j++){
        var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K256[j] + w[j]) | 0;
        var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    var out = [];
    for(i = 0; i < 8; i++) out.push((H[i] >>> 24) & 255, (H[i] >>> 16) & 255, (H[i] >>> 8) & 255, H[i] & 255);
    return out;
  }
  function octetsDeTexte(s){
    var out = [];
    for(var i = 0; i < s.length; i++) out.push(s.charCodeAt(i) & 255);
    return out;
  }
  function hexa(octets){
    var out = "";
    for(var i = 0; i < octets.length; i++) out += (octets[i] < 16 ? "0" : "") + octets[i].toString(16);
    return out;
  }
  function hacherPin(pin, sel){
    var h = sha256(octetsDeTexte(sel + "|" + pin));
    for(var i = 1; i < PIN_ITERATIONS; i++) h = sha256(h.concat(octetsDeTexte(sel)));
    return hexa(h);
  }
