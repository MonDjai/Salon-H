<!DOCTYPE html>
<html lang="fr" style="background-color:#eff1f4;">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#eff1f4">
<script>
/* Sprint 7C — thème posé AVANT le premier affichage : aucun éclair au démarrage, au rechargement
   de mise à jour, sur le code d'accès ni sur le PIN. Lit seulement config.theme dans salonh_state_v1
   ('clair' | 'auto' | 'sombre' ; absent ou illisible = 'clair'). N'écrit rien, aucun appel réseau. */
(function(){
  var t = "clair", bandeau = false, h = document.documentElement;
  try{
    var s = JSON.parse(localStorage.getItem("salonh_state_v1") || "null");
    var c = s && typeof s === "object" && s.config && typeof s.config === "object" ? s.config : null;
    var choix = c ? c.theme : null;
    if(choix === "sombre") t = "sombre";
    else if(choix === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "sombre";
    /* Écrans à bandeau : appli ouverte sans PIN, après le premier lancement. SalonH-8A : une
       nouvelle installation ouvre l'inscription, qui a le bandeau MonDjai ; le code PIN du
       compte (créé ici, dans Coiffure ou dans Mèches) ferme aussi Salon H. */
    var k = JSON.parse(localStorage.getItem("mondjai_compte_v1") || "null");
    bandeau = !(c && c.codeAccesOk) || !!(c.onboardingComplete && !(c.pinActif && c.pin) && !(k && k.pin));
  }catch(e){}
  h.setAttribute("data-theme", t);
  h.style.backgroundColor = t === "sombre" ? "#11141a" : "#eff1f4";
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t === "sombre" ? "#11141a" : (bandeau ? "#141922" : "#eff1f4"));
})();
</script>
<style>html,body{background-color:#eff1f4;color:#151a22;margin:0;}html[data-theme="sombre"],html[data-theme="sombre"] body{background-color:#11141a;color:#f5f6f8;}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>MonDjai/Salon H</title>
<meta name="description" content="Le carnet de recettes et de charges du coiffeur, en quelques secondes, en fin de journée.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Salon H">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salon H">
<style>
  :root{
    --bg:#11141a;
    --bg-card:#1a1f29;
    --bg-card-2:#20263380;
    --bg-input:#141924;
    --text:#f5f6f8;
    --text-dim:#b7bfcc;
    --text-dim-2:#858ea0;       /* 7C : retouche de contraste (7B : #6b7385, 3,5:1 → 5,0:1 sur les cartes) */
    --accent:#f5a623;
    --accent-dark:#c9840f;
    --accent-ink:#241a06;
    --success:#34b37e;
    --danger:#ff6b5e;
    --border:#2a3040;
    /* ----- Sprint 7C : couleurs autrefois écrites en dur dans les classes, en variables.
       :root = thème sombre, valeurs EXACTES de la 7B, sauf les retouches de contraste marquées « 7C ». ----- */
    --accent-fill:#f5a623;        /* ambre « remplissage » (boutons, jauges, pastilles) ; --accent = ambre « texte » */
    --success-fill:#34b37e;       /* vert « remplissage » (pastilles, interrupteur) ; --success = vert « texte » */
    --on-success:#08241a;
    --bord-btn:#2a3040;           /* contour des boutons et des choix */
    --bord-champ:#646d80;         /* 7C : contour des champs de saisie (7B : #2a3040, 1,3:1 → 3,2:1) */
    --perso-text:#241a06;         /* 7C : étiquette « perso » (7B : #fff, 3,1:1 → 5,5:1) */
    --choice-sel-bg:#20180a;
    --sel-bg:#1c1609;
    --sel-ring:#fff;
    --warn-bg:#241d0e;
    --warn-bd:#4a3a12;
    --warn-text:#e8c77a;
    --chip-bd:#4a3a12;
    --ambre-soft:#2a1f0e;
    --ambre-bd:#6a4d12;
    --ambre-badge-bg:#241a06;
    --badge-text:#f0c775;
    --info-bg:#16233a;
    --info-bd:#2b4470;
    --info-btn-bd:#2b4470;
    --info-text:#a9c4f5;
    --info-text-2:#dce8ff;
    --ok-bg:#0f2a20;
    --ok-bd:#1d4a34;
    --ok-btn-bd:#1d4a34;
    --ok-text:#7fe0b4;
    --perte-bg:#3a1714;
    --danger-bd:#4a2b28;
    --danger-text-2:#ff9b90;
    --overlay:rgba(6,7,10,.68);
    --maj-bg:#1c1609;
    --ombre-pop:0 6px 18px rgba(0,0,0,.45);
    --ombre-toast:0 6px 18px rgba(0,0,0,.4);
    --ombre-secours:0 8px 24px rgba(0,0,0,.4);
    --radius:18px;
    --radius-sm:12px;
  }
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    min-height:var(--h-ecran,100vh);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:var(--h-ecran,100vh);
    padding:18px 16px 172px 16px;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 172px) 16px;
    position:relative;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;color:inherit;}
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(145deg,var(--accent-fill),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:var(--accent-ink);
    flex:none;
  }
  .brand-name{font-size:16px;font-weight:700;letter-spacing:.2px;}
  .brand-sub{font-size:12px;color:var(--text-dim);margin-top:1px;}

  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }
  .muted{color:var(--text-dim);font-size:13px;line-height:1.5;}
  .title-lg{font-size:22px;font-weight:800;margin-bottom:6px;}
  .title-md{font-size:17px;font-weight:700;margin-bottom:4px;}
  .step-label{
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:8px;
  }

  .choice-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .choice{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--bg-input);
    border:2px solid var(--bord-btn);
    border-radius:var(--radius-sm);
    padding:14px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    width:100%;
  }
  .choice.selected{
    border-color:var(--accent);
    background:linear-gradient(0deg,var(--choice-sel-bg),var(--choice-sel-bg)),var(--bg-input);
  }
  .choice-dot{
    width:20px;height:20px;border-radius:50%;
    border:2px solid var(--text-dim-2);
    flex:none;margin-top:2px;
    display:flex;align-items:center;justify-content:center;
  }
  .choice.selected .choice-dot{border-color:var(--accent);}
  .choice.selected .choice-dot::after{
    content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);
  }
  .choice-txt strong{display:block;font-size:15px;margin-bottom:2px;}
  .choice-txt span{font-size:13px;color:var(--text-dim);}

  .field{margin-top:14px;}
  .field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .field input[type=text],
  .field input[type=tel],
  .field input[type=number]{
    width:100%;
    background:var(--bg-input);
    border:2px solid var(--bord-champ);
    border-radius:var(--radius-sm);
    padding:14px;
    font-size:17px;
    color:var(--text);
    outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  .amount-field{position:relative;}
  .amount-field input{padding-right:44px !important;font-weight:700;font-size:20px !important;}
  .amount-suffix{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    color:var(--text-dim);font-weight:700;font-size:15px;
    pointer-events:none;
  }

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    border:none;
    border-radius:var(--radius-sm);
    padding:15px 18px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent-fill);color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.4;}
  .btn-secondary{background:var(--bg-input);color:var(--text);border:1px solid var(--bord-btn);}
  .btn-ghost{background:transparent;color:var(--text-dim);}
  .btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--danger-bd);}
  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .btn-row .btn{flex:1;}

  .rubrique-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
  }
  .rubrique-item{
    position:relative;
    background:var(--bg-input);
    border:2px solid var(--bord-btn);
    border-radius:var(--radius-sm);
    padding:12px 8px 10px 8px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;
    color:var(--text);
    text-align:center;
  }
  .rubrique-item.selected{border-color:var(--accent);}
  .rubrique-icon{
    width:40px;height:40px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .rubrique-nom{font-size:11.5px;line-height:1.25;color:var(--text-dim);}
  .rubrique-item.selected .rubrique-nom{color:var(--text);}
  .rubrique-check{
    position:absolute;top:6px;right:6px;
    width:18px;height:18px;border-radius:50%;
    border:2px solid var(--text-dim-2);
    background:var(--bg-input);
  }
  .rubrique-item.selected .rubrique-check{
    border-color:var(--accent-fill);background:var(--accent-fill);
  }
  .rubrique-item.selected .rubrique-check::after{
    content:"✓";display:block;font-size:11px;line-height:14px;color:var(--accent-ink);font-weight:900;
  }
  .rubrique-item.perso-tag::before{
    content:"perso";
    position:absolute;top:-7px;left:8px;
    background:var(--accent-dark);
    color:var(--perso-text);
    font-size:8.5px;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:2px 6px;
    border-radius:20px;
  }

  .soft-msg{
    margin-top:12px;
    background:var(--warn-bg);
    border:1px solid var(--warn-bd);
    color:var(--warn-text);
    font-size:12.5px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    line-height:1.4;
  }

  .add-rubrique-btn{
    margin-top:14px;
    width:100%;
    border:2px dashed var(--border);
    background:transparent;
    color:var(--text-dim);
    border-radius:var(--radius-sm);
    padding:13px;
    font-size:14px;
    font-weight:600;
  }

  .custom-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .emoji-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .emoji-choice{
    width:42px;height:42px;border-radius:11px;
    background:var(--bg-input);border:2px solid var(--bord-btn);
    font-size:19px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text);
  }
  .emoji-choice.selected{border-color:var(--accent);}
  .color-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center;}
  .color-choice{
    width:30px;height:30px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .color-choice.selected{border-color:var(--sel-ring);}

  /* Ecran du jour */
  .solde-card{
    text-align:center;
    padding:26px 18px 22px 18px;
  }
  .solde-label{font-size:13px;color:var(--text-dim);font-weight:600;margin-bottom:8px;}
  .solde-value{
    font-size:2.4rem;
    font-size:clamp(2.1rem,10vw,2.7rem);
    font-weight:800;
    line-height:1.1;
    word-break:break-word;
  }
  .solde-value.positif{color:var(--success);}
  .solde-value.perte{color:var(--danger);}
  .stat-row{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .stat-box{
    flex:1;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:12px;
    text-align:center;
  }
  .stat-box .stat-num{font-size:17px;font-weight:800;}
  .stat-box .stat-label{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .client-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;
    background:linear-gradient(145deg,var(--accent-fill),var(--accent-dark));
    color:var(--accent-ink);
    border:none;
    border-radius:var(--radius);
    padding:18px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    margin-bottom:14px;
  }
  .client-btn .plus-circle{
    width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:900;
  }

  .section-title{
    font-size:13px;font-weight:700;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.05em;
    margin:4px 0 10px 2px;
  }
  .charge-list{display:flex;flex-direction:column;gap:8px;}
  .charge-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:11px 13px;
  }
  .charge-icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;flex:none;
  }
  .charge-info{flex:1;min-width:0;}
  .charge-nom{font-size:14px;font-weight:600;}
  .charge-heure{font-size:11.5px;color:var(--text-dim);}
  .charge-montant{font-size:15px;font-weight:700;color:var(--danger);white-space:nowrap;}
  .empty-note{
    color:var(--text-dim-2);
    font-size:13px;
    text-align:center;
    padding:18px 10px;
  }

  .fab{
    position:fixed;
    right:calc(50% - 240px + 18px);
    bottom:96px;
    bottom:calc(env(safe-area-inset-bottom) + 96px);
    width:60px;height:60px;
    border-radius:50%;
    background:var(--accent-fill);
    color:var(--accent-ink);
    border:none;
    font-size:28px;
    font-weight:800;
    box-shadow:0 6px 18px rgba(245,166,35,.35);
    cursor:pointer;
    z-index:20;
  }
  @media (max-width:516px){
    .fab{right:22px;}
  }

  /* Modales */
  .overlay{
    position:fixed;top:0;right:0;bottom:0;left:0;inset:0;
    background:var(--overlay);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--bg-card);
    border-radius:22px 22px 0 0;
    padding:20px 18px 20px 18px;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 20px) 18px;
    max-height:88vh;
    overflow-y:auto;
    border-top:1px solid var(--border);
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{
    from{transform:translateY(24px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .sheet-title{font-size:16px;font-weight:800;}
  .sheet-close{
    background:var(--bg-input);
    border:none;color:var(--text-dim);
    width:32px;height:32px;border-radius:50%;
    font-size:16px;cursor:pointer;
  }
  .modal-rubrique-grid{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  .modal-rubrique-item{
    background:var(--bg-input);
    border:2px solid var(--bord-btn);
    border-radius:var(--radius-sm);
    padding:10px 4px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    cursor:pointer;color:var(--text);
  }
  .modal-rubrique-icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .modal-rubrique-nom{font-size:10px;text-align:center;color:var(--text-dim);line-height:1.2;}
  .selected-rubrique-preview{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    margin-bottom:14px;
  }
  .selected-rubrique-preview .charge-icon{width:34px;height:34px;font-size:16px;}
  .back-link{
    background:none;border:none;color:var(--text-dim);
    font-size:13px;padding:0 0 12px 0;cursor:pointer;
    display:flex;align-items:center;gap:4px;
  }

  /* Navigation basse */
  .navbar{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:100%;
    max-width:480px;
    display:flex;
    background:var(--bg-card);
    border-top:1px solid var(--border);
    padding:8px 6px 8px 6px;
    padding:8px 6px calc(env(safe-area-inset-bottom) + 8px) 6px;
    z-index:15;
  }
  .navbtn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:transparent;border:none;color:var(--text-dim);
    padding:6px 2px;border-radius:12px;cursor:pointer;
  }
  .navbtn.active{color:var(--accent);}
  .navicon{font-size:19px;position:relative;display:inline-block;}
  .navlabel{font-size:10px;font-weight:700;}
  .navdot{
    position:absolute;top:-2px;right:-7px;
    width:8px;height:8px;border-radius:50%;
    background:var(--danger);
    border:1.5px solid var(--bg-card);
  }

  /* Badge créances sur le tableau de bord */
  .badge-chip{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--ambre-soft);border:none;color:var(--badge-text);
    font-size:12.5px;font-weight:700;
    padding:9px 14px;border-radius:999px;
    margin-top:14px;
    cursor:pointer;
  }
  .badge-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none;}

  /* Créances */
  .creance-list{display:flex;flex-direction:column;gap:8px;}
  .creance-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:12px 13px;
  }
  .creance-info{flex:1;min-width:0;}
  .creance-nom{font-size:14.5px;font-weight:700;}
  .creance-date{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .creance-montant{font-size:15px;font-weight:800;color:var(--accent);white-space:nowrap;margin-right:2px;}
  .creance-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none;}
  .btn-sm{
    border:none;border-radius:9px;
    padding:7px 11px;font-size:11.5px;font-weight:700;cursor:pointer;
    white-space:nowrap;
  }
  .btn-sm-payer{background:var(--success-fill);color:var(--on-success);}
  .btn-sm-annuler{background:transparent;color:var(--text-dim-2);border:1px solid var(--bord-btn);}
  .creance-row.payee{opacity:.65;}
  .creance-row.payee .creance-montant{color:var(--success);}
  .creance-tag-payee{
    font-size:10.5px;font-weight:800;color:var(--success);
    background:var(--ok-bg);padding:3px 8px;border-radius:999px;
  }

  /* Mon état */
  .etat-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .etat-tab{
    flex:1;background:var(--bg-input);border:2px solid var(--bord-btn);
    color:var(--text-dim);border-radius:var(--radius-sm);
    padding:10px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .etat-tab.active{border-color:var(--accent);color:var(--text);}
  .etat-period-nav{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:14px;
  }
  .etat-period-nav button{
    background:var(--bg-input);border:1px solid var(--bord-btn);color:var(--text);
    width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;flex:none;
  }
  .etat-period-nav button:disabled{opacity:.3;cursor:default;}
  .etat-period-label{font-size:14px;font-weight:700;text-align:center;flex:1;}
  .etat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .etat-stat{background:var(--bg-input);border-radius:var(--radius-sm);padding:14px 12px;}
  .etat-stat .num{font-size:18px;font-weight:800;}
  .etat-stat .num.positif{color:var(--success);}
  .etat-stat .num.perte{color:var(--danger);}
  .etat-stat .label{font-size:11px;color:var(--text-dim);margin-top:3px;}
  .rubrique-stat-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-input);border-radius:var(--radius-sm);
    padding:10px 13px;
  }
  .rubrique-stat-row .charge-icon{width:32px;height:32px;font-size:15px;flex:none;}
  .rubrique-stat-nom{flex:1;font-size:13.5px;min-width:0;}
  .rubrique-stat-montant{font-size:14px;font-weight:700;color:var(--danger);white-space:nowrap;}

  /* Historique */
  .hist-list{display:flex;flex-direction:column;gap:8px;}
  .hist-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--bg-input);border-radius:var(--radius-sm);
    padding:13px;cursor:pointer;color:var(--text);border:none;width:100%;text-align:left;
  }
  .hist-date{font-size:14px;font-weight:700;}
  .hist-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .hist-solde{font-size:15px;font-weight:800;white-space:nowrap;}
  .hist-solde.positif{color:var(--success);}
  .hist-solde.perte{color:var(--danger);}
  .readonly-tag{
    display:inline-block;background:var(--bg-input);color:var(--text-dim);
    font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;
    margin-bottom:14px;
  }

  /* En-tête : accès Mes données (F10) */
  .brand-info{flex:1;min-width:0;}
  .brand-action{
    flex:none;
    width:36px;height:36px;border-radius:50%;
    background:var(--bg-card);border:1px solid var(--border);
    color:var(--text-dim);font-size:15px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }

  /* Rappel doux de sauvegarde */
  .rappel-sauvegarde{margin-bottom:14px;}

  /* Mes données (F10) */
  .backup-info{
    margin-top:12px;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    font-size:13px;
    color:var(--text-dim);
  }
  .backup-info strong{color:var(--text);}
  input[type=file]{width:0.1px;height:0.1px;opacity:0;overflow:hidden;position:absolute;}

  /* Jauge de progression (F8) */
  .jauge-track{
    height:10px;border-radius:999px;
    background:var(--bg-input);overflow:hidden;
  }
  .jauge-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent-dark),var(--accent-fill));
  }
  .jauge-label{font-size:12px;color:var(--text-dim);margin-top:7px;}
  .jauge-wrap{margin-top:14px;}

  /* Tableau de bord : mini-jauge de l'objectif actif */
  .objectif-mini{
    display:block;width:100%;text-align:left;
    font:inherit;color:var(--text);cursor:pointer;
  }
  .objectif-mini-head{
    display:flex;align-items:center;gap:9px;
    margin-bottom:9px;
  }
  .objectif-mini-nom{flex:1;font-size:13.5px;font-weight:700;min-width:0;}
  .objectif-mini-pct{font-size:13px;font-weight:800;color:var(--accent);}
  .modele-icon-sm{font-size:18px;flex:none;}

  /* Mon objectif : modèles */
  .modele-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .modele-card{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--bg-input);border:2px solid var(--border);
    border-radius:var(--radius-sm);padding:14px;
    cursor:pointer;text-align:left;color:var(--text);width:100%;
  }
  .modele-icon{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:var(--ambre-badge-bg);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .modele-txt{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .modele-txt strong{font-size:14.5px;}
  .modele-txt span{font-size:12.5px;color:var(--text-dim);line-height:1.4;}
  .modele-montant{color:var(--accent) !important;font-weight:700;}

  /* Mon objectif : scénarios */
  .scenario-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .scenario-card{
    background:var(--bg-input);border:2px solid var(--border);
    border-radius:var(--radius-sm);padding:13px 14px;
    cursor:pointer;text-align:left;color:var(--text);width:100%;
  }
  .scenario-card.selected{border-color:var(--accent);}
  .scenario-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:4px;
  }
  .scenario-head strong{font-size:14.5px;}
  .scenario-pct{
    font-size:12px;font-weight:800;color:var(--accent);
    background:var(--ambre-badge-bg);padding:2px 9px;border-radius:999px;
  }
  .scenario-detail{font-size:12.5px;color:var(--text-dim);}

  /* En-tête : accès Réglages (F11) et Partager (F9) */
  .brand-actions{display:flex;gap:8px;flex:none;}

  /* Écran de verrouillage (PIN, F11) */
  .pin-screen{
    min-height:calc(100vh - 40px);
    min-height:calc(var(--h-ecran,100vh) - 40px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:6px;padding:20px 0;
  }
  .pin-titre{font-size:18px;font-weight:800;margin-top:18px;}
  .pin-sous-titre{font-size:13px;color:var(--text-dim);margin-top:4px;margin-bottom:8px;}
  .pin-dots{display:flex;gap:14px;margin:22px 0 26px 0;}
  .pin-dot{
    width:16px;height:16px;border-radius:50%;
    border:2px solid var(--text-dim-2);background:transparent;
  }
  .pin-dot.rempli{background:var(--accent-fill);border-color:var(--accent);}
  .pin-screen.pin-erreur .pin-dot{border-color:var(--danger);}
  .pin-screen.pin-erreur .pin-dot.rempli{background:var(--danger);}
  .pin-erreur-msg{color:var(--danger);font-size:12.5px;font-weight:600;height:16px;margin-bottom:6px;}
  .pin-keypad{
    display:grid;grid-template-columns:repeat(3,64px);gap:14px;
    justify-content:center;
  }
  .pin-key{
    width:64px;height:64px;border-radius:50%;
    background:var(--bg-input);border:1px solid var(--bord-btn);color:var(--text);
    font-size:22px;font-weight:700;cursor:pointer;
  }
  .pin-key.pin-key-vide{background:transparent;border:none;cursor:default;}
  .pin-key.pin-key-effacer{font-size:18px;color:var(--text-dim);}
  .pin-oublie{margin-top:24px;background:none;border:none;color:var(--text-dim);font-size:13px;text-decoration:underline;cursor:pointer;}

  /* Réglages (F11) */
  .settings-section-title{
    font-size:12.5px;font-weight:800;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.05em;
    margin:20px 2px 10px 2px;
  }
  .settings-section-title:first-of-type{margin-top:4px;}
  .settings-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 2px;border-bottom:1px solid var(--border);
  }
  .settings-row:last-child{border-bottom:none;}
  .settings-row-txt{min-width:0;}
  .settings-row-label{font-size:14.5px;font-weight:600;}
  .settings-row-val{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .settings-pill{
    border:none;border-radius:999px;padding:7px 14px;
    font-size:12.5px;font-weight:700;cursor:pointer;flex:none;
  }
  .settings-pill.on{background:var(--success-fill);color:var(--on-success);}
  .settings-pill.off{background:var(--bg-input);color:var(--text-dim);border:1px solid var(--bord-btn);}
  .settings-link-row{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;background:none;border:none;color:var(--text);
    padding:13px 2px;font-size:14.5px;font-weight:600;cursor:pointer;text-align:left;
  }
  .settings-chevron{color:var(--text-dim-2);font-size:15px;}

  /* Partager (F9) */
  .partage-preview-wrap{
    display:flex;justify-content:center;margin:6px 0 16px 0;
  }
  .partage-canvas{
    width:100%;max-width:340px;border-radius:var(--radius);
    border:1px solid var(--border);display:block;
  }

  /* À propos */
  .about-mark{
    width:56px;height:56px;border-radius:16px;margin:6px auto 14px auto;
    background:linear-gradient(145deg,var(--accent-fill),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:26px;color:var(--accent-ink);
  }
  .about-mission{
    font-size:16px;font-weight:700;line-height:1.5;text-align:center;
    margin-bottom:10px;
  }
  .about-tagline{
    text-align:center;color:var(--accent);font-weight:700;font-size:13.5px;
    margin-bottom:18px;
  }

  /* ===== Sprint 5 (V1.1) ===== */
  .btn:disabled{opacity:.4;pointer-events:none;}
  /* Code d'accès */
  .code-screen{min-height:calc(100vh - 60px);min-height:calc(var(--h-ecran,100vh) - 60px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;gap:8px;}
  .code-lock{font-size:54px;margin-bottom:6px;}
  .code-titre{font-size:22px;font-weight:800;}
  .code-sous-titre{font-size:14px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;}
  .code-input{width:100%;background:var(--sel-bg);border:2px solid var(--accent);border-radius:var(--radius-sm);padding:16px;font-size:22px;font-weight:800;letter-spacing:.2em;text-align:center;text-transform:uppercase;color:var(--text);outline:none;}
  .code-erreur{color:var(--danger);font-size:13px;font-weight:600;min-height:18px;}
  .code-mention{margin-top:22px;font-size:11.5px;color:var(--text-dim-2);line-height:1.5;}
  /* Carte d'installation */
  .install-card{display:flex;align-items:center;gap:12px;background:var(--sel-bg);border:1px solid var(--warn-bd);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;}
  .install-ico{font-size:28px;flex:none;}
  .install-txt{flex:1;min-width:0;font-size:13px;color:var(--warn-text);line-height:1.4;}
  .install-txt strong{display:block;color:var(--text);font-size:14px;margin-bottom:2px;}
  .install-actions{display:flex;flex-direction:column;gap:6px;flex:none;}
  .install-steps{margin:6px 0 0 0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--text);}
  .install-steps li{margin-bottom:6px;}
  .install-os{font-size:13px;font-weight:800;color:var(--accent);margin-top:14px;text-transform:uppercase;letter-spacing:.04em;}
  /* Jour de saisie */
  .date-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-10px 0 14px 0;}
  .date-link{position:relative;overflow:hidden;background:none;border:none;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;padding:6px 0;}
  .date-link input[type=date]{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
  .retro-banner{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info-text);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .retro-banner button{background:none;border:1px solid var(--info-btn-bd);color:var(--info-text-2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;flex:none;}
  .retro-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--info-text);background:var(--info-bg);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle;}
  /* Disponible */
  .dispo-line{margin-top:12px;font-size:13.5px;color:var(--text-dim);}
  .dispo-line strong{color:var(--text);font-size:15px;}
  .stat-box.clickable{cursor:pointer;border:1px solid var(--bord-btn);color:var(--text);font:inherit;}
  .stat-box .stat-hint{font-size:10.5px;color:var(--accent);margin-top:4px;font-weight:700;}
  /* Montants rapides */
  .quick-row{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px 0;align-items:center;}
  .quick-label{font-size:11.5px;color:var(--text-dim);width:100%;}
  .quick-chip{background:var(--bg-input);border:1px solid var(--chip-bd);color:var(--accent);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer;}
  /* Liste des clients du jour */
  .client-row{display:flex;align-items:center;gap:12px;background:var(--bg-input);border-radius:var(--radius-sm);padding:11px 13px;cursor:pointer;width:100%;border:none;text-align:left;}
  .client-row .client-num{width:30px;height:30px;border-radius:9px;background:var(--ambre-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:none;}
  .client-row .client-info{flex:1;min-width:0;font-size:13px;color:var(--text-dim);}
  .client-row .client-montant{font-size:15px;font-weight:800;color:var(--success);}
  .auto-tag{font-size:10px;font-weight:800;color:var(--accent);background:var(--ambre-badge-bg);padding:2px 7px;border-radius:999px;margin-left:6px;}
  /* Mon état : listes cliquables */
  .hist-row.futur{opacity:.35;cursor:default;}
  .hist-row.vide .hist-solde{color:var(--text-dim-2);}
  .hist-chevron{color:var(--text-dim-2);margin-left:6px;}
  .etat-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  /* Toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;top:calc(env(safe-area-inset-top) + 70px);background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok-text);padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:80;max-width:90%;text-align:center;box-shadow:var(--ombre-toast);}
  .switch{width:50px;height:30px;border-radius:999px;border:none;background:var(--bg-input);position:relative;cursor:pointer;flex:none;border:1px solid var(--bord-btn);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text-dim-2);transition:left .15s;}
  .switch.on{background:var(--success-fill);border-color:var(--success-fill);}
  .switch.on::after{left:23px;background:#fff;}

  /* ===== V1.2 (Sprint 6) ===== */
  #app{padding-bottom:96px;padding-bottom:calc(env(safe-area-inset-bottom) + 96px);}
  .blocks-stack{display:flex;flex-direction:column;gap:10px;min-height:calc(100vh - 230px);min-height:calc(var(--h-ecran,100vh) - 230px);}
  .dash-block{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);color:var(--text);font:inherit;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;}
  button.dash-block{cursor:pointer;width:100%;}
  .dash-block.recette{flex:1.25;}
  .dash-block.recette.set{border-color:var(--success);}
  button.dash-block.recette{border:2px solid var(--border);background:var(--bg-card);}
  button.dash-block.recette.set{border-color:var(--success);}
  .dash-zone{background:none;border:none;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:4px;}
  .blocks-row .dash-block.dash-zone{border:2px solid var(--border);background:var(--bg-card);}
  .dash-ico{font-size:34px;line-height:1;}
  .dash-montant{font-size:26px;font-weight:800;}
  .dash-montant.muted-montant{color:var(--text-dim);font-size:24px;}
  .dash-label{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);font-weight:600;}
  .blocks-row{display:flex;gap:12px;flex:1;}
  .blocks-row .dash-block{flex:1;min-height:128px;}
  .client-pill{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:linear-gradient(145deg,var(--accent-fill),var(--accent-dark));color:var(--accent-ink);border:none;border-radius:var(--radius-sm);padding:15px;font-size:17px;font-weight:800;cursor:pointer;}
  .client-pill .plus-circle{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-weight:900;}
  .quick-row.in-block{margin:6px 0 0 0;justify-content:center;}
  .mini-jauge{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:4px;}
  .mini-jauge .jauge-track{height:7px;}
  .mini-jauge-txt{font-size:11.5px;color:var(--text-dim);}
  .mini-jauge-txt.accent{color:var(--accent);font-weight:700;}
  .solde-bas{margin-bottom:0;padding:18px 16px 16px 16px;}
  .solde-formule{font-size:11.5px;color:var(--text-dim-2);margin-top:6px;}
  .perte-bandeau{margin-top:10px;display:inline-block;background:var(--perte-bg);color:var(--danger);font-weight:800;font-size:13.5px;padding:7px 14px;border-radius:999px;}
  .loyer-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sel-bg);border:1px solid var(--warn-bd);color:var(--warn-text);border-radius:var(--radius-sm);padding:12px 13px;margin-bottom:14px;font-size:13px;line-height:1.4;}
  .loyer-banner strong{color:var(--text);}
  .rub-sugg{font-size:9.5px;color:var(--accent);line-height:1.2;}
  .rub-rythme{font-size:9.5px;color:var(--text-dim-2);line-height:1.2;}
  .add-charge-title{font-size:12.5px;font-weight:800;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px 0;}
  /* Mon état V1.2 */
  .solde-mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}
  .solde-mini-stats .v{font-size:16px;font-weight:800;}
  .solde-mini-stats .l{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .epargne-row{display:flex;align-items:center;gap:12px;background:var(--bg-input);border-radius:var(--radius-sm);padding:12px 13px;width:100%;border:none;color:var(--text);cursor:pointer;text-align:left;font:inherit;}
  .epargne-row .nom{flex:1;font-size:14px;font-weight:700;}
  .epargne-row .sub{display:block;font-size:11.5px;color:var(--text-dim);font-weight:500;margin-top:2px;}
  .epargne-row .val{font-size:15px;font-weight:800;color:var(--accent);}
  /* Objectif V1.2 (modèle MonDjai/Coiffure) */
  .zahe{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info-text-2);border-radius:var(--radius-sm);padding:13px 14px;font-size:14px;line-height:1.5;margin-bottom:16px;}
  .obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .obj-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--text);font:inherit;}
  .obj-card:last-child:nth-child(odd){grid-column:1 / -1;}
  .obj-card.selected{border-color:var(--accent);background:var(--sel-bg);}
  .obj-card .e{font-size:38px;}
  .obj-card strong{font-size:15px;}
  .obj-card span.d{font-size:12px;color:var(--text-dim);line-height:1.35;}
  .obj-card span.m{font-size:11.5px;color:var(--accent);font-weight:700;}
  .mode-tabs{display:flex;gap:10px;margin:12px 0;}
  .mode-tab{flex:1;background:var(--bg-input);border:2px solid var(--bord-btn);border-radius:var(--radius-sm);padding:13px;font-size:14px;font-weight:700;cursor:pointer;color:var(--text-dim);}
  .mode-tab.active{border-color:var(--accent);color:var(--accent);background:var(--sel-bg);}
  .pct-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .pct-card{background:var(--bg-input);border:2px solid var(--bord-btn);border-radius:var(--radius-sm);padding:12px 4px;cursor:pointer;text-align:center;color:var(--text);font:inherit;}
  .pct-card.selected{border-color:var(--accent);background:var(--sel-bg);}
  .pct-card .p{display:block;font-size:17px;font-weight:800;color:var(--accent);}
  .pct-card .n{display:block;font-size:12px;color:var(--text-dim);}
  .pct-card .x{display:block;font-size:11px;color:var(--text);margin-top:4px;}
  .slot-lock{position:relative;margin-top:14px;border:2px dashed var(--border);border-radius:var(--radius);padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--bg-card);}
  .slot-ghost{display:flex;gap:18px;font-size:28px;opacity:.35;filter:blur(1px) grayscale(.3);}
  .abo-badge{display:inline-block;background:var(--ambre-soft);border:1px solid var(--ambre-bd);color:var(--accent);font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;text-align:center;}
  .obj-actif-head{display:flex;align-items:center;gap:12px;}
  .obj-actif-head .e{font-size:34px;}
  .obj-actif-head .n{font-size:17px;font-weight:800;}
  .obj-actif-head .r{font-size:12.5px;color:var(--text-dim);}
  .obj-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  /* Partager V1.2 (modèle Télécharger de MonDjai/Coiffure) */
  .partage-apercu{position:relative;margin:4px 0 16px 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .partage-apercu canvas{display:block;width:100%;height:auto;}
  #partage-canvas-flou{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;-webkit-filter:blur(16px);filter:blur(16px);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,transparent 34%,black 42%,black 100%);mask-image:linear-gradient(to bottom,transparent 0%,transparent 34%,black 42%,black 100%);}
  .partage-abo{position:absolute;left:50%;top:70%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);width:-webkit-max-content;width:max-content;max-width:80%;}
  .partage-btns{display:flex;gap:10px;}
  .partage-btns .btn{flex:1;}

  /* ===== Sprint 7A : compatibilité tous téléphones ===== */
  /* Champs : 16 px au moins (pas de zoom automatique). Les champs visibles gardent
     leur taille V1.2 (17 à 22 px), plus précise. */
  input,textarea,select{font-size:16px;}
  /* Animations coupées : « mouvement réduit » ou téléphone modeste (classe posée au démarrage). */
  html.sans-anim .sheet{animation:none;}
  html.sans-anim .switch::after{transition:none;}
  @media (prefers-reduced-motion: reduce){
    .sheet{animation:none;}
    .switch::after{transition:none;}
  }
  /* Clavier ouvert : la feuille du bas reste au-dessus du clavier et tient dans la partie visible. */
  html.clavier .overlay{bottom:var(--clavier,0px);}
  html.clavier .sheet{max-height:calc(var(--h-visible,100vh) * .88);}
  /* Installation guidée et diagnostic */
  .install-integre{background:var(--info-bg);border-color:var(--info-bd);}
  .install-integre .install-txt{color:var(--info-text);}
  .install-apres{margin:-2px 0 10px 0;font-size:12.5px;}
  .install-lien,.secours-lien{word-break:break-all;color:var(--text);font-size:12.5px;}
  .code-screen.avec-bandeau{min-height:0;padding-top:18px;}
  .install-autres{border-top:1px solid var(--border);margin-top:12px;}
  .diag-row{padding:10px 2px;}
  .diag-row .settings-row-label{font-size:13.5px;font-weight:600;flex:none;}
  .diag-val{font-size:13px;font-weight:700;text-align:right;color:var(--text);min-width:0;word-break:break-word;}
  .diag-texte{display:block;width:100%;min-height:150px;margin-top:10px;background:var(--bg-input);color:var(--text);border:1px solid var(--bord-champ);border-radius:var(--radius-sm);padding:10px;font-size:12px;font-family:monospace;}
  .secours{padding-top:12px;}
  .secours .btn{margin-top:10px;}

  /* ===== Sprint 7B : mise à jour, Annuler, copie de secours, trace ===== */
  #maj-banner{position:fixed;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;
    bottom:76px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:40;display:flex;align-items:center;gap:10px;
    background:var(--maj-bg);border:1px solid var(--ambre-bd);border-radius:14px;padding:9px 9px 9px 14px;box-shadow:var(--ombre-pop);
    font-size:13.5px;font-weight:700;color:var(--text);}
  #maj-banner .mb-txt{flex:1;}
  #maj-banner .mb-btn{flex:none;border:none;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:800;background:var(--accent-fill);color:var(--accent-ink);cursor:pointer;}
  /* Feuille ouverte : le bandeau passe en haut, au-dessus du voile, sans cacher le bouton Enregistrer. */
  body.feuille-ouverte #maj-banner{bottom:auto;top:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:65;}
  body.maj-visible #app{padding-bottom:156px;padding-bottom:calc(env(safe-area-inset-bottom) + 156px);}
  #annuler-msg{position:fixed;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;
    top:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:70;display:flex;align-items:center;gap:10px;
    background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok-text);border-radius:14px;padding:8px 8px 8px 14px;
    font-size:14px;font-weight:700;box-shadow:var(--ombre-pop);}
  #annuler-msg .am-txt{flex:1;}
  #annuler-msg .am-btn{flex:none;border:1px solid var(--ok-btn-bd);background:transparent;color:var(--text);border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:800;cursor:pointer;}
  #secours-info{position:fixed;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;
    top:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:90;background:var(--bg-card);color:var(--text);border:1px solid var(--success-fill);border-radius:12px;
    padding:12px 14px;font-size:14px;font-weight:700;line-height:1.4;text-align:center;box-shadow:var(--ombre-secours);}
  .modifie-le{font-size:12px;color:var(--text-dim);margin:8px 0 0 2px;}
  .noscript-msg{max-width:480px;margin:60px auto;padding:0 20px;text-align:center;color:var(--text);font-family:-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;}

  /* ===== Sprint 7C : thème clair « bandeau MonDjai », finitions, Affichage =====
     Le thème sombre (:root, plus haut) garde le rendu de la 7B ; tout ce qui suit et qui commence par
     html[data-theme="clair"] ne touche que le thème clair. */

  /* Messages doux : variantes autrefois écrites en ligne (mêmes couleurs que la 7B en sombre). */
  .soft-msg.soft-ok{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok-text);}
  .soft-msg.soft-erreur{border-color:var(--danger-bd);color:var(--danger-text-2);}

  /* Message unique « Nouveau : affichage clair » (hors de #app, comme Annuler). */
  #theme-info{position:fixed;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;
    top:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:68;display:flex;align-items:center;gap:10px;
    background:var(--bg-card);border:1px solid var(--ambre-bd);color:var(--text);border-radius:14px;padding:8px 8px 8px 10px;
    font-size:14px;font-weight:700;box-shadow:var(--ombre-pop);}
  #theme-info .ti-txt{flex:1;min-width:0;background:none;border:none;color:inherit;font:inherit;text-align:left;padding:6px 4px;cursor:pointer;}
  #theme-info .ti-btn{flex:none;border:none;border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:800;background:var(--accent-fill);color:var(--accent-ink);cursor:pointer;}

  /* Réglages › Affichage */
  .theme-choix{margin-bottom:0;}
  .theme-aide{margin-top:10px;}

  /* ---------- Thème clair : palette du § 9.1 (identique à Salaire et Coiffure) ---------- */
  html[data-theme="clair"]{
    color-scheme:light;
    background-color:#eff1f4;
    --bg:#eff1f4;
    --bg-card:#ffffff;
    --bg-card-2:#f3f5f880;
    --bg-input:#f3f5f8;
    --text:#151a22;            /* 17,5:1 sur blanc */
    --text-dim:#5a6372;        /* 6,1:1 */
    --text-dim-2:#646c7d;      /* 4,7:1 sur le fond */
    --accent:#9a5a00;          /* ambre « texte » : 5,5:1 */
    --accent-fill:#f5a623;     /* ambre « remplissage », toujours avec --accent-ink dessus */
    --accent-dark:#c9840f;
    --accent-ink:#1b1200;
    --success:#137b52;         /* 5,3:1 */
    --success-fill:#137b52;
    --on-success:#ffffff;
    --danger:#c4382c;          /* 5,3:1 */
    --bleu:#2b5bc0;            /* 6,3:1 */
    --border:#e3e6eb;          /* filets et contours des cartes */
    --bord-btn:#7d8593;        /* contour des boutons et des choix : ≥ 3:1 sur blanc et sur le fond */
    --bord-champ:#7d8593;      /* contour des champs : ≥ 3:1 */
    --perso-text:#1b1200;
    --choice-sel-bg:#fff8ec;
    --sel-bg:#fff5e3;
    --sel-ring:#151a22;
    --warn-bg:#fff5e3;
    --warn-bd:rgba(154,90,0,.32);
    --warn-text:#7a4700;
    --chip-bd:#9a5a00;
    --ambre-soft:#fff1d9;
    --ambre-bd:rgba(154,90,0,.45);
    --ambre-badge-bg:#fff1d9;
    --badge-text:#8a5200;
    --info-bg:#eaf0fb;
    --info-bd:rgba(43,91,192,.35);
    --info-btn-bd:#2b5bc0;
    --info-text:#2b5bc0;
    --info-text-2:#1d3f86;
    --ok-bg:#e7f5ee;
    --ok-bd:rgba(19,123,82,.35);
    --ok-btn-bd:#137b52;
    --ok-text:#0f6544;
    --perte-bg:#fdecea;
    --danger-bd:#c4382c;
    --danger-text-2:#a8301f;
    --overlay:rgba(16,20,28,.45);
    --maj-bg:#ffffff;
    --ombre-pop:0 8px 24px rgba(16,24,40,.18);
    --ombre-toast:0 8px 22px rgba(16,24,40,.16);
    --ombre-secours:0 8px 24px rgba(16,24,40,.18);
    /* Finitions de la famille (Coiffure 8C) */
    --bandeau:#141922;
    --card-grad:linear-gradient(180deg,#ffffff 0%,#fbfbfc 100%);
    --ombre-carte:0 1px 2px rgba(16,24,40,.05),0 10px 22px -14px rgba(16,24,40,.28);
    --anneau-plein:inset 0 0 0 1px #b8770a;   /* bord des boutons ambre : 3,7:1 sur blanc */
  }
  /* Le fond est porté par <html> (couleur posée dès la première ligne) ; le corps reste transparent
     pour laisser voir le bandeau, dessiné derrière l'écran. */
  html[data-theme="clair"] body{background:transparent;}
  html[data-theme="clair"] ::placeholder{color:#646c7d;opacity:1;}

  /* ---------- Bandeau MonDjai ---------- */
  html[data-theme="clair"].avec-bandeau body::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;
    height:0;height:var(--bandeau-h,0px);background:var(--bandeau);border-radius:0 0 26px 26px;pointer-events:none;}
  /* Ce qui est posé sur le bandeau passe en clair sur sombre. */
  html[data-theme="clair"].avec-bandeau #app > .brand,
  html[data-theme="clair"].avec-bandeau #app > .date-row{
    --text:#ffffff;--text-dim:#b4bcc9;--accent:#f5a623;
    --bg-card:rgba(255,255,255,.1);--bord-btn:rgba(255,255,255,.5);
    color:var(--text);}
  html[data-theme="clair"] .brand-action{border-color:var(--bord-btn);}

  /* ---------- Cartes : léger dégradé et ombre douce ---------- */
  html[data-theme="clair"] .card,
  html[data-theme="clair"] .dash-block,
  html[data-theme="clair"] button.dash-block.recette,
  html[data-theme="clair"] .blocks-row .dash-block.dash-zone,
  html[data-theme="clair"] .obj-card,
  html[data-theme="clair"] .slot-lock,
  html[data-theme="clair"] .hist-row,
  html[data-theme="clair"] .epargne-row,
  html[data-theme="clair"] .rubrique-stat-row{background:var(--card-grad);box-shadow:var(--ombre-carte);}
  html[data-theme="clair"] .obj-card.selected{background:var(--sel-bg);}
  html[data-theme="clair"] .install-card,
  html[data-theme="clair"] .loyer-banner,
  html[data-theme="clair"] .retro-banner,
  html[data-theme="clair"] .soft-msg,
  html[data-theme="clair"] .zahe{box-shadow:0 1px 2px rgba(16,24,40,.05);}
  html[data-theme="clair"] .slot-lock,
  html[data-theme="clair"] .add-rubrique-btn{border-color:var(--bord-btn);}
  html[data-theme="clair"] .etat-tab.active{background:var(--sel-bg);}
  html[data-theme="clair"] .jauge-track{background:#e6e9ee;box-shadow:inset 0 0 0 1px #dde1e7;}

  /* ---------- Boutons ambre : bord net, lisible en plein soleil ---------- */
  html[data-theme="clair"] .btn-primary,
  html[data-theme="clair"] .client-btn,
  html[data-theme="clair"] .client-pill,
  html[data-theme="clair"] #maj-banner .mb-btn,
  html[data-theme="clair"] #theme-info .ti-btn{box-shadow:var(--anneau-plein);}

  /* ---------- Pastilles d'icônes teintées ---------- */
  html[data-theme="clair"] .dash-ico{display:flex;align-items:center;justify-content:center;width:54px;height:54px;margin:-6px 0;border-radius:50%;font-size:27px;
    background:radial-gradient(circle at 30% 25%,rgba(245,166,35,.42),rgba(245,166,35,.14));box-shadow:inset 0 0 0 1px rgba(201,132,15,.30);}
  html[data-theme="clair"] .blocks-row .dash-block:first-child .dash-ico{
    background:radial-gradient(circle at 30% 25%,rgba(255,107,94,.34),rgba(255,107,94,.12));box-shadow:inset 0 0 0 1px rgba(196,56,44,.22);}
  html[data-theme="clair"] .blocks-row .dash-block:last-child .dash-ico{
    background:radial-gradient(circle at 30% 25%,rgba(52,179,126,.36),rgba(52,179,126,.12));box-shadow:inset 0 0 0 1px rgba(19,122,82,.24);}
  html[data-theme="clair"] .charge-icon,
  html[data-theme="clair"] .rubrique-icon,
  html[data-theme="clair"] .modal-rubrique-icon{box-shadow:inset 0 0 0 1px rgba(16,24,40,.08);}

  /* ---------- Chiffres : chasse fixe, alignés à droite ---------- */
  html[data-theme="clair"] .dash-montant,
  html[data-theme="clair"] .solde-value,
  html[data-theme="clair"] .charge-montant,
  html[data-theme="clair"] .rubrique-stat-montant,
  html[data-theme="clair"] .hist-solde,
  html[data-theme="clair"] .epargne-row .val,
  html[data-theme="clair"] .etat-stat .num,
  html[data-theme="clair"] .solde-mini-stats .v,
  html[data-theme="clair"] .jauge-label,
  html[data-theme="clair"] .mini-jauge-txt,
  html[data-theme="clair"] .rub-sugg,
  html[data-theme="clair"] .perte-bandeau{font-variant-numeric:tabular-nums;}
  html[data-theme="clair"] .charge-montant,
  html[data-theme="clair"] .rubrique-stat-montant,
  html[data-theme="clair"] .hist-solde,
  html[data-theme="clair"] .epargne-row .val{text-align:right;}

  /* ---------- Menu du bas : onglet actif en pastille ambre, libellés jamais coupés ---------- */
  html[data-theme="clair"] .navbar{box-shadow:0 -8px 20px -16px rgba(16,24,40,.35);}
  html[data-theme="clair"] .navbtn.active .navicon{z-index:0;}
  html[data-theme="clair"] .navbtn.active .navicon::before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:52px;height:28px;
    margin:-14px 0 0 -26px;border-radius:999px;background:var(--accent-fill);}
  html[data-theme="clair"] .navlabel{white-space:normal;text-align:center;line-height:1.15;font-size:10px;}

  /* ---------- Feuilles du bas : poignée ---------- */
  html[data-theme="clair"] .sheet{position:relative;box-shadow:0 -14px 34px rgba(16,24,40,.18);}
  html[data-theme="clair"] .sheet::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:999px;background:#c3c8d0;}

  /* ---------- Léger enfoncement au toucher ---------- */
  html[data-theme="clair"] .btn,
  html[data-theme="clair"] .btn-sm,
  html[data-theme="clair"] .dash-block,
  html[data-theme="clair"] .navbtn,
  html[data-theme="clair"] .choice,
  html[data-theme="clair"] .etat-tab,
  html[data-theme="clair"] .mode-tab,
  html[data-theme="clair"] .pct-card,
  html[data-theme="clair"] .obj-card,
  html[data-theme="clair"] .hist-row,
  html[data-theme="clair"] .epargne-row,
  html[data-theme="clair"] .rubrique-item,
  html[data-theme="clair"] .modal-rubrique-item,
  html[data-theme="clair"] .settings-link-row{-webkit-transition:-webkit-transform .08s ease-out;transition:transform .08s ease-out;}
  html[data-theme="clair"] .btn:active,
  html[data-theme="clair"] .btn-sm:active,
  html[data-theme="clair"] .dash-block:active,
  html[data-theme="clair"] .navbtn:active,
  html[data-theme="clair"] .choice:active,
  html[data-theme="clair"] .etat-tab:active,
  html[data-theme="clair"] .mode-tab:active,
  html[data-theme="clair"] .pct-card:active,
  html[data-theme="clair"] .obj-card:active,
  html[data-theme="clair"] .hist-row:active,
  html[data-theme="clair"] .epargne-row:active,
  html[data-theme="clair"] .rubrique-item:active,
  html[data-theme="clair"] .modal-rubrique-item:active,
  html[data-theme="clair"] .settings-link-row:active{-webkit-transform:scale(.98);transform:scale(.98);}

  /* ---------- Transition courte lors d'un vrai changement d'écran ---------- */
  @-webkit-keyframes ecran-entree{from{opacity:.55;-webkit-transform:translateY(6px);}to{opacity:1;-webkit-transform:none;}}
  @keyframes ecran-entree{from{opacity:.55;-webkit-transform:translateY(6px);transform:translateY(6px);}to{opacity:1;-webkit-transform:none;transform:none;}}
  html[data-theme="clair"] #app.ecran-change > *:not(.brand):not(.navbar):not(.overlay):not(.toast){-webkit-animation:ecran-entree .16s ease-out;animation:ecran-entree .16s ease-out;}

  /* Aucune animation si « mouvement réduit » ou téléphone modeste */
  html.sans-anim #app.ecran-change > *{-webkit-animation:none !important;animation:none !important;}
  html.sans-anim *{-webkit-transition:none !important;transition:none !important;}
  html.sans-anim .btn:active,html.sans-anim .btn-sm:active,html.sans-anim .dash-block:active,html.sans-anim .navbtn:active,
  html.sans-anim .choice:active,html.sans-anim .etat-tab:active,html.sans-anim .mode-tab:active,html.sans-anim .pct-card:active,
  html.sans-anim .obj-card:active,html.sans-anim .hist-row:active,html.sans-anim .epargne-row:active,html.sans-anim .rubrique-item:active,
  html.sans-anim .modal-rubrique-item:active,html.sans-anim .settings-link-row:active{-webkit-transform:none;transform:none;}
  @media (prefers-reduced-motion: reduce){
    #app.ecran-change > *{-webkit-animation:none !important;animation:none !important;}
    html[data-theme="clair"] .btn:active,html[data-theme="clair"] .btn-sm:active,html[data-theme="clair"] .dash-block:active,
    html[data-theme="clair"] .navbtn:active,html[data-theme="clair"] .choice:active,html[data-theme="clair"] .etat-tab:active,
    html[data-theme="clair"] .mode-tab:active,html[data-theme="clair"] .pct-card:active,html[data-theme="clair"] .obj-card:active,
    html[data-theme="clair"] .hist-row:active,html[data-theme="clair"] .epargne-row:active,html[data-theme="clair"] .rubrique-item:active,
    html[data-theme="clair"] .modal-rubrique-item:active,html[data-theme="clair"] .settings-link-row:active{-webkit-transform:none;transform:none;}
  }
  /* ===== Sprint 7D : en-tête (Épargne, Télécharger), Mes charges, Mes habitudes ===== */
  .brand-actions{gap:6px;}
  .brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hd-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:54px;height:44px;padding:3px 8px;
    border-radius:12px;border:1px solid var(--bord-btn);background:var(--bg-card);color:var(--text);font:inherit;cursor:pointer;flex:none;}
  .hd-ic{font-size:16px;line-height:1.1;}
  .hd-lab{font-size:10.5px;font-weight:800;line-height:1.15;white-space:nowrap;}
  .hd-epargne .hd-lab{color:var(--accent);}
  /* Très petits écrans (320 px) : la marque « H » s'efface, le nom et les deux boutons tiennent. */
  @media (max-width:350px){ .brand .brand-mark{display:none;} }
  button.mc-row{width:100%;border:none;color:var(--text);font:inherit;text-align:left;cursor:pointer;}
  .mc-sub{display:block;font-size:11.5px;color:var(--text-dim);margin-top:2px;font-weight:500;}
  .mc-vide .rubrique-stat-nom,.mc-vide .rubrique-stat-montant{color:var(--text-dim);}
  .mc-vide .rubrique-stat-montant{font-weight:600;}
  .mc-total-val{color:var(--text);}
  .lien-mes-charges{margin-top:6px;}
  .hab-carte{padding:10px 14px;}
  .hab-ligne{display:flex;align-items:center;gap:10px;padding:5px 0;}
  .hab-lib{flex:none;width:42px;font-size:13px;font-weight:700;color:var(--text-dim);}
  .hab-barre{display:block;flex:1;min-width:0;height:10px;border-radius:999px;background:var(--bg-input);overflow:hidden;}
  .hab-barre span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-dark),var(--accent-fill));}
  .hab-val{flex:none;min-width:72px;text-align:right;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;}
  .hab-rub{padding:6px 0 8px 0;}
