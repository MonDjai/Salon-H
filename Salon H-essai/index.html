  // ---------- Installation sur l'écran d'accueil (V1.1, guidée selon le navigateur au Sprint 7A) ----------
  // Le petit script de démarrage reconnaît le navigateur (BOOT.contexte()) :
  //  - Chrome, Samsung Internet, Edge ordinateur : bouton natif quand le navigateur le propose,
  //    sinon le geste du menu ;
  //  - navigateur du fabricant (Tecno, Infinix, itel, Xiaomi…) ou autre : « ouvrez ce lien avec Chrome » ;
  //  - Huawei : gestes du Navigateur Huawei et autorisation « Créer des raccourcis » (repris de Coiffure) ;
  //  - iPhone : Safari › Partager › « Sur l'écran d'accueil », avertissement sur les données ;
  //  - lien ouvert dans WhatsApp, Facebook… : bandeau « Ouvrez dans Chrome » avec le geste.
  var invitationInstallation = null;
  var installeeIci = false;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    invitationInstallation = e;
    if(state.config.codeAccesOk && !ui.verrouille) render();
  });
  window.addEventListener("appinstalled", function(){
    invitationInstallation = null;
    installeeIci = true;
    afficherToast("Salon H est installée sur votre écran d’accueil.");
  });

  function lancerInstallation(){
    if(invitationInstallation){
      var ev = invitationInstallation;
      invitationInstallation = null;
      try{
        ev.prompt();
        if(ev.userChoice){ ev.userChoice.then(function(){ render(); }, function(){ render(); }); }
      }catch(e){ ui.modal = "installer-aide"; render(); }
      return;
    }
    ui.modal = "installer-aide";
    render();
  }

  // standard | fabricant | ios-autre | integre (navigateur intégré) | integre-lien (lien venu d'une appli)
  function typeInstallation(){
    var c = BOOT.contexte();
    if(c.cle === "integre") return "integre";
    if(invitationInstallation) return "standard";
    if(c.integre && c.plateforme === "android") return "integre-lien";
    if(c.cle === "fabricant" || c.cle === "operamini") return "fabricant";
    if(c.cle === "ios-autre") return "ios-autre";
    return "standard";
  }

  function nomAppliIntegree(c){
    return c.integre && c.integre !== "une application" ? c.integre : "cette application";
  }

  function boutonsLien(c, avecNonMerci){
    var html = "";
    if(c.plateforme === "android" && window.location.protocol === "https:"){
      html += '<button type="button" class="btn-sm btn-sm-payer" data-action="ouvrir-chrome">Ouvrir Chrome</button>';
      html += '<button type="button" class="btn-sm btn-sm-annuler" data-action="copier-lien">Copier le lien</button>';
    }else{
      html += '<button type="button" class="btn-sm btn-sm-payer" data-action="copier-lien">Copier le lien</button>';
    }
    if(avecNonMerci) html += '<button type="button" class="btn-sm btn-sm-annuler" data-action="installer-plus-tard">Non merci</button>';
    return html;
  }

  // Bandeau « Ouvrez dans Chrome » (lien ouvert dans WhatsApp, Facebook…).
  function renderBandeauIntegre(avecNonMerci){
    var c = BOOT.contexte();
    var ios = c.plateforme === "ios";
    var titre, texte;
    if(c.integreSur){
      titre = ios ? "Ouvrez dans Safari" : "Ouvrez dans Chrome";
      texte = (ios ? "Touchez ⋯ puis « Ouvrir dans Safari »." : "Touchez ⋮ puis « Ouvrir dans Chrome ».") +
              " Ici, vos données restent dans " + nomAppliIntegree(c) + ".";
    }else{
      titre = "Ouvrez dans Chrome pour installer";
      texte = "Lien venu de " + nomAppliIntegree(c) + " : touchez ⋮ puis « Ouvrir dans Chrome ».";
    }
    return '<div class="install-card install-integre" data-test="bandeau-integre">' +
             '<span class="install-ico">💬</span>' +
             '<span class="install-txt"><strong>' + titre + '</strong>' + escapeHtml(texte) + '</span>' +
             '<span class="install-actions">' + boutonsLien(c, avecNonMerci) + '</span>' +
           '</div>';
  }

  // Carte compacte sur Aujourd'hui (« Non merci » la masque ; À propos garde le bouton).
  function renderCarteInstallation(){
    if(estInstallee() || installeeIci || state.meta.installCarteMasquee) return "";
    var t = typeInstallation();
    var c = BOOT.contexte();
    if(t === "integre" || t === "integre-lien") return renderBandeauIntegre(true);
    if(t === "fabricant"){
      return '<div class="install-card" data-test="carte-installation" data-type="fabricant">' +
               '<span class="install-ico">🌐</span>' +
               '<span class="install-txt"><strong>Ouvrez avec Chrome</strong>Pour une vraie application, ouvrez ce lien avec Chrome.</span>' +
               '<span class="install-actions">' + boutonsLien(c, true) + '</span>' +
             '</div>';
    }
    if(t === "ios-autre"){
      return '<div class="install-card" data-test="carte-installation" data-type="ios-autre">' +
               '<span class="install-ico">🧭</span>' +
               '<span class="install-txt"><strong>Ouvrez avec Safari</strong>Sur iPhone, Salon H s’installe depuis Safari.</span>' +
               '<span class="install-actions">' + boutonsLien(c, true) + '</span>' +
             '</div>';
    }
    return '<div class="install-card" data-test="carte-installation" data-type="standard">' +
             '<span class="install-ico">📲</span>' +
             '<span class="install-txt"><strong>Installez Salon H</strong>Une icône sur l’écran d’accueil, plein écran, même sans connexion.</span>' +
             '<span class="install-actions">' +
               '<button type="button" class="btn-sm btn-sm-payer" data-action="installer-app">Installer</button>' +
               '<button type="button" class="btn-sm btn-sm-annuler" data-action="installer-plus-tard">Non merci</button>' +
             '</span>' +
           '</div>';
  }

  // Gestes par téléphone et navigateur (feuille « Installer Salon H »).
  var ETAPES_INSTALLATION = {
    chrome: { titre: "Android (Chrome)", etapes: [
      "Touchez le menu <strong>⋮</strong> en haut à droite.",
      "Choisissez <strong>« Installer l’application »</strong> (ou « Ajouter à l’écran d’accueil »), puis <strong>Installer</strong>.",
      "Ouvrez Salon H depuis sa nouvelle icône."
    ], apres: "Pas de « Installer » dans le menu ? Si le lien vient de WhatsApp, touchez d’abord ⋮ › « Ouvrir dans Chrome »." },
    samsung: { titre: "Samsung Internet", etapes: [
      "Touchez le menu <strong>≡</strong> en bas à droite.",
      "Choisissez <strong>« Ajouter la page à »</strong> › <strong>« Écran d’accueil »</strong>.",
      "Touchez <strong>Ajouter</strong>, puis ouvrez Salon H depuis son icône."
    ], apres: "" },
    fabricant: { titre: "Navigateur du téléphone (Tecno, Infinix, itel, Xiaomi…)", etapes: [
      "Pour une vraie application, ouvrez ce lien avec <strong>Chrome</strong> : touchez <strong>« Copier le lien »</strong>.",
      "Ouvrez <strong>Chrome</strong> et collez le lien dans la barre d’adresse.",
      "Dans Chrome : menu <strong>⋮</strong> › <strong>« Installer l’application »</strong>."
    ], apres: "Les journées notées ici restent dans ce navigateur : pour les retrouver dans Chrome, Sauvegarder ici puis Restaurer dans Chrome." },
    huawei: { titre: "Téléphone Huawei (Navigateur Huawei, HarmonyOS)", etapes: [
      "Ouvrez cette adresse dans le <strong>Navigateur Huawei</strong> (le navigateur d’origine du téléphone).",
      "Touchez le <strong>menu</strong> (☰ ou ⋮), puis <strong>« Ajouter à l’écran d’accueil »</strong> — selon la version : « Ajouter au bureau » ou « Ajouter un raccourci ».",
      "Gardez le nom « Salon H », touchez <strong>« Ajouter »</strong>, puis ouvrez l’application depuis sa nouvelle icône."
    ], apres: "L’icône n’apparaît pas ? Autorisez le navigateur à créer des raccourcis : Paramètres › Applications › Navigateur › Autorisations › « Créer des raccourcis sur l’écran d’accueil », puis recommencez. Si Chrome est installé sur le téléphone, vous pouvez aussi passer par Chrome (menu ⋮ › « Installer l’application »)." },
    ios: { titre: "iPhone (Safari)", etapes: [
      "Ouvrez cette adresse dans <strong>Safari</strong>.",
      "Touchez le bouton <strong>Partager</strong> (le carré avec une flèche vers le haut).",
      "Choisissez <strong>« Sur l’écran d’accueil »</strong>, puis <strong>« Ajouter »</strong>, et ouvrez l’application depuis son icône."
    ], apres: "Sur iPhone, l’application installée garde ses propres données, séparées de Safari : si vous avez déjà noté des journées dans Safari, faites d’abord « Sauvegarder mes données » dans Safari, puis « Restaurer une sauvegarde » dans l’application installée." },
    integre: { titre: "Lien ouvert dans WhatsApp ou Facebook", etapes: [
      "Touchez <strong>⋮</strong> en haut à droite.",
      "Choisissez <strong>« Ouvrir dans Chrome »</strong> (ou « Ouvrir dans le navigateur »).",
      "Dans Chrome : menu <strong>⋮</strong> › <strong>« Installer l’application »</strong>."
    ], apres: "Ce que vous notez dans WhatsApp ou Facebook reste dans leur navigateur : passez par Chrome avant de commencer." },
    "integre-ios": { titre: "Lien ouvert dans WhatsApp ou Facebook (iPhone)", etapes: [
      "Touchez <strong>⋯</strong> ou l’icône de boussole.",
      "Choisissez <strong>« Ouvrir dans Safari »</strong>.",
      "Dans Safari : <strong>Partager</strong> › <strong>« Sur l’écran d’accueil »</strong>."
    ], apres: "Ce que vous notez dans WhatsApp ou Facebook reste dans leur navigateur : passez par Safari avant de commencer." },
    ordinateur: { titre: "Ordinateur", etapes: [
      "Dans Chrome ou Edge, cliquez sur l’icône d’installation à droite de la barre d’adresse (ou menu › « Installer MonDjai/Salon H »).",
      "L’application s’ouvre ensuite dans sa propre fenêtre."
    ], apres: "" }
  };
  var AUTRES_TELEPHONES = ["chrome", "fabricant", "integre", "samsung", "huawei", "ios"];

  function cleEtapesInstallation(){
    var c = BOOT.contexte();
    var t = typeInstallation();
    if(t === "integre") return c.plateforme === "ios" ? "integre-ios" : "integre";
    if(t === "fabricant") return "fabricant";
    if(t === "ios-autre") return "ios";
    if(t === "integre-lien") return "chrome";
    if(c.cle === "samsung") return "samsung";
    if(c.cle === "huawei") return "huawei";
    if(c.cle === "safari" || c.plateforme === "ios") return "ios";
    if(c.cle === "chrome") return "chrome";
    return "ordinateur";
  }

  function renderEtapesInstallation(cle){
    var e = ETAPES_INSTALLATION[cle];
    var html = '<div class="install-os">' + e.titre + '</div>';
    html += '<ol class="install-steps" data-test="etapes-' + cle + '">';
    e.etapes.forEach(function(x){ html += '<li>' + x + '</li>'; });
    html += '</ol>';
    if(e.apres) html += '<div class="muted install-apres">' + escapeHtml(e.apres) + '</div>';
    return html;
  }

  function lienApplication(){ return BOOT.lienApplication(); }

  // SalonH-8A : l'écran « Code d'accès » (V1.1) est retiré : l'inscription du
  // compte MonDjai le remplace (bloc MONDJAI-COMPTE).

  // ---------- Sprint 7D : menu de la famille et écrans secondaires ----------
  // Menu du bas (décision du 31/10/2026) : Aujourd'hui · Mon état · Mes habitudes · Réglages.
  // Écrans secondaires (‹ Retour) : Objectif, Télécharger (ex-Partager), Mes charges, À propos,
  // détail d'un jour. Ils gardent le menu, avec l'onglet d'où l'on vient mis en évidence.
  var ONGLETS = [
    { id:"jour",      icone:"🏠", label:"Aujourd’hui" },
    { id:"etat",      icone:"📊", label:"Mon état" },
    { id:"habitudes", icone:"📈", label:"Mes habitudes" },
    { id:"reglages",  icone:"⚙️", label:"Réglages" }
  ];
  function estOnglet(page){
    for(var i = 0; i < ONGLETS.length; i++){ if(ONGLETS[i].id === page) return true; }
    return false;
  }
  // Pile des écrans traversés : le premier est toujours un onglet ; chaque retour en dépile un.
  function ongletActif(){
    var p = ui.page || "jour";
    if(estOnglet(p)) return p;
    return (ui.pile && ui.pile.length) ? ui.pile[0] : "jour";
  }
  function ouvrirSecondaire(page){
    var actuelle = ui.page || "jour";
    if(actuelle === page) return;
    if(!ui.pile) ui.pile = [];
    if(estOnglet(actuelle)) ui.pile = [actuelle];
    else ui.pile.push(actuelle);
    ui.page = page;
    ui.pagePrecedente = ui.pile[0];
    ui.modal = null;
  }
  function retourSecondaire(){
    ui.page = (ui.pile && ui.pile.length) ? ui.pile.pop() : "jour";
    if(ui.page === "jour-detail" && !ui.historiqueSelection) ui.page = "etat";
    ui.modal = null;
  }
  function allerOnglet(page){
    ui.pile = [];
    ui.page = page;
    ui.pagePrecedente = page;
    ui.modal = null;
    if(page !== "jour-detail") ui.historiqueSelection = null;
  }
  function lienRetour(){
    return '<button type="button" class="back-link" data-action="retour-secondaire" data-test="retour-secondaire">‹ Retour</button>';
  }

  function renderNavBar(active){
    var html = '<nav class="navbar">';
    ONGLETS.forEach(function(it){
      html += '<button type="button" class="navbtn' + (active === it.id ? " active" : "") + '" data-action="aller-page" data-page="' + it.id + '"' + (active === it.id ? ' aria-current="page"' : "") + '>' +
                '<span class="navicon">' + it.icone + '</span>' +
                '<span class="navlabel">' + it.label + '</span>' +
              '</button>';
    });
    html += '</nav>';
    return html;
  }

  // En-tête : marque, date ou titre de l'écran ; à droite, raccourci Épargne (icône de l'objectif +
  // épargne du jour, « Aucun » sans objectif) et « Télécharger ». Pas d'actions pendant le premier lancement.
  function brandHeader(sub, aujourdhui){
    var actions = "";
    // SalonH-8A : à la place du sous-titre, le bandeau « Lecture seule » (tous les
    // écrans) ou une ligne du compte (Aujourd'hui) : aucune hauteur ajoutée.
    var ligne = ligneCompteEnTete(!!aujourdhui);
    if(state.config.onboardingComplete){
      var obj = state.objectif;
      var icone = obj ? (obj.icone || "💰") : "🔐";
      var val = obj ? formatFCFA(epargneDuJour(todayKey())) : "Aucun";
      actions = '<div class="brand-actions">' +
          '<button type="button" class="hd-btn hd-epargne" data-action="ouvrir-objectif" data-test="raccourci-epargne" aria-label="Épargne du jour : ' + val + '">' +
            '<span class="hd-ic">' + icone + '</span><span class="hd-lab">' + val + '</span></button>' +
          '<button type="button" class="hd-btn hd-telecharger" data-action="ouvrir-partager" data-test="bouton-telecharger" aria-label="Télécharger">' +
            '<span class="hd-ic">⬇️</span><span class="hd-lab">Télécharger</span></button>' +
        "</div>";
    }
    return (
      '<div class="brand' + (ligne ? " avec-ligne" : "") + '">' +
        '<div class="brand-mark">H</div>' +
        '<div class="brand-info">' +
          '<div class="brand-name">MonDjai/Salon H</div>' +
          (ligne ? '<div class="brand-sub brand-ligne" data-test="ligne-compte">' + ligne + '</div>' : (sub ? '<div class="brand-sub">' + sub + '</div>' : "")) +
        "</div>" +
        actions +
      "</div>"
    );
  }

  // --- Verrouillage par code PIN (F11) ---

  function renderVerrouillage(){
    var html = '<div class="pin-screen' + (ui.pinErreur ? " pin-erreur" : "") + '">';
    html += '<div class="brand-mark" style="width:48px;height:48px;font-size:22px;">H</div>';
    html += '<div class="pin-titre">MonDjai/Salon H</div>';
    html += '<div class="pin-sous-titre">Entrez votre code à 4 chiffres</div>';

    html += '<div class="pin-dots">';
    for(var i=0;i<4;i++){
      html += '<span class="pin-dot' + (i < ui.pinSaisie.length ? " rempli" : "") + '"></span>';
    }
    html += "</div>";

    html += '<div class="pin-erreur-msg">' + (ui.pinErreur ? "Code incorrect, réessayez." : "") + '</div>';

    html += renderPinClavier("pin-toucher-chiffre", "pin-effacer-chiffre");

    if(MonDjaiCompte.empreinteActive()) html += '<button type="button" class="btn btn-secondary pin-empreinte" data-action="compte-empreinte" data-test="ouvrir-empreinte">Utiliser mon empreinte</button>';
    html += '<button type="button" class="pin-oublie" data-action="ouvrir-pin-oublie">Code oublié ?</button>';
    html += "</div>";

    if(ui.pinOublieConfirmation){
      html += '<div class="overlay" data-action="fermer-pin-oublie-backdrop"><div class="sheet" data-stop="1">';
      html += '<div class="sheet-head"><div class="sheet-title">Code oublié</div><button type="button" class="sheet-close" data-action="fermer-pin-oublie">✕</button></div>';
      html += '<div class="muted">Retirer le code enlève la protection à l’ouverture. Vos données restent intactes sur ce téléphone.</div>';
      if(MonDjaiCompte.pinDefini()) html += '<div class="muted" style="margin-top:8px;" data-test="pin-oublie-en-ligne">La sauvegarde en ligne fermée par ce code ne pourra plus être ouverte.</div>';
      if(ui.pinOublieMessage) html += '<div class="soft-msg soft-erreur" role="status" data-test="pin-partage">' + escapeHtml(ui.pinOublieMessage) + '</div>';
      html += '<div class="btn-row" style="margin-top:14px;">';
      html += '<button type="button" class="btn btn-ghost" data-action="fermer-pin-oublie">Annuler</button>';
      html += '<button type="button" class="btn btn-danger-outline" data-action="retirer-pin-oublie">Retirer le code</button>';
      html += "</div></div></div>";
    }

    return html;
  }

  // Clavier numérique réutilisé pour le verrouillage et pour la création/modification du PIN en Réglages.
  function renderPinClavier(actionChiffre, actionEffacer){
    var touches = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
    var html = '<div class="pin-keypad">';
    touches.forEach(function(t){
      if(t === ""){
        html += '<span class="pin-key pin-key-vide"></span>';
      }else if(t === "⌫"){
        html += '<button type="button" class="pin-key pin-key-effacer" data-action="' + actionEffacer + '">⌫</button>';
      }else{
        html += '<button type="button" class="pin-key" data-action="' + actionChiffre + '" data-chiffre="' + t + '">' + t + '</button>';
      }
    });
    html += "</div>";
    return html;
  }

  // --- Onboarding : statut ---

  // V1.2 : réglage du loyer de place — fréquence, jour de paiement, montant.
  function renderLoyerForm(idMontant, valeurMontant){
    var f = ui.loyerFreqSaisie;
    var html = '<div class="field"><label>Le loyer se paie…</label><div class="mode-tabs" style="margin:0;">';
    [["jour","Chaque jour"],["semaine","Chaque semaine"],["mois","Chaque mois"]].forEach(function(o){
      html += '<button type="button" class="mode-tab' + (f === o[0] ? " active" : "") + '" data-action="loyer-freq" data-freq="' + o[0] + '" style="padding:11px 4px;font-size:13px;">' + o[1] + '</button>';
    });
    html += '</div></div>';
    if(f === "semaine"){
      html += '<div class="field"><label>Jour de paiement</label><div class="quick-row" style="margin:0;">';
      JOURS_SEMAINE.forEach(function(j, i){
        var v = String(i + 1);
        html += '<button type="button" class="quick-chip' + (ui.loyerJourSaisie === v ? " chip-on" : "") + '" data-action="loyer-jour" data-jour="' + v + '" style="padding:8px 11px;font-size:12.5px;">' + j.charAt(0).toUpperCase() + j.slice(1, 3) + '.</button>';
      });
      html += '</div></div>';
    }else if(f === "mois"){
      html += '<div class="field"><label>Date de paiement (jour du mois, 1 à 31)</label>' +
                '<input type="tel" inputmode="numeric" id="input-loyer-jour" maxlength="2" value="' + escapeHtml(ui.loyerJourSaisie) + '"></div>';
    }
    html += '<div class="field"><label>Montant du loyer ' + (f === "jour" ? "par jour" : f === "semaine" ? "par semaine" : "par mois") + '</label>' +
              '<div class="amount-field"><input type="tel" inputmode="numeric" id="' + idMontant + '" placeholder="Ex. 1 500" value="' + escapeHtml(valeurMontant) + '"><span class="amount-suffix">F</span></div>' +
              '<div class="muted" style="margin-top:6px;">' + (f === "jour" ? "Ajouté tout seul à votre premier client de chaque journée." : "Un rappel « Loyer dû » s’affiche à la date de paiement, jusqu’à ce que vous notiez le paiement.") + '</div></div>';
    return html;
  }

  function loyerSaisieValide(montantStr){
    if(!(parseMontant(montantStr) > 0)) return false;
    if(ui.loyerFreqSaisie === "mois"){ var n = parseMontant(ui.loyerJourSaisie); return n >= 1 && n <= 31; }
    return true;
  }

  function appliquerLoyerSaisie(montantStr){
    state.config.cotisationHabituelle = parseMontant(montantStr);
    state.config.loyerFrequence = ui.loyerFreqSaisie;
    state.config.loyerJour = ui.loyerFreqSaisie === "jour" ? 1 : Math.max(1, Math.min(31, parseMontant(ui.loyerJourSaisie) || 1));
    if(ui.loyerFreqSaisie === "semaine") state.config.loyerJour = Math.min(7, state.config.loyerJour);
  }

  function renderOnboardingStatut(){
    var statuts = [
      { id:"locataire", titre:"Locataire de ma place", desc:"Vous payez un loyer de place au salon." },
      { id:"independant", titre:"Indépendant à domicile", desc:"Vous travaillez seul, chez vous ou en déplacement." }
    ];

    var html = "";
    html += brandHeader('« Chaque coupe compte. »');
    html += '<div class="card">';
    html += '<div class="step-label">Étape 1 sur 2</div>';
    html += '<div class="title-lg">Votre statut</div>';
    html += '<div class="muted">Pour adapter l’application à votre façon de travailler.</div>';
    html += '<div class="choice-list">';
    statuts.forEach(function(s){
      var sel = ui.statutChoisi === s.id;
      html += '<button type="button" class="choice' + (sel ? " selected" : "") + '" data-action="choisir-statut" data-id="' + s.id + '">' +
                '<span class="choice-dot"></span>' +
                '<span class="choice-txt"><strong>' + s.titre + '</strong><span>' + s.desc + '</span></span>' +
              "</button>";

    html += "</div>";

    if(ui.statutChoisi === "locataire"){
      html += renderLoyerForm("input-cotisation", ui.cotisationSaisie);

    html += "</div>";

    var peutContinuer = peutContinuerStatut();

    html += '<button type="button" class="btn btn-primary" data-action="continuer-statut"' + (peutContinuer ? "" : " disabled") + '>Continuer</button>';

    return html;
  }

  // --- Onboarding : rubriques ---

  function renderOnboardingRubriques(){
    var actives = ui.rubriquesDraft.filter(function(r){ return r.actif; }).length;

    var html = "";
    html += brandHeader("Configuration initiale");
    html += '<div class="card">';
    html += '<div class="step-label">Étape 2 sur 2</div>';
    html += '<div class="title-lg">Vos rubriques de charges</div>';
    html += '<div class="muted">Cochez celles qui vous concernent. Vous pourrez ajouter les vôtres.</div>';

    html += '<div class="rubrique-grid">';
    ui.rubriquesDraft.forEach(function(r, idx){
      html += renderRubriqueTuile(r, idx);
    });
    html += "</div>";

    if(actives > MAX_RUBRIQUES_CONSEILLE){
      html += '<div class="soft-msg">Trop de rubriques tue le suivi. Vous avez ' + actives + ' rubriques actives — gardez l’essentiel pour faire le point vite.</div>';
    }

    if(!ui.ajoutRubriquePerso){
      html += '<button type="button" class="add-rubrique-btn" data-action="ouvrir-ajout-perso">+ Ajouter une rubrique personnalisée</button>';
    }else{
      html += renderFormulairePerso();
    }

    html += "</div>";

    html += '<div class="btn-row">';
    html += '<button type="button" class="btn btn-secondary" data-action="retour-statut">Retour</button>';
    html += '<button type="button" class="btn btn-primary" data-action="terminer-onboarding">Terminer</button>';
    html += "</div>";

    return html;
  }

  function renderRubriqueTuile(r, idx){
    return '<div class="rubrique-item' + (r.actif ? " selected" : "") + (r.perso ? " perso-tag" : "") + '" data-action="toggle-rubrique-draft" data-idx="' + idx + '">' +
             '<span class="rubrique-check"></span>' +
             '<span class="rubrique-icon" style="background:' + r.couleur + '22;color:' + r.couleur + ';">' + r.icone + "</span>" +
             '<span class="rubrique-nom">' + escapeHtml(r.nom) + "</span>" +
             renderRythmeRubrique(r.id) +
           "</div>";
  }

  function renderRythmeRubrique(id){
    var pr = infoRubriquePreconfig(id);
    if(!pr) return "";
    return '<span class="rub-rythme">' + (pr.montant ? formatFCFA(pr.montant) + " · " : "") + pr.rythme + '</span>';
  }

  function renderFormulairePerso(){
    var html = '<div class="custom-form">';
    html += '<div class="field" style="margin-top:0;">' +
              '<label>Nom de la rubrique</label>' +
              '<input type="text" id="input-perso-nom" placeholder="Ex. Musique, Wifi, Loyer local" value="' + escapeHtml(ui.persoNom) + '">' +
            "</div>";

    html += '<div class="field"><label>Icône</label><div class="emoji-row">';
    EMOJI_SUGGESTIONS.forEach(function(e){
      html += '<button type="button" class="emoji-choice' + (ui.persoIcone === e ? " selected" : "") + '" data-action="choisir-emoji-perso" data-emoji="' + e + '">' + e + "</button>";
    });
    html += "</div></div>";

    html += '<div class="field"><label>Couleur</label><div class="color-row">';
    COULEUR_SUGGESTIONS.forEach(function(c){
      html += '<button type="button" class="color-choice' + (ui.persoCouleur === c ? " selected" : "") + '" style="background:' + c + ';" data-action="choisir-couleur-perso" data-couleur="' + c + '"></button>';
    });
    html += "</div></div>";

    var peutAjouter = peutAjouterPerso();
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn btn-ghost" data-action="annuler-ajout-perso">Annuler</button>';
    html += '<button type="button" class="btn btn-primary" data-action="valider-ajout-perso"' + (peutAjouter ? "" : " disabled") + '>Ajouter</button>';
    html += "</div>";
    html += "</div>";
    return html;
  }

  // --- Ecran du jour ---

  // V1.2 (Sprint 6A) : disposition MonDjai/Trépor — Recette du jour en tête, Charges et
  // Épargne côte à côte, Solde net du jour (recette − charges − épargne) en bas.
  // ---------- Sprint 7E : Aujourd'hui en cases ----------
  // Ordre décidé le 29/09/2026 : [Recette du jour] → [Charges | Épargne] → [Solde net du jour],
  // puis « Ce mois-ci » et le bouton « + » (une charge en 3 taps), puis les avis.
  // Les cases occupent la hauteur restante, MESURÉE après chaque rendu (majHauteurCases) : sans avis,
  // tout tient à 390×844 sans défiler ; avec des avis, les cases se resserrent jusqu'à leur hauteur minimale.
  function renderJour(){
    var key = jourSaisieKey();
    var estAujourdhui = key === todayKey();
    var jour = lireJour(key);
    var totalCharges = totalChargesJour(jour);
    var epargne = epargneDuJour(key);
    var soldeBrut = jour.recette - totalCharges;
    var solde = soldeBrut - epargne;

    var html = "";
    html += brandHeader(estAujourdhui ? todayLabel() : formatDateLabel(key), estAujourdhui);

    if(estAujourdhui){
      html += '<div class="date-row"><span></span>' +
                '<label class="date-link">🗓️ Saisir un jour passé' +
                  '<input type="date" id="input-jour-saisie" max="' + todayKey() + '" value="' + key + '">' +
                '</label></div>';
    }else{
      html += '<div class="retro-banner"><span>Vous complétez le <strong>' + formatDateLabel(key).replace(/ \d{4}$/, "") + '</strong></span>' +
                '<button type="button" data-action="revenir-aujourdhui">↺ Revenir à aujourd’hui</button></div>';
    }

    html += '<div class="blocks-stack" data-test="cases">';

    // 1. Recette du jour : grande case, « + Recette » ou « Modifier »
    var nbc = nbClientsJour(jour);
    var noteeRecette = jour.recetteSaisie != null || jour.recette > 0;
    html += '<button type="button" class="dash-block recette dash-zone' + (jour.recette > 0 ? " set" : "") + '" data-action="ouvrir-recette" data-test="case-recette">' +
              '<span class="dash-ico">💰</span>' +
              '<span class="dash-montant' + (jour.recette > 0 ? "" : " muted-montant") + '">' + (jour.recette > 0 ? formatFCFA(jour.recette) : "À saisir") + '</span>' +
              '<span class="dash-label">Recette ' + (estAujourdhui ? "du jour" : "de ce jour") + (nbc ? " · " + nbc + (nbc > 1 ? " clients" : " client") : "") + '</span>' +
              '<span class="case-pill' + (noteeRecette ? " case-pill-2" : "") + '">' + (noteeRecette ? "✏️ Modifier" : "+ Recette") + '</span>' +
            '</button>';

    // 2. Charges | Épargne
    html += '<div class="blocks-row">';
    html += '<button type="button" class="dash-block dash-zone" data-action="ouvrir-charges-jour" data-test="case-charges">' +
              '<span class="dash-ico">🧾</span>' +
              '<span class="dash-montant">' + formatFCFA(totalCharges) + '</span>' +
              '<span class="dash-label">Charges' + (jour.charges.length ? " (" + jour.charges.length + ")" : "") + '</span>' +
              '<span class="case-pill case-pill-2">+ Charge</span>' +
            '</button>';
    var obj = state.objectif;
    if(obj){
      var cumul = montantEpargneEstime(obj);
      var pct = obj.montantCible > 0 ? Math.min(100, Math.round(cumul / obj.montantCible * 100)) : null;
      html += '<button type="button" class="dash-block dash-zone" data-action="ouvrir-objectif" data-test="case-epargne">' +
                '<span class="dash-ico">' + (obj.icone || "💰") + '</span>' +
                '<span class="dash-montant">' + formatFCFA(epargne) + '</span>' +
                '<span class="dash-label">Épargne</span>' +
                (pct !== null ? '<span class="mini-jauge"><span class="jauge-track"><span class="jauge-fill" style="display:block;width:' + pct + '%;"></span></span><span class="mini-jauge-txt">' + pct + '% · ' + formatFCFA(cumul) + '</span></span>'
                              : '<span class="mini-jauge-txt">' + formatFCFA(cumul) + ' mis de côté</span>') +
              '</button>';
    }else{
      html += '<button type="button" class="dash-block dash-zone" data-action="ouvrir-objectif" data-test="case-epargne">' +
                '<span class="dash-ico">🔐</span>' +
                '<span class="dash-montant muted-montant">Aucun</span>' +
                '<span class="dash-label">Épargne</span>' +
                '<span class="mini-jauge-txt accent">Définir un objectif ›</span>' +
              '</button>';
    }
    html += '</div>';

    // 3. Solde net du jour (inchangé)
    html += '<div class="card solde-card solde-bas" data-test="case-solde">';
    html += '<div class="solde-label">SOLDE NET ' + (estAujourdhui ? "DU JOUR" : "DE CE JOUR") + '</div>';
    html += '<div class="solde-value ' + (solde < 0 ? "perte" : "positif") + '">' + formatFCFA(solde) + '</div>';
    html += '<div class="solde-formule">Recette − charges − épargne</div>';
    if(soldeBrut < 0){
      html += '<div class="perte-bandeau">Jour à perte : ' + formatFCFA(Math.abs(soldeBrut)) + '</div>';
    }
    html += '</div>';
    html += '</div>';   // fin des cases

    // 4. « Ce mois-ci : … F » (solde net du mois en cours, jusqu'à aujourd'hui) et le bouton « + »,
    //    posé dans son propre couloir à droite : il ne recouvre jamais un montant ni un bouton.
    var bm = bornesPeriode("mois", 0);
    var mois = calculerPlage(dateToKey(bm.debut), dateToKey(bm.fin));
    html += '<div class="ligne-mois">' +
              '<button type="button" class="ce-mois" data-action="ouvrir-ce-mois" data-test="ce-mois">Ce mois-ci : <strong class="' + (mois.soldeNet < 0 ? "perte" : "positif") + '">' + formatFCFA(mois.soldeNet) + '</strong> ›</button>' +
              '<button type="button" class="fab-charge" data-action="plus-charge" data-test="plus-charge" aria-label="Noter une charge">+</button>' +
            '</div>';

    // 5. Avis (ordre du cahier § 9.2) : Loyer dû, jauge du loyer, rappel de saisie, installation.
    //    SalonH-8A : le rappel de sauvegarde passe dans l'en-tête, avec les lignes du
    //    compte (« Sauvegardez vos données », la sauvegarde en ligne du jour compte).
    var avis = "";
    var echeance = estAujourdhui ? loyerDu() : null;
    if(echeance){
      avis += '<div class="loyer-banner"><span>🔑 <strong>Loyer de place dû</strong><br>' +
                (echeance === todayKey() ? "Aujourd’hui" : "Depuis le " + formatDateCourte(echeance)) + ' · ' + formatFCFA(state.config.cotisationHabituelle) + '</span>' +
                '<span class="install-actions"><button type="button" class="btn-sm btn-sm-payer" data-action="loyer-noter">Noter le paiement</button>' +
                '<button type="button" class="btn-sm btn-sm-annuler" data-action="loyer-plus-tard">Plus tard</button></span></div>';
    }
    if(estAujourdhui) avis += renderJaugeLoyer();
    if(estAujourdhui) avis += renderRappelSaisie();
    if(estAujourdhui) avis += renderCarteInstallation();
    if(avis) html += '<div class="avis-jour" data-test="avis">' + avis + '</div>';
    return html;
  }

  // Hauteur des cases : place réellement disponible entre le haut des cases et le bas de l'écran (moins la
  // marge réservée au menu du bas, la ligne « Ce mois-ci » et les avis) ; jamais moins que la somme des
  // hauteurs minimales des cases (le contenu n'est jamais rogné : avec beaucoup d'avis, la page défile).
  var CASES_ECART_PX = 10;             // espace entre deux cases, et entre les cases et la ligne suivante
  function majHauteurCases(){
    var racine = document.documentElement;
    var pile = app.querySelector(".blocks-stack");
    if(!pile || (ui.page || "jour") !== "jour" || ui.verrouille || !state.config.onboardingComplete){
      if(racine.style.getPropertyValue("--hauteur-cases")) racine.style.removeProperty("--hauteur-cases");
      return;
    }
    var cs = function(e){ return window.getComputedStyle(e); };
    var hFenetre = window.innerHeight || racine.clientHeight;
    var basReserve = parseFloat(cs(app).paddingBottom) || 0;           // place du menu du bas (et du bandeau de mise à jour)
    var haut = pile.getBoundingClientRect().top + (window.pageYOffset || 0);
    var apres = 0;
    for(var n = pile.nextElementSibling; n; n = n.nextElementSibling){
      if(n.tagName === "NAV" || aLaClasse(n, "overlay") || aLaClasse(n, "toast")) continue;
      apres += n.getBoundingClientRect().height + (parseFloat(cs(n).marginTop) || 0) + (parseFloat(cs(n).marginBottom) || 0);
    }
    // Minimum : case Recette + rangée Charges | Épargne (hauteurs minimales CSS) + solde (hauteur naturelle) + écarts.
    var enfants = pile.children, mini = CASES_ECART_PX * Math.max(0, enfants.length - 1);
    for(var i = 0; i < enfants.length; i++){
      var m = parseFloat(cs(enfants[i]).minHeight) || 0;
      mini += aLaClasse(enfants[i], "solde-card") ? enfants[i].offsetHeight : m;
    }
    var h = Math.floor(hFenetre - basReserve - haut - apres);
    var val = Math.ceil(Math.max(mini, h)) + "px";
    if(racine.style.getPropertyValue("--hauteur-cases") !== val) racine.style.setProperty("--hauteur-cases", val);
  }

  // ---------- Sprint 7E : jauge du loyer (semaine ou mois) ----------
  // Recettes depuis la dernière échéance comparées au montant du loyer. Simple repère : rien n'est déduit.
  // Pourcentage arrondi à l'inférieur ; jamais 100 % avant que le loyer soit couvert.
  function etatJaugeLoyer(){
    var cfg = state.config;
    if(cfg.statut !== "locataire" || !(cfg.cotisationHabituelle > 0)) return null;
    if(cfg.loyerFrequence !== "semaine" && cfg.loyerFrequence !== "mois") return null;
    var rub = findRubrique("cotisation");
    if(!rub || !rub.actif) return null;
    var ech = derniereEcheanceLoyer();
    if(!ech) return null;
    var aujourdhui = todayKey(), recettes = 0;
    Object.keys(state.jours).forEach(function(k){ if(k >= ech && k <= aujourdhui) recettes += state.jours[k].recette || 0; });
    var loyer = cfg.cotisationHabituelle;
    var couvert = recettes >= loyer;
    var pct = couvert ? 100 : Math.min(99, Math.floor(recettes / loyer * 100));
    return { echeance: ech, recettes: recettes, loyer: loyer, couvert: couvert, pct: pct, reste: Math.max(0, loyer - recettes), frequence: cfg.loyerFrequence };
  }
  function renderJaugeLoyer(){
    var j = etatJaugeLoyer();
    if(!j) return "";
    return '<div class="card jauge-loyer" data-test="jauge-loyer">' +
             '<div class="jl-tete"><span>🔑 Loyer ' + (j.frequence === "semaine" ? "de la semaine" : "du mois") + ' à couvrir</span><strong>' + j.pct + ' %</strong></div>' +
             '<div class="jauge-track"><div class="jauge-fill' + (j.couvert ? " ok" : "") + '" style="width:' + j.pct + '%;"></div></div>' +
             '<div class="jl-pied">' + (j.couvert ? '<span class="jl-ok">Loyer couvert ✓</span>' : "encore " + formatFCFA(j.reste) + " à couvrir") +
               ' · ' + formatFCFA(j.recettes) + ' sur ' + formatFCFA(j.loyer) + '</div>' +
           '</div>';
  }

  // ---------- Sprint 7E : rappel doux de saisie ----------
  // À l'ouverture : la veille n'a ni recette ni charge, n'est pas un jour de repos choisi, n'est pas
  // avant la date d'installation, et le rappel n'a pas déjà été montré aujourd'hui. Montré une fois
  // par jour (meta.rappelSaisieVu, écrit à l'affichage) ; la carte reste jusqu'à une réponse.
  var JOURS_REPOS_LIBELLES = ["Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam.", "Dim."];   // index 0 = lundi
  function rappelSaisieActif(){ return state.config.rappelSaisie !== false; }   // absent = activé
  function joursRepos(){ return Array.isArray(state.config.joursRepos) ? state.config.joursRepos : []; }
  function cleVeille(){
    var d = parseDateKey(todayKey());
    return dateToKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1));
  }
  function jourNote(cle){
    var j = state.jours[cle];
    return !!j && (j.recetteSaisie != null || j.recette > 0 || (j.charges && j.charges.length > 0) || (j.clients && j.clients.length > 0));
  }
  function rappelSaisieDu(){
    if(!rappelSaisieActif()) return false;
    var hier = cleVeille();
    if(!state.meta.creation || hier < state.meta.creation) return false;
    if(jourNote(hier)) return false;
    var jsem = (parseDateKey(hier).getDay() + 6) % 7;   // 0 = lundi
    if(joursRepos().indexOf(jsem) !== -1) return false;
    return true;
  }
  var rappelSession = null;   // null = pas encore décidé pour cette ouverture ; true / false ensuite
  function renderRappelSaisie(){
    if(rappelSession === null){
      rappelSession = state.meta.rappelSaisieVu !== todayKey() && rappelSaisieDu();
      if(rappelSession){ state.meta.rappelSaisieVu = todayKey(); saveState(); }
    }
    if(!rappelSession || jourNote(cleVeille()) || !rappelSaisieActif() || !saisieOuverte()) return "";   // 8A : jamais en lecture seule
    return '<div class="card rappel-saisie" data-test="rappel-saisie">' +
             '<div class="rs-titre">📝 Hier n’est pas noté</div>' +
             '<div class="btn-row" style="margin-top:10px;">' +
               '<button type="button" class="btn-sm btn-sm-payer" data-action="rappel-saisir-hier">Saisir hier</button>' +
               '<button type="button" class="btn-sm btn-sm-annuler" data-action="rappel-pas-travaille">Je n’ai pas travaillé</button>' +
             '</div>' +
           '</div>';
  }

  // ---------- Sprint 7E : étiquettes facultatives des charges ----------
  var ETIQUETTES_PROPOSEES = {
    consommables: ["Gel", "Mousse", "Lotion", "Huile", "Parfum"],
    entretien: ["Tondeuse", "Rasoir", "Ciseaux", "Sèche-cheveux"],
    transport: ["Taxi", "Woro-woro", "Gbaka", "Moto-taxi"]
  };
  var ETIQUETTES_PERSO_MAX = 6;        // étiquettes « + Autre » gardées par rubrique (les plus récentes)
  var ETIQUETTE_LONGUEUR_MAX = 24;     // caractères
  function etiquettesProposees(rubId){
    if(!ETIQUETTES_PROPOSEES[rubId]) return null;
    var perso = (state.config.etiquettesPerso && Array.isArray(state.config.etiquettesPerso[rubId])) ? state.config.etiquettesPerso[rubId] : [];
    var l = ETIQUETTES_PROPOSEES[rubId].slice();
    perso.forEach(function(e){ if(l.indexOf(e) === -1) l.push(e); });
    return l;
  }
  function memoriserEtiquette(rubId, etiquette){
    if(!etiquette || !ETIQUETTES_PROPOSEES[rubId] || ETIQUETTES_PROPOSEES[rubId].indexOf(etiquette) !== -1) return;
    if(!state.config.etiquettesPerso || typeof state.config.etiquettesPerso !== "object") state.config.etiquettesPerso = {};
    var l = Array.isArray(state.config.etiquettesPerso[rubId]) ? state.config.etiquettesPerso[rubId].slice() : [];
    l = l.filter(function(e){ return e !== etiquette; });
    l.push(etiquette);
    while(l.length > ETIQUETTES_PERSO_MAX) l.shift();
    state.config.etiquettesPerso[rubId] = l;
  }
  function nettoyerEtiquette(s){ return String(s || "").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "").slice(0, ETIQUETTE_LONGUEUR_MAX); }
  // Pastilles sous le montant (saisie et modification d'une charge) ; « + Autre » ouvre un petit champ.
  function renderPastillesEtiquettes(rubId, choisie){
    var liste = etiquettesProposees(rubId);
    if(!liste) return "";
    if(choisie && liste.indexOf(choisie) === -1) liste.push(choisie);
    var html = '<div class="field etiquettes" data-test="etiquettes"><label>Détail (facultatif)</label><div class="quick-row etiq-row">';
    liste.forEach(function(e){
      html += '<button type="button" class="quick-chip etiq' + (choisie === e ? " etiq-on" : "") + '" data-action="choisir-etiquette" data-etiquette="' + escapeHtml(e) + '" aria-pressed="' + (choisie === e ? "true" : "false") + '">' + escapeHtml(e) + '</button>';
    });
    if(!ui.etiquetteAutre){
      html += '<button type="button" class="quick-chip etiq etiq-autre" data-action="etiquette-autre">+ Autre</button>';
    }
    html += '</div>';
    if(ui.etiquetteAutre){
      html += '<div class="etiq-autre-ligne"><input type="text" id="input-etiquette-autre" maxlength="' + ETIQUETTE_LONGUEUR_MAX + '" placeholder="Ex. Savon" value="' + escapeHtml(ui.etiquetteAutreSaisie) + '">' +
              '<button type="button" class="btn-sm btn-sm-payer" data-action="valider-etiquette-autre"' + (nettoyerEtiquette(ui.etiquetteAutreSaisie) ? "" : " disabled") + '>OK</button></div>';
    }
    html += '</div>';
    return html;
  }
  function libelleCharge(c, nomRubrique){
    return escapeHtml(nomRubrique) + (c && c.etiquette ? ' <span class="etiq-tag">· ' + escapeHtml(c.etiquette) + '</span>' : "");
  }

  function formatHeure(ts){
    try{
      var d = new Date(ts);
      return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }catch(e){
      return "";
    }
  }

  // --- Ecran Mes créances ---

  function renderCreances(){
    var enCoursListe = creancesEnCours().slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    var payeesRecemment = state.creances.filter(function(c){ return c.statut === "payee"; })
      .sort(function(a,b){ return (b.tsPaiement||0) - (a.tsPaiement||0); })
      .slice(0, 8);

    var html = "";
    html += brandHeader("Mes créances");

    html += '<button type="button" class="client-btn" data-action="ouvrir-ajout-creance"><span class="plus-circle">+</span> Client à crédit</button>';

    var ancienneNb = enCoursListe.filter(function(c){ return joursDepuis(c.date) >= 14; }).length;
    if(ancienneNb > 0){
      html += '<div class="soft-msg">' + ancienneNb + (ancienneNb > 1 ? " créances datent" : " créance date") + ' de plus de deux semaines. Un petit rappel au client, si l’occasion se présente.</div>';
    }

    html += '<div class="section-title">En cours' + (enCoursListe.length ? " (" + enCoursListe.length + ")" : "") + '</div>';
    if(enCoursListe.length === 0){
      html += '<div class="card"><div class="empty-note">Aucune créance en cours.<br>Tout est encaissé.</div></div>';
    }else{
      html += '<div class="creance-list">';
      enCoursListe.forEach(function(c){
        var ancienne = joursDepuis(c.date) >= 14;
        html += '<div class="creance-row">' +
                  '<span class="creance-info">' +
                    '<span class="creance-nom">' + escapeHtml(c.nom) + '</span><br>' +
                    '<span class="creance-date">Depuis le ' + formatDateCourte(c.date) + (ancienne ? " · en attente" : "") + '</span>' +
                  '</span>' +
                  '<span class="creance-montant">' + formatFCFA(c.montant) + '</span>' +
                  '<span class="creance-actions">' +
                    '<button type="button" class="btn-sm btn-sm-payer" data-action="marquer-payee" data-id="' + c.id + '">✓ Payé</button>' +
                    '<button type="button" class="btn-sm btn-sm-annuler" data-action="supprimer-creance" data-id="' + c.id + '">Annuler</button>' +
                  '</span>' +
                '</div>';
      });
      html += "</div>";
    }

    if(payeesRecemment.length > 0){
      html += '<div class="section-title" style="margin-top:18px;">Recouvrées récemment</div>';
      html += '<div class="creance-list">';
      payeesRecemment.forEach(function(c){
        html += '<div class="creance-row payee">' +
                  '<span class="creance-info">' +
                    '<span class="creance-nom">' + escapeHtml(c.nom) + '</span><br>' +
                    '<span class="creance-date">Recouvrée le ' + formatDateCourte(c.datePaiement) + '</span>' +
                  '</span>' +
                  '<span class="creance-montant">' + formatFCFA(c.montant) + '</span>' +
                  '<span class="creance-tag-payee">Payé</span>' +
                '</div>';
      });
      html += "</div>";
    }

    return html;
  }

  // --- Ecran Mon état ---

  // V1.1 : Mon état regroupe les chiffres ET l'historique (ancien onglet Historique),
  // sur le modèle Trépor Sprint 7B : Jour (‹ › jour par jour), Semaine (→ jours),
  // Mois (→ semaines → jours). La flèche « ‹ » s'arrête à la première journée enregistrée.

  function renderEtat(){
    var mode = ui.etatMode;
    var offset = ui.etatOffset;
    var html = "";
    html += brandHeader("Mon état");

    if(mode === "mois" && ui.etatSemaineOuverte){
      return html + renderEtatSemaineDepuisMois(ui.etatSemaineOuverte);
    }

    html += '<div class="etat-tabs">';
    [["jour","Jour"],["semaine","Semaine"],["mois","Mois"]].forEach(function(m){
      html += '<button type="button" class="etat-tab' + (mode === m[0] ? " active" : "") + '" data-action="etat-mode" data-mode="' + m[0] + '">' + m[1] + '</button>';
    });
    html += "</div>";

    html += '<div class="etat-period-nav">';
    html += '<button type="button" data-action="etat-precedent" aria-label="Période précédente"' + (precedentPossible(mode, offset) ? "" : " disabled") + '>‹</button>';
    html += '<div class="etat-period-label">' + labelPeriode(mode, offset) + '</div>';
    html += '<button type="button" data-action="etat-suivant" aria-label="Période suivante"' + (offset >= 0 ? " disabled" : "") + '>›</button>';
    html += "</div>";

    var b = bornesPeriode(mode, offset);
    var startKey = dateToKey(b.debut), endKey = dateToKey(b.fin);
    var e = calculerPlage(startKey, endKey);

    if(mode === "jour"){
      html += renderResumeJour(startKey, true);
      html += lienMesCharges();   // Sprint 7D
      return html;
    }

    // V1.2 : 1. Solde net · 2. Recette − charges − épargne · 3. détail des charges et de l'épargne
    html += renderResumePeriode(e, mode === "semaine" ? "de la semaine" : "du mois");
    html += renderChargesParRubrique(e);
    html += lienMesCharges();   // Sprint 7D
    html += renderEpargneDetail(e, startKey, endKey);

    if(mode === "semaine"){
      html += '<div class="section-title" style="margin-top:18px;">Jours de la semaine</div>';
      html += renderListeJours(startKey, endKey);
    }else{
      html += '<div class="section-title" style="margin-top:18px;">Semaines du mois</div>';
      html += renderListeSemaines(b.debut, b.fin);
    }
    return html;
  }

  // Sprint 7D : Mon état → Mes charges (deux taps depuis le menu).
  function lienMesCharges(){
    return '<button type="button" class="settings-link-row lien-mes-charges" data-action="ouvrir-mes-charges" data-test="lien-mes-charges">🧾 Mes charges du mois<span class="settings-chevron">›</span></button>';
  }

  function renderSoldeCarte(titre, recette, charges, epargne, nbClients){
    var solde = recette - charges - epargne;
    var html = '<div class="card solde-card">';
    html += '<div class="solde-label">' + titre + '</div>';
    html += '<div class="solde-value ' + (solde < 0 ? "perte" : "positif") + '">' + formatFCFA(solde) + '</div>';
    if(recette - charges < 0){
      html += '<div class="perte-bandeau">À perte : ' + formatFCFA(Math.abs(recette - charges)) + '</div>';
    }
    html += '<div class="solde-mini-stats">' +
              '<div><div class="v">' + formatFCFA(recette) + '</div><div class="l">Recette' + (nbClients ? " (" + nbClients + (nbClients > 1 ? " clients)" : " client)") : "") + '</div></div>' +
              '<div><div class="v">' + formatFCFA(charges) + '</div><div class="l">Charges</div></div>' +
              '<div><div class="v">' + (state.objectif ? formatFCFA(epargne) : "Aucun") + '</div><div class="l">Épargne</div></div>' +
            '</div>';
    html += '</div>';
    return html;
  }

  function renderResumePeriode(e, suffixe){
    return renderSoldeCarte("SOLDE NET " + (suffixe || "").toUpperCase(), e.recetteTotale, e.chargesTotal, e.epargneTotal, e.nbClients);
  }

  function renderEpargneDetail(e, startKey, endKey){
    var html = '<div class="section-title" style="margin-top:18px;">Épargne</div>';
    var obj = state.objectif;
    if(!obj){
      return html + '<button type="button" class="epargne-row" data-action="ouvrir-objectif"><span class="nom">Aucun objectif<span class="sub">Définir un objectif d’épargne ›</span></span></button>';
    }
    var rythme = obj.mode === "manuel" ? formatFCFA(obj.montantJour) + " par jour travaillé" : obj.pourcentage + " % de la recette";
    var jours = 0;
    Object.keys(state.jours).forEach(function(k){ if(k >= startKey && k <= endKey && epargneDuJour(k) > 0) jours++; });
    html += '<button type="button" class="epargne-row" data-action="ouvrir-objectif">' +
              '<span style="font-size:24px;">' + (obj.icone || "💰") + '</span>' +
              '<span class="nom">' + escapeHtml(obj.nom) + '<span class="sub">' + rythme + (jours ? " · " + jours + (jours > 1 ? " jours" : " jour") : "") + '</span></span>' +
              '<span class="val">' + formatFCFA(e.epargneTotal) + '</span>' +
            '</button>';
    return html;
  }

  function renderChargesParRubrique(e){
    var html = '<div class="section-title" style="margin-top:18px;">Charges par rubrique</div>';
    var rubriqueIds = Object.keys(e.chargesParRubrique);
    if(rubriqueIds.length === 0){
      return html + '<div class="card"><div class="empty-note">Aucune charge sur cette période.</div></div>';
    }
    rubriqueIds.sort(function(a,b){
      if(a === "cotisation") return -1;
      if(b === "cotisation") return 1;
      return e.chargesParRubrique[b] - e.chargesParRubrique[a];
    });
    html += '<div class="charge-list">';
    rubriqueIds.forEach(function(rid){
      var r = findRubrique(rid);
      var icone = r ? r.icone : "❓";
      var couleur = r ? r.couleur : "#8a94a6";
      var nom = r ? r.nom : "Rubrique supprimée";
      html += '<div class="rubrique-stat-row">' +
                '<span class="charge-icon" style="background:' + couleur + '22;color:' + couleur + ';">' + icone + "</span>" +
                '<span class="rubrique-stat-nom">' + escapeHtml(nom) + '</span>' +
                '<span class="rubrique-stat-montant">' + formatFCFA(e.chargesParRubrique[rid]) + '</span>' +
              "</div>";
    });
    html += "</div>";
    return html;
  }

  // Liste des jours d'une plage (du plus récent au plus ancien), chacun cliquable vers son détail.
  function renderListeJours(startKey, endKey){
    var today = todayKey();
    var d = parseDateKey(endKey);
    var debut = parseDateKey(startKey);
    var html = '<div class="hist-list">';
    while(d >= debut){
      var k = dateToKey(d);
      var j = state.jours[k];
      var futur = k > today;
      var aDonnees = !!j && (jourADesDonnees(j) || j.clients.length > 0);
      var solde = j ? j.recette - totalChargesJour(j) - epargneDuJour(k) : 0;
      var sousTitre = futur ? "À venir" : (aDonnees ? j.clients.length + (j.clients.length > 1 ? " clients · " : " client · ") + j.charges.length + (j.charges.length > 1 ? " charges" : " charge") : "Rien d’enregistré");
      html += '<button type="button" class="hist-row' + (futur ? " futur" : "") + (aDonnees ? "" : " vide") + '"' + (futur ? " disabled" : ' data-action="voir-jour-detail" data-key="' + k + '"') + '>' +
                '<span>' +
                  '<span class="hist-date">' + formatDateLabel(k).replace(/ \d{4}$/, "") + (j && j.saisiApresCoup ? '<span class="retro-tag">saisi après coup</span>' : "") + '</span><br>' +
                  '<span class="hist-sub">' + sousTitre + '</span>' +
                '</span>' +
                '<span class="hist-solde ' + (solde < 0 ? "perte" : "positif") + '">' + (aDonnees ? formatFCFA(solde) : "—") + (futur ? "" : '<span class="hist-chevron">›</span>') + '</span>' +
              '</button>';
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    }
    html += "</div>";
    return html;
  }

  // Semaines civiles (lundi → dimanche) qui recoupent le mois, de la plus récente à la plus ancienne.
  function renderListeSemaines(debutMois, finMois){
    var today = todayKey();
    var lundis = [];
    var l = lundiDeLaSemaine(debutMois);
    while(l <= finMois){
      lundis.push(new Date(l.getTime()));
      l = new Date(l.getFullYear(), l.getMonth(), l.getDate() + 7);
    }
    lundis.reverse();
    var html = '<div class="hist-list">';
    lundis.forEach(function(lundi){
      var dim = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
      var sk = dateToKey(lundi), ek = dateToKey(dim);
      var futur = sk > today;
      var e = calculerPlage(sk, ek);
      var aDonnees = e.nbJoursTravailles > 0 || e.nbClients > 0;
      html += '<button type="button" class="hist-row' + (futur ? " futur" : "") + (aDonnees ? "" : " vide") + '"' + (futur ? " disabled" : ' data-action="etat-ouvrir-semaine" data-key="' + sk + '"') + '>' +
                '<span>' +
                  '<span class="hist-date">Du ' + formatDateCourte(sk) + ' au ' + formatDateCourte(ek) + '</span><br>' +
                  '<span class="hist-sub">' + (futur ? "À venir" : (aDonnees ? e.nbClients + (e.nbClients > 1 ? " clients · " : " client · ") + e.nbJoursTravailles + (e.nbJoursTravailles > 1 ? " jours travaillés" : " jour travaillé") : "Rien d’enregistré")) + '</span>' +
                '</span>' +
                '<span class="hist-solde ' + (e.soldeNet < 0 ? "perte" : "positif") + '">' + (aDonnees ? formatFCFA(e.soldeNet) : "—") + (futur ? "" : '<span class="hist-chevron">›</span>') + '</span>' +
              '</button>';
    });
    html += "</div>";
    return html;
  }

  function renderEtatSemaineDepuisMois(lundiKey){
    var lundi = parseDateKey(lundiKey);
    var dim = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
    var sk = lundiKey, ek = dateToKey(dim);
    var e = calculerPlage(sk, ek);
    var html = '<button type="button" class="back-link" data-action="etat-fermer-semaine">‹ Retour aux semaines</button>';
    html += '<div class="etat-period-label" style="margin-bottom:14px;text-align:left;">Semaine du ' + formatDateCourte(sk) + ' au ' + formatDateCourte(ek) + '</div>';
    html += renderResumePeriode(e, "de la semaine");
    html += renderChargesParRubrique(e);
    html += renderEpargneDetail(e, sk, ek);
    html += '<div class="section-title" style="margin-top:18px;">Jours de la semaine</div>';
    html += renderListeJours(sk, ek);
    return html;
  }

  // Résumé d'une journée, en lecture seule (vue Jour de Mon état et détail d'un jour).
  function renderResumeJour(key, avecLienSaisie){
    var jour = lireJour(key);
    var e = calculerPlage(key, key);
    var html = renderSoldeCarte("SOLDE NET DU JOUR", jour.recette, totalChargesJour(jour), epargneDuJour(key), nbClientsJour(jour));
    if(jour.saisiApresCoup){
      html += '<div class="muted" style="margin:-4px 0 12px 2px;">Journée saisie après coup.</div>';
    }
    if(jour.modifieLe){
      html += renderModifieLe(jour, "Recette modifiée le ").replace('class="modifie-le"', 'class="modifie-le" style="margin:-4px 0 12px 2px;"');
    }
    if(avecLienSaisie){
      html += '<button type="button" class="btn btn-secondary" style="margin-bottom:6px;" data-action="completer-jour" data-key="' + key + '">✏️ Compléter ou corriger ce jour</button>';
    }
    html += renderChargesParRubrique(e);
    html += renderEpargneDetail(e, key, key);
    return html;
  }

  // --- Ecran Mon objectif (F8) ---

  // V1.2 (Sprint 6B) : modèle d'objectif de MonDjai/Coiffure, intitulés Salon H.
  // Un seul objectif actif.

  function nouveauBrouillonObjectif(){
    return { step:"modele", edition:false, modele:null, mode:"auto", pourcentage:10, montantJour:"", cible:"", nom:"" };
  }

  function renderObjectif(){
    var html = "";
    html += brandHeader("Objectif d’épargne");
    html += lienRetour();   // Sprint 7D : écran secondaire
    html += '<div class="zahe">' + escapeHtml(MESSAGE_EPARGNE) + '</div>';
    if(ui.objDraft){
      html += renderObjectifBrouillon();
    }else if(!state.objectif){
      ui.objDraft = nouveauBrouillonObjectif();
      html += renderObjectifBrouillon();
    }else{
      html += renderObjectifActif();
    }
    return html;
  }

  // SalonH-8A : les deux emplacements grisés « Abonnez-vous pour plus de
  // fonctionnalités » sont retirés (l'abonnement comprend toutes les fonctions).

  function renderObjectifBrouillon(){
    var d = ui.objDraft;
    var html = "";
    if(d.step === "modele" && !d.edition){
      html += '<div class="muted" style="font-size:14px;">Vous mettez de côté pour quoi ?</div>';
      html += '<div class="muted">Choisissez ce qui vous ressemble le plus.</div>';
      html += '<div class="obj-grid">';
      OBJECTIF_MODELES.forEach(function(m){
        html += '<button type="button" class="obj-card' + (d.modele === m.id ? " selected" : "") + '" data-action="obj-choisir-modele" data-id="' + m.id + '">' +
                  '<span class="e">' + m.icone + '</span>' +
                  '<strong>' + escapeHtml(m.nom) + '</strong>' +
                  '<span class="d">' + escapeHtml(m.description) + '</span>' +
                  '<span class="m">Suggestion : ' + formatFCFA(m.montantSuggere) + '</span>' +
                '</button>';
      });
      html += '</div>';
      html += '<button type="button" class="btn btn-primary" style="margin-top:16px;" data-action="obj-continuer"' + (d.modele ? "" : " disabled") + '>Continuer</button>';
      return html;
    }

    if(d.edition){
      html += '<button type="button" class="btn btn-secondary" style="margin-bottom:12px;" data-action="obj-annuler-edition">‹ Annuler la modification</button>';
    }else{
      html += '<button type="button" class="btn btn-secondary" style="margin-bottom:12px;" data-action="obj-changer-modele">‹ Changer de modèle</button>';
    }
    html += '<div class="muted"><strong>Auto</strong> : un pourcentage de la recette. <strong>Manuel</strong> : un montant fixe par jour travaillé.</div>';
    html += '<div class="mode-tabs">' +
              '<button type="button" class="mode-tab' + (d.mode === "auto" ? " active" : "") + '" data-action="obj-mode" data-mode="auto">Auto (%)</button>' +
              '<button type="button" class="mode-tab' + (d.mode === "manuel" ? " active" : "") + '" data-action="obj-mode" data-mode="manuel">Manuel (montant)</button>' +
            '</div>';
    if(d.mode === "auto"){
      var moy = recetteMoyenneJourTravaille();
      html += '<div class="field" style="margin-top:0;"><label>Pourcentage de la recette *</label></div>';
      html += '<div class="pct-row">';
      SCENARIOS_OBJECTIF.forEach(function(sc){
        html += '<button type="button" class="pct-card' + (d.pourcentage === sc.pourcentage ? " selected" : "") + '" data-action="obj-pct" data-pourcentage="' + sc.pourcentage + '">' +
                  '<span class="p">' + sc.pourcentage + ' %</span><span class="n">' + sc.nom + '</span>' +
                  (moy ? '<span class="x">≈ ' + formatFCFA(Math.round(moy * sc.pourcentage / 100)) + '/jour</span>' : "") +
                '</button>';
      });
      html += '</div>';
      if(!moy) html += '<div class="muted" style="margin-top:8px;">L’estimation par jour apparaîtra après vos premières journées enregistrées.</div>';
    }else{
      html += '<div class="field" style="margin-top:0;"><label>Montant mis de côté chaque jour travaillé *</label>' +
                '<div class="amount-field"><input type="tel" inputmode="numeric" id="input-obj-montant-jour" placeholder="Ex. 200" value="' + escapeHtml(d.montantJour) + '"><span class="amount-suffix">F</span></div></div>';
    }
    html += '<div class="field"><label>Montant visé (pour la jauge)</label>' +
              '<div class="amount-field"><input type="tel" inputmode="numeric" id="input-obj-cible" placeholder="Ex. 45 000" value="' + escapeHtml(d.cible) + '"><span class="amount-suffix">F</span></div></div>';
    html += '<div class="field"><label>Nom</label><input type="text" id="input-obj-nom" value="' + escapeHtml(d.nom) + '"></div>';
    var valide = objectifBrouillonValide();
    html += '<button type="button" class="btn btn-primary" style="margin-top:16px;" data-action="obj-enregistrer"' + (valide ? "" : " disabled") + '>' + (d.edition ? "Enregistrer les modifications" : "Créer mon objectif") + '</button>';
    return html;
  }

  function renderObjectifActif(){
    var obj = state.objectif;
    var cumul = montantEpargneEstime(obj);
    var pct = obj.montantCible > 0 ? Math.min(100, Math.round(cumul / obj.montantCible * 100)) : null;
    var rythme = obj.mode === "manuel" ? "Manuel · " + formatFCFA(obj.montantJour) + " par jour travaillé" : "Auto · " + obj.pourcentage + " % de la recette";
    var parJour = estimationEpargneJour(obj.mode, obj.pourcentage, obj.montantJour);
    var html = '<div class="card">';
    html += '<div class="obj-actif-head"><span class="e">' + (obj.icone || "💰") + '</span><span><span class="n">' + escapeHtml(obj.nom) + '</span><br><span class="r">' + rythme + '</span></span></div>';
    if(pct !== null){
      html += '<div class="jauge-wrap"><div class="jauge-track"><div class="jauge-fill" style="width:' + pct + '%;"></div></div>' +
                '<div class="jauge-label">' + formatFCFA(cumul) + ' sur ' + formatFCFA(obj.montantCible) + ' (' + pct + '%)</div></div>';
    }
    html += '<div class="obj-stats">' +
              '<div class="etat-stat"><div class="num">' + formatFCFA(epargneDuJour(todayKey())) + '</div><div class="label">Aujourd’hui</div></div>' +
              '<div class="etat-stat"><div class="num">' + formatFCFA(cumul) + '</div><div class="label">Mis de côté depuis le ' + formatDateCourte(obj.dateCreation) + '</div></div>' +
            '</div>';
    if(pct !== null && pct >= 100){
      html += '<div class="soft-msg soft-ok">Objectif atteint ! Bravo — démarrez-en un nouveau quand vous voulez.</div>';
    }else if(pct !== null){
      var restant = Math.max(0, obj.montantCible - cumul);
      html += '<div class="muted" style="margin-top:12px;">Au rythme de ≈ ' + formatFCFA(parJour) + ' par jour : ' + formatJoursTravailles(parJour > 0 ? Math.ceil(restant / parJour) : null) + '.</div>';
    }
    html += '<div class="btn-row">';
    html += '<button type="button" class="btn btn-secondary" data-action="obj-modifier">Modifier</button>';
    html += '<button type="button" class="btn btn-ghost" data-action="obj-supprimer">Recommencer</button>';
    html += '</div>';
    if(ui.objConfirmSuppr){
      html += '<div class="soft-msg">Recommencer efface cet objectif ; recettes et charges restent intactes.</div>';
      html += '<div class="btn-row"><button type="button" class="btn btn-ghost" data-action="obj-supprimer-annuler">Annuler</button>' +
              '<button type="button" class="btn btn-danger-outline" data-action="obj-supprimer-confirmer">Oui, recommencer</button></div>';
    }
    html += '</div>';
    return html;
  }

  // --- Détail d'un jour passé (ouvert depuis Mon état) ---

  function renderJourDetail(key){
    var html = brandHeader(formatDateLabel(key));
    html += lienRetour();
    html += '<div class="readonly-tag">Lecture seule</div>';
    html += renderResumeJour(key, true);
    return html;
  }

  // --- Écran Réglages (F11) ---

  // SalonH-8A : Réglages en parties dépliables, toutes fermées à l'entrée, comme
  // Coiffure 9B2 : Mon compte · Statut et loyer · Rubriques de charges ·
  // Sécurité · Sauvegarde · Rappels et notifications · Affichage · À propos.
  // Affichage seulement : chaque réglage de Salon H reste le même.
  function renderReglagesStatut(){
    var html = "";
    var statuts = [
      { id:"locataire", titre:"Locataire de ma place" },
      { id:"independant", titre:"Indépendant à domicile" }
    ];
    html += '<div class="choice-list">';
    statuts.forEach(function(st){
      var sel = state.config.statut === st.id;
      html += '<button type="button" class="choice' + (sel ? " selected" : "") + '" data-action="reglages-choisir-statut" data-id="' + st.id + '">' +
                '<span class="choice-dot"></span>' +
                '<span class="choice-txt"><strong>' + st.titre + '</strong></span>' +
              "</button>";
    });
    html += "</div>";
    if(state.config.statut !== "locataire" && state.config.statut !== "independant"){
      html += '<div class="soft-msg">Choisissez votre statut : « Salarié à commission » n’existe plus dans l’application.</div>';
    }
    if(state.config.statut === "locataire"){
      html += '<div class="muted" style="margin-top:10px;">Actuellement : ' + (state.config.cotisationHabituelle > 0 ? formatFCFA(state.config.cotisationHabituelle) + ", " + libelleLoyer() : "montant non renseigné") + '.</div>';
      html += renderLoyerForm("input-reglages-cotisation", ui.reglagesCotisationSaisie);
      html += '<button type="button" class="btn btn-secondary" style="margin-top:10px;" data-action="reglages-enregistrer-cotisation"' + (cotisationReglagesValide() ? "" : " disabled") + '>Enregistrer le loyer</button>';

  function roundRectCompat(ctx, x, y, w, h, r){
    ctx.beginPath();
    if(ctx.roundRect){
      ctx.roundRect(x, y, w, h, r);
    }else{
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  }

  function ajusterTaillePolice(ctx, texte, largeurMax, tailleDepart){
    var taille = tailleDepart;
    while(taille > 34){
      ctx.font = "800 " + taille + "px -apple-system,Helvetica,Arial,sans-serif";
      if(ctx.measureText(texte).width <= largeurMax) break;
      taille -= 4;
    }
    return taille;
  }

  var POLICE = "-apple-system,Helvetica,Arial,sans-serif";

  function dessinerImagePartage(canvas, d){
    canvas.width = 1080; canvas.height = 1350;
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height, marge = 80;
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#161b25"); grad.addColorStop(1, "#0d0f14");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

    // En-tête (net)
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#f5a623"; ctx.font = "700 40px " + POLICE;
    ctx.fillText("✂️ MonDjai / Salon H", w/2, 120);
    ctx.fillStyle = "#b7bfcc"; ctx.font = "500 30px " + POLICE;
    ctx.fillText(d.titre, w/2, 172);
    ctx.fillStyle = "#b7bfcc"; ctx.font = "700 28px " + POLICE;
    ctx.fillText("SOLDE NET", w/2, 262);
    ctx.fillStyle = d.solde < 0 ? "#ff6b5e" : "#f5f6f8";
    var texteSolde = formatFCFAImage(d.solde);
    ctx.font = "800 " + ajusterTaillePolice(ctx, texteSolde, w - marge*2, 120) + "px " + POLICE;
    ctx.fillText(texteSolde, w/2, 380);

    // Détail (flouté ensuite)
    var y = 520, col = (w - marge*2) / 3;
    [["Recette", d.recette, "#34b37e"], ["Charges", d.charges, "#ff6b5e"], ["Épargne", d.epargne, "#f5a623"]].forEach(function(c, i){
      var cx = marge + col*i + col/2;
      ctx.fillStyle = "#b7bfcc"; ctx.font = "500 28px " + POLICE; ctx.fillText(c[0], cx, y);
      ctx.fillStyle = c[2]; ctx.font = "800 40px " + POLICE; ctx.fillText(formatFCFAImage(c[1]), cx, y + 58);
    });
    ctx.fillStyle = "#b7bfcc"; ctx.font = "500 26px " + POLICE;
    ctx.fillText(d.nbClients + (d.nbClients > 1 ? " clients" : " client"), w/2, y + 120);

    ctx.strokeStyle = "#2a3040"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(marge, 700); ctx.lineTo(w - marge, 700); ctx.stroke();
    var ids = Object.keys(d.chargesParRubrique).sort(function(a,b){ return d.chargesParRubrique[b] - d.chargesParRubrique[a]; }).slice(0, 6);
    ctx.textAlign = "left";
    ids.forEach(function(rid, i){
      var r = findRubrique(rid);
      var yy = 770 + i*62;
      ctx.fillStyle = "#f5f6f8"; ctx.font = "500 30px " + POLICE;
      ctx.fillText((r ? r.icone + "  " + r.nom : "Rubrique supprimée"), marge, yy);
      ctx.textAlign = "right"; ctx.fillStyle = "#ff6b5e"; ctx.font = "700 30px " + POLICE;
      ctx.fillText(formatFCFAImage(d.chargesParRubrique[rid]), w - marge, yy);
      ctx.textAlign = "left";
    });
    ctx.textAlign = "center";
    ctx.fillStyle = "#6b7385"; ctx.font = "400 24px " + POLICE;
    ctx.fillText("Généré le " + formatDateCourte(todayKey()) + " avec MonDjai/Salon H · document informatif, non certifié", w/2, h - 50);
  }

  // SalonH-8A : l'image n'est floutée qu'en lecture seule (essai tout ouvert).
  var MENTION_FLOU = "Réabonnez-vous pour l’image complète";
  function telechargerFloute(){ return !saisieOuverte(); }
  // Image exportée = même rendu que l'aperçu : nette, ou (lecture seule) haut net,
  // bas réellement flouté + mention.
  function construireCanvasExport(){
    var src = document.getElementById("partage-canvas");
    var w = src.width, h = src.height;
    var out = document.createElement("canvas"); out.width = w; out.height = h;
    var ctx = out.getContext("2d");
    ctx.drawImage(src, 0, 0);
    if(!telechargerFloute()) return out;
    var flou = document.createElement("canvas"); flou.width = w; flou.height = h;
    var fx = flou.getContext("2d");
    var filtreOk = typeof fx.filter === "string";
    if(filtreOk){
      fx.filter = "blur(28px)";
      fx.drawImage(src, 0, 0);
      fx.filter = "none";
    }
    if(!filtreOk || fx.getImageData(w/2|0, (h*0.45)|0, 1, 1).data[3] === 0){
      var petit = document.createElement("canvas"); petit.width = Math.ceil(w/14); petit.height = Math.ceil(h/14);
      var px = petit.getContext("2d"); px.imageSmoothingEnabled = true;
      px.drawImage(src, 0, 0, petit.width, petit.height);
      fx.clearRect(0, 0, w, h); fx.imageSmoothingEnabled = true;
      fx.drawImage(petit, 0, 0, w, h);
    }
    fx.globalCompositeOperation = "destination-in";
    var g = fx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(PARTAGE_FLOU_DEBUT, "rgba(0,0,0,0)");
    g.addColorStop(PARTAGE_FLOU_PLEIN, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,1)");
    fx.fillStyle = g; fx.fillRect(0, 0, w, h);
    fx.globalCompositeOperation = "source-over";
    ctx.drawImage(flou, 0, 0);
    // Mention (lecture seule)
    var texte = MENTION_FLOU;
    ctx.font = "800 38px " + POLICE;
    var tw = ctx.measureText(texte).width, bw = tw + 80, bh = 84, bx = (w - bw)/2, by = h*PARTAGE_BADGE_Y - bh/2;
    ctx.fillStyle = "#2a1f0e"; roundRectCompat(ctx, bx, by, bw, bh, 42); ctx.fill();
    ctx.strokeStyle = "#6a4d12"; ctx.lineWidth = 3; roundRectCompat(ctx, bx, by, bw, bh, 42); ctx.stroke();
    ctx.fillStyle = "#f5a623"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(texte, w/2, by + bh/2 + 2);
    return out;
  }

  function genererEtPartagerImage(telechargerSeulement){
    var src = document.getElementById("partage-canvas");
    if(!src) return;
    var canvas = construireCanvasExport();
    if(!canvas.toBlob) return;
    var nomFichier = nomFichierPartage();
    canvas.toBlob(function(blob){
      if(!blob) return;
      if(telechargerSeulement){ telechargerBlobImage(blob, nomFichier); return; }
      var fichier = null;
      try{ fichier = new File([blob], nomFichier, { type: "image/png" }); }catch(e){ fichier = null; }
      if(fichier && window.navigator && navigator.canShare && navigator.share && navigator.canShare({ files: [fichier] })){
        navigator.share({ files: [fichier], title: "MonDjai/Salon H" }).catch(function(err){
          if(err && err.name === "AbortError") return;
          telechargerBlobImage(blob, nomFichier);

  // Lu localement dans le cache du téléphone (aucun appel réseau).
  function verifierHorsLigne(){
    function fixer(txt){ etatHorsLigne = txt; majEtatHorsLigne(); }
    try{
      if(!("caches" in window) || !("serviceWorker" in navigator)){ fixer("non pris en charge par ce navigateur"); return; }
      var urlIndex = window.location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "") + "index.html";
      caches.keys().then(function(cles){
        var courant = cles.indexOf(NOM_CACHE) !== -1;
        var ancien = null;
        cles.forEach(function(k){
          if(k === NOM_CACHE) return;
          PREFIXES_CACHE_SALONH.forEach(function(p){ if(k.indexOf(p) === 0) ancien = k; });
        });
        if(!courant && !ancien){ fixer("pas encore (ouvrez-la une fois avec internet)"); return; }
        return caches.open(courant ? NOM_CACHE : ancien).then(function(cache){
          return cache.match(urlIndex);
        }).then(function(rep){
          fixer(rep ? (courant ? "prêt (" + NOM_CACHE + ")" : "prêt (version précédente)") : "pas encore (ouvrez-la une fois avec internet)");
        });
      }).catch(function(){ fixer("état inconnu"); });
    }catch(e){ fixer("état inconnu"); }
  }

    if(!ref) return -1;

  // ---------- Sprint 7D : Mes charges (écran secondaire) ----------
  // Mois en cours par défaut, ‹ › bornés (premiereDateDonnees / mois en cours). Les totaux viennent de
  // calculerPlage() : ce sont exactement ceux de Mon état › Mois. Aucun deuxième calcul.
  var MC_NB_CHARGES_PLUS_GROSSES = 5;   // Mes habitudes : « 5 plus grosses charges »

  // Liste à plat des charges d'une plage de dates : [{ cle:'AAAA-MM-JJ', c:charge }], du plus ancien au plus récent.
  function chargesDePlage(startKey, endKey){
    var l = [];
    Object.keys(state.jours).sort().forEach(function(k){
      if(k >= startKey && k <= endKey){
        (state.jours[k].charges || []).slice().sort(function(a, c){ return (a.ts || 0) - (c.ts || 0); }).forEach(function(c){ l.push({ cle:k, c:c }); });
      }
    });
    return l;
  }

  function moisAvecArticle(label){
    // « Charges d’octobre 2026 », « Charges de novembre 2026 »
    var m = label.charAt(0).toLowerCase() + label.slice(1);
    return /^[aeiouyàâéèêëîïôöûü]/i.test(m) ? "d’" + m : "de " + m;
  }

    var payes = liste.filter(function(x){ return x.c.rubriqueId === "cotisation"; });
    var dernier = payes.length ? payes[payes.length - 1].cle : null;
    if(off === 0 && cfg.cotisationHabituelle > 0){
      var ech = derniereEcheanceLoyer();
      var avantInstallation = !!(ech && state.meta.creation && ech < state.meta.creation);
      if(ech && !avantInstallation && !loyerNoteDepuis(ech)) return "À payer le " + formatDateCourte(ech);

  var JOURS_COURTS = ["Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam.", "Dim."];

  function barreHabitude(pct){
    var p = Math.max(0, Math.min(100, Math.round(pct)));

  }

  function renderHabitudes(){
    var mode = ui.habMode === "mois" ? "mois" : "semaine";

    // 1. Recette par jour de la semaine
    var parJour = [0, 0, 0, 0, 0, 0, 0];

    Object.keys(state.jours).forEach(function(k){
      if(k < sk || k > ek) return;
      var j = state.jours[k];
      var d = parseDateKey(k);
      parJour[(d.getDay() + 6) % 7] += j.recette;

    // 3. Charges par rubrique en %
    html += '<div class="section-title">Charges par rubrique</div>';

    if(!ids.length){
      html += '<div class="card"><div class="empty-note">Aucune charge sur cette période.</div></div>';

      html += '<div class="card hab-carte">';

      // 4. Les 5 plus grosses charges
      var grosses = chargesDePlage(sk, ek).sort(function(x, y){ return y.c.montant - x.c.montant || (x.cle < y.cle ? 1 : x.cle > y.cle ? -1 : 0); }).slice(0, MC_NB_CHARGES_PLUS_GROSSES);

                  '<span class="rubrique-stat-montant">' + formatFCFA(x.c.montant) + '</span>' +
                "</div>";

      html += "</div>";

      // Sprint 7E : par étiquette (seulement si des charges en portent une)
      var parEtiq = {}, ordreEtiq = [];
      chargesDePlage(sk, ek).forEach(function(x){
        if(!x.c.etiquette) return;

                    '<span class="charge-icon" style="background:' + couleur + '22;color:' + couleur + ';">' + icone + "</span>" +
