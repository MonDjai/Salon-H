<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>MonDjai/Salon H</title>
<meta name="description" content="Le carnet de recettes et de charges du coiffeur, en quelques secondes entre deux clients.">
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Salon H">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salon H">
<style>
  :root{
    --bg:#11141a;
    --bg-card:#1a1f29;
    --bg-card-2:#20263380;
    --bg-input:#141924;
    --text:#f5f6f8;
    --text-dim:#b7bfcc;
    --text-dim-2:#6b7385;
    --accent:#f5a623;
    --accent-dark:#c9840f;
    --accent-ink:#241a06;
    --success:#34b37e;
    --danger:#ff6b5e;
    --border:#2a3040;
    --radius:18px;
    --radius-sm:12px;
  }
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 172px) 16px;
    position:relative;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;color:inherit;}
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(145deg,var(--accent),var(--accent-dark));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:var(--accent-ink);
    flex:none;
  }
  .brand-name{font-size:16px;font-weight:700;letter-spacing:.2px;}
  .brand-sub{font-size:12px;color:var(--text-dim);margin-top:1px;}

  .card{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }
  .muted{color:var(--text-dim);font-size:13px;line-height:1.5;}
  .title-lg{font-size:22px;font-weight:800;margin-bottom:6px;}
  .title-md{font-size:17px;font-weight:700;margin-bottom:4px;}
  .step-label{
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin-bottom:8px;
  }

  .choice-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .choice{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--bg-input);
    border:2px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    width:100%;
  }
  .choice.selected{
    border-color:var(--accent);
    background:linear-gradient(0deg,#20180a,#20180a),var(--bg-input);
  }
  .choice-dot{
    width:20px;height:20px;border-radius:50%;
    border:2px solid var(--text-dim-2);
    flex:none;margin-top:2px;
    display:flex;align-items:center;justify-content:center;
  }
  .choice.selected .choice-dot{border-color:var(--accent);}
  .choice.selected .choice-dot::after{
    content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);
  }
  .choice-txt strong{display:block;font-size:15px;margin-bottom:2px;}
  .choice-txt span{font-size:13px;color:var(--text-dim);}

  .field{margin-top:14px;}
  .field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .field input[type=text],
  .field input[type=tel],
  .field input[type=number]{
    width:100%;
    background:var(--bg-input);
    border:2px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px;
    font-size:17px;
    color:var(--text);
    outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  .amount-field{position:relative;}
  .amount-field input{padding-right:44px !important;font-weight:700;font-size:20px !important;}
  .amount-suffix{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    color:var(--text-dim);font-weight:700;font-size:15px;
    pointer-events:none;
  }

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;
    border:none;
    border-radius:var(--radius-sm);
    padding:15px 18px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.4;}
  .btn-secondary{background:var(--bg-input);color:var(--text);border:1px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--text-dim);}
  .btn-danger-outline{background:transparent;color:var(--danger);border:1px solid #4a2b28;}
  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .btn-row .btn{flex:1;}

  .rubrique-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
  }
  .rubrique-item{
    position:relative;
    background:var(--bg-input);
    border:2px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px 8px 10px 8px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;
    color:var(--text);
    text-align:center;
  }
  .rubrique-item.selected{border-color:var(--accent);}
  .rubrique-icon{
    width:40px;height:40px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .rubrique-nom{font-size:11.5px;line-height:1.25;color:var(--text-dim);}
  .rubrique-item.selected .rubrique-nom{color:var(--text);}
  .rubrique-check{
    position:absolute;top:6px;right:6px;
    width:18px;height:18px;border-radius:50%;
    border:2px solid var(--text-dim-2);
    background:var(--bg-input);
  }
  .rubrique-item.selected .rubrique-check{
    border-color:var(--accent);background:var(--accent);
  }
  .rubrique-item.selected .rubrique-check::after{
    content:"✓";display:block;font-size:11px;line-height:14px;color:var(--accent-ink);font-weight:900;
  }
  .rubrique-item.perso-tag::before{
    content:"perso";
    position:absolute;top:-7px;left:8px;
    background:var(--accent-dark);
    color:#fff;
    font-size:8.5px;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:2px 6px;
    border-radius:20px;
  }

  .soft-msg{
    margin-top:12px;
    background:#241d0e;
    border:1px solid #4a3a12;
    color:#e8c77a;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    line-height:1.4;
  }

  .add-rubrique-btn{
    margin-top:14px;
    width:100%;
    border:2px dashed var(--border);
    background:transparent;
    color:var(--text-dim);
    border-radius:var(--radius-sm);
    padding:13px;
    font-size:14px;
    font-weight:600;
  }

  .custom-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .emoji-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .emoji-choice{
    width:42px;height:42px;border-radius:11px;
    background:var(--bg-input);border:2px solid var(--border);
    font-size:19px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text);
  }
  .emoji-choice.selected{border-color:var(--accent);}
  .color-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center;}
  .color-choice{
    width:30px;height:30px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .color-choice.selected{border-color:#fff;}

  /* Ecran du jour */
  .solde-card{
    text-align:center;
    padding:26px 18px 22px 18px;
  }
  .solde-label{font-size:13px;color:var(--text-dim);font-weight:600;margin-bottom:8px;}
  .solde-value{
    font-size:clamp(2.1rem,10vw,2.7rem);
    font-weight:800;
    line-height:1.1;
    word-break:break-word;
  }
  .solde-value.positif{color:var(--success);}
  .solde-value.perte{color:var(--danger);}
  .stat-row{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .stat-box{
    flex:1;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:12px;
    text-align:center;
  }
  .stat-box .stat-num{font-size:17px;font-weight:800;}
  .stat-box .stat-label{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .client-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;
    background:linear-gradient(145deg,var(--accent),var(--accent-dark));
    color:var(--accent-ink);
    border:none;
    border-radius:var(--radius);
    padding:18px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    margin-bottom:14px;
  }
  .client-btn .plus-circle{
    width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:900;
  }

  .section-title{
    font-size:13px;font-weight:700;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.05em;
    margin:4px 0 10px 2px;
  }
  .charge-list{display:flex;flex-direction:column;gap:8px;}
  .charge-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:11px 13px;
  }
  .charge-icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;flex:none;
  }
  .charge-info{flex:1;min-width:0;}
  .charge-nom{font-size:14px;font-weight:600;}
  .charge-heure{font-size:11.5px;color:var(--text-dim);}
  .charge-montant{font-size:15px;font-weight:700;color:var(--danger);white-space:nowrap;}
  .empty-note{
    color:var(--text-dim-2);
    font-size:13px;
    text-align:center;
    padding:18px 10px;
  }

  .fab{
    position:fixed;
    right:calc(50% - 240px + 18px);
    bottom:calc(env(safe-area-inset-bottom) + 96px);
    width:60px;height:60px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    font-size:28px;
    font-weight:800;
    box-shadow:0 6px 18px rgba(245,166,35,.35);
    cursor:pointer;
    z-index:20;
  }
  @media (max-width:516px){
    .fab{right:22px;}
  }

  /* Modales */
  .overlay{
    position:fixed;inset:0;
    background:rgba(6,7,10,.68);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--bg-card);
    border-radius:22px 22px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 20px) 18px;
    max-height:88vh;
    overflow-y:auto;
    border-top:1px solid var(--border);
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{
    from{transform:translateY(24px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .sheet-title{font-size:16px;font-weight:800;}
  .sheet-close{
    background:var(--bg-input);
    border:none;color:var(--text-dim);
    width:32px;height:32px;border-radius:50%;
    font-size:16px;cursor:pointer;
  }
  .modal-rubrique-grid{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:10px;
  }
  .modal-rubrique-item{
    background:var(--bg-input);
    border:2px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 4px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    cursor:pointer;color:var(--text);
  }
  .modal-rubrique-icon{
    width:36px;height:36px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .modal-rubrique-nom{font-size:10px;text-align:center;color:var(--text-dim);line-height:1.2;}
  .selected-rubrique-preview{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    margin-bottom:14px;
  }
  .selected-rubrique-preview .charge-icon{width:34px;height:34px;font-size:16px;}
  .back-link{
    background:none;border:none;color:var(--text-dim);
    font-size:13px;padding:0 0 12px 0;cursor:pointer;
    display:flex;align-items:center;gap:4px;
  }

  /* Navigation basse */
  .navbar{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:100%;
    max-width:480px;
    display:flex;
    background:var(--bg-card);
    border-top:1px solid var(--border);
    padding:8px 6px calc(env(safe-area-inset-bottom) + 8px) 6px;
    z-index:15;
  }
  .navbtn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:transparent;border:none;color:var(--text-dim);
    padding:6px 2px;border-radius:12px;cursor:pointer;
  }
  .navbtn.active{color:var(--accent);}
  .navicon{font-size:19px;position:relative;display:inline-block;}
  .navlabel{font-size:10px;font-weight:700;}
  .navdot{
    position:absolute;top:-2px;right:-7px;
    width:8px;height:8px;border-radius:50%;
    background:var(--danger);
    border:1.5px solid var(--bg-card);
  }

  /* Badge créances sur le tableau de bord */
  .badge-chip{
    display:inline-flex;align-items:center;gap:7px;
    background:#2a1f0e;border:none;color:#f0c775;
    font-size:12.5px;font-weight:700;
    padding:9px 14px;border-radius:999px;
    margin-top:14px;
    cursor:pointer;
  }
  .badge-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none;}

  /* Créances */
  .creance-list{display:flex;flex-direction:column;gap:8px;}
  .creance-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:12px 13px;
  }
  .creance-info{flex:1;min-width:0;}
  .creance-nom{font-size:14.5px;font-weight:700;}
  .creance-date{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
  .creance-montant{font-size:15px;font-weight:800;color:var(--accent);white-space:nowrap;margin-right:2px;}
  .creance-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none;}
  .btn-sm{
    border:none;border-radius:9px;
    padding:7px 11px;font-size:11.5px;font-weight:700;cursor:pointer;
    white-space:nowrap;
  }
  .btn-sm-payer{background:var(--success);color:#08241a;}
  .btn-sm-annuler{background:transparent;color:var(--text-dim-2);border:1px solid var(--border);}
  .creance-row.payee{opacity:.65;}
  .creance-row.payee .creance-montant{color:var(--success);}
  .creance-tag-payee{
    font-size:10.5px;font-weight:800;color:var(--success);
    background:#0f2a20;padding:3px 8px;border-radius:999px;
  }

  /* Mon état */
  .etat-tabs{display:flex;gap:8px;margin-bottom:14px;}
  .etat-tab{
    flex:1;background:var(--bg-input);border:2px solid var(--border);
    color:var(--text-dim);border-radius:var(--radius-sm);
    padding:10px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .etat-tab.active{border-color:var(--accent);color:var(--text);}
  .etat-period-nav{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;margin-bottom:14px;
  }
  .etat-period-nav button{
    background:var(--bg-input);border:1px solid var(--border);color:var(--text);
    width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;flex:none;
  }
  .etat-period-nav button:disabled{opacity:.3;cursor:default;}
  .etat-period-label{font-size:14px;font-weight:700;text-align:center;flex:1;}
  .etat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .etat-stat{background:var(--bg-input);border-radius:var(--radius-sm);padding:14px 12px;}
  .etat-stat .num{font-size:18px;font-weight:800;}
  .etat-stat .num.positif{color:var(--success);}
  .etat-stat .num.perte{color:var(--danger);}
  .etat-stat .label{font-size:11px;color:var(--text-dim);margin-top:3px;}
  .rubrique-stat-row{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-input);border-radius:var(--radius-sm);
    padding:10px 13px;
  }
  .rubrique-stat-row .charge-icon{width:32px;height:32px;font-size:15px;flex:none;}
  .rubrique-stat-nom{flex:1;font-size:13.5px;min-width:0;}
  .rubrique-stat-montant{font-size:14px;font-weight:700;color:var(--danger);white-space:nowrap;}

  /* Historique */
  .hist-list{display:flex;flex-direction:column;gap:8px;}
  .hist-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--bg-input);border-radius:var(--radius-sm);
    padding:13px;cursor:pointer;color:var(--text);border:none;width:100%;text-align:left;
  }
  .hist-date{font-size:14px;font-weight:700;}
  .hist-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .hist-solde{font-size:15px;font-weight:800;white-space:nowrap;}
  .hist-solde.positif{color:var(--success);}
  .hist-solde.perte{color:var(--danger);}
  .readonly-tag{
    display:inline-block;background:var(--bg-input);color:var(--text-dim);
    font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;
    margin-bottom:14px;
  }

  /* En-tête : accès Mes données (F10) */
  .brand-info{flex:1;min-width:0;}
  .brand-action{
    flex:none;
    width:36px;height:36px;border-radius:50%;
    background:var(--bg-card);border:1px solid var(--border);
    color:var(--text-dim);font-size:15px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }

  /* Rappel doux de sauvegarde */
  .rappel-sauvegarde{margin-bottom:14px;}

  /* Mes données (F10) */
  .backup-info{
    margin-top:12px;
    background:var(--bg-input);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    font-size:13px;
    color:var(--text-dim);
  }
  .backup-info strong{color:var(--text);}
  input[type=file]{width:0.1px;height:0.1px;opacity:0;overflow:hidden;position:absolute;}

  /* Jauge de progression (F8) */
  .jauge-track{
    height:10px;border-radius:999px;
    background:var(--bg-input);overflow:hidden;
  }
  .jauge-fill{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent-dark),var(--accent));
  }
  .jauge-label{font-size:12px;color:var(--text-dim);margin-top:7px;}
  .jauge-wrap{margin-top:14px;}

  /* Tableau de bord : mini-jauge de l'objectif actif */
  .objectif-mini{
    display:block;width:100%;text-align:left;
    font:inherit;color:var(--text);cursor:pointer;
  }
  .objectif-mini-head{
    display:flex;align-items:center;gap:9px;
    margin-bottom:9px;
  }
  .objectif-mini-nom{flex:1;font-size:13.5px;font-weight:700;min-width:0;}
  .objectif-mini-pct{font-size:13px;font-weight:800;color:var(--accent);}
  .modele-icon-sm{font-size:18px;flex:none;}

  /* Mon objectif : modèles */
  .modele-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .modele-card{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--bg-input);border:2px solid var(--border);
    border-radius:var(--radius-sm);padding:14px;
    cursor:pointer;text-align:left;color:var(--text);width:100%;
  }
  .modele-icon{
    width:38px;height:38px;border-radius:11px;flex:none;

  /* Mon objectif : scénarios */

  .pin-screen{

  /* Réglages (F11) */
  .settings-section-title{

  .settings-row{

  .settings-pill{
    border:none;border-radius:999px;padding:7px 14px;

  .settings-pill.on{background:var(--success);color:#08241a;}
  .settings-pill.off{background:var(--bg-input);color:var(--text-dim);border:1px solid var(--border);}
  .settings-link-row{

  /* Partager (F9) */
  .partage-preview-wrap{
    display:flex;justify-content:center;margin:6px 0 16px 0;
  }
  .partage-canvas{
    width:100%;max-width:340px;border-radius:var(--radius);

  /* À propos */
  .about-mark{
    width:56px;height:56px;border-radius:16px;margin:6px auto 14px auto;
    background:linear-gradient(145deg,var(--accent),var(--accent-dark));

  .about-mission{
    font-size:16px;font-weight:700;line-height:1.5;text-align:center;
    margin-bottom:10px;

    text-align:center;color:var(--accent);font-weight:700;font-size:13.5px;

  /* ===== Sprint 5 (V1.1) ===== */
  .btn:disabled{opacity:.4;pointer-events:none;}
  /* Code d'accès */
  .code-screen{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center;gap:8px;}

  .code-input{width:100%;background:#1c1609;border:2px solid var(--accent);border-radius:var(--radius-sm);padding:16px;font-size:22px;font-weight:800;letter-spacing:.2em;text-align:center;text-transform:uppercase;color:var(--text);outline:none;}

  /* Carte d'installation */
  .install-card{display:flex;align-items:center;gap:12px;background:#1c1609;border:1px solid #4a3a12;border-radius:var(--radius);padding:14px;margin-bottom:14px;}
  .install-ico{font-size:28px;flex:none;}
  .install-txt{flex:1;min-width:0;font-size:13px;color:#e8c77a;line-height:1.4;}
  .install-txt strong{display:block;color:var(--text);font-size:14px;margin-bottom:2px;}

  .install-os{font-size:13px;font-weight:800;color:var(--accent);margin-top:14px;text-transform:uppercase;letter-spacing:.04em;}

  .retro-banner{background:#16233a;border:1px solid #2b4470;color:#a9c4f5;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}

  /* Disponible */
  .dispo-line{margin-top:12px;font-size:13.5px;color:var(--text-dim);}
  .dispo-line strong{color:var(--text);font-size:15px;}
  .stat-box.clickable{cursor:pointer;border:1px solid var(--border);color:var(--text);font:inherit;}
  .stat-box .stat-hint{font-size:10.5px;color:var(--accent);margin-top:4px;font-weight:700;}
  /* Montants rapides */
  .quick-row{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px 0;align-items:center;}
  .quick-label{font-size:11.5px;color:var(--text-dim);width:100%;}
  .quick-chip{background:var(--bg-input);border:1px solid #4a3a12;color:var(--accent);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer;}
  /* Liste des clients du jour */
  .client-row{display:flex;align-items:center;gap:12px;background:var(--bg-input);border-radius:var(--radius-sm);padding:11px 13px;cursor:pointer;width:100%;border:none;text-align:left;}
  .client-row .client-num{width:30px;height:30px;border-radius:9px;background:#2a1f0e;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:none;}
  .client-row .client-info{flex:1;min-width:0;font-size:13px;color:var(--text-dim);}
  .client-row .client-montant{font-size:15px;font-weight:800;color:var(--success);}
  .auto-tag{font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-ink);padding:2px 7px;border-radius:999px;margin-left:6px;}
  /* Mon état : listes cliquables */
  .hist-row.futur{opacity:.35;cursor:default;}
  .hist-row.vide .hist-solde{color:var(--text-dim-2);}
  .hist-chevron{color:var(--text-dim-2);margin-left:6px;}
  .etat-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  /* Toast */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 170px);background:#0f2a20;border:1px solid #1d4a34;color:#7fe0b4;padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:80;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .switch{width:50px;height:30px;border-radius:999px;border:none;background:var(--bg-input);position:relative;cursor:pointer;flex:none;border:1px solid var(--border);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--text-dim-2);transition:left .15s;}
  .switch.on{background:var(--success);border-color:var(--success);}
  .switch.on::after{left:23px;background:#fff;}
</style>

<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "salonh_state_v1";

  var RUBRIQUES_PRECONFIGUREES = [
    { id:"cotisation",   nom:"Cotisation / loyer de place",              icone:"🔑", couleur:"#f5a623", defautLocataire:true },
    { id:"consommables", nom:"Produits consommables (gel, mousse, lotion)", icone:"🧴", couleur:"#34b37e", defaut:true },
    { id:"entretien",    nom:"Entretien matériel (tondeuse, rasoir, ciseaux)", icone:"🔧", couleur:"#5b8def", defaut:true },
    { id:"electricite",  nom:"Électricité",                              icone:"💡", couleur:"#e8c94a", defaut:false },
    { id:"transport",    nom:"Transport (prestations à domicile)",       icone:"🛵", couleur:"#4fd1c5", defaut:false }
  ];

  var EMOJI_SUGGESTIONS = ["💈","✂️","🪒","🧢","🧼","🚿","📦","🧾","🛠️","🧹","🧺","☕"];
  var COULEUR_SUGGESTIONS = ["#f5a623","#34b37e","#5b8def","#e8c94a","#4fd1c5","#ff6b5e","#b478e0","#8a94a6"];

  var MAX_RUBRIQUES_CONSEILLE = 8;

  // Modèles pré-configurés pour « Mon objectif » (F8). Le montant est une
  // suggestion : toujours modifiable par l'utilisateur avant de créer l'objectif.
  var OBJECTIF_MODELES = [
    { id:"tondeuse", nom:"Tondeuse professionnelle", icone:"✂️",
      description:"Une tondeuse de qualité pro, pour couper plus vite et plus net.",
      montantSuggere:45000 },
    { id:"kit_installation", nom:"Kit d’installation indépendant", icone:"🧰",
      description:"Tondeuse, rasoir, ciseaux, cape, miroir : de quoi travailler seul, à domicile ou ailleurs.",
      montantSuggere:150000 },
    { id:"place_fixe", nom:"Place fixe / mini-salon", icone:"🏠",
      description:"De quoi payer l’installation d’une place fixe ou démarrer un petit salon.",
      montantSuggere:500000 }
  ];

  // Scénarios fixes du simulateur « 3 façons d'y arriver » (F8).
  var SCENARIOS_OBJECTIF = [
    { pourcentage:10, nom:"Tranquille" },
    { pourcentage:20, nom:"Équilibré" },
    { pourcentage:30, nom:"Ambitieux" }
  ];

  // Moyenne calculée sur les 4 dernières semaines réellement saisies
  // (semaines avec au moins un jour de données, pas des semaines calendaires vides).
  var NB_SEMAINES_MOYENNE = 4;

  // Rappel doux de sauvegarde (F10) au-delà de ce nombre de jours.
  var RAPPEL_SAUVEGARDE_JOURS = 7;

  // V1.1 (Sprint 5A) : code d'accès commun à la famille MonDjai (comme Trépor et Salon F).
  var CODE_ACCES = "HKETCK";
  var VERSION_APP = "1.1";

  // ---------- Etat ----------

  function defaultState(){
    return {
      version: 1,
      config: {
        statut: null,               // 'salarie' | 'locataire' | 'independant'
        cotisationHabituelle: null,
        rubriques: [],              // {id, nom, icone, couleur, actif, perso}
        onboardingComplete: false,
        pinActif: false,            // F11 : code PIN optionnel à l'ouverture
        pin: null,                  // chaîne de 4 chiffres, ou null
        codeAccesOk: false,         // V1.1 : code d'accès validé une fois (jamais redemandé ensuite)
        cotisationAuto: false       // V1.1 : cotisation ajoutée toute seule au 1er client du jour (locataire)
      },
      jours: {},                    // 'AAAA-MM-JJ' -> { date, origine, recette, clients:[], charges:[], creancesRecouvrees:[] }
      dernierMontant: {},           // { rubriqueId: montant }
      creances: [],                 // [{id, nom, montant, date, statut:'en_cours'|'payee', ts, datePaiement, tsPaiement}]
      objectif: null,               // {id, modele, sousType, nom, montantCible, dateCreation, pourcentage, actif} | null (F8)
      meta: {                       // F10 : suivi de la sauvegarde JSON, pour le rappel doux
        derniereSauvegarde: null,       // 'AAAA-MM-JJ' | null
        dernierRappelSauvegarde: null,  // 'AAAA-MM-JJ' | null
        creation: null,                 // V1.1 : 'AAAA-MM-JJ' du premier lancement
        installCarteMasquee: false      // V1.1 : carte « Installer » repoussée par l'utilisateur
      }
    };
  }

  var state = loadState();
  if(!state.meta.creation){ state.meta.creation = todayKeyBrut(); saveState(); }

  function todayKeyBrut(){
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1) + "-" + (d.getDate() < 10 ? "0" : "") + d.getDate();
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var base = defaultState();
      return {
        version: 1,
        config: Object.assign({}, base.config, parsed.config || {}),
        jours: parsed.jours || {},
        dernierMontant: parsed.dernierMontant || {},
        creances: parsed.creances || [],
        objectif: parsed.objectif || null,
        meta: Object.assign({}, base.meta, parsed.meta || {})
      };
    }catch(e){
      return defaultState();
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      // stockage indisponible : on continue sans bloquer l'utilisateur
    }
  }

  // ---------- Utilitaires ----------

  function pad2(n){ return n < 10 ? "0" + n : "" + n; }

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function todayLabel(){
    var d = new Date();
    try{
      var s = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long" }).format(d);
      return s.charAt(0).toUpperCase() + s.slice(1);
    }catch(e){
      return todayKey();
    }
  }

  function formatFCFA(n){
    var val = Math.round(Number(n) || 0);
    var sign = val < 0 ? "-" : "";
    var abs = Math.abs(val);
    var str = String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return sign + str + " F";
  }

  function uid(prefix){
    return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  }

  // Jour sur lequel porte la saisie de l'écran Aujourd'hui (V1.1 : un jour passé peut être choisi).
  function jourSaisieKey(){
    return ui.jourSelection || todayKey();
  }

  function ensureJour(cle){
    var key = cle || jourSaisieKey();
    if(!state.jours[key]){
      state.jours[key] = {
        date: key,
        origine: "salon-h",
        recette: 0,
        clients: [],
        charges: [],
        creancesRecouvrees: []
      };
      if(key < todayKey()) state.jours[key].saisiApresCoup = true;
    }
    return state.jours[key];
  }

  // Lecture sans création (évite de créer des journées vides en consultant).
  function lireJour(key){
    return state.jours[key] || { date:key, origine:"salon-h", recette:0, clients:[], charges:[], creancesRecouvrees:[] };
  }

  function totalChargesJour(jour){
    return (jour.charges || []).reduce(function(s,c){ return s + c.montant; }, 0);
  }

  // Recette = clients encaissés + créances recouvrées ce jour-là.
  function recalculerRecette(jour){
    var r = (jour.clients || []).reduce(function(s,c){ return s + c.montant; }, 0);
    creancesRecouvreesDe(jour).forEach(function(cr){ r += cr.montant; });
    jour.recette = r;
  }

  // Tri d'affichage (V1.1, repris de Trépor) : cotisation en tête, puis montant décroissant.
  function trierCharges(liste){
    return liste.slice().sort(function(a,b){
      if(a.rubriqueId === "cotisation" && b.rubriqueId !== "cotisation") return -1;
      if(b.rubriqueId === "cotisation" && a.rubriqueId !== "cotisation") return 1;
      return b.montant - a.montant;
    });
  }

  // Montants les plus récemment encaissés (4 max, distincts), pour les boutons rapides.
  function montantsRapides(){
    var tous = [];
    Object.keys(state.jours).forEach(function(k){
      (state.jours[k].clients || []).forEach(function(c){ tous.push(c); });
    });
    tous.sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    var vus = [];
    for(var i=0;i<tous.length && vus.length<4;i++){
      if(tous[i].montant > 0 && vus.indexOf(tous[i].montant) === -1) vus.push(tous[i].montant);
    }
    return vus.sort(function(a,b){ return a - b; });
  }

  // Ajoute un client encaissé sur le jour de saisie (+ cotisation automatique si activée).
  function ajouterClient(montant){
    var jour = ensureJour();
    var premier = jour.clients.length === 0;
    jour.clients.push({ id: uid("client"), montant: montant, ts: Date.now() });
    recalculerRecette(jour);
    var cotisationAjoutee = false;
    if(premier && state.config.cotisationAuto && state.config.statut === "locataire" && state.config.cotisationHabituelle > 0){
      var rub = findRubrique("cotisation");
      var dejaLa = jour.charges.some(function(c){ return c.rubriqueId === "cotisation"; });
      if(rub && rub.actif && !dejaLa){
        jour.charges.push({ id: uid("charge"), rubriqueId:"cotisation", montant: state.config.cotisationHabituelle, ts: Date.now(), auto:true });
        cotisationAjoutee = true;
      }
    }
    saveState();
    return cotisationAjoutee;
  }

  // Part de l'objectif (F8) pour un jour donné — même règle que montantEpargneEstime.
  function epargneDuJour(key){
    var obj = state.objectif;
    if(!obj || key < obj.dateCreation) return 0;
    var j = lireJour(key);
    var solde = j.recette - totalChargesJour(j);
    return solde > 0 ? Math.round(solde * obj.pourcentage / 100) : 0;
  }

  function normaliserCode(s){
    return String(s || "").replace(/\s+/g, "").toUpperCase();
  }

  function estInstallee(){
    try{
      if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return true;
    }catch(e){}
    return !!(window.navigator && window.navigator.standalone);
  }

  // Jours antérieurs au Sprint 2 : le tableau des créances recouvrées n'existe pas encore.
  function creancesRecouvreesDe(jour){
    return (jour && jour.creancesRecouvrees) || [];
  }

  function rubriquesActives(){
    return state.config.rubriques.filter(function(r){ return r.actif; });
  }

  function findRubrique(id){
    for(var i=0;i<state.config.rubriques.length;i++){
      if(state.config.rubriques[i].id === id) return state.config.rubriques[i];
    }
    return null;
  }

  function findChargeDuJour(jour, id){
    for(var i=0;i<jour.charges.length;i++){
      if(jour.charges[i].id === id) return jour.charges[i];
    }
    return null;
  }

  function findCreance(id){
    for(var i=0;i<state.creances.length;i++){
      if(state.creances[i].id === id) return state.creances[i];
    }
    return null;
  }

  function creancesEnCours(){
    return state.creances.filter(function(c){ return c.statut === "en_cours"; });
  }

  function sommeCreancesEnCours(){
    return creancesEnCours().reduce(function(s,c){ return s + c.montant; }, 0);
  }

  // ---------- Dates ----------

  function parseDateKey(key){
    var parts = String(key).split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function dateToKey(d){
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function joursDepuis(key){
    var d = parseDateKey(key);
    var now = new Date();
    var todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((todayMidnight - d) / 86400000);
  }

  function formatDateLabel(key){
    var d = parseDateKey(key);
    try{
      var s = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" }).format(d);
      return s.charAt(0).toUpperCase() + s.slice(1);
    }catch(e){
      return key;
    }
  }

  function formatDateCourte(key){
    var d = parseDateKey(key);
    try{
      return new Intl.DateTimeFormat("fr-FR", { day:"numeric", month:"short" }).format(d);
    }catch(e){
      return key;
    }
  }

  function lundiDeLaSemaine(d){
    var day = d.getDay(); // 0=dimanche .. 6=samedi
    var diff = (day === 0 ? -6 : 1 - day);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  }

  function bornesPeriode(mode, offset){
    var today = new Date();
    if(mode === "jour"){
      var dj = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset);
      return { debut: dj, fin: dj };
    }
    if(mode === "mois"){
      var refMois = new Date(today.getFullYear(), today.getMonth() + offset, 1);
      var debut = new Date(refMois.getFullYear(), refMois.getMonth(), 1);
      var fin = new Date(refMois.getFullYear(), refMois.getMonth() + 1, 0);
      return { debut: debut, fin: fin };
    }
    var refSemaine = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset * 7);
    var lundi = lundiDeLaSemaine(refSemaine);
    var dimanche = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
    return { debut: lundi, fin: dimanche };
  }

  function labelPeriode(mode, offset){
    var b = bornesPeriode(mode, offset);
    if(mode === "jour"){
      if(offset === 0) return "Aujourd’hui · " + formatDateCourte(dateToKey(b.debut));
      if(offset === -1) return "Hier · " + formatDateCourte(dateToKey(b.debut));
      return formatDateLabel(dateToKey(b.debut));
    }
    if(mode === "mois"){
      try{
        var s = new Intl.DateTimeFormat("fr-FR", { month:"long", year:"numeric" }).format(b.debut);
        return s.charAt(0).toUpperCase() + s.slice(1);
      }catch(e){
        return dateToKey(b.debut).slice(0,7);
      }
    }
    return "Semaine du " + formatDateCourte(dateToKey(b.debut)) + " au " + formatDateCourte(dateToKey(b.fin));
  }

  function calculerEtat(mode, offset){
    var b = bornesPeriode(mode, offset);
    return calculerPlage(dateToKey(b.debut), dateToKey(b.fin));
  }

  function calculerPlage(startKey, endKey){
    var nbClients = 0;
    var recetteClients = 0;
    var nbJoursTravailles = 0;
    var recetteTotale = 0;
    var chargesTotal = 0;
    var chargesParRubrique = {};
    var creancesRecouvreesTotal = 0;

    Object.keys(state.jours).forEach(function(k){
      if(k >= startKey && k <= endKey){
        var j = state.jours[k];
        nbClients += j.clients.length;
        recetteTotale += j.recette;
        j.clients.forEach(function(c){ recetteClients += c.montant; });
        if(jourADesDonnees(j)) nbJoursTravailles += 1;
        j.charges.forEach(function(c){
          chargesTotal += c.montant;
          chargesParRubrique[c.rubriqueId] = (chargesParRubrique[c.rubriqueId] || 0) + c.montant;
        });
        creancesRecouvreesDe(j).forEach(function(cr){
          creancesRecouvreesTotal += cr.montant;
        });
      }
    });

    var creancesEnCoursTotal = 0;
    state.creances.forEach(function(c){
      if(c.date >= startKey && c.date <= endKey && c.statut === "en_cours"){
        creancesEnCoursTotal += c.montant;
      }
    });

    return {
      startKey: startKey,
      endKey: endKey,
      nbClients: nbClients,
      recetteTotale: recetteTotale,
      chargesTotal: chargesTotal,
      chargesParRubrique: chargesParRubrique,
      soldeNetCumule: recetteTotale - chargesTotal,
      creancesEnCoursTotal: creancesEnCoursTotal,
      creancesRecouvreesTotal: creancesRecouvreesTotal,
      nbJoursTravailles: nbJoursTravailles,
      ticketMoyen: nbClients > 0 ? Math.round(recetteClients / nbClients) : 0,
      moyenneJour: nbJoursTravailles > 0 ? Math.round((recetteTotale - chargesTotal) / nbJoursTravailles) : 0
    };
  }

  // Première date avec des données (borne la navigation « ‹ » de Mon état et Partager).
  function premiereDateDonnees(){
    var cles = Object.keys(state.jours).filter(function(k){ return jourADesDonnees(state.jours[k]); }).sort();
    return cles.length ? cles[0] : null;
  }

  function precedentPossible(mode, offset){
    var premiere = premiereDateDonnees();
    if(!premiere) return false;
    var b = bornesPeriode(mode, offset);
    return dateToKey(b.debut) > premiere;
  }

  // ---------- Mon objectif (F8) ----------

  function trouverModeleObjectif(id){
    for(var i=0;i<OBJECTIF_MODELES.length;i++){
      if(OBJECTIF_MODELES[i].id === id) return OBJECTIF_MODELES[i];
    }
    return null;
  }

  function jourADesDonnees(jour){
    return !!jour && (jour.recette > 0 || (jour.charges && jour.charges.length > 0));
  }

  // Cherche, en remontant semaine par semaine, les dernières semaines qui
  // contiennent réellement au moins un jour saisi (pas des semaines calendaires vides).
  function semainesRecentesAvecDonnees(limite){
    var resultats = [];
    var offset = 0;
    var essais = 0;
    while(resultats.length < limite && essais < 52){
      var b = bornesPeriode("semaine", offset);
      var startKey = dateToKey(b.debut);
      var endKey = dateToKey(b.fin);
      var aDesDonnees = Object.keys(state.jours).some(function(k){
        return k >= startKey && k <= endKey && jourADesDonnees(state.jours[k]);
      });
      if(aDesDonnees) resultats.push(offset);
      offset -= 1;
      essais += 1;
    }
    return resultats;
  }

  // Solde net moyen réel par semaine, sur les dernières semaines saisies.
  // Retourne null si aucune donnée n'est encore disponible.
  function soldeNetMoyenHebdo(){
    var semaines = semainesRecentesAvecDonnees(NB_SEMAINES_MOYENNE);
    if(semaines.length === 0) return null;
    var total = 0;
    semaines.forEach(function(offset){
      total += calculerEtat("semaine", offset).soldeNetCumule;
    });
    return total / semaines.length;
  }

  // Montant estimé mis de côté pour l'objectif actif depuis sa création :
  // le pourcentage choisi appliqué au solde net réel de chaque jour positif.
  function montantEpargneEstime(obj){
    if(!obj) return 0;
    var total = 0;
    Object.keys(state.jours).forEach(function(k){
      if(k >= obj.dateCreation){
        var j = state.jours[k];
        var totalCharges = j.charges.reduce(function(s,c){ return s + c.montant; }, 0);
        var soldeJour = j.recette - totalCharges;
        if(soldeJour > 0){
          total += soldeJour * (obj.pourcentage / 100);
        }
      }
    });
    return Math.round(total);
  }

  function calculerScenarios(montantCible, montantDejaEpargne, soldeHebdoMoyen){
    var montantRestant = Math.max(0, montantCible - montantDejaEpargne);
    return SCENARIOS_OBJECTIF.map(function(sc){
      var montantParSemaine = soldeHebdoMoyen > 0 ? Math.round(soldeHebdoMoyen * sc.pourcentage / 100) : 0;
      var semaines = montantParSemaine > 0 ? Math.ceil(montantRestant / montantParSemaine) : null;
      return {
        pourcentage: sc.pourcentage,
        nom: sc.nom,
        montantParSemaine: montantParSemaine,
        semaines: semaines
      };
    });
  }

  function formatDuree(semaines){
    if(semaines == null) return "durée non estimable pour l’instant";
    if(semaines <= 0) return "objectif atteint";
    if(semaines === 1) return "1 semaine";
    if(semaines < 9) return semaines + " semaines";
    var mois = Math.round(semaines / 4.345);
    if(mois < 1) mois = 1;
    if(mois < 24) return "environ " + mois + " mois";
    var ans = Math.round(mois / 12);
    return "environ " + ans + (ans > 1 ? " ans" : " an");
  }

  // V1.1 (repris de MonDjai/Coiffure) : choix du dossier quand le navigateur le permet,
  // sinon téléchargement classique. Une annulation volontaire ne déclenche rien.
  function sauvegarderAvecChoixDossier(){
    var nom = "mondjai-salonh-sauvegarde-" + todayKey() + ".json";
    if(typeof window.showSaveFilePicker === "function"){
      var donnees = JSON.stringify(state, null, 2);
      window.showSaveFilePicker({
        suggestedName: nom,
        types: [{ description: "Sauvegarde MonDjai/Salon H", accept: { "application/json": [".json"] } }]
      }).then(function(handle){
        return handle.createWritable().then(function(w){
          return w.write(donnees).then(function(){ return w.close(); });
        });
      }).then(function(){
        marquerSauvegardeFaite();
        afficherToast("Sauvegarde enregistrée.");
      }).catch(function(err){
        if(err && err.name === "AbortError") return;
        if(telechargerSauvegarde()) afficherToast("Sauvegarde téléchargée.");
      });
      return;
    }
    if(telechargerSauvegarde()) afficherToast("Sauvegarde téléchargée.");
  }

  function telechargerSauvegarde(){
    try{
      var donnees = JSON.stringify(state, null, 2);
      var blob = new Blob([donnees], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "mondjai-salonh-sauvegarde-" + todayKey() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      marquerSauvegardeFaite();
      return true;
    }catch(e){
      return false;
    }
  }

  function stateDepuisImport(parsed){
    var base = defaultState();
    if(!parsed || typeof parsed !== "object") return null;
    return {
      version: 1,
      config: Object.assign({}, base.config, parsed.config || {}),
      jours: (parsed.jours && typeof parsed.jours === "object") ? parsed.jours : {},
      dernierMontant: parsed.dernierMontant || {},
      creances: Array.isArray(parsed.creances) ? parsed.creances : [],
      objectif: parsed.objectif || null,
      meta: Object.assign({}, base.meta, parsed.meta || {})
    };
  }

  function rappelSauvegardeActif(){
    if(Object.keys(state.jours).length === 0) return false;
    var derniere = state.meta.derniereSauvegarde;
    var dernierRappel = state.meta.dernierRappelSauvegarde;
    // V1.1 : pas de rappel pendant la première semaine d'utilisation.
    var joursSansSauvegarde = derniere ? joursDepuis(derniere) : (state.meta.creation ? joursDepuis(state.meta.creation) : 9999);
    if(joursSansSauvegarde < RAPPEL_SAUVEGARDE_JOURS) return false;
    if(dernierRappel && joursDepuis(dernierRappel) < RAPPEL_SAUVEGARDE_JOURS) return false;
    return true;
  }

  // ---------- Bouton retour du téléphone (V1.1, repris de Trépor Sprint 5A) ----------
  // Une seule entrée d'historique armée à la fois : le retour ferme la couche la plus
  // profonde (fenêtre → écran secondaire → sous-étape → onglet), jamais l'application
  // tant qu'on n'est pas revenu sur « Aujourd'hui ».

  var historiqueArme = false;
  var ignorerProchainPop = false;

  function porteEntreeActive(){
    return !state.config.codeAccesOk || ui.verrouille || !state.config.onboardingComplete;
  }

  function uiProfonde(){
    if(porteEntreeActive()) return false;
    if(ui.modal) return true;
    if(ui.page && ui.page !== "jour") return true;
    if(ui.jourSelection) return true;
    return false;
  }

  function syncHistorique(){
    if(!window.history || !history.pushState) return;
    var profonde = uiProfonde();
    if(profonde && !historiqueArme){
      try{ history.pushState({ salonh:1 }, ""); historiqueArme = true; }catch(e){}
    }else if(!profonde && historiqueArme){
      historiqueArme = false;
      ignorerProchainPop = true;
      try{ history.back(); }catch(e){ ignorerProchainPop = false; }
    }
  }

  function retourArriere(){
    if(ui.modal){
      if(ui.modal === "client-edit"){ ui.modal = "clients-jour"; }
      else { ui.modal = null; ui.chargeRubriqueId = null; ui.chargeEditId = null; }
      return;
    }
    if(ui.page === "reglages"){
      if(ui.ajoutRubriquePerso){ ui.ajoutRubriquePerso = false; return; }
      if(ui.reglagesPinEtape){ ui.reglagesPinEtape = null; ui.pinSaisie = ""; return; }
      ui.page = ui.pagePrecedente || "jour"; return;
    }
    if(ui.page === "apropos"){ ui.page = "reglages"; return; }
    if(ui.page === "partager"){ ui.page = ui.pagePrecedente || "jour"; return; }
    if(ui.page === "jour-detail"){ ui.page = ui.jourDetailRetour || "etat"; ui.historiqueSelection = null; return; }
    if(ui.page === "etat" && ui.etatSemaineOuverte){ ui.etatSemaineOuverte = null; return; }
    if(ui.page === "objectif"){
      if(ui.objectifConfirmationReset){ ui.objectifConfirmationReset = false; return; }
      if(ui.objectifModifierRythme){ ui.objectifModifierRythme = false; return; }
      if(!state.objectif && ui.objectifEtape === "scenarios"){ ui.objectifEtape = "montant"; return; }
      if(!state.objectif && ui.objectifEtape === "montant"){ ui.objectifEtape = "modeles"; ui.objectifModeleChoisi = null; return; }
    }
    if(ui.page && ui.page !== "jour"){ ui.page = "jour"; return; }
    if(ui.jourSelection){ ui.jourSelection = null; return; }
  }

  function renderNavBar(active){

  function renderPinClavier(actionChiffre, actionEffacer){
    var touches = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
    var html = '<div class="pin-keypad">';
    touches.forEach(function(t){
      if(t === ""){

      }else if(t === "⌫"){
        html += '<button type="button" class="pin-key pin-key-effacer" data-action="' + actionEffacer + '">⌫</button>';
      }else{
        html += '<button type="button" class="pin-key" data-action="' + actionChiffre + '" data-chiffre="' + t + '">' + t + '</button>';
      }
    });
    html += "</div>";

  // --- Ecran du jour ---

  function renderJour(){
    var key = jourSaisieKey();
    var estAujourdhui = key === todayKey();
    var jour = lireJour(key);
    var totalCharges = totalChargesJour(jour);
    var solde = jour.recette - totalCharges;
    var enPerte = solde < 0;

    var html = "";
    html += brandHeader(estAujourdhui ? todayLabel() : formatDateLabel(key));

    // Choix du jour de saisie (V1.1 : rattraper un jour oublié, jamais une date future)
    if(estAujourdhui){
      html += '<div class="date-row"><span></span>' +
                '<label class="date-link">🗓️ Saisir un jour passé' +
                  '<input type="date" id="input-jour-saisie" max="' + todayKey() + '" value="' + key + '">' +
                '</label></div>';
    }else{
      html += '<div class="retro-banner"><span>Vous complétez le <strong>' + formatDateLabel(key).replace(/ \d{4}$/, "") + '</strong></span>' +
                '<button type="button" data-action="revenir-aujourdhui">↺ Revenir à aujourd’hui</button></div>';
    }

    if(estAujourdhui) html += renderCarteInstallation();

    if(rappelSauvegardeActif()){
      html += '<div class="soft-msg rappel-sauvegarde">' +
                'Pensez à sauvegarder vos données cette semaine — elles ne vivent que sur ce téléphone.' +
                '<div class="btn-row" style="margin-top:10px;">' +
                  '<button type="button" class="btn-sm btn-sm-payer" data-action="sauvegarder-donnees">Sauvegarder maintenant</button>' +
                  '<button type="button" class="btn-sm btn-sm-annuler" data-action="rappel-plus-tard">Plus tard</button>' +
                "</div>" +
              "</div>";
    }

    html += '<div class="card solde-card">';
    if(enPerte){
      html += '<div class="solde-label">' + (estAujourdhui ? "Aujourd’hui" : "Ce jour-là") + '</div>';
      html += '<div class="solde-value perte">Jour à perte : ' + formatFCFA(Math.abs(solde)) + "</div>";
    }else{
      html += '<div class="solde-label">Solde net du jour</div>';
      html += '<div class="solde-value positif">' + formatFCFA(solde) + "</div>";
    }
    // F4 : Disponible = Solde net − part affectée à l'objectif (affiché seulement si un objectif est actif)
    if(state.objectif && solde > 0 && key >= state.objectif.dateCreation){
      var partObjectif = epargneDuJour(key);
      html += '<div class="dispo-line">Disponible après épargne : <strong>' + formatFCFA(solde - partObjectif) + '</strong><br>' +
                '<span style="font-size:12px;">dont ' + formatFCFA(partObjectif) + ' pour « ' + escapeHtml(state.objectif.nom) + ' »</span></div>';
    }
    html += '<div class="stat-row">';
    html += '<button type="button" class="stat-box clickable" data-action="ouvrir-clients-jour"><div class="stat-num">' + formatFCFA(jour.recette) + '</div><div class="stat-label">Recette (' + jour.clients.length + (jour.clients.length > 1 ? " clients" : " client") + ')</div><div class="stat-hint">Voir / corriger ›</div></button>';
    html += '<div class="stat-box"><div class="stat-num">' + formatFCFA(totalCharges) + '</div><div class="stat-label">Charges (' + jour.charges.length + ")</div></div>";
    html += "</div>";

    var enCours = sommeCreancesEnCours();
    if(enCours > 0){
      var nbEnCours = creancesEnCours().length;
      html += '<button type="button" class="badge-chip" data-action="aller-page" data-page="creances">' +
                '<span class="dot"></span>' +
                nbEnCours + (nbEnCours > 1 ? " créances en cours · " : " créance en cours · ") + formatFCFA(enCours) +
              '</button>';
    }
    html += "</div>";

    if(state.objectif){
      var objDash = state.objectif;
      var epargneDash = montantEpargneEstime(objDash);
      var pctDash = objDash.montantCible > 0 ? Math.min(100, Math.round(epargneDash / objDash.montantCible * 100)) : 0;
      var modeleDash = trouverModeleObjectif(objDash.modele) || { icone:"🎯" };
      html += '<button type="button" class="card objectif-mini" data-action="aller-page" data-page="objectif">' +
                '<div class="objectif-mini-head">' +
                  '<span class="modele-icon-sm">' + modeleDash.icone + '</span>' +
                  '<span class="objectif-mini-nom">' + escapeHtml(objDash.nom) + '</span>' +
                  '<span class="objectif-mini-pct">' + pctDash + '%</span>' +
                '</div>' +
                '<div class="jauge-track"><div class="jauge-fill" style="width:' + pctDash + '%;"></div></div>' +
              '</button>';
    }

    html += '<button type="button" class="client-btn" data-action="ouvrir-client"><span class="plus-circle">+</span> Client encaissé</button>';

    // Montants rapides (V1.1) : un tap = un client encaissé à ce montant
    var rapides = montantsRapides();
    if(rapides.length){
      html += '<div class="quick-row"><span class="quick-label">Montant habituel ? Un tap suffit :</span>';
      rapides.forEach(function(m){
        html += '<button type="button" class="quick-chip" data-action="client-rapide" data-montant="' + m + '">+ ' + formatFCFA(m) + '</button>';
      });
      html += '</div>';
    }

    html += '<div class="section-title">Charges ' + (estAujourdhui ? "du jour" : "de ce jour") + '</div>';
    if(jour.charges.length === 0){
      html += '<div class="card"><div class="empty-note">Aucune charge notée pour l’instant.<br>Utilisez le bouton + en bas de l’écran.</div></div>';
    }else{
      html += '<div class="charge-list">';
      trierCharges(jour.charges).forEach(function(c){
        var r = findRubrique(c.rubriqueId);
        var icone = r ? r.icone : "❓";
        var couleur = r ? r.couleur : "#8a94a6";
        var nom = r ? r.nom : "Rubrique supprimée";
        var heure = formatHeure(c.ts);
        html += '<div class="charge-row" style="cursor:pointer;" data-action="editer-charge" data-id="' + c.id + '">' +
                  '<span class="charge-icon" style="background:' + couleur + '22;color:' + couleur + ';">' + icone + "</span>" +
                  '<span class="charge-info"><span class="charge-nom">' + escapeHtml(nom) + '</span>' + (c.auto ? '<span class="auto-tag">auto</span>' : "") + '<br><span class="charge-heure">' + heure + "</span></span>" +
                  '<span class="charge-montant">-' + formatFCFA(c.montant) + "</span>" +
                "</div>";
      });
      html += "</div>";
      html += '<div class="muted" style="margin-top:8px;">Touchez une charge pour la modifier ou la supprimer.</div>';
    }

    html += '<button type="button" class="fab" data-action="ouvrir-charge-grille" aria-label="Ajouter une charge">+</button>';

    return html;
  }

  function formatHeure(ts){
    try{
      var d = new Date(ts);
      return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }catch(e){
      return "";
    }
  }

  // --- Ecran Mon état ---

  // V1.1 : Mon état regroupe les chiffres ET l'historique (ancien onglet Historique),
  // sur le modèle Trépor Sprint 7B : Jour (‹ › jour par jour), Semaine (→ jours),
  // Mois (→ semaines → jours). La flèche « ‹ » s'arrête à la première journée enregistrée.

  function renderEtat(){
    var mode = ui.etatMode;
    var offset = ui.etatOffset;
    var html = "";
    html += brandHeader("Mon état");

    if(mode === "mois" && ui.etatSemaineOuverte){
      return html + renderEtatSemaineDepuisMois(ui.etatSemaineOuverte);
    }

    html += '<div class="etat-tabs">';
    [["jour","Jour"],["semaine","Semaine"],["mois","Mois"]].forEach(function(m){
      html += '<button type="button" class="etat-tab' + (mode === m[0] ? " active" : "") + '" data-action="etat-mode" data-mode="' + m[0] + '">' + m[1] + '</button>';
    });
    html += "</div>";

    html += '<div class="etat-period-nav">';
    html += '<button type="button" data-action="etat-precedent" aria-label="Période précédente"' + (precedentPossible(mode, offset) ? "" : " disabled") + '>‹</button>';
    html += '<div class="etat-period-label">' + labelPeriode(mode, offset) + '</div>';
    html += '<button type="button" data-action="etat-suivant" aria-label="Période suivante"' + (offset >= 0 ? " disabled" : "") + '>›</button>';
    html += "</div>";

    var b = bornesPeriode(mode, offset);
    var startKey = dateToKey(b.debut), endKey = dateToKey(b.fin);
    var e = calculerPlage(startKey, endKey);

    if(mode === "jour"){
      html += renderResumeJour(startKey, true);
      return html;
    }

    html += renderResumePeriode(e);

    if(mode === "semaine"){
      html += '<div class="section-title" style="margin-top:18px;">Jours de la semaine</div>';
      html += renderListeJours(startKey, endKey);
    }else{
      html += '<div class="section-title" style="margin-top:18px;">Semaines du mois</div>';
      html += renderListeSemaines(b.debut, b.fin);
    }

    html += renderChargesParRubrique(e);

    html += '<div class="section-title" style="margin-top:18px;">Créances</div>';
    html += '<div class="card">';
    html += '<div class="etat-grid">';
    html += '<div class="etat-stat"><div class="num">' + formatFCFA(e.creancesEnCoursTotal) + '</div><div class="label">Nées cette période, en attente</div></div>';
    html += '<div class="etat-stat"><div class="num">' + formatFCFA(e.creancesRecouvreesTotal) + '</div><div class="label">Recouvrées cette période</div></div>';
    html += "</div>";
    html += "</div>";

    return html;
  }

  function renderResumePeriode(e){
    var html = '<div class="card">';
    html += '<div class="etat-grid">';
    html += '<div class="etat-stat"><div class="num">' + e.nbClients + '</div><div class="label">Clients encaissés</div></div>';
    html += '<div class="etat-stat"><div class="num">' + formatFCFA(e.recetteTotale) + '</div><div class="label">Recette totale</div></div>';
    html += '<div class="etat-stat"><div class="num">' + formatFCFA(e.chargesTotal) + '</div><div class="label">Charges totales</div></div>';
    html += '<div class="etat-stat"><div class="num ' + (e.soldeNetCumule < 0 ? "perte" : "positif") + '">' + formatFCFA(e.soldeNetCumule) + '</div><div class="label">Solde net cumulé</div></div>';
    html += '<div class="etat-stat"><div class="num">' + formatFCFA(e.ticketMoyen) + '</div><div class="label">Ticket moyen par client</div></div>';
    html += '<div class="etat-stat"><div class="num">' + formatFCFA(e.moyenneJour) + '</div><div class="label">Solde moyen / jour travaillé (' + e.nbJoursTravailles + ' j)</div></div>';
    html += "</div>";
    html += "</div>";
    return html;
  }

  function renderChargesParRubrique(e){
    var html = '<div class="section-title" style="margin-top:18px;">Charges par rubrique</div>';
    var rubriqueIds = Object.keys(e.chargesParRubrique);
    if(rubriqueIds.length === 0){
      return html + '<div class="card"><div class="empty-note">Aucune charge sur cette période.</div></div>';
    }
    rubriqueIds.sort(function(a,b){
      if(a === "cotisation") return -1;
      if(b === "cotisation") return 1;
      return e.chargesParRubrique[b] - e.chargesParRubrique[a];
    });
    html += '<div class="charge-list">';
    rubriqueIds.forEach(function(rid){
      var r = findRubrique(rid);
      var icone = r ? r.icone : "❓";
      var couleur = r ? r.couleur : "#8a94a6";
      var nom = r ? r.nom : "Rubrique supprimée";
      html += '<div class="rubrique-stat-row">' +
                '<span class="charge-icon" style="background:' + couleur + '22;color:' + couleur + ';">' + icone + "</span>" +
                '<span class="rubrique-stat-nom">' + escapeHtml(nom) + '</span>' +
                '<span class="rubrique-stat-montant">' + formatFCFA(e.chargesParRubrique[rid]) + '</span>' +
              "</div>";
    });
    html += "</div>";
    return html;
  }

  // Liste des jours d'une plage (du plus récent au plus ancien), chacun cliquable vers son détail.
  function renderListeJours(startKey, endKey){
    var today = todayKey();
    var d = parseDateKey(endKey);
    var debut = parseDateKey(startKey);
    var html = '<div class="hist-list">';
    while(d >= debut){
      var k = dateToKey(d);
      var j = state.jours[k];
      var futur = k > today;
      var aDonnees = !!j && (jourADesDonnees(j) || j.clients.length > 0);
      var solde = j ? j.recette - totalChargesJour(j) : 0;
      var sousTitre = futur ? "À venir" : (aDonnees ? j.clients.length + (j.clients.length > 1 ? " clients · " : " client · ") + j.charges.length + (j.charges.length > 1 ? " charges" : " charge") : "Rien d’enregistré");
      html += '<button type="button" class="hist-row' + (futur ? " futur" : "") + (aDonnees ? "" : " vide") + '"' + (futur ? " disabled" : ' data-action="voir-jour-detail" data-key="' + k + '"') + '>' +
                '<span>' +
                  '<span class="hist-date">' + formatDateLabel(k).replace(/ \d{4}$/, "") + (j && j.saisiApresCoup ? '<span class="retro-tag">saisi après coup</span>' : "") + '</span><br>' +
                  '<span class="hist-sub">' + sousTitre + '</span>' +
                '</span>' +
                '<span class="hist-solde ' + (solde < 0 ? "perte" : "positif") + '">' + (aDonnees ? formatFCFA(solde) : "—") + (futur ? "" : '<span class="hist-chevron">›</span>') + '</span>' +
              '</button>';
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    }
    html += "</div>";
    return html;
  }

  // Semaines civiles (lundi → dimanche) qui recoupent le mois, de la plus récente à la plus ancienne.
  function renderListeSemaines(debutMois, finMois){
    var today = todayKey();
    var lundis = [];
    var l = lundiDeLaSemaine(debutMois);
    while(l <= finMois){
      lundis.push(new Date(l.getTime()));
      l = new Date(l.getFullYear(), l.getMonth(), l.getDate() + 7);
    }
    lundis.reverse();
    var html = '<div class="hist-list">';
    lundis.forEach(function(lundi){
      var dim = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
      var sk = dateToKey(lundi), ek = dateToKey(dim);
      var futur = sk > today;
      var e = calculerPlage(sk, ek);
      var aDonnees = e.nbJoursTravailles > 0 || e.nbClients > 0;
      html += '<button type="button" class="hist-row' + (futur ? " futur" : "") + (aDonnees ? "" : " vide") + '"' + (futur ? " disabled" : ' data-action="etat-ouvrir-semaine" data-key="' + sk + '"') + '>' +
                '<span>' +
                  '<span class="hist-date">Du ' + formatDateCourte(sk) + ' au ' + formatDateCourte(ek) + '</span><br>' +
                  '<span class="hist-sub">' + (futur ? "À venir" : (aDonnees ? e.nbClients + (e.nbClients > 1 ? " clients · " : " client · ") + e.nbJoursTravailles + (e.nbJoursTravailles > 1 ? " jours travaillés" : " jour travaillé") : "Rien d’enregistré")) + '</span>' +
                '</span>' +
                '<span class="hist-solde ' + (e.soldeNetCumule < 0 ? "perte" : "positif") + '">' + (aDonnees ? formatFCFA(e.soldeNetCumule) : "—") + (futur ? "" : '<span class="hist-chevron">›</span>') + '</span>' +
              '</button>';
    });
    html += "</div>";
    return html;
  }

  function renderEtatSemaineDepuisMois(lundiKey){
    var lundi = parseDateKey(lundiKey);
    var dim = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
    var sk = lundiKey, ek = dateToKey(dim);
    var e = calculerPlage(sk, ek);
    var html = '<button type="button" class="back-link" data-action="etat-fermer-semaine">‹ Retour aux semaines</button>';
    html += '<div class="etat-period-label" style="margin-bottom:14px;text-align:left;">Semaine du ' + formatDateCourte(sk) + ' au ' + formatDateCourte(ek) + '</div>';
    html += renderResumePeriode(e);
    html += '<div class="section-title" style="margin-top:18px;">Jours de la semaine</div>';
    html += renderListeJours(sk, ek);
    html += renderChargesParRubrique(e);
    return html;
  }

  // Résumé d'une journée, en lecture seule (vue Jour de Mon état et détail d'un jour).
  function renderResumeJour(key, avecLienSaisie){
    var jour = lireJour(key);
    var totalCharges = totalChargesJour(jour);
    var solde = jour.recette - totalCharges;
    var enPerte = solde < 0;
    var recouvrees = creancesRecouvreesDe(jour);
    var html = "";

    html += '<div class="card solde-card">';
    if(enPerte){
      html += '<div class="solde-label">Ce jour-là</div>';
      html += '<div class="solde-value perte">Jour à perte : ' + formatFCFA(Math.abs(solde)) + "</div>";
    }else{
      html += '<div class="solde-label">Solde net du jour</div>';
      html += '<div class="solde-value positif">' + formatFCFA(solde) + "</div>";
    }
    html += '<div class="stat-row">';
    html += '<div class="stat-box"><div class="stat-num">' + formatFCFA(jour.recette) + '</div><div class="stat-label">Recette (' + jour.clients.length + (jour.clients.length > 1 ? " clients" : " client") + ')</div></div>';
    html += '<div class="stat-box"><div class="stat-num">' + formatFCFA(totalCharges) + '</div><div class="stat-label">Charges (' + jour.charges.length + ")</div></div>";
    html += "</div>";
    if(jour.saisiApresCoup){
      html += '<div class="muted" style="margin-top:10px;">Journée saisie après coup.</div>';
    }
    html += "</div>";

    if(avecLienSaisie){
      html += '<button type="button" class="btn btn-secondary" style="margin-bottom:14px;" data-action="completer-jour" data-key="' + key + '">✏️ Compléter ou corriger ce jour</button>';
    }

    html += '<div class="section-title">Charges de la journée</div>';
    if(jour.charges.length === 0){
      html += '<div class="card"><div class="empty-note">Aucune charge ce jour-là.</div></div>';
    }else{
      html += '<div class="charge-list">';
      trierCharges(jour.charges).forEach(function(c){
        var r = findRubrique(c.rubriqueId);
        var icone = r ? r.icone : "❓";
        var couleur = r ? r.couleur : "#8a94a6";
        var nom = r ? r.nom : "Rubrique supprimée";
        html += '<div class="charge-row">' +
                  '<span class="charge-icon" style="background:' + couleur + '22;color:' + couleur + ';">' + icone + "</span>" +
                  '<span class="charge-info"><span class="charge-nom">' + escapeHtml(nom) + '</span><br><span class="charge-heure">' + formatHeure(c.ts) + "</span></span>" +
                  '<span class="charge-montant">-' + formatFCFA(c.montant) + "</span>" +
                "</div>";
      });
      html += "</div>";
    }

    if(recouvrees.length > 0){
      var totalRecouvre = recouvrees.reduce(function(s,r){ return s + r.montant; }, 0);
      html += '<div class="section-title" style="margin-top:18px;">Créances recouvrées ce jour-là (' + formatFCFA(totalRecouvre) + ')</div>';
      html += '<div class="creance-list">';
      recouvrees.forEach(function(cr){
        var creanceOrigine = findCreance(cr.creanceId);
        var nom = creanceOrigine ? creanceOrigine.nom : "Client";
        html += '<div class="creance-row payee">' +
                  '<span class="creance-info"><span class="creance-nom">' + escapeHtml(nom) + '</span></span>' +
                  '<span class="creance-montant">' + formatFCFA(cr.montant) + '</span>' +
                '</div>';
      });
      html += "</div>";
    }
    return html;
  }

  // --- Ecran Mon objectif (F8) ---

  function renderObjectif(){

  function renderObjectifCreation(){
    var etape = ui.objectifEtape;
    var html = "";

    if(etape === "montant" || etape === "scenarios"){
      var modele = trouverModeleObjectif(ui.objectifModeleChoisi);
      if(!modele){
        ui.objectifEtape = "modeles";
        etape = "modeles";
      }
    }

    if(etape === "modeles"){
      html += '<div class="card">';
      html += '<div class="title-md">Choisissez un modèle</div>';
      html += '<div class="muted">Le montant proposé est une suggestion : vous pourrez le changer.</div>';
      html += '<div class="modele-list">';
      OBJECTIF_MODELES.forEach(function(m){
        html += '<button type="button" class="modele-card" data-action="choisir-modele-objectif" data-id="' + m.id + '">' +
                  '<span class="modele-icon">' + m.icone + '</span>' +
                  '<span class="modele-txt">' +
                    '<strong>' + escapeHtml(m.nom) + '</strong>' +
                    '<span>' + escapeHtml(m.description) + '</span>' +
                    '<span class="modele-montant">Suggestion : ' + formatFCFA(m.montantSuggere) + '</span>' +
                  '</span>' +
                "</button>";
      });
      html += "</div></div>";
      return html;
    }

    var modeleChoisi = trouverModeleObjectif(ui.objectifModeleChoisi);

    if(etape === "montant"){
      var montantSaisi = parseMontant(ui.objectifMontantSaisi);
      html += '<button type="button" class="back-link" data-action="objectif-retour-modeles">‹ Changer de modèle</button>';
      html += '<div class="card">';
      html += '<div class="selected-rubrique-preview">' +
                '<span class="charge-icon" style="background:var(--accent-ink);color:var(--accent);">' + modeleChoisi.icone + '</span>' +
                '<strong>' + escapeHtml(modeleChoisi.nom) + '</strong>' +
              '</div>';
      html += '<div class="field" style="margin-top:0;">' +
                '<label>Montant cible</label>' +
                '<div class="amount-field">' +
                  '<input type="tel" inputmode="numeric" id="input-objectif-montant" value="' + escapeHtml(ui.objectifMontantSaisi) + '" autofocus>' +
                  '<span class="amount-suffix">F</span>' +
                "</div>" +
              "</div>";
      html += '<button type="button" class="btn btn-primary" style="margin-top:16px;" data-action="objectif-continuer-montant"' + (montantSaisi > 0 ? "" : " disabled") + '>Voir les 3 façons d’y arriver</button>';
      html += "</div>";
      return html;
    }

    // etape === "scenarios"
    var montantCible = parseMontant(ui.objectifMontantSaisi);
    var soldeHebdo = soldeNetMoyenHebdo();
    var scenarios = calculerScenarios(montantCible, 0, soldeHebdo || 0);

    html += '<button type="button" class="back-link" data-action="objectif-retour-montant">‹ Changer le montant</button>';
    html += '<div class="card">';
    html += '<div class="selected-rubrique-preview">' +
              '<span class="charge-icon" style="background:var(--accent-ink);color:var(--accent);">' + modeleChoisi.icone + '</span>' +
              '<strong>' + escapeHtml(modeleChoisi.nom) + ' · ' + formatFCFA(montantCible) + '</strong>' +
            '</div>';

    if(soldeHebdo === null){
      html += '<div class="soft-msg">Pas encore assez de journées enregistrées pour calculer votre rythme réel. Les 3 scénarios ci-dessous partent de 0 F pour l’instant — ils s’ajusteront tout seuls au fil de vos prochaines journées.</div>';
    }else{
      html += '<div class="muted">D’après votre solde net moyen réel des dernières semaines : <strong>' + formatFCFA(Math.round(soldeHebdo)) + ' / semaine</strong>.</div>';
    }

    html += '<div class="section-title" style="margin-top:16px;">3 façons d’y arriver</div>';
    html += '<div class="scenario-list">';
    scenarios.forEach(function(sc){
      var sel = ui.objectifScenarioChoisi === sc.pourcentage;
      html += '<button type="button" class="scenario-card' + (sel ? " selected" : "") + '" data-action="choisir-scenario-objectif" data-pourcentage="' + sc.pourcentage + '">' +
                '<span class="scenario-head"><strong>' + sc.nom + '</strong><span class="scenario-pct">' + sc.pourcentage + '%</span></span>' +
                '<span class="scenario-detail">' + formatFCFA(sc.montantParSemaine) + ' / semaine · ' + formatDuree(sc.semaines) + '</span>' +
              "</button>";
    });
    html += "</div>";

    html += '<button type="button" class="btn btn-primary" style="margin-top:16px;" data-action="creer-objectif"' + (ui.objectifScenarioChoisi ? "" : " disabled") + '>Créer mon objectif</button>';
    html += "</div>";
    return html;
  }

  function renderObjectifActif(){
    var obj = state.objectif;
    var modele = trouverModeleObjectif(obj.modele) || { icone:"🎯" };
    var epargne = montantEpargneEstime(obj);
    var pct = obj.montantCible > 0 ? Math.min(100, Math.round(epargne / obj.montantCible * 100)) : 0;
    var soldeHebdo = soldeNetMoyenHebdo();
    var montantParSemaine = soldeHebdo > 0 ? Math.round(soldeHebdo * obj.pourcentage / 100) : 0;
    var montantRestant = Math.max(0, obj.montantCible - epargne);
    var semaines = montantParSemaine > 0 ? Math.ceil(montantRestant / montantParSemaine) : null;
    var scenarioActuel = SCENARIOS_OBJECTIF.filter(function(s){ return s.pourcentage === obj.pourcentage; })[0];
    var scenarioNom = scenarioActuel ? scenarioActuel.nom : "";

    var html = "";
    html += '<div class="card">';
    html += '<div class="selected-rubrique-preview">' +
              '<span class="charge-icon" style="background:var(--accent-ink);color:var(--accent);">' + modele.icone + '</span>' +
              '<strong>' + escapeHtml(obj.nom) + '</strong>' +
            '</div>';

    html += '<div class="jauge-wrap">' +
              '<div class="jauge-track"><div class="jauge-fill" style="width:' + pct + '%;"></div></div>' +
              '<div class="jauge-label">' + formatFCFA(epargne) + ' sur ' + formatFCFA(obj.montantCible) + ' (' + pct + '%)</div>' +
            "</div>";

    if(pct >= 100){
      html += '<div class="soft-msg" style="border-color:#1d4a34;background:#0f2a20;color:#7fe0b4;">Objectif atteint ! Bravo — vous pouvez en démarrer un nouveau quand vous voulez.</div>';
    }else{
      html += '<div class="muted" style="margin-top:12px;">Au rythme ' + scenarioNom + ' (' + obj.pourcentage + '%) : ' + formatFCFA(montantParSemaine) + ' / semaine · ' + formatDuree(semaines) + ' estimé.</div>';
    }

    html += '<div class="btn-row" style="margin-top:16px;">';
    html += '<button type="button" class="btn btn-secondary" data-action="objectif-changer-rythme">Changer de rythme</button>';
    html += '<button type="button" class="btn btn-ghost" data-action="objectif-proposer-reset">Recommencer</button>';
    html += "</div>";
    html += "</div>";

    if(ui.objectifModifierRythme){
      var scenariosMaj = calculerScenarios(obj.montantCible, epargne, soldeHebdo || 0);
      html += '<div class="card">';
      html += '<div class="title-md">Changer de rythme</div>';
      html += '<div class="scenario-list">';
      scenariosMaj.forEach(function(sc){
        var sel = obj.pourcentage === sc.pourcentage;
        html += '<button type="button" class="scenario-card' + (sel ? " selected" : "") + '" data-action="appliquer-rythme" data-pourcentage="' + sc.pourcentage + '">' +
                  '<span class="scenario-head"><strong>' + sc.nom + '</strong><span class="scenario-pct">' + sc.pourcentage + '%</span></span>' +
                  '<span class="scenario-detail">' + formatFCFA(sc.montantParSemaine) + ' / semaine · ' + formatDuree(sc.semaines) + '</span>' +
                "</button>";
      });
      html += "</div>";
      html += '<button type="button" class="btn btn-ghost" style="margin-top:10px;" data-action="objectif-fermer-rythme">Annuler</button>';
      html += "</div>";
    }

    if(ui.objectifConfirmationReset){
      html += '<div class="card">';
      html += '<div class="muted">Recommencer efface cet objectif — vos recettes et vos charges ne sont pas touchées. Vous pourrez créer un nouvel objectif juste après.</div>';
      html += '<div class="btn-row" style="margin-top:12px;">';
      html += '<button type="button" class="btn btn-ghost" data-action="objectif-annuler-reset">Annuler</button>';
      html += '<button type="button" class="btn btn-danger-outline" data-action="objectif-confirmer-reset">Oui, recommencer</button>';
      html += "</div></div>";
    }

    return html;
  }

  function donneesPartage(mode, offset){
