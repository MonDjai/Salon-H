  // ---------- Aides ----------

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function parseMontant(str){
    if(str == null) return 0;
    var digits = String(str).replace(/[^\d]/g, "");
    if(!digits) return 0;
    return parseInt(digits, 10);
  }

  // ---------- Gestion des evenements ----------

  function attachHandlers(){
    app.onclick = function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.getAttribute("data-action");
      if(action.indexOf("backdrop") !== -1 && e.target.closest("[data-stop]")){
        return; // le clic a eu lieu à l'intérieur de la feuille, pas sur le fond
      }
      handleAction(action, el, e);
    };

    app.oninput = function(e){
      var t = e.target;
      if(t.id === "input-cotisation"){
        ui.cotisationSaisie = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-perso-nom"){
        ui.persoNom = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-client-montant"){
        ui.clientMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-charge-montant"){
        ui.chargeMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-charge-edit-montant"){
        ui.chargeEditMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-creance-nom"){
        ui.creanceNom = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-creance-montant"){
        ui.creanceMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-creance-date"){
        ui.creanceDate = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-objectif-montant"){
        ui.objectifMontantSaisi = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-reglages-cotisation"){
        ui.reglagesCotisationSaisie = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-nb-clients"){
        ui.nbClientsSaisie = t.value;
      }else if(t.id === "input-loyer-jour"){
        ui.loyerJourSaisie = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-obj-montant-jour" && ui.objDraft){
        ui.objDraft.montantJour = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-obj-cible" && ui.objDraft){
        ui.objDraft.cible = t.value;
      }else if(t.id === "input-obj-nom" && ui.objDraft){
        ui.objDraft.nom = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-client-edit-montant"){
        ui.clientEditMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-code-acces"){
        ui.codeSaisie = t.value;
        ui.codeErreur = false;
        renderKeepFocus(t);
      }
    };

    app.onkeydown = function(e){
      if(e.target && e.target.id === "input-code-acces" && e.key === "Enter"){
        handleAction("valider-code-acces", e.target);
      }
    };

    app.onchange = function(e){
      var t = e.target;
      if(t.id === "input-restauration" && t.files && t.files[0]){
        lireFichierRestauration(t.files[0]);
      }else if(t.id === "input-jour-saisie"){
        var v = t.value;
        if(v && v < todayKey()){ ui.jourSelection = v; }
        else { ui.jourSelection = null; }
        render();
      }
    };
  }

  function lireFichierRestauration(fichier){
    var reader = new FileReader();
    reader.onload = function(ev){
      var parsed;
      try{
        parsed = JSON.parse(ev.target.result);
      }catch(err){
        parsed = null;
      }
      if(!parsed || typeof parsed !== "object" || typeof parsed.jours !== "object" || parsed.jours === null){
        ui.restaurationFichier = null;
        ui.restaurationErreur = "Ce fichier ne ressemble pas à une sauvegarde MonDjai/Salon H valide.";
      }else{
        ui.restaurationFichier = parsed;
        ui.restaurationErreur = "";
      }
      render();
    };
    reader.onerror = function(){
      ui.restaurationFichier = null;
      ui.restaurationErreur = "Impossible de lire ce fichier.";
      render();
    };
    reader.readAsText(fichier);
  }

  // Pour éviter de perdre le focus/le curseur lors d'une saisie, on ne
  // ré-affiche que si nécessaire (activation/désactivation d'un bouton),
  // en remettant le focus et la position du curseur sur le même champ.
  function renderKeepFocus(inputEl){
    var id = inputEl.id;
    var selStart = inputEl.selectionStart;
    var selEnd = inputEl.selectionEnd;
    render();
    var again = document.getElementById(id);
    if(again){
      again.focus();
      try{ again.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }

  function handleAction(action, el){
    switch(action){

      case "choisir-statut":
        ui.statutChoisi = el.getAttribute("data-id");
        render();
        break;

      case "continuer-statut":
        if(el.hasAttribute("disabled")) return;
        state.config.statut = ui.statutChoisi;
        if(ui.statutChoisi === "locataire"){
          appliquerLoyerSaisie(ui.cotisationSaisie);
        }else{
          state.config.cotisationHabituelle = null;
        }
        saveState();
        ui.onboardingStep = "rubriques";
        ui.rubriquesDraft = null;
        render();
        break;

      case "retour-statut":
        ui.onboardingStep = "statut";
        render();
        break;

      case "toggle-rubrique-draft":
        var idx = parseInt(el.getAttribute("data-idx"), 10);
        if(ui.rubriquesDraft[idx]){
          ui.rubriquesDraft[idx].actif = !ui.rubriquesDraft[idx].actif;
        }
        render();
        break;

      case "ouvrir-ajout-perso":
        ui.ajoutRubriquePerso = true;
        ui.ajoutRubriqueContexte = (ui.page === "reglages") ? "reglages" : "onboarding";
        ui.persoNom = "";
        ui.persoIcone = EMOJI_SUGGESTIONS[0];
        ui.persoCouleur = COULEUR_SUGGESTIONS[0];
        render();
        break;

      case "annuler-ajout-perso":
        ui.ajoutRubriquePerso = false;
        render();
        break;

      case "choisir-emoji-perso":
        ui.persoIcone = el.getAttribute("data-emoji");
        render();
        break;

      case "choisir-couleur-perso":
        ui.persoCouleur = el.getAttribute("data-couleur");
        render();
        break;

      case "valider-ajout-perso":
        if(el.hasAttribute("disabled")) return;
        var nouvelleRubriquePerso = {
          id: uid("perso"),
          nom: ui.persoNom.trim(),
          icone: ui.persoIcone,
          couleur: ui.persoCouleur,
          actif: true,
          perso: true
        };
        if(ui.ajoutRubriqueContexte === "reglages"){
          state.config.rubriques.push(nouvelleRubriquePerso);
          saveState();
        }else{
          ui.rubriquesDraft.push(nouvelleRubriquePerso);
        }
        ui.ajoutRubriquePerso = false;
        render();
        break;

      case "terminer-onboarding":
        state.config.rubriques = ui.rubriquesDraft.map(function(r){ return Object.assign({}, r); });
        if(state.config.statut === "locataire" && state.config.cotisationHabituelle){
          state.dernierMontant.cotisation = state.config.cotisationHabituelle;
        }
        state.config.onboardingComplete = true;
        saveState();
        ensureJour();
        saveState();
        ui.onboardingStep = null;
        render();
        break;

      case "ouvrir-client":
      case "ouvrir-recette":
        var jourRec = lireJour(jourSaisieKey());
        ui.modal = "recette";
        ui.clientMontant = jourRec.recetteSaisie != null ? String(jourRec.recetteSaisie) : (jourRec.recette > 0 ? String(jourRec.recette - creancesRecouvreesDe(jourRec).reduce(function(s,c){ return s + c.montant; }, 0)) : "");
        ui.nbClientsSaisie = nbClientsJour(jourRec) ? String(nbClientsJour(jourRec)) : "";
        render();
        break;

      case "valider-recette":
        if(el.hasAttribute("disabled")) return;
        var montantRec = parseMontant(ui.clientMontant);
        ui.modal = null;
        var loyerAuto = enregistrerRecette(montantRec, parseMontant(ui.nbClientsSaisie));
        afficherToast("Recette enregistrée : " + formatFCFA(montantRec) + (loyerAuto ? " · loyer du jour ajouté" : ""));
        break;

      case "ouvrir-charges-jour":
        ui.modal = "charges-jour";
        ui.chargeRetour = "charges-jour";
        render();
        break;

      case "ouvrir-charge-grille":
        ui.modal = "charge-grid";
        ui.chargeRetour = null;
        render();
        break;

      case "choisir-rubrique-charge":
        ui.chargeRubriqueId = el.getAttribute("data-id");
        var precedent = montantProposeRubrique(ui.chargeRubriqueId);
        ui.chargeMontant = precedent ? String(precedent) : "";
        ui.modal = "charge-montant";
        render();
        break;

      case "retour-charge-grille":
        ui.modal = ui.chargeRetour || "charge-grid";
        render();
        break;

      case "valider-client":
        if(el.hasAttribute("disabled")) return;
        var montantClient = parseMontant(ui.clientMontant);
        ui.modal = null;
        if(montantClient > 0){
          var cotisAuto = ajouterClient(montantClient);
          afficherToast("Client ajouté : " + formatFCFA(montantClient) + (cotisAuto ? " · cotisation du jour ajoutée" : ""));
        }else{
          render();
        }
        break;

      case "client-rapide":
        var montantRapide = parseInt(el.getAttribute("data-montant"), 10);
        ui.modal = null;
        if(montantRapide > 0){
          var cotisAutoR = ajouterClient(montantRapide);
          afficherToast("Client ajouté : " + formatFCFA(montantRapide) + (cotisAutoR ? " · cotisation du jour ajoutée" : ""));
        }
        break;

      case "ouvrir-clients-jour":
        ui.modal = "clients-jour";
        render();
        break;

      case "editer-client":
        ui.clientEditId = el.getAttribute("data-id");
        var jourEdC = lireJour(jourSaisieKey());
        var idxEdC = trouverClient(jourEdC, ui.clientEditId);
        ui.clientEditMontant = idxEdC >= 0 ? String(jourEdC.clients[idxEdC].montant) : "";
        ui.modal = "client-edit";
        render();
        break;

      case "retour-clients-jour":
        ui.modal = "clients-jour";
        render();
        break;

      case "valider-modif-client":
        if(el.hasAttribute("disabled")) return;
        var jourVC = ensureJour();
        var idxVC = trouverClient(jourVC, ui.clientEditId);
        var nvMontantClient = parseMontant(ui.clientEditMontant);
        if(idxVC >= 0 && nvMontantClient > 0){
          jourVC.clients[idxVC].montant = nvMontantClient;
          recalculerRecette(jourVC);
          saveState();
        }
        ui.modal = "clients-jour";
        ui.clientEditId = null;
        render();
        break;

      case "supprimer-client":
        var jourSCl = ensureJour();
        var idxSCl = trouverClient(jourSCl, ui.clientEditId);
        if(idxSCl >= 0){
          jourSCl.clients.splice(idxSCl, 1);
          recalculerRecette(jourSCl);
          saveState();
        }
        ui.modal = "clients-jour";
        ui.clientEditId = null;
        afficherToast("Client retiré de la recette.");
        break;

      case "revenir-aujourdhui":
        ui.jourSelection = null;
        render();
        break;

      case "completer-jour":
        var cleCompleter = el.getAttribute("data-key");
        ui.jourSelection = (cleCompleter && cleCompleter < todayKey()) ? cleCompleter : null;
        ui.page = "jour";
        ui.historiqueSelection = null;
        ui.modal = null;
        render();
        break;

      case "valider-code-acces":
        if(normaliserCode(ui.codeSaisie) === CODE_ACCES){
          state.config.codeAccesOk = true;
          saveState();
          ui.codeSaisie = "";
          ui.codeErreur = false;
        }else{
          ui.codeErreur = true;
        }
        render();
        break;

      case "installer-app":
        lancerInstallation();
        break;

      case "installer-aide":
        ui.modal = "installer-aide";
        render();
        break;

      case "installer-plus-tard":
        state.meta.installCarteMasquee = true;
        saveState();
        afficherToast("D’accord. Vous pourrez l’installer depuis ⚙️ Réglages.");
        break;

      case "reglages-toggle-cotisation-auto":
        state.config.cotisationAuto = !state.config.cotisationAuto;
        saveState();
        render();
        break;

      case "valider-charge":
        if(el.hasAttribute("disabled")) return;
        var montantCharge = parseMontant(ui.chargeMontant);
        if(montantCharge > 0 && ui.chargeRubriqueId){
          var jourD = ensureJour();
          jourD.charges.push({
            id: uid("charge"),
            rubriqueId: ui.chargeRubriqueId,
            montant: montantCharge,
            ts: Date.now()
          });
          state.dernierMontant[ui.chargeRubriqueId] = montantCharge;
          saveState();
        }
        ui.modal = ui.chargeRetour || null;
        ui.chargeRubriqueId = null;
        render();
        break;

      case "aller-page":
        ui.page = el.getAttribute("data-page");
        ui.modal = null;
        if(ui.page !== "jour-detail"){
          ui.historiqueSelection = null;
        }
        render();

      case "voir-jour-detail":
        ui.historiqueSelection = el.getAttribute("data-key");
        ui.jourDetailRetour = "etat";
        ui.page = "jour-detail";
        render();
        break;

      case "retour-jour-detail":
        ui.historiqueSelection = null;
        ui.page = ui.jourDetailRetour || "etat";
        render();
        break;

      case "etat-mode":
        ui.etatMode = el.getAttribute("data-mode");
        ui.etatOffset = 0;
        ui.etatSemaineOuverte = null;

        render();

      case "objectif-retour-modeles":
        ui.objectifEtape = "modeles";
        ui.objectifModeleChoisi = null;
        render();
        break;

      case "objectif-continuer-montant":
        if(el.hasAttribute("disabled")) return;
        ui.objectifEtape = "scenarios";
        ui.objectifScenarioChoisi = null;
        render();
        break;

      case "objectif-retour-montant":
        ui.objectifEtape = "montant";
        render();
        break;

      case "choisir-scenario-objectif":
        ui.objectifScenarioChoisi = parseInt(el.getAttribute("data-pourcentage"), 10);
        render();
        break;

      case "creer-objectif":
        if(el.hasAttribute("disabled")) return;
        var modeleFinal = trouverModeleObjectif(ui.objectifModeleChoisi);
        var montantFinal = parseMontant(ui.objectifMontantSaisi);
        if(modeleFinal && montantFinal > 0 && ui.objectifScenarioChoisi){
          state.objectif = {
            id: uid("objectif"),
            modele: modeleFinal.id,
            sousType: null,
            nom: modeleFinal.nom,
            montantCible: montantFinal,
            dateCreation: todayKey(),
            pourcentage: ui.objectifScenarioChoisi,
            actif: true
          };
          saveState();
        }
        ui.objectifEtape = "modeles";
        ui.objectifModeleChoisi = null;
        ui.objectifMontantSaisi = "";
        ui.objectifScenarioChoisi = null;
        render();
        break;

      case "objectif-changer-rythme":
        ui.objectifModifierRythme = true;
        render();
        break;

      case "objectif-fermer-rythme":
        ui.objectifModifierRythme = false;
        render();
        break;

      case "appliquer-rythme":
        if(state.objectif){
          state.objectif.pourcentage = parseInt(el.getAttribute("data-pourcentage"), 10);
          saveState();
        }
        ui.objectifModifierRythme = false;
        render();
        break;

      case "objectif-proposer-reset":
        ui.objectifConfirmationReset = true;
        render();
        break;

      case "objectif-annuler-reset":
        ui.objectifConfirmationReset = false;
        render();
        break;

      case "objectif-confirmer-reset":
        state.objectif = null;
        saveState();
        ui.objectifConfirmationReset = false;
        ui.objectifModifierRythme = false;
        render();
        break;

      // --- Réglages, Partager, À propos (F9/F11) ---

      case "ouvrir-reglages":
        if(ui.page !== "reglages" && ui.page !== "partager" && ui.page !== "apropos"){
          ui.pagePrecedente = ui.page;
        }
        ui.page = "reglages";
        ui.reglagesCotisationSaisie = state.config.cotisationHabituelle ? String(state.config.cotisationHabituelle) : "";
        ui.loyerFreqSaisie = state.config.loyerFrequence || "jour";
        ui.loyerJourSaisie = String(state.config.loyerJour || 1);
        ui.reglagesPinEtape = null;
        ui.reglagesPinTemp = "";
        ui.reglagesPinErreur = "";
        ui.pinSaisie = "";
        ui.ajoutRubriquePerso = false;
        ui.modal = null;
        render();
        break;

      case "ouvrir-partager":
        if(ui.page !== "reglages" && ui.page !== "partager" && ui.page !== "apropos"){
          ui.pagePrecedente = ui.page;
        }
        ui.page = "partager";
        ui.partagerMode = "jour";
        ui.partagerOffset = 0;
        ui.modal = null;
        render();
        break;

      case "ouvrir-apropos":
        ui.page = "apropos";
        render();
        break;

      case "retour-reglages":
        ui.page = "reglages";
        render();
        break;

      case "fermer-ecran-secondaire":
        ui.page = ui.pagePrecedente || "jour";
        ui.ajoutRubriquePerso = false;
        ui.reglagesPinEtape = null;
        render();
        break;

      case "reglages-choisir-statut":
        var nouveauStatut = el.getAttribute("data-id");
        state.config.statut = nouveauStatut;
        if(nouveauStatut !== "locataire"){
          state.config.cotisationHabituelle = null;
          ui.reglagesCotisationSaisie = "";
        }else{
          ui.reglagesCotisationSaisie = state.config.cotisationHabituelle ? String(state.config.cotisationHabituelle) : "";
          ui.loyerFreqSaisie = state.config.loyerFrequence || "jour";
          ui.loyerJourSaisie = String(state.config.loyerJour || 1);
          var rubLoyer = findRubrique("cotisation");
          if(rubLoyer) rubLoyer.actif = true;
        }
        saveState();
        render();
        break;

      case "reglages-enregistrer-cotisation":
        if(el.hasAttribute("disabled")) return;
        if(loyerSaisieValide(ui.reglagesCotisationSaisie)){
          appliquerLoyerSaisie(ui.reglagesCotisationSaisie);
          saveState();
          afficherToast("Loyer enregistré : " + formatFCFA(state.config.cotisationHabituelle) + ", " + libelleLoyer() + ".");
        }else{
          render();
        }
        break;

      case "reglages-toggle-rubrique":
        var rubriqueAToggle = findRubrique(el.getAttribute("data-id"));
        if(rubriqueAToggle){
          rubriqueAToggle.actif = !rubriqueAToggle.actif;
          saveState();
        }
        render();
        break;

      case "reglages-pin-activer":
      case "reglages-pin-modifier":
        ui.reglagesPinEtape = "saisie-1";
        ui.reglagesPinTemp = "";
        ui.pinSaisie = "";
        ui.reglagesPinErreur = "";
        render();
        break;

      case "reglages-pin-desactiver":
        state.config.pinActif = false;
        saveState();
        render();
        break;

      case "reglages-pin-annuler":
        ui.reglagesPinEtape = null;
        ui.reglagesPinTemp = "";
        ui.pinSaisie = "";
        ui.reglagesPinErreur = "";
        render();
        break;

      case "reglages-pin-toucher-chiffre":
        if(ui.pinSaisie.length >= 4) return;
        ui.pinSaisie += el.getAttribute("data-chiffre");
        if(ui.pinSaisie.length === 4){
          if(ui.reglagesPinEtape === "saisie-1"){
            ui.reglagesPinTemp = ui.pinSaisie;
            ui.pinSaisie = "";
            ui.reglagesPinEtape = "saisie-2";
            ui.reglagesPinErreur = "";
          }else if(ui.reglagesPinEtape === "saisie-2"){
            if(ui.pinSaisie === ui.reglagesPinTemp){
              state.config.pin = ui.pinSaisie;
              state.config.pinActif = true;
              saveState();
              ui.reglagesPinEtape = null;
              ui.reglagesPinTemp = "";
              ui.pinSaisie = "";
              ui.reglagesPinErreur = "";
            }else{
              ui.reglagesPinErreur = "Les codes ne correspondent pas. Recommencez.";
              ui.reglagesPinEtape = "saisie-1";
              ui.reglagesPinTemp = "";
              ui.pinSaisie = "";
            }
          }
        }
        render();
        break;

      case "reglages-pin-effacer-chiffre":
        ui.pinSaisie = ui.pinSaisie.slice(0, -1);
        render();
        break;

      case "pin-toucher-chiffre":
        if(ui.pinSaisie.length >= 4) return;
        ui.pinSaisie += el.getAttribute("data-chiffre");
        if(ui.pinSaisie.length === 4){
          if(ui.pinSaisie === state.config.pin){
            ui.verrouille = false;
            ui.pinSaisie = "";
            ui.pinErreur = false;
            render();
          }else{
            ui.pinErreur = true;
            render();
            setTimeout(function(){
              ui.pinSaisie = "";
              ui.pinErreur = false;
              render();
            }, 500);
          }
          return;
        }
        render();
        break;

      case "pin-effacer-chiffre":
        ui.pinSaisie = ui.pinSaisie.slice(0, -1);
        render();
        break;

      case "ouvrir-pin-oublie":
        ui.pinOublieConfirmation = true;
        render();
        break;

      case "fermer-pin-oublie":
      case "fermer-pin-oublie-backdrop":
        ui.pinOublieConfirmation = false;
        render();
        break;

      case "retirer-pin-oublie":
        state.config.pinActif = false;
        state.config.pin = null;
        saveState();
        ui.pinOublieConfirmation = false;
        ui.verrouille = false;
        ui.pinSaisie = "";
        render();
        break;

      case "partager-mode":
        ui.partagerMode = el.getAttribute("data-mode");
        ui.partagerOffset = 0;
        render();
        break;

      case "partager-precedent":
        if(el.hasAttribute("disabled")) return;
        if(precedentPossible(ui.partagerMode, ui.partagerOffset)) ui.partagerOffset -= 1;
        render();
        break;

      case "partager-suivant":
        if(el.hasAttribute("disabled")) return;
        if(ui.partagerOffset < 0){
          ui.partagerOffset += 1;
        }
        render();
        break;

      case "partager-generer":
        genererEtPartagerImage(false);
        break;

      case "partager-telecharger":
        genererEtPartagerImage(true);
        break;

      // --- Mes données : sauvegarde et restauration (F10) ---

      case "sauvegarder-donnees":
        sauvegarderAvecChoixDossier();
        render();
        break;

      case "rappel-plus-tard":
        state.meta.dernierRappelSauvegarde = todayKey();
        saveState();
        render();
        break;

      case "annuler-restauration":
        ui.restaurationFichier = null;
        ui.restaurationErreur = "";
        render();
        break;

      case "confirmer-restauration":
        if(ui.restaurationFichier){
          var nouvelEtat = stateDepuisImport(ui.restaurationFichier);
          if(nouvelEtat){
            // Le code d'accès déjà validé sur ce téléphone n'est jamais redemandé après une restauration.
            if(state.config.codeAccesOk) nouvelEtat.config.codeAccesOk = true;
            if(!nouvelEtat.meta.creation) nouvelEtat.meta.creation = state.meta.creation;
            ui.jourSelection = null;
            ui.etatSemaineOuverte = null;
            ui.objDraft = null;
            ui.objConfirmSuppr = false;
            state = nouvelEtat;
            saveState();
            ui.restaurationFichier = null;
            ui.modal = null;
            ui.page = "jour";
            ui.historiqueSelection = null;
            ui.objectifEtape = "modeles";
            ui.objectifModeleChoisi = null;
            ui.objectifMontantSaisi = "";
            ui.objectifScenarioChoisi = null;
            ui.objectifModifierRythme = false;
            ui.objectifConfirmationReset = false;
            ui.onboardingStep = state.config.onboardingComplete ? null : "statut";
            ui.statutChoisi = state.config.statut;
            ui.cotisationSaisie = state.config.cotisationHabituelle ? String(state.config.cotisationHabituelle) : "";
            ui.rubriquesDraft = null;
            ui.pagePrecedente = "jour";
            ui.reglagesCotisationSaisie = "";
            ui.reglagesPinEtape = null;
            ui.reglagesPinTemp = "";
            ui.reglagesPinErreur = "";
            ui.pinSaisie = "";
            ui.partagerMode = "jour";
            ui.partagerOffset = 0;
            // Le code PIN restauré ne verrouille qu'à la prochaine ouverture de l'application,
            // pas immédiatement après une restauration en cours de session.
          }
        }
        render();
        break;

      // --- V1.2 : loyer ---
      case "loyer-freq":
        ui.loyerFreqSaisie = el.getAttribute("data-freq");
        if(ui.loyerFreqSaisie === "semaine" && parseMontant(ui.loyerJourSaisie) > 7) ui.loyerJourSaisie = "1";
        render();
        break;

      case "loyer-jour":
        ui.loyerJourSaisie = el.getAttribute("data-jour");
        render();
        break;

      case "loyer-noter":
        var jourLoyer = ensureJour(todayKey());
        jourLoyer.charges.push({ id: uid("charge"), rubriqueId:"cotisation", montant: state.config.cotisationHabituelle, ts: Date.now(), auto:true });
        saveState();
        afficherToast("Loyer noté : " + formatFCFA(state.config.cotisationHabituelle));
        break;

      case "loyer-plus-tard":
        state.meta.loyerRappelMasque = todayKey();
        saveState();
        render();
        break;

      // --- V1.2 : objectif (modèle Coiffure) ---
      case "obj-choisir-modele":
        if(!ui.objDraft) ui.objDraft = nouveauBrouillonObjectif();
        ui.objDraft.modele = el.getAttribute("data-id");
        render();
        break;

      case "obj-continuer":
        if(el.hasAttribute("disabled")) return;
        var mC = trouverModeleObjectif(ui.objDraft.modele);
        ui.objDraft.step = "form";
        if(mC){ ui.objDraft.nom = mC.nom; ui.objDraft.cible = String(mC.montantSuggere); }
        render();
        break;

      case "obj-changer-modele":
        if(ui.objDraft) ui.objDraft.step = "modele";
        render();
        break;

      case "obj-mode":
        ui.objDraft.mode = el.getAttribute("data-mode");
        render();
        break;

      case "obj-pct":
        ui.objDraft.pourcentage = parseInt(el.getAttribute("data-pourcentage"), 10);
        render();
        break;

      case "obj-enregistrer":
        if(el.hasAttribute("disabled")) return;
        var dO = ui.objDraft;
        var mO = trouverModeleObjectif(dO.modele) || (state.objectif ? trouverModeleObjectif(state.objectif.modele) : null);
        var base = dO.edition && state.objectif ? state.objectif : { id: uid("objectif"), modele: dO.modele, sousType: null, dateCreation: todayKey(), actif: true, icone: mO ? mO.icone : "💰" };
        base.nom = dO.nom.trim();
        base.mode = dO.mode;
        base.pourcentage = dO.mode === "auto" ? dO.pourcentage : (base.pourcentage || 10);
        base.montantJour = dO.mode === "manuel" ? parseMontant(dO.montantJour) : null;
        base.montantCible = parseMontant(dO.cible);
        state.objectif = base;
        saveState();
        ui.objDraft = null;
        afficherToast(dO.edition ? "Objectif modifié." : "Objectif créé.");
        break;

      case "obj-modifier":
        var oM = state.objectif;
        ui.objDraft = { step:"form", edition:true, modele:oM.modele, mode:oM.mode || "auto", pourcentage:oM.pourcentage || 10,
                        montantJour: oM.montantJour ? String(oM.montantJour) : "", cible: oM.montantCible ? String(oM.montantCible) : "", nom: oM.nom };
        render();
        break;

      case "obj-annuler-edition":
        ui.objDraft = null;
        render();
        break;

      case "obj-supprimer":
        ui.objConfirmSuppr = true;
        render();
        break;

      case "obj-supprimer-annuler":
        ui.objConfirmSuppr = false;
        render();
        break;

      case "obj-supprimer-confirmer":
        state.objectif = null;
        saveState();
        ui.objConfirmSuppr = false;
        ui.objDraft = nouveauBrouillonObjectif();
        render();
        break;

      case "objectif-abonnement":
        afficherToast("Disponible par abonnement — activation à venir.");
        break;

      case "fermer-modal":
      case "fermer-modal-backdrop":
        ui.chargeRetour = null;
        ui.modal = null;
        ui.chargeRubriqueId = null;
        ui.chargeEditId = null;
        render();
        break;

      default:
        break;
    }
  }

  // ---------- Démarrage ----------

  if(!state.config.onboardingComplete && ui.onboardingStep === "rubriques"){
    initRubriquesDraft();
  }

  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function(){});
    });
  }
})();
</script>
</body>
</html>
