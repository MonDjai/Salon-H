  function roundRectCompat(ctx, x, y, w, h, r){
    ctx.beginPath();
    if(ctx.roundRect){
      ctx.roundRect(x, y, w, h, r);
    }else{
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  }

  // Réduit la taille de police jusqu'à ce que le texte tienne dans la largeur disponible.
  function ajusterTaillePolice(ctx, texte, largeurMax, tailleDepart){
    var taille = tailleDepart;
    while(taille > 34){
      ctx.font = "800 " + taille + "px -apple-system,Helvetica,Arial,sans-serif";
      if(ctx.measureText(texte).width <= largeurMax) break;
      taille -= 4;
    }
    return taille;
  }

  function dessinerStatBloc(ctx, x, y, largeur, label, valeur){
    ctx.fillStyle = "#1a1f29";
    roundRectCompat(ctx, x, y, largeur, 140, 18);
    ctx.fill();
    ctx.textAlign = "left";
    ctx.fillStyle = "#f5f6f8";
    ctx.font = "800 34px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText(valeur, x + 22, y + 58);
    ctx.fillStyle = "#9aa3b2";
    ctx.font = "500 21px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText(label, x + 22, y + 96);
  }

  // Calcule la hauteur nécessaire pour ne pas laisser un grand vide sous le contenu
  // (la créance en cours n'est pas toujours affichée).
  function calculerHauteurPartage(d){
    var y = 96 + 168 + 78;
    if(!d.enPerte){ y += 44; }
    y += 60 + 66;
    var fin = y + 140;
    if(d.creancesEnCoursTotal > 0){
      fin = y + 168 + 112;
    }
    return fin + 110;
  }

  function dessinerImagePartage(canvas, d){
    canvas.height = calculerHauteurPartage(d);
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height;
    var marge = 70;

    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#161b25");
    grad.addColorStop(1, "#0d0f14");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    var y = 96;
    ctx.fillStyle = "#f5a623";
    roundRectCompat(ctx, marge, y, 78, 78, 20);
    ctx.fill();
    ctx.fillStyle = "#241a06";
    ctx.font = "800 42px -apple-system,Helvetica,Arial,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("H", marge + 39, y + 41);

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#f5f6f8";
    ctx.font = "800 36px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText("MonDjai/Salon H", marge + 100, y + 34);
    ctx.fillStyle = "#9aa3b2";
    ctx.font = "400 24px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText("Chaque coupe compte.", marge + 100, y + 68);

    y += 168;
    ctx.fillStyle = "#9aa3b2";
    ctx.font = "700 27px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText(d.titre, marge, y);

    y += 78;
    var texteSolde = d.enPerte ? "Jour à perte : " + formatFCFA(Math.abs(d.solde)) : formatFCFA(d.solde);
    ctx.fillStyle = d.enPerte ? "#ff6b5e" : "#34b37e";
    var taillePolice = ajusterTaillePolice(ctx, texteSolde, w - marge*2, 84);
    ctx.font = "800 " + taillePolice + "px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText(texteSolde, marge, y);

    if(!d.enPerte){
      y += 44;
      ctx.fillStyle = "#9aa3b2";
      ctx.font = "600 25px -apple-system,Helvetica,Arial,sans-serif";
      ctx.fillText("Solde net", marge, y);
    }

    y += 60;
    ctx.strokeStyle = "#2a3040";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(marge, y);
    ctx.lineTo(w - marge, y);
    ctx.stroke();

    y += 66;
    var colLargeur = (w - marge*2 - 24) / 2;
    dessinerStatBloc(ctx, marge, y, colLargeur, "Recette (" + d.nbClients + (d.nbClients > 1 ? " clients)" : " client)"), formatFCFA(d.recette));
    dessinerStatBloc(ctx, marge + colLargeur + 24, y, colLargeur, "Charges", formatFCFA(d.charges));

    y += 168;
    if(d.creancesEnCoursTotal > 0){
      ctx.fillStyle = "#241d0e";
      roundRectCompat(ctx, marge, y, w - marge*2, 112, 20);
      ctx.fill();
      ctx.fillStyle = "#e8c77a";
      ctx.textAlign = "left";
      ctx.font = "700 27px -apple-system,Helvetica,Arial,sans-serif";
      ctx.fillText(d.creancesEnCoursNb + (d.creancesEnCoursNb > 1 ? " créances en cours" : " créance en cours"), marge + 28, y + 42);
      ctx.font = "800 32px -apple-system,Helvetica,Arial,sans-serif";
      ctx.fillText(formatFCFA(d.creancesEnCoursTotal) + " à recouvrer", marge + 28, y + 84);
    }

    ctx.fillStyle = "#6b7385";
    ctx.font = "400 22px -apple-system,Helvetica,Arial,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Généré le " + formatDateCourte(todayKey()) + " avec MonDjai/Salon H", w/2, h - 66);
    ctx.font = "400 19px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText("Document informatif, non certifié", w/2, h - 34);
  }

  function genererEtPartagerImage(){
    var canvas = document.getElementById("partage-canvas");
    if(!canvas || !canvas.toBlob){ return; }
    var mode = ui.partagerMode;
    var nomFichier = "mondjai-salonh-partage-" + mode + "-" + todayKey() + ".png";
    canvas.toBlob(function(blob){
      if(!blob) return;
      var fichier = null;
      try{ fichier = new File([blob], nomFichier, { type: "image/png" }); }catch(e){ fichier = null; }
      if(fichier && window.navigator && navigator.canShare && navigator.share && navigator.canShare({ files: [fichier] })){
        navigator.share({ files: [fichier], title: "MonDjai/Salon H" }).catch(function(){
          telechargerBlobImage(blob, nomFichier);
        });
      }else{
        telechargerBlobImage(blob, nomFichier);
      }
    }, "image/png");
  }

  function telechargerBlobImage(blob, nomFichier){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = nomFichier;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function trouverClient(jour, ref){
    if(!ref) return -1;
    for(var i=0;i<jour.clients.length;i++){
      if(jour.clients[i].id === ref) return i;
    }
    if(ref.indexOf("idx_") === 0){
      var n = parseInt(ref.slice(4), 10);
      if(n >= 0 && n < jour.clients.length && !jour.clients[n].id) return n;
    }
    return -1;
  }

  // ---------- Aides ----------

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function parseMontant(str){
    if(str == null) return 0;
    var digits = String(str).replace(/[^\d]/g, "");
    if(!digits) return 0;
    return parseInt(digits, 10);
  }

  // ---------- Gestion des evenements ----------

  function attachHandlers(){
    app.onclick = function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.getAttribute("data-action");
      if(action.indexOf("backdrop") !== -1 && e.target.closest("[data-stop]")){
        return; // le clic a eu lieu à l'intérieur de la feuille, pas sur le fond
      }
      handleAction(action, el, e);
    };

    app.oninput = function(e){
      var t = e.target;
      if(t.id === "input-cotisation"){
        ui.cotisationSaisie = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-perso-nom"){
        ui.persoNom = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-client-montant"){
        ui.clientMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-charge-montant"){
        ui.chargeMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-charge-edit-montant"){
        ui.chargeEditMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-creance-nom"){
        ui.creanceNom = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-creance-montant"){
        ui.creanceMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-creance-date"){
        ui.creanceDate = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-objectif-montant"){
        ui.objectifMontantSaisi = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-reglages-cotisation"){
        ui.reglagesCotisationSaisie = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-client-edit-montant"){
        ui.clientEditMontant = t.value;
        renderKeepFocus(t);
      }else if(t.id === "input-code-acces"){
        ui.codeSaisie = t.value;
        ui.codeErreur = false;
        renderKeepFocus(t);
      }
    };

    app.onkeydown = function(e){
      if(e.target && e.target.id === "input-code-acces" && e.key === "Enter"){
        handleAction("valider-code-acces", e.target);
      }
    };

    app.onchange = function(e){
      var t = e.target;
      if(t.id === "input-restauration" && t.files && t.files[0]){
        lireFichierRestauration(t.files[0]);
      }else if(t.id === "input-jour-saisie"){
        var v = t.value;
        if(v && v < todayKey()){ ui.jourSelection = v; }
        else { ui.jourSelection = null; }
        render();
      }
    };
  }

  function lireFichierRestauration(fichier){
    var reader = new FileReader();
    reader.onload = function(ev){
      var parsed;
      try{
        parsed = JSON.parse(ev.target.result);
      }catch(err){
        parsed = null;
      }
      if(!parsed || typeof parsed !== "object" || typeof parsed.jours !== "object" || parsed.jours === null){
        ui.restaurationFichier = null;
        ui.restaurationErreur = "Ce fichier ne ressemble pas à une sauvegarde MonDjai/Salon H valide.";
      }else{
        ui.restaurationFichier = parsed;
        ui.restaurationErreur = "";
      }
      render();
    };
    reader.onerror = function(){
      ui.restaurationFichier = null;
      ui.restaurationErreur = "Impossible de lire ce fichier.";
      render();
    };
    reader.readAsText(fichier);
  }

  // Pour éviter de perdre le focus/le curseur lors d'une saisie, on ne
  // ré-affiche que si nécessaire (activation/désactivation d'un bouton),
  // en remettant le focus et la position du curseur sur le même champ.
  function renderKeepFocus(inputEl){
    var id = inputEl.id;
    var selStart = inputEl.selectionStart;
    var selEnd = inputEl.selectionEnd;
    render();
    var again = document.getElementById(id);
    if(again){
      again.focus();
      try{ again.setSelectionRange(selStart, selEnd); }catch(e){}
    }
  }

  function handleAction(action, el){
    switch(action){

      case "choisir-statut":
        ui.statutChoisi = el.getAttribute("data-id");
        render();
        break;

      case "continuer-statut":
        if(el.hasAttribute("disabled")) return;
        state.config.statut = ui.statutChoisi;
        if(ui.statutChoisi === "locataire"){
          state.config.cotisationHabituelle = parseMontant(ui.cotisationSaisie);
        }else{
          state.config.cotisationHabituelle = null;
        }
        saveState();
        ui.onboardingStep = "rubriques";
        ui.rubriquesDraft = null;
        render();
        break;

      case "retour-statut":
        ui.onboardingStep = "statut";
        render();
        break;

      case "toggle-rubrique-draft":
        var idx = parseInt(el.getAttribute("data-idx"), 10);
        if(ui.rubriquesDraft[idx]){
          ui.rubriquesDraft[idx].actif = !ui.rubriquesDraft[idx].actif;
        }
        render();
        break;

      case "ouvrir-ajout-perso":
        ui.ajoutRubriquePerso = true;
        ui.ajoutRubriqueContexte = (ui.page === "reglages") ? "reglages" : "onboarding";
        ui.persoNom = "";
        ui.persoIcone = EMOJI_SUGGESTIONS[0];
        ui.persoCouleur = COULEUR_SUGGESTIONS[0];
        render();
        break;

      case "annuler-ajout-perso":
        ui.ajoutRubriquePerso = false;
        render();
        break;

      case "choisir-emoji-perso":
        ui.persoIcone = el.getAttribute("data-emoji");
        render();
        break;

      case "choisir-couleur-perso":
        ui.persoCouleur = el.getAttribute("data-couleur");
        render();
        break;

      case "valider-ajout-perso":
        if(el.hasAttribute("disabled")) return;
        var nouvelleRubriquePerso = {
          id: uid("perso"),
          nom: ui.persoNom.trim(),
          icone: ui.persoIcone,
          couleur: ui.persoCouleur,
          actif: true,
          perso: true
        };
        if(ui.ajoutRubriqueContexte === "reglages"){
          state.config.rubriques.push(nouvelleRubriquePerso);
          saveState();
        }else{
          ui.rubriquesDraft.push(nouvelleRubriquePerso);
        }
        ui.ajoutRubriquePerso = false;
        render();
        break;

      case "terminer-onboarding":
        state.config.rubriques = ui.rubriquesDraft.map(function(r){ return Object.assign({}, r); });
        if(state.config.statut === "locataire" && state.config.cotisationHabituelle){
          state.dernierMontant.cotisation = state.config.cotisationHabituelle;
        }
        state.config.onboardingComplete = true;
        saveState();
        ensureJour();
        saveState();
        ui.onboardingStep = null;
        render();
        break;

      case "ouvrir-client":
        ui.modal = "client";
        ui.clientMontant = "";
        render();
        break;

      case "ouvrir-charge-grille":
        ui.modal = "charge-grid";
        render();
        break;

      case "choisir-rubrique-charge":
        ui.chargeRubriqueId = el.getAttribute("data-id");
        var precedent = state.dernierMontant[ui.chargeRubriqueId];
        ui.chargeMontant = precedent ? String(precedent) : "";
        ui.modal = "charge-montant";
        render();
        break;

      case "retour-charge-grille":
        ui.modal = "charge-grid";
        render();
        break;

      case "valider-client":
        if(el.hasAttribute("disabled")) return;
        var montantClient = parseMontant(ui.clientMontant);
        ui.modal = null;
        if(montantClient > 0){
          var cotisAuto = ajouterClient(montantClient);
          afficherToast("Client ajouté : " + formatFCFA(montantClient) + (cotisAuto ? " · cotisation du jour ajoutée" : ""));
        }else{
          render();
        }
        break;

      case "client-rapide":
        var montantRapide = parseInt(el.getAttribute("data-montant"), 10);
        ui.modal = null;
        if(montantRapide > 0){
          var cotisAutoR = ajouterClient(montantRapide);
          afficherToast("Client ajouté : " + formatFCFA(montantRapide) + (cotisAutoR ? " · cotisation du jour ajoutée" : ""));
        }
        break;

      case "ouvrir-clients-jour":
        ui.modal = "clients-jour";
        render();
        break;

      case "editer-client":
        ui.clientEditId = el.getAttribute("data-id");
        var jourEdC = lireJour(jourSaisieKey());
        var idxEdC = trouverClient(jourEdC, ui.clientEditId);
        ui.clientEditMontant = idxEdC >= 0 ? String(jourEdC.clients[idxEdC].montant) : "";
        ui.modal = "client-edit";
        render();
        break;

      case "retour-clients-jour":
        ui.modal = "clients-jour";
        render();
        break;

      case "valider-modif-client":
        if(el.hasAttribute("disabled")) return;
        var jourVC = ensureJour();
        var idxVC = trouverClient(jourVC, ui.clientEditId);
        var nvMontantClient = parseMontant(ui.clientEditMontant);
        if(idxVC >= 0 && nvMontantClient > 0){
          jourVC.clients[idxVC].montant = nvMontantClient;
          recalculerRecette(jourVC);
          saveState();
        }
        ui.modal = "clients-jour";
        ui.clientEditId = null;
        render();
        break;

      case "supprimer-client":
        var jourSCl = ensureJour();
        var idxSCl = trouverClient(jourSCl, ui.clientEditId);
        if(idxSCl >= 0){
          jourSCl.clients.splice(idxSCl, 1);
          recalculerRecette(jourSCl);
          saveState();
        }
        ui.modal = "clients-jour";
        ui.clientEditId = null;
        afficherToast("Client retiré de la recette.");
        break;

      case "revenir-aujourdhui":
        ui.jourSelection = null;
        render();
        break;

      case "completer-jour":
        var cleCompleter = el.getAttribute("data-key");
        ui.jourSelection = (cleCompleter && cleCompleter < todayKey()) ? cleCompleter : null;
        ui.page = "jour";
        ui.historiqueSelection = null;
        ui.modal = null;
        render();
        break;

      case "valider-code-acces":
        if(normaliserCode(ui.codeSaisie) === CODE_ACCES){
          state.config.codeAccesOk = true;
          saveState();
          ui.codeSaisie = "";
          ui.codeErreur = false;
        }else{
          ui.codeErreur = true;
        }
        render();
        break;

      case "installer-app":
        lancerInstallation();
        break;

      case "installer-aide":
        ui.modal = "installer-aide";
        render();
        break;

      case "installer-plus-tard":
        state.meta.installCarteMasquee = true;
        saveState();
        afficherToast("D’accord. Vous pourrez l’installer depuis ⚙️ Réglages.");
        break;

      case "reglages-toggle-cotisation-auto":
        state.config.cotisationAuto = !state.config.cotisationAuto;
        saveState();
        render();
        break;

      case "valider-charge":
        if(el.hasAttribute("disabled")) return;
        var montantCharge = parseMontant(ui.chargeMontant);
        if(montantCharge > 0 && ui.chargeRubriqueId){
          var jourD = ensureJour();
          jourD.charges.push({
            id: uid("charge"),
            rubriqueId: ui.chargeRubriqueId,
            montant: montantCharge,
            ts: Date.now()
          });
          state.dernierMontant[ui.chargeRubriqueId] = montantCharge;
          saveState();
        }
        ui.modal = null;
        ui.chargeRubriqueId = null;
        render();
        break;

      case "aller-page":
        ui.page = el.getAttribute("data-page");
        ui.modal = null;
        if(ui.page !== "jour-detail"){
          ui.historiqueSelection = null;
        }
        render();
        break;

      case "voir-jour-detail":
        ui.historiqueSelection = el.getAttribute("data-key");
        ui.jourDetailRetour = "etat";
        ui.page = "jour-detail";
        render();
        break;

      case "retour-jour-detail":
        ui.historiqueSelection = null;
        ui.page = ui.jourDetailRetour || "etat";
        render();
        break;

      case "etat-mode":
        ui.etatMode = el.getAttribute("data-mode");
        ui.etatOffset = 0;
        ui.etatSemaineOuverte = null;
        render();
        break;

      case "etat-precedent":
        if(el.hasAttribute("disabled")) return;
        if(precedentPossible(ui.etatMode, ui.etatOffset)) ui.etatOffset -= 1;
        ui.etatSemaineOuverte = null;
        render();
        break;

      case "etat-ouvrir-semaine":
        ui.etatSemaineOuverte = el.getAttribute("data-key");
        render();
        break;

      case "etat-fermer-semaine":
        ui.etatSemaineOuverte = null;
        render();
        break;

      case "etat-suivant":
        if(el.hasAttribute("disabled")) return;
        ui.etatSemaineOuverte = null;
        if(ui.etatOffset < 0){
          ui.etatOffset += 1;
        }
        render();
        break;

      case "editer-charge":
        ui.chargeEditId = el.getAttribute("data-id");
        var jourEC = ensureJour();
        var chargeAModifier = findChargeDuJour(jourEC, ui.chargeEditId);
        ui.chargeEditMontant = chargeAModifier ? String(chargeAModifier.montant) : "";
        ui.modal = "charge-edit";
        render();
        break;

      case "valider-modif-charge":
        if(el.hasAttribute("disabled")) return;
        var nouveauMontant = parseMontant(ui.chargeEditMontant);
        if(nouveauMontant > 0){
          var jourVM = ensureJour();
          var chargeAMaj = findChargeDuJour(jourVM, ui.chargeEditId);
          if(chargeAMaj){
            chargeAMaj.montant = nouveauMontant;
            state.dernierMontant[chargeAMaj.rubriqueId] = nouveauMontant;
            saveState();
          }
        }
        ui.modal = null;
        ui.chargeEditId = null;
        render();
        break;

      case "supprimer-charge":
        var jourSC = ensureJour();
        jourSC.charges = jourSC.charges.filter(function(c){ return c.id !== ui.chargeEditId; });
        saveState();
        ui.modal = null;
        ui.chargeEditId = null;
        render();
        break;

      case "ouvrir-ajout-creance":
        ui.modal = "creance-ajout";
        ui.creanceNom = "";
        ui.creanceMontant = "";
        ui.creanceDate = todayKey();
        render();
        break;

      case "valider-creance":
        if(el.hasAttribute("disabled")) return;
        var montantCreance = parseMontant(ui.creanceMontant);
        var nomCreance = ui.creanceNom.trim();
        if(montantCreance > 0 && nomCreance){
          state.creances.push({
            id: uid("creance"),
            nom: nomCreance,
            montant: montantCreance,
            date: ui.creanceDate || todayKey(),
            statut: "en_cours",
            ts: Date.now(),
            datePaiement: null,
            tsPaiement: null
          });
          saveState();
        }
        ui.modal = null;
        render();
        break;

      case "marquer-payee":
        var creanceAPayer = findCreance(el.getAttribute("data-id"));
        if(creanceAPayer && creanceAPayer.statut === "en_cours"){
          creanceAPayer.statut = "payee";
          creanceAPayer.datePaiement = todayKey();
          creanceAPayer.tsPaiement = Date.now();
          var jourMP = ensureJour(todayKey());
          jourMP.creancesRecouvrees = jourMP.creancesRecouvrees || [];
          jourMP.creancesRecouvrees.push({ creanceId: creanceAPayer.id, montant: creanceAPayer.montant, ts: Date.now() });
          jourMP.recette += creanceAPayer.montant;
          saveState();
        }
        render();
        break;

      case "supprimer-creance":
        var idASupprimer = el.getAttribute("data-id");
        state.creances = state.creances.filter(function(c){ return c.id !== idASupprimer; });
        saveState();
        render();

      case "choisir-modele-objectif":

        if(el.hasAttribute("disabled")) return;
        var modeleFinal = trouverModeleObjectif(ui.objectifModeleChoisi);
        var montantFinal = parseMontant(ui.objectifMontantSaisi);
        if(modeleFinal && montantFinal > 0 && ui.objectifScenarioChoisi){
          state.objectif = {
            id: uid("objectif"),
            modele: modeleFinal.id,
            sousType: null,
            nom: modeleFinal.nom,
            montantCible: montantFinal,
            dateCreation: todayKey(),

            actif: true
          };

        ui.objectifModeleChoisi = null;
        ui.objectifMontantSaisi = "";

        ui.objectifModifierRythme = false;
        render();

          saveState();
        }
        ui.objectifModifierRythme = false;
        render();
        break;

      case "objectif-proposer-reset":
        ui.objectifConfirmationReset = true;
        render();
        break;

      case "objectif-annuler-reset":
        ui.objectifConfirmationReset = false;
        render();
        break;

      case "objectif-confirmer-reset":
        state.objectif = null;
        saveState();
        ui.objectifConfirmationReset = false;
        ui.objectifModifierRythme = false;
        render();
        break;

      // --- Réglages, Partager, À propos (F9/F11) ---

      case "ouvrir-reglages":
        if(ui.page !== "reglages" && ui.page !== "partager" && ui.page !== "apropos"){
          ui.pagePrecedente = ui.page;
        }
        ui.page = "reglages";
        ui.reglagesCotisationSaisie = state.config.cotisationHabituelle ? String(state.config.cotisationHabituelle) : "";
        ui.reglagesPinEtape = null;
        ui.reglagesPinTemp = "";
        ui.reglagesPinErreur = "";
        ui.pinSaisie = "";
        ui.ajoutRubriquePerso = false;
        ui.modal = null;
        render();
        break;

      case "ouvrir-partager":
        if(ui.page !== "reglages" && ui.page !== "partager" && ui.page !== "apropos"){
          ui.pagePrecedente = ui.page;
        }
        ui.page = "partager";
        ui.partagerMode = "jour";
        ui.partagerOffset = 0;
        ui.modal = null;
        render();
        break;

      case "ouvrir-apropos":
        ui.page = "apropos";
        render();
        break;

      case "retour-reglages":
        ui.page = "reglages";
        render();
        break;

      case "fermer-ecran-secondaire":
        ui.page = ui.pagePrecedente || "jour";
        ui.ajoutRubriquePerso = false;
        ui.reglagesPinEtape = null;
        render();
        break;

      case "reglages-choisir-statut":
        var nouveauStatut = el.getAttribute("data-id");
        state.config.statut = nouveauStatut;
        if(nouveauStatut !== "locataire"){
          state.config.cotisationHabituelle = null;
          ui.reglagesCotisationSaisie = "";
        }else{
          ui.reglagesCotisationSaisie = state.config.cotisationHabituelle ? String(state.config.cotisationHabituelle) : "";
        }
        saveState();
        render();
        break;

      case "reglages-enregistrer-cotisation":
        var montantCotisationReglages = parseMontant(ui.reglagesCotisationSaisie);
        if(montantCotisationReglages > 0){
          state.config.cotisationHabituelle = montantCotisationReglages;
          saveState();
        }
        render();
        break;

      case "reglages-toggle-rubrique":
        var rubriqueAToggle = findRubrique(el.getAttribute("data-id"));
        if(rubriqueAToggle){
          rubriqueAToggle.actif = !rubriqueAToggle.actif;
          saveState();
        }
        render();
        break;

      case "reglages-pin-activer":
      case "reglages-pin-modifier":
        ui.reglagesPinEtape = "saisie-1";
        ui.reglagesPinTemp = "";
        ui.pinSaisie = "";
        ui.reglagesPinErreur = "";
        render();
        break;

      case "reglages-pin-desactiver":
        state.config.pinActif = false;
        saveState();
        render();
        break;

      case "reglages-pin-annuler":
        ui.reglagesPinEtape = null;
        ui.reglagesPinTemp = "";
        ui.pinSaisie = "";
        ui.reglagesPinErreur = "";
        render();
        break;

      case "reglages-pin-toucher-chiffre":
        if(ui.pinSaisie.length >= 4) return;
        ui.pinSaisie += el.getAttribute("data-chiffre");
        if(ui.pinSaisie.length === 4){
          if(ui.reglagesPinEtape === "saisie-1"){
            ui.reglagesPinTemp = ui.pinSaisie;
            ui.pinSaisie = "";
            ui.reglagesPinEtape = "saisie-2";
            ui.reglagesPinErreur = "";
          }else if(ui.reglagesPinEtape === "saisie-2"){
            if(ui.pinSaisie === ui.reglagesPinTemp){
              state.config.pin = ui.pinSaisie;
              state.config.pinActif = true;
              saveState();
              ui.reglagesPinEtape = null;
              ui.reglagesPinTemp = "";
              ui.pinSaisie = "";
              ui.reglagesPinErreur = "";
            }else{
              ui.reglagesPinErreur = "Les codes ne correspondent pas. Recommencez.";
              ui.reglagesPinEtape = "saisie-1";
              ui.reglagesPinTemp = "";
              ui.pinSaisie = "";
            }
          }
        }
        render();
        break;

      case "reglages-pin-effacer-chiffre":
        ui.pinSaisie = ui.pinSaisie.slice(0, -1);
        render();
        break;

      case "pin-toucher-chiffre":
        if(ui.pinSaisie.length >= 4) return;
        ui.pinSaisie += el.getAttribute("data-chiffre");
        if(ui.pinSaisie.length === 4){
          if(ui.pinSaisie === state.config.pin){
            ui.verrouille = false;
            ui.pinSaisie = "";
            ui.pinErreur = false;
            render();
          }else{
            ui.pinErreur = true;
            render();
            setTimeout(function(){
              ui.pinSaisie = "";
              ui.pinErreur = false;
              render();
            }, 500);
          }
          return;
        }
        render();
        break;

      case "pin-effacer-chiffre":
        ui.pinSaisie = ui.pinSaisie.slice(0, -1);
        render();
        break;

      case "ouvrir-pin-oublie":
        ui.pinOublieConfirmation = true;
        render();
        break;

      case "fermer-pin-oublie":
      case "fermer-pin-oublie-backdrop":
        ui.pinOublieConfirmation = false;
        render();
        break;

      case "retirer-pin-oublie":
        state.config.pinActif = false;
        state.config.pin = null;
        saveState();
        ui.pinOublieConfirmation = false;
        ui.verrouille = false;
        ui.pinSaisie = "";
        render();
        break;

      case "partager-mode":
        ui.partagerMode = el.getAttribute("data-mode");
        ui.partagerOffset = 0;
        render();
        break;

      case "partager-precedent":
        if(el.hasAttribute("disabled")) return;
        if(precedentPossible(ui.partagerMode, ui.partagerOffset)) ui.partagerOffset -= 1;
        render();
        break;

      case "partager-suivant":
        if(el.hasAttribute("disabled")) return;
        if(ui.partagerOffset < 0){
          ui.partagerOffset += 1;
        }
        render();
        break;

      case "partager-generer":
        genererEtPartagerImage();
        break;

      // --- Mes données : sauvegarde et restauration (F10) ---

      case "sauvegarder-donnees":
        sauvegarderAvecChoixDossier();
        render();
        break;

      case "rappel-plus-tard":
        state.meta.dernierRappelSauvegarde = todayKey();
        saveState();
        render();
        break;

      case "annuler-restauration":
        ui.restaurationFichier = null;
        ui.restaurationErreur = "";
        render();
        break;

      case "confirmer-restauration":
        if(ui.restaurationFichier){
          var nouvelEtat = stateDepuisImport(ui.restaurationFichier);
          if(nouvelEtat){
            // Le code d'accès déjà validé sur ce téléphone n'est jamais redemandé après une restauration.
            if(state.config.codeAccesOk) nouvelEtat.config.codeAccesOk = true;
            if(!nouvelEtat.meta.creation) nouvelEtat.meta.creation = state.meta.creation;
            ui.jourSelection = null;
            ui.etatSemaineOuverte = null;
            state = nouvelEtat;
            saveState();
            ui.restaurationFichier = null;
            ui.modal = null;
            ui.page = "jour";
            ui.historiqueSelection = null;
            ui.objectifEtape = "modeles";
            ui.objectifModeleChoisi = null;
            ui.objectifMontantSaisi = "";
            ui.objectifScenarioChoisi = null;
            ui.objectifModifierRythme = false;
            ui.objectifConfirmationReset = false;
            ui.onboardingStep = state.config.onboardingComplete ? null : "statut";
            ui.statutChoisi = state.config.statut;
            ui.cotisationSaisie = state.config.cotisationHabituelle ? String(state.config.cotisationHabituelle) : "";
            ui.rubriquesDraft = null;
            ui.pagePrecedente = "jour";
            ui.reglagesCotisationSaisie = "";
            ui.reglagesPinEtape = null;
            ui.reglagesPinTemp = "";
            ui.reglagesPinErreur = "";
            ui.pinSaisie = "";
            ui.partagerMode = "jour";
            ui.partagerOffset = 0;
            // Le code PIN restauré ne verrouille qu'à la prochaine ouverture de l'application,
            // pas immédiatement après une restauration en cours de session.
          }
        }
        render();
        break;

      case "fermer-modal":
      case "fermer-modal-backdrop":
        ui.modal = null;
        ui.chargeRubriqueId = null;
        ui.chargeEditId = null;
        render();
        break;

      default:
        break;
    }
  }

  // ---------- Démarrage ----------

  if(!state.config.onboardingComplete && ui.onboardingStep === "rubriques"){
    initRubriquesDraft();
  }

  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function(){});
    });
  }
})();
</script>
</body>
</html>
