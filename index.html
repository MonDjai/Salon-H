  function construireClasseurSalonH(mode, offset){
    var d = donneesExcel(mode, offset), e = d.plage;
    var lignes = [], r = 0;
    var ligne = function(cells){ r++; lignes.push({ r: r, cells: cells || [] }); return lignes[lignes.length - 1]; };
    var txt = function(v, s){ return { t: "str", v: v, s: s || 0 }; };
    var mt = function(v, s){ return { t: "str", v: formatFCFAImage(v), s: s === undefined ? 5 : s }; };
    var dt = function(cle){ return { t: "num", v: xlsSerieDate(cle), s: 6 }; };

    ligne([txt("MonDjai/Salon H — " + d.titre, 2)]);
    ligne();
    ligne([txt("Période", 1), txt("du " + formatDateCourte(d.debut) + " au " + formatDateCourte(d.fin))]);
    ligne([txt("Recette", 1), mt(e.recetteTotale, 4)]);
    ligne([txt("Charges", 1), mt(e.chargesTotal, 4)]);
    ligne([txt("Épargne", 1), state.objectif ? mt(e.epargneTotal, 4) : txt("Aucun objectif", 4)]);
    ligne([txt("Solde net", 1), mt(e.soldeNet, 4)]);
    ligne([txt("Clients", 1), { t: "num", v: e.nbClients, s: 4 }]);
    ligne([txt("Jours travaillés", 1), { t: "num", v: e.nbJoursTravailles, s: 4 }]);
    ligne();

    ligne([txt("Journées", 1)]);
    ligne([txt("Date", 3), txt("Recette", 3), txt("Clients", 3), txt("Charges", 3), txt("Épargne", 3), txt("Solde net", 3)]);
    if(!d.jours.length) ligne([txt("Aucune journée notée")]);
    d.jours.forEach(function(k){
      var j = state.jours[k], ch = totalChargesJour(j), ep = epargneDuJour(k), nbc = nbClientsJour(j);
      ligne([dt(k), mt(j.recette), nbc ? { t: "num", v: nbc, s: 5 } : txt(""), mt(ch), mt(ep), mt(j.recette - ch - ep)]);
    });
    ligne();

    ligne([txt("Charges par rubrique", 1)]);
    ligne([txt("Rubrique", 3), txt("Montant", 3)]);
    var ids = Object.keys(e.chargesParRubrique).sort(function(a, c){
      if(a === "cotisation") return -1;
      if(c === "cotisation") return 1;
      return e.chargesParRubrique[c] - e.chargesParRubrique[a];
    });
    if(!ids.length) ligne([txt("Aucune charge")]);
    ids.forEach(function(id){ var rb = findRubrique(id); ligne([txt(rb ? rb.nom : "Rubrique supprimée"), mt(e.chargesParRubrique[id])]); });
    ligne();

    ligne([txt("Détail des charges", 1)]);
    ligne([txt("Date", 3), txt("Rubrique", 3), txt("Montant", 3), txt("Détail", 3)]);
    d.charges.forEach(function(x){ var rb = findRubrique(x.c.rubriqueId); ligne([dt(x.cle), txt(rb ? rb.nom : "Rubrique supprimée"), mt(x.c.montant), txt(x.c.etiquette || "")]); });

    var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews>' +
      '<cols><col min="1" max="1" width="22" customWidth="1"/><col min="2" max="6" width="16" customWidth="1"/></cols><sheetData>';
    lignes.forEach(function(L){
      sheet += '<row r="' + L.r + '">';
      L.cells.forEach(function(c, i){
        var ref = xlsCol(i) + L.r;
        if(c.t === "num") sheet += '<c r="' + ref + '" s="' + c.s + '"><v>' + c.v + '</v></c>';
        else sheet += '<c r="' + ref + '" s="' + c.s + '" t="inlineStr"><is><t xml:space="preserve">' + xlsEsc(c.v) + '</t></is></c>';
      });
      sheet += '</row>';
    });
    sheet += '</sheetData></worksheet>';

    var types = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';
    var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
    var relsWb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
    var wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Salon H" sheetId="1" r:id="rId1"/></sheets></workbook>';
    return xlsZip([
      { nom: "[Content_Types].xml", octets: xlsOctets(types) },

  function escapeHtml(s){

      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];

  function parseMontant(str){
    if(str == null) return 0;
    var digits = String(str).replace(/[^\d]/g, "");
    if(!digits) return 0;
    return parseInt(digits, 10);
  }

  // Sprint 7A : taper un chiffre ne redessine plus l'écran (cause des clignotements

  var REGLES_BOUTONS = [
    ["continuer-statut", peutContinuerStatut],
    ["valider-ajout-perso", peutAjouterPerso],
    ["valider-recette", recetteSaisieValide],

    ["valider-code-acces", codeSaisiValide],
    ["valider-etiquette-autre", function(){ return !!nettoyerEtiquette(ui.etiquetteAutreSaisie); }]   // Sprint 7E
  ];

  function majBoutonsSaisie(){
    for(var i = 0; i < REGLES_BOUTONS.length; i++){
      var liste = app.querySelectorAll('[data-action="' + REGLES_BOUTONS[i][0] + '"]');
      if(!liste.length) continue;
      var ok = !!REGLES_BOUTONS[i][1]();
      for(var j = 0; j < liste.length; j++){
        var b = liste[j];
        var grise = b.hasAttribute("disabled");
        if(ok && grise) b.removeAttribute("disabled");
        else if(!ok && !grise) b.setAttribute("disabled", "");
      }
    }
  }

  // Ancien nom gardé (outil existant) : ne redessine plus, met seulement à jour les boutons.

  // ---------- Sprint 7A : clavier stable ----------
  // Quand un champ de saisie prend le focus, la hauteur de l'écran est figée (le fond
  // ne saute plus quand le clavier s'ouvre), la feuille du bas reste au-dessus du
  // clavier, et le champ actif comme le bouton Enregistrer sont ramenés à l'écran.
  // Repli : sans variables CSS ni visualViewport, l'affichage reste celui de la V1.2.
  var CLAVIER_DELAI_MS = 320;       // le temps que le clavier finisse de s'ouvrir
  var CLAVIER_MARGE_PX = 12;        // espace gardé autour du champ et du bouton
  var docEl = document.documentElement;
  var sondeHauteur = null;
  var clavierActif = false;
  var minuteurRamener = null;

  function estChampTexte(el){
    if(!el || !el.tagName) return false;
    if(el.tagName === "TEXTAREA") return !el.readOnly;
    if(el.tagName !== "INPUT") return false;
    var t = (el.getAttribute("type") || "text").toLowerCase();
    return t === "text" || t === "tel" || t === "number" || t === "email" || t === "search" || t === "password";
  }

  function classeHtml(nom, active){
    var c = " " + (docEl.className || "") + " ";
    var a = c.indexOf(" " + nom + " ") !== -1;
    if(active && !a) docEl.className = (c + nom).replace(/^\s+|\s+$/g, "");
    else if(!active && a) docEl.className = c.replace(" " + nom + " ", " ").replace(/^\s+|\s+$/g, "");
  }

  function hauteur100vh(){
    if(!sondeHauteur){
      sondeHauteur = document.createElement("div");
      sondeHauteur.setAttribute("aria-hidden", "true");
      sondeHauteur.style.cssText = "position:absolute;top:0;left:-9999px;width:1px;height:100vh;visibility:hidden;pointer-events:none;";
      document.body.appendChild(sondeHauteur);
    }
    return sondeHauteur.offsetHeight;
  }

  function majZoneVisible(){
    if(!clavierActif || !docEl.style.setProperty) return;
    var vv = window.visualViewport;
    var visible = vv ? vv.height : window.innerHeight;
    var sousClavier = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
    docEl.style.setProperty("--h-visible", Math.round(visible) + "px");
    docEl.style.setProperty("--clavier", Math.round(sousClavier) + "px");
  }

  function ouvrirModeClavier(){
    if(clavierActif) return;
    clavierActif = true;
    if(docEl.style.setProperty){
      var h = hauteur100vh();
      if(h > 0) docEl.style.setProperty("--h-ecran", h + "px");
    }
    majZoneVisible();
    classeHtml("clavier", true);
  }

  function fermerModeClavier(){
    if(!clavierActif) return;
    clavierActif = false;
    classeHtml("clavier", false);
    if(docEl.style.removeProperty){
      docEl.style.removeProperty("--h-ecran");
      docEl.style.removeProperty("--h-visible");
      docEl.style.removeProperty("--clavier");
    }
  }

  function boutonApres(champ, conteneur){
    var liste = conteneur.querySelectorAll(".btn-primary, .btn-secondary");
    for(var i = 0; i < liste.length; i++){
      if(champ.compareDocumentPosition(liste[i]) & 4) return liste[i];
    }
    return null;
  }

  // Ramène le champ actif à l'écran, avec le bouton qui le suit (Enregistrer) si possible.
  function ramenerChamp(champ){
    if(!champ || !champ.getBoundingClientRect || !app.contains(champ)) return;
    var vv = window.visualViewport;
    var haut = (vv ? vv.offsetTop : 0) + CLAVIER_MARGE_PX;
    var bas = (vv ? vv.offsetTop + vv.height : window.innerHeight) - CLAVIER_MARGE_PX;
    var feuille = champ.closest(".sheet");
    var bouton = boutonApres(champ, feuille || champ.closest(".card") || app);
    var rc = champ.getBoundingClientRect();
    var cibleBas = bouton ? Math.max(rc.bottom, bouton.getBoundingClientRect().bottom) : rc.bottom;
    if(feuille){
      var rf = feuille.getBoundingClientRect();
      haut = Math.max(haut, rf.top + CLAVIER_MARGE_PX);
      bas = Math.min(bas, rf.bottom - CLAVIER_MARGE_PX);
    }
    var decalage = 0;
    if(cibleBas > bas) decalage = cibleBas - bas;
    if(rc.top - decalage < haut) decalage = rc.top - haut; // le champ reste prioritaire
    if(Math.abs(decalage) < 1) return;
    if(feuille) feuille.scrollTop += decalage;
    else window.scrollBy(0, decalage);
  }

  function programmerRamener(champ, delai){
    if(minuteurRamener) clearTimeout(minuteurRamener);
    minuteurRamener = setTimeout(function(){
      minuteurRamener = null;
      if(document.activeElement === champ) ramenerChamp(champ);
    }, delai);
  }

  function installerSuiviClavier(){
    try{ hauteur100vh(); }catch(e){}
    document.addEventListener("focusin", function(e){
      if(!estChampTexte(e.target)) return;
      ouvrirModeClavier();
      programmerRamener(e.target, CLAVIER_DELAI_MS);
    });
    document.addEventListener("focusout", function(){
      setTimeout(function(){ if(!estChampTexte(document.activeElement)) fermerModeClavier(); }, 0);
    });
    function surRedimension(){
      if(!clavierActif) return;
      majZoneVisible();
      var a = document.activeElement;
      if(estChampTexte(a)) programmerRamener(a, 80);
    }
    window.addEventListener("resize", surRedimension);
    if(window.visualViewport){
      window.visualViewport.addEventListener("resize", surRedimension);
      window.visualViewport.addEventListener("scroll", majZoneVisible);
    }
  }

  // ---------- Sprint 7B : corriger avec trace ----------
  // Règle de la famille (Coiffure 8C, Revente E) : une correction garde la trace dans
  // l'enregistrement lui-même — modifieLe (horodatage de la dernière correction) et
  // versionsPrecedentes (anciennes valeurs, la plus récente en dernier). Enregistrer sans
  // rien changer n'ajoute aucune trace. Aucun calcul ne lit ces champs.
  function memeValeur(a, b){
    var videA = (a === null || a === undefined), videB = (b === null || b === undefined);
    if(videA || videB) return videA && videB;
    return a === b;
  }

  function instantane(rec){
    var copie = {};
    for(var k in rec){
      if(Object.prototype.hasOwnProperty.call(rec, k) && k !== "versionsPrecedentes") copie[k] = rec[k];
    }
    return JSON.parse(JSON.stringify(copie));
  }

  // Applique une correction à une charge ; renvoie false si rien n'a changé.
  function appliquerModification(rec, nouveau){
    var change = Object.keys(nouveau).some(function(k){ return !memeValeur(rec[k], nouveau[k]); });
    if(!change) return false;
    var historique = Array.isArray(rec.versionsPrecedentes) ? rec.versionsPrecedentes.slice() : [];
    historique.push(instantane(rec));
    Object.keys(nouveau).forEach(function(k){ rec[k] = nouveau[k]; });
    rec.modifieLe = Date.now();
    rec.versionsPrecedentes = historique;
    return true;
  }

  function texteModifieLe(ts){
    var d = new Date(ts);
    if(isNaN(d.getTime())) return "";
    return formatDateCourte(dateToKey(d)) + " à " + formatHeure(ts);
  }

  function renderModifieLe(rec, libelle){
    if(!rec || !rec.modifieLe) return "";
    var t = texteModifieLe(rec.modifieLe);
    return t ? '<div class="modifie-le" data-test="modifie-le">✏️ ' + (libelle || "Modifié le ") + t + '</div>' : "";
  }

  // Message doux quand un jour passé change (jamais bloquant).
  function messageJourCorrige(cle){
    return "Le " + formatDateCourte(cle) + " est corrigé · Mon état est à jour.";
  }

  function jourVide(j){
    return !!j && !(j.charges && j.charges.length) && !(j.clients && j.clients.length) && j.recetteSaisie == null &&
           !(j.creancesRecouvrees && j.creancesRecouvrees.length) && !(j.recette > 0);
  }

  // ---------- Sprint 7B : Annuler pendant 5 secondes ----------
  // Après une création (charge, première recette d'un jour, loyer noté) : message hors de
  // #app avec [Annuler]. Annuler retire exactement ce qui vient d'être créé, rien d'autre.
  var DUREE_ANNULER_MS = 5000;
  var annulation = null;

  function retirerAnnuler(){
    if(!annulation) return;
    clearTimeout(annulation.minuteur);
    if(annulation.el.parentNode) annulation.el.parentNode.removeChild(annulation.el);
    annulation = null;
  }

  function proposerAnnuler(texte, defaire){
    retirerAnnuler();
    retirerInfoTheme();
    var el = document.createElement("div");
    el.id = "annuler-msg";
    el.setAttribute("role", "status");
    el.setAttribute("data-test", "annuler-msg");
    el.innerHTML = '<span class="am-txt">' + escapeHtml(texte) + '</span><button type="button" class="am-btn" data-test="bouton-annuler">Annuler</button>';
    var a = { el: el };
    el.querySelector("button").onclick = function(){
      if(annulation !== a) return;
      retirerAnnuler();
      defaire();
      saveState();
      afficherToast("Annulé.");
    };
    a.minuteur = setTimeout(function(){
      if(annulation === a) retirerAnnuler();
      verifierMajEnAttente();
    }, DUREE_ANNULER_MS);
    annulation = a;
    document.body.appendChild(el);
  }

  // Retire une charge créée (et ce que sa création a changé).
  function annulationCharge(cle, idCharge, jourCree, rubriqueId, montant, avaitDernier, dernierAvant){
    return function(){
      var j = state.jours[cle];
      if(j) j.charges = (j.charges || []).filter(function(c){ return c.id !== idCharge; });
      if(rubriqueId && state.dernierMontant[rubriqueId] === montant){
        if(avaitDernier) state.dernierMontant[rubriqueId] = dernierAvant;
        else delete state.dernierMontant[rubriqueId];
      }
      if(j && jourCree && jourVide(j)) delete state.jours[cle];
    };
  }

  // ---------- Sprint 7C : thème clair « bandeau MonDjai » / Automatique / Sombre ----------
  // Une seule source de couleurs : les variables CSS, en deux jeux (:root = sombre, valeurs de la 7B ;
  // html[data-theme="clair"] = clair, palette du § 9.1). config.theme = 'clair' | 'auto' | 'sombre' ;
  // absent = 'clair', lu à la volée : rien n'est écrit tant que l'utilisateur ne choisit pas.
  // Le script de <head> pose data-theme avant le premier affichage ; ces fonctions le tiennent à jour
  // (choix dans Réglages, sauvegarde restaurée, téléphone en Automatique), sans rechargement.
  var CHOIX_THEMES = ["clair", "auto", "sombre"];
  var LIBELLES_THEMES = { clair: "Clair", auto: "Automatique", sombre: "Sombre" };
  var FOND_THEME = { clair: "#eff1f4", sombre: "#11141a" };   // = background_color du manifest (clair) et fond de la 7B (sombre)
  var COULEUR_BANDEAU = "#141922";
  var BANDEAU_MARGE_PX = 12;          // sous l'en-tête, le bandeau dépasse de 12 px (écrans sans carte posée dessus)
  var DUREE_TRANSITION_MS = 220;      // transition courte, seulement lors d'un vrai changement d'écran
  var DUREE_INFO_THEME_MS = 8000;     // message unique « Nouveau : affichage clair »

  function themeChoisi(){
    var t = state && state.config ? state.config.theme : null;
    return CHOIX_THEMES.indexOf(t) !== -1 ? t : "clair";
  }
  function telephoneEnSombre(){
    try{ return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }catch(e){ return false; }
  }
  function themeEffectif(){
    var c = themeChoisi();
    return (c === "sombre" || (c === "auto" && telephoneEnSombre())) ? "sombre" : "clair";
  }
  var fondApplique = null;
  function appliquerTheme(){
    var t = themeEffectif();
    var racine = document.documentElement;
    if(racine.getAttribute("data-theme") !== t) racine.setAttribute("data-theme", t);
    if(fondApplique !== t){ racine.style.backgroundColor = FOND_THEME[t]; fondApplique = t; }
    signeMoins = t === "clair" ? "−" : "-";
  }
  // Automatique : suit en direct le réglage clair / sombre du téléphone.
  function suivreThemeTelephone(){
    try{
      if(!window.matchMedia) return;
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var surChangement = function(){ if(themeChoisi() === "auto"){ appliquerTheme(); render(); } };
      if(mq.addEventListener) mq.addEventListener("change", surChangement);
      else if(mq.addListener) mq.addListener(surChangement);
    }catch(e){}
  }

  function aLaClasse(el, nom){ return !!el && (" " + (el.className || "") + " ").indexOf(" " + nom + " ") !== -1; }

  // Bandeau MonDjai (thème clair) : sur les écrans de l'application (pas sur le code d'accès, le PIN
  // ni le premier lancement). Sur Aujourd'hui, il descend jusqu'au milieu de la première carte ;
  // ailleurs, il couvre l'en-tête. Hauteur mesurée après chaque rendu et à chaque changement de taille.
  function majBandeau(){
    var racine = document.documentElement;
    var brand = null, cible = null, i;
    var avec = themeEffectif() === "clair" && state.config.codeAccesOk && !ui.verrouille && state.config.onboardingComplete && !BOOT.secoursAffiche;
    if(avec){
      for(i = 0; i < app.children.length; i++){ if(aLaClasse(app.children[i], "brand")){ brand = app.children[i]; break; } }
      avec = !!brand;
    }
    classeHtml("avec-bandeau", avec);
    if(avec){
      if((ui.page || "jour") === "jour"){
        var pileCases = app.querySelector(".blocks-stack");   // Sprint 7E : la case Recette chevauche le bandeau
        if(pileCases) cible = pileCases.firstElementChild || pileCases;
      }
      var y = window.pageYOffset || 0, h;
      if(cible){ var r = cible.getBoundingClientRect(); h = r.top + y + r.height / 2; }
      else { var rb = brand.getBoundingClientRect(); h = rb.bottom + y + BANDEAU_MARGE_PX; }
      var val = Math.max(0, Math.round(h)) + "px";
      if(racine.style.getPropertyValue("--bandeau-h") !== val) racine.style.setProperty("--bandeau-h", val);
    }
    // Barre du téléphone : sombre en Sombre ; en clair, la couleur du bandeau quand l'écran en a un.
    var meta = document.querySelector('meta[name="theme-color"]');
    var couleur = themeEffectif() === "sombre" ? FOND_THEME.sombre : (avec ? COULEUR_BANDEAU : FOND_THEME.clair);
    if(meta && meta.getAttribute("content") !== couleur) meta.setAttribute("content", couleur);
  }

  // Transitions courtes : seulement lors d'un vrai changement d'écran (jamais pendant la saisie ni
  // à l'ouverture d'une feuille), en thème clair, et jamais si « mouvement réduit » ou téléphone modeste.
  var dernierEcran = null, minuteurTransition = null;
  function cleEcran(){
    if(!state.config.codeAccesOk) return "code";
    if(ui.verrouille) return "pin";
    if(!state.config.onboardingComplete) return "accueil-" + (ui.onboardingStep || "statut");
    var p = ui.page || "jour";
    if(p === "etat" && ui.etatSemaineOuverte) p += "-semaine";
    if(p === "jour-detail") p += "-" + ui.historiqueSelection;
    return p;
  }
  function animationsPermises(){
    if(aLaClasse(document.documentElement, "sans-anim")) return false;
    try{ if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false; }catch(e){}
    return true;
  }
  function retirerClasseApp(nom){
    var c = " " + (app.className || "") + " ";
    if(c.indexOf(" " + nom + " ") !== -1) app.className = c.replace(" " + nom + " ", " ").replace(/^\s+|\s+$/g, "");
  }
  function majTransition(){
    var cle = cleEcran();
    var change = dernierEcran !== null && cle !== dernierEcran;
    dernierEcran = cle;
    if(!change || themeEffectif() !== "clair" || !animationsPermises()) return;
    if(aLaClasse(app, "ecran-change")){ retirerClasseApp("ecran-change"); void app.offsetWidth; }
    app.className = (app.className ? app.className + " " : "") + "ecran-change";
    if(minuteurTransition) clearTimeout(minuteurTransition);
    minuteurTransition = setTimeout(function(){ minuteurTransition = null; retirerClasseApp("ecran-change"); }, DUREE_TRANSITION_MS);
  }

  // Message unique à la première ouverture après la mise à jour (hors de #app, comme Annuler).
  var infoTheme = null, infoThemeExaminee = false;
  function retirerInfoTheme(){
    if(!infoTheme) return;
    clearTimeout(infoTheme.minuteur);
    if(infoTheme.el.parentNode) infoTheme.el.parentNode.removeChild(infoTheme.el);
    infoTheme = null;
  }
  function verifierInfoTheme(){
    if(infoThemeExaminee) return;
    if(!state.config.codeAccesOk || ui.verrouille || !state.config.onboardingComplete || BOOT.secoursAffiche) return;
    infoThemeExaminee = true;
    if(Object.prototype.hasOwnProperty.call(state.config, "theme") || state.meta.infoThemeVue) return;
    state.meta.infoThemeVue = true;   // montré une fois : jamais reproposé, même après un rechargement
    saveState();
    if(annulation) return;
    var el = document.createElement("div");
    el.id = "theme-info";
    el.setAttribute("role", "status");
    el.setAttribute("data-test", "info-theme");
    el.innerHTML = '<button type="button" class="ti-txt" data-test="info-theme-reglages">Nouveau : affichage clair · Réglages › Affichage</button>' +
                   '<button type="button" class="ti-btn" data-test="info-theme-ok">OK</button>';
    var a = { el: el };
    el.firstChild.onclick = function(){
      retirerInfoTheme();
      handleAction("ouvrir-reglages", el);
      var s = document.getElementById("reglages-affichage");
      if(s && s.scrollIntoView) s.scrollIntoView();
    };
    el.lastChild.onclick = function(){ retirerInfoTheme(); };
    a.minuteur = setTimeout(function(){ if(infoTheme === a) retirerInfoTheme(); }, DUREE_INFO_THEME_MS);
    infoTheme = a;
    document.body.appendChild(el);
  }

  function apresRenduTheme(){
    if(!aLaClasse(document.documentElement, "clavier")) majHauteurCases();   // Sprint 7E (jamais pendant que le clavier est ouvert)
    majBandeau();
    majTransition();
    verifierInfoTheme();
  }


  // ---------- Sprint 7B : mises à jour automatiques ----------
  // Mécanisme de la famille (Coiffure 8C, Revente) : quand index.html ET sw.js sont
  // remplacés sur GitHub (numéro VERSION_CACHE changé), le téléphone le détecte seul :
  //  - vérification à chaque ouverture et à chaque retour au premier plan
  //    (registration.update(), silencieux, ignoré hors ligne) ;
  //  - le nouveau service worker prend le contrôle (« controllerchange ») et la page se
  //    recharge UNE seule fois, seulement si aucune saisie n'est en cours ;
  //  - sinon, bandeau « Nouvelle version · Mettre à jour » (#maj-banner, hors de #app),
  //    et le rechargement se fait dès que c'est sans risque.
  // Les données ne sont jamais touchées (enregistrées à chaque action, vérifiées avant).
  var MAJ_CLE_SESSION = "salonh_maj_auto";
  var MAJ_ANTI_BOUCLE_MS = 10000;   // une page issue d'un rechargement automatique ne se recharge plus seule pendant 10 s
  var maj = { prete: false, rechargementLance: false };
  var swRegistration = null;
  var swControleurAuDemarrage = false;
  var pageIssueDunRechargementAuto = false;
  try{ pageIssueDunRechargementAuto = sessionStorage.getItem(MAJ_CLE_SESSION) === "1"; }catch(e){}
  if(pageIssueDunRechargementAuto){
    setTimeout(function(){
      try{ sessionStorage.removeItem(MAJ_CLE_SESSION); }catch(e){}
      pageIssueDunRechargementAuto = false;
    }, MAJ_ANTI_BOUCLE_MS);
  }

  function assurerEtatEnregistre(){
    if(BOOT.secours && BOOT.secours.verification) return;
    try{
      var stocke = localStorage.getItem(STORAGE_KEY);
      if(stocke !== null && stocke !== JSON.stringify(state)) saveState();
    }catch(e){}
  }

  function rechargementSansRisque(){
    var actif = document.activeElement;
    if(actif && /^(INPUT|TEXTAREA|SELECT)$/.test(actif.tagName) && actif.value) return false;
    if(annulation || clavierActif) return false;
    if(!state.config.codeAccesOk) return !normaliserCode(ui.codeSaisie);
    if(ui.verrouille) return !ui.pinSaisie && !ui.pinOublieConfirmation;
    if(!state.config.onboardingComplete) return false;
    return !ui.modal && (ui.page || "jour") === "jour" && !ui.jourSelection && !ui.restaurationFichier;
  }

  function rechargerPourMaj(automatique){
    if(maj.rechargementLance) return;
    maj.rechargementLance = true;
    assurerEtatEnregistre();
    if(BOOT.secours && BOOT.secours.vider) BOOT.secours.vider();
    try{ if(automatique) sessionStorage.setItem(MAJ_CLE_SESSION, "1"); }catch(e){}
    window.location.reload();
  }

  function afficherBanniereMaj(){
    if(document.getElementById("maj-banner")) return;
    var b = document.createElement("div");
    b.id = "maj-banner";
    b.setAttribute("role", "status");
    b.setAttribute("data-test", "maj-banner");
    b.innerHTML = '<span class="mb-txt">Nouvelle version</span><button type="button" class="mb-btn">Mettre à jour</button>';
    b.querySelector("button").onclick = function(){ rechargerPourMaj(false); };
    document.body.appendChild(b);
    if((" " + document.body.className + " ").indexOf(" maj-visible ") === -1) document.body.className = (document.body.className + " maj-visible").replace(/^\s+/, "");
  }

  // Appelée après chaque rendu et à la prise de contrôle d'une nouvelle version.
  function verifierMajEnAttente(){
    if(!maj || !maj.prete || maj.rechargementLance) return;
    if(!pageIssueDunRechargementAuto && rechargementSansRisque()){
      rechargerPourMaj(true);
      return;
    }
    afficherBanniereMaj();
  }

  function verifierMiseAJourSw(){
    if(!swRegistration) return;
    if(navigator.onLine === false) return;   // hors ligne : rien à vérifier, aucune erreur
    try{
      var p = swRegistration.update();
      if(p && typeof p.catch === "function") p.catch(function(){});
    }catch(e){}
  }

  function enregistrerServiceWorker(){
    if(!("serviceWorker" in navigator)) return;
    // Premier lancement (aucun service worker ne contrôlait la page) : la prise de
    // contrôle qui suit l'installation ne doit PAS recharger la page.
    swControleurAuDemarrage = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(!swControleurAuDemarrage){ swControleurAuDemarrage = true; return; }
      maj.prete = true;
      verifierMajEnAttente();
    });
    var demarrer = function(){
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function(reg){
        swRegistration = reg;
        if(swControleurAuDemarrage) verifierMiseAJourSw();
      }).catch(function(){});
    };
    if(document.readyState === "complete") demarrer();
    else window.addEventListener("load", demarrer);
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible") verifierMiseAJourSw();
    });
  }

  function texteProtection(){
    return BOOT.secours && BOOT.secours.etatTexte ? BOOT.secours.etatTexte() : "copie de secours indisponible sur ce navigateur";
  }

  // ---------- Démarrage ----------

  if(!state.config.onboardingComplete && ui.onboardingStep === "rubriques"){
    initRubriquesDraft();
  }

  render();
  suivreThemeTelephone();   // Sprint 7C : Automatique suit le téléphone en direct
  try{ window.addEventListener("resize", function(){ if(!aLaClasse(document.documentElement, "clavier")) majHauteurCases(); majBandeau(); }); }catch(e){}
  // Sprint 7A : premier écran affiché ; le script de secours (en bas de page) n'a rien à faire.
  BOOT.ok = true;
  BOOT.premierRendu = BOOT.maintenant();
  installerSuiviClavier();
  // Rien de lourd avant le premier affichage : le reste vient juste après.
  setTimeout(function(){ enrichirContexte(); verifierHorsLigne(); }, 0);

  // Sprint 7B : la ligne « Protection » de Réglages suit la copie de secours, sans redessiner l'écran.
  if(BOOT.secours){
    BOOT.secours.surChangement = function(){
      var el = document.getElementById("protection-val");
      var t = texteProtection();
      if(el && el.textContent !== t) el.textContent = t;
    };
  }
  enregistrerServiceWorker();
})();
</script>
<script>
/* Sprint 7A — si l'application n'a pas démarré (erreur, données illisibles, navigateur
   trop ancien…), on affiche l'écran de secours au lieu d'un écran vide. */
(function(){
  var B = window.SALONH_BOOT;
  if(!B || B.ok || !B.afficherSecours) return;
  var ATTENTE_SECOURS_MS = 600;   // Sprint 7B : le temps de lire la copie de secours
  var fait = false;
  var montrer = function(){
    if(fait || (B.secours && B.secours.restaure)) return;
    fait = true;
    B.afficherSecours(B.bloque || B.raison || "erreur");
  };
  if(B.secours && B.secours.verification && B.secours.apres){
    B.secours.apres(montrer);
    setTimeout(montrer, ATTENTE_SECOURS_MS);
  }else{
    montrer();
  }
})();
</script>
