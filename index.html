        loyerRappelMasque: null,        // V1.2 : 'AAAA-MM-JJ' du jour où le bandeau « Loyer dû » a été repoussé
        infoThemeVue: false,            // Sprint 7C : message unique « Nouveau : affichage clair » déjà montré
        rappelSaisieVu: null            // Sprint 7E : 'AAAA-MM-JJ' du dernier jour où le rappel « Hier n'est pas noté » a été montré
      }
    };
  }

  var state = loadState();
  if(!state.meta.creation){ state.meta.creation = todayKeyBrut(); saveState(); }

  function todayKeyBrut(){
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() < 9 ? "0" : "") + (d.getMonth() + 1) + "-" + (d.getDate() < 10 ? "0" : "") + d.getDate();
  }

  function loadState(){
    var raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(!raw) return defaultState();
    var parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ parsed = null; }
    if(!parsed || typeof parsed !== "object"){
      // Sprint 7A : en V1.2, des données illisibles étaient remplacées sans bruit par un état
      // vide (puis écrasées). Désormais rien n'est écrit : l'écran de secours s'affiche.
      BOOT.raison = "illisible";
      throw new Error("Données enregistrées illisibles");
    }
    var base = defaultState();
    return migrerEtat({
      version: 1,
      config: Object.assign({}, base.config, parsed.config || {}),
      jours: parsed.jours || {},
      dernierMontant: parsed.dernierMontant || {},
      creances: parsed.creances || [],
      objectif: parsed.objectif || null,
      meta: Object.assign({}, base.meta, parsed.meta || {})
    });
  }

  // V1.2 : mise à niveau douce d'un état V1.0/V1.1 (aucune donnée supprimée).
  function migrerEtat(st){
    var cfg = st.config;
    // Rubriques : noms/icônes métier pour les rubriques préconfigurées, ajout des nouvelles.
    if(cfg.onboardingComplete && Array.isArray(cfg.rubriques)){
      RUBRIQUES_PRECONFIGUREES.forEach(function(pr){
        var ex = null;
        for(var i=0;i<cfg.rubriques.length;i++){ if(cfg.rubriques[i].id === pr.id) ex = cfg.rubriques[i]; }
        if(ex){
          if(!ex.perso){ ex.nom = pr.nom; ex.icone = pr.icone; }
        }else{
          var actif = pr.id === "cotisation" ? cfg.statut === "locataire" : !!pr.defaut;
          cfg.rubriques.push({ id:pr.id, nom:pr.nom, icone:pr.icone, couleur:pr.couleur, actif:actif, perso:false });
        }
      });
    }
    if(["jour","semaine","mois"].indexOf(cfg.loyerFrequence) === -1) cfg.loyerFrequence = "jour";
    if(!(cfg.loyerJour >= 1)) cfg.loyerJour = 1;
    // Objectif V1.0/V1.1 (pourcentage du solde net) → modèle V1.2 « Auto » (pourcentage de la recette).
    if(st.objectif && !st.objectif.mode){
      st.objectif.mode = "auto";
      st.objectif.montantJour = null;
      if(!st.objectif.pourcentage) st.objectif.pourcentage = 10;
    }
    if(st.objectif){
      var m = trouverModeleObjectif(st.objectif.modele);
      if(!st.objectif.icone) st.objectif.icone = m ? m.icone : "💰";
      if(!(st.objectif.montantCible >= 0)) st.objectif.montantCible = 0;
    }
    return st;
  }

  function saveState(){
    var secours = BOOT.secours;
    if(secours && secours.verification){
      if(!ecritureDifferee){
        ecritureDifferee = true;
        secours.apres(function(){ ecritureDifferee = false; if(!secours.restaure) saveState(); });
      }
      return;
    }
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      // stockage indisponible : on continue sans bloquer l'utilisateur
    }
    if(secours && secours.miroir) secours.miroir();   // Sprint 7B : copie 500 ms plus tard
  }

  // ---------- Utilitaires ----------

  function pad2(n){ return n < 10 ? "0" + n : "" + n; }

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function todayLabel(){
    var d = new Date();
    try{
      var s = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long" }).format(d);
      return s.charAt(0).toUpperCase() + s.slice(1);
    }catch(e){
      return todayKey();
    }
  }

  // Sprint 7C : vrai signe moins (−) à l'écran en thème clair ; le sombre garde « - » (identique à la 7B).
  var signeMoins = "-";
  function formatFCFA(n){
    var val = Math.round(Number(n) || 0);
    var sign = val < 0 ? signeMoins : "";
    var abs = Math.abs(val);
    var str = String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return sign + str + " F";
  }

  // Image partagée : ses propres textes, inchangés (« - » ordinaire), quel que soit le thème.
  function formatFCFAImage(n){
    var val = Math.round(Number(n) || 0);
    var sign = val < 0 ? "-" : "";
    var abs = Math.abs(val);
    var str = String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return sign + str + " F";
  }

  function uid(prefix){
    return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
  }

  // Jour sur lequel porte la saisie de l'écran Aujourd'hui (V1.1 : un jour passé peut être choisi).
  function jourSaisieKey(){
    return ui.chargeCle || ui.jourSelection || todayKey();   // Sprint 7D : ui.chargeCle seulement pendant une feuille ouverte depuis Mes charges
  }

  function ensureJour(cle){
    var key = cle || jourSaisieKey();
    if(!state.jours[key]){
      state.jours[key] = {
        date: key,
        origine: "salon-h",
        recette: 0,
        clients: [],
        charges: [],
        creancesRecouvrees: []
      };
      if(key < todayKey()) state.jours[key].saisiApresCoup = true;
    }
    return state.jours[key];
  }

  // Lecture sans création (évite de créer des journées vides en consultant).
  function lireJour(key){
    return state.jours[key] || { date:key, origine:"salon-h", recette:0, clients:[], charges:[], creancesRecouvrees:[] };
  }

  function totalChargesJour(jour){
    return (jour.charges || []).reduce(function(s,c){ return s + c.montant; }, 0);
  }

  // Recette = clients encaissés + créances recouvrées ce jour-là.
  // Recette du jour. V1.2 : saisie une fois en fin de journée (recetteSaisie), comme Trépor.
  // Les jours V1.0/V1.1 saisis client par client restent lus via la somme des clients.
  function recalculerRecette(jour){
    var r;
    if(jour.recetteSaisie != null){ r = jour.recetteSaisie; }
    else { r = (jour.clients || []).reduce(function(s,c){ return s + c.montant; }, 0); }
    creancesRecouvreesDe(jour).forEach(function(cr){ r += cr.montant; });
    jour.recette = r;
  }

  function nbClientsJour(jour){
    if(!jour) return 0;
    if(jour.nbClients != null) return jour.nbClients;
    return (jour.clients || []).length;
  }

  // Enregistre la recette du jour (+ loyer quotidien automatique la première fois).
  // Sprint 7B : renvoie { loyerAjoute, creation, corrige, cle, annuler }.
  //  - recette déjà notée (même 0, ou anciens clients) : correction tracée sur le jour
  //    (modifieLe, versionsPrecedentes : recetteSaisie, nbClients, recette) ;
  //  - sinon : création, que « Annuler » peut retirer exactement.
  function enregistrerRecette(montant, nbClients){
    var cle = jourSaisieKey();
    var jourCree = !state.jours[cle];
    var jour = ensureJour();
    var premiere = !(jour.recette > 0);
    var nbNouveau = nbClients > 0 ? nbClients : null;
    var dejaNotee = jour.recetteSaisie != null || (jour.clients && jour.clients.length > 0);
    var corrige = false;
    if(dejaNotee && (!memeValeur(jour.recetteSaisie, montant) || !memeValeur(jour.nbClients, nbNouveau))){
      var historique = Array.isArray(jour.versionsPrecedentes) ? jour.versionsPrecedentes.slice() : [];
      historique.push({ recetteSaisie: jour.recetteSaisie != null ? jour.recetteSaisie : null, nbClients: jour.nbClients != null ? jour.nbClients : null, recette: jour.recette });
      jour.versionsPrecedentes = historique;
      jour.modifieLe = Date.now();
      corrige = true;
    }
    var avaitRS = Object.prototype.hasOwnProperty.call(jour, "recetteSaisie"), rsAvant = jour.recetteSaisie;
    var avaitNb = Object.prototype.hasOwnProperty.call(jour, "nbClients"), nbAvant = jour.nbClients;
    jour.recetteSaisie = montant;
    jour.nbClients = nbNouveau;
    recalculerRecette(jour);
    var idLoyer = null;
    var loyerAjoute = false;
    if(premiere && montant > 0 && state.config.loyerFrequence === "jour" && state.config.statut === "locataire" && state.config.cotisationHabituelle > 0){
      var rub = findRubrique("cotisation");
      var dejaLa = jour.charges.some(function(c){ return c.rubriqueId === "cotisation"; });
      if(rub && rub.actif && !dejaLa){
        idLoyer = uid("charge");
        jour.charges.push({ id: idLoyer, rubriqueId:"cotisation", montant: state.config.cotisationHabituelle, ts: Date.now(), auto:true });
        loyerAjoute = true;
      }
    }
    saveState();
    var annuler = null;
    if(!dejaNotee){
      annuler = function(){
        var j = state.jours[cle];
        if(!j) return;
        if(avaitRS) j.recetteSaisie = rsAvant; else delete j.recetteSaisie;
        if(avaitNb) j.nbClients = nbAvant; else delete j.nbClients;
        if(idLoyer) j.charges = (j.charges || []).filter(function(c){ return c.id !== idLoyer; });
        recalculerRecette(j);
        if(jourCree && jourVide(j)) delete state.jours[cle];
      };
    }
    return { loyerAjoute: loyerAjoute, creation: !dejaNotee, corrige: corrige, cle: cle, annuler: annuler };
  }

  // Tri d'affichage (V1.1, repris de Trépor) : cotisation en tête, puis montant décroissant.
  function trierCharges(liste){
    return liste.slice().sort(function(a,b){
      if(a.rubriqueId === "cotisation" && b.rubriqueId !== "cotisation") return -1;
      if(b.rubriqueId === "cotisation" && a.rubriqueId !== "cotisation") return 1;
      return b.montant - a.montant;
    });
  }

  // Montants les plus récemment encaissés (4 max, distincts), pour les boutons rapides.
  function montantsRapides(){
    var tous = [];
    Object.keys(state.jours).forEach(function(k){
      (state.jours[k].clients || []).forEach(function(c){ tous.push(c); });
    });
    tous.sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    var vus = [];
    for(var i=0;i<tous.length && vus.length<4;i++){
      if(tous[i].montant > 0 && vus.indexOf(tous[i].montant) === -1) vus.push(tous[i].montant);
    }
    return vus.sort(function(a,b){ return a - b; });
  }

  // Ajoute un client encaissé sur le jour de saisie (+ cotisation automatique si activée).
  function ajouterClient(montant){
    var jour = ensureJour();
    var premier = jour.clients.length === 0;
    jour.clients.push({ id: uid("client"), montant: montant, ts: Date.now() });
    recalculerRecette(jour);
    var cotisationAjoutee = false;
    if(premier && state.config.loyerFrequence === "jour" && state.config.statut === "locataire" && state.config.cotisationHabituelle > 0){
      var rub = findRubrique("cotisation");
      var dejaLa = jour.charges.some(function(c){ return c.rubriqueId === "cotisation"; });
      if(rub && rub.actif && !dejaLa){
        jour.charges.push({ id: uid("charge"), rubriqueId:"cotisation", montant: state.config.cotisationHabituelle, ts: Date.now(), auto:true });
        cotisationAjoutee = true;
      }
    }
    saveState();
    return cotisationAjoutee;
  }

  // Part de l'objectif (F8) pour un jour donné — même règle que montantEpargneEstime.
  // V1.2 (modèle MonDjai/Coiffure) : l'épargne est calculée sur la RECETTE du jour.
  // Auto : pourcentage de la recette. Manuel : montant fixe chaque jour travaillé (au moins un client).
  function epargneDuJour(key){
    var obj = state.objectif;
    if(!obj || key < obj.dateCreation) return 0;
    var j = state.jours[key];
    if(!j || !(j.recette > 0)) return 0;
    if(obj.mode === "manuel") return obj.montantJour > 0 ? obj.montantJour : 0;
    return Math.round(j.recette * (obj.pourcentage || 0) / 100);
  }

  function epargnePlage(startKey, endKey){
    var total = 0;
    Object.keys(state.jours).forEach(function(k){
      if(k >= startKey && k <= endKey) total += epargneDuJour(k);
    });
    return total;
  }

  // Loyer (V1.2) : dernière échéance ≤ aujourd'hui pour un loyer hebdomadaire ou mensuel.
  function derniereEcheanceLoyer(){
    var cfg = state.config;
    var d = new Date(); d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if(cfg.loyerFrequence === "semaine"){
      var cible = cfg.loyerJour % 7; // 1..6 = lundi..samedi, 7 → 0 = dimanche
      while(d.getDay() !== cible){ d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1); }
      return dateToKey(d);
    }
    if(cfg.loyerFrequence === "mois"){
      var jourMois = function(annee, mois){ return Math.min(cfg.loyerJour, new Date(annee, mois + 1, 0).getDate()); };
      var e = new Date(d.getFullYear(), d.getMonth(), jourMois(d.getFullYear(), d.getMonth()));
      if(e > d){
        var pm = new Date(d.getFullYear(), d.getMonth() - 1, 1);
        e = new Date(pm.getFullYear(), pm.getMonth(), jourMois(pm.getFullYear(), pm.getMonth()));
      }
      return dateToKey(e);
    }
    return null;
  }

  function loyerNoteDepuis(cle){
    var today = todayKey();
    return Object.keys(state.jours).some(function(k){
      return k >= cle && k <= today && (state.jours[k].charges || []).some(function(c){ return c.rubriqueId === "cotisation"; });
    });
  }

  // Bandeau « Loyer dû » : loyer hebdomadaire/mensuel, échéance atteinte, pas encore noté, pas repoussé aujourd'hui.
  function loyerDu(){
    var cfg = state.config;
    if(cfg.statut !== "locataire" || !(cfg.cotisationHabituelle > 0) || cfg.loyerFrequence === "jour") return null;
    var rub = findRubrique("cotisation");
    if(!rub || !rub.actif) return null;
    var ech = derniereEcheanceLoyer();
    if(!ech || (state.meta.creation && ech < state.meta.creation)) return null;
    if(loyerNoteDepuis(ech)) return null;
    if(state.meta.loyerRappelMasque === todayKey()) return null;
    return ech;
  }

  function libelleLoyer(){
    var cfg = state.config;
    if(cfg.loyerFrequence === "semaine") return "chaque " + JOURS_SEMAINE[(cfg.loyerJour - 1) % 7];
    if(cfg.loyerFrequence === "mois") return "le " + cfg.loyerJour + " de chaque mois";
    return "chaque jour travaillé";
  }

  function normaliserCode(s){
    return String(s || "").replace(/\s+/g, "").toUpperCase();
  }

  function estInstallee(){
    try{
      if(window.matchMedia && (window.matchMedia("(display-mode: standalone)").matches ||
         window.matchMedia("(display-mode: fullscreen)").matches ||
         window.matchMedia("(display-mode: minimal-ui)").matches)) return true;
    }catch(e){}
    return !!(window.navigator && window.navigator.standalone);
  }

  // Jours antérieurs au Sprint 2 : le tableau des créances recouvrées n'existe pas encore.
  function creancesRecouvreesDe(jour){
    return (jour && jour.creancesRecouvrees) || [];
  }

  function rubriquesActives(){
    return state.config.rubriques.filter(function(r){ return r.actif; });
  }

  function findRubrique(id){
    for(var i=0;i<state.config.rubriques.length;i++){
      if(state.config.rubriques[i].id === id) return state.config.rubriques[i];
    }
    return null;
  }

  function findChargeDuJour(jour, id){
    for(var i=0;i<jour.charges.length;i++){
      if(jour.charges[i].id === id) return jour.charges[i];
    }
    return null;
  }

  function findCreance(id){
    for(var i=0;i<state.creances.length;i++){
      if(state.creances[i].id === id) return state.creances[i];
    }
    return null;
  }

  function creancesEnCours(){
    return state.creances.filter(function(c){ return c.statut === "en_cours"; });
  }

  function sommeCreancesEnCours(){
    return creancesEnCours().reduce(function(s,c){ return s + c.montant; }, 0);
  }

  // ---------- Dates ----------

  function parseDateKey(key){
    var parts = String(key).split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function dateToKey(d){
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function joursDepuis(key){
    var d = parseDateKey(key);
    var now = new Date();
    var todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((todayMidnight - d) / 86400000);
  }

  function formatDateLabel(key){
    var d = parseDateKey(key);
    try{
      var s = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" }).format(d);
      return s.charAt(0).toUpperCase() + s.slice(1);
    }catch(e){
      return key;
    }
  }

  function formatDateCourte(key){
    var d = parseDateKey(key);
    try{
      return new Intl.DateTimeFormat("fr-FR", { day:"numeric", month:"short" }).format(d);
    }catch(e){
      return key;
    }
  }

  function lundiDeLaSemaine(d){
    var day = d.getDay(); // 0=dimanche .. 6=samedi
    var diff = (day === 0 ? -6 : 1 - day);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
  }

  function bornesPeriode(mode, offset){
    var today = new Date();
    if(mode === "jour"){
      var dj = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset);
      return { debut: dj, fin: dj };
    }
    if(mode === "mois"){
      var refMois = new Date(today.getFullYear(), today.getMonth() + offset, 1);
      var debut = new Date(refMois.getFullYear(), refMois.getMonth(), 1);
      var fin = new Date(refMois.getFullYear(), refMois.getMonth() + 1, 0);
      return { debut: debut, fin: fin };
    }
    var refSemaine = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset * 7);
    var lundi = lundiDeLaSemaine(refSemaine);
    var dimanche = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
    return { debut: lundi, fin: dimanche };
  }

  function labelPeriode(mode, offset){
    var b = bornesPeriode(mode, offset);
    if(mode === "jour"){
      if(offset === 0) return "Aujourd’hui · " + formatDateCourte(dateToKey(b.debut));
      if(offset === -1) return "Hier · " + formatDateCourte(dateToKey(b.debut));
      return formatDateLabel(dateToKey(b.debut));
    }
    if(mode === "mois"){
      try{
        var s = new Intl.DateTimeFormat("fr-FR", { month:"long", year:"numeric" }).format(b.debut);
        return s.charAt(0).toUpperCase() + s.slice(1);
      }catch(e){
        return dateToKey(b.debut).slice(0,7);
      }
    }
    return "Semaine du " + formatDateCourte(dateToKey(b.debut)) + " au " + formatDateCourte(dateToKey(b.fin));
  }

  function calculerEtat(mode, offset){
    var b = bornesPeriode(mode, offset);
    return calculerPlage(dateToKey(b.debut), dateToKey(b.fin));
  }

  function calculerPlage(startKey, endKey){
    var nbClients = 0;
    var recetteClients = 0;
    var nbJoursTravailles = 0;
    var recetteTotale = 0;
    var chargesTotal = 0;
    var chargesParRubrique = {};
    var creancesRecouvreesTotal = 0;

    Object.keys(state.jours).forEach(function(k){
      if(k >= startKey && k <= endKey){
        var j = state.jours[k];
        nbClients += nbClientsJour(j);
        recetteTotale += j.recette;
        recetteClients += j.recette;
        if(jourADesDonnees(j)) nbJoursTravailles += 1;
        j.charges.forEach(function(c){
          chargesTotal += c.montant;
          chargesParRubrique[c.rubriqueId] = (chargesParRubrique[c.rubriqueId] || 0) + c.montant;
        });
        creancesRecouvreesDe(j).forEach(function(cr){
          creancesRecouvreesTotal += cr.montant;
        });
      }
    });

    var creancesEnCoursTotal = 0;
    state.creances.forEach(function(c){
      if(c.date >= startKey && c.date <= endKey && c.statut === "en_cours"){
        creancesEnCoursTotal += c.montant;
      }
    });

    return {
      startKey: startKey,
      endKey: endKey,
      nbClients: nbClients,
      recetteTotale: recetteTotale,
      chargesTotal: chargesTotal,
      chargesParRubrique: chargesParRubrique,
      soldeNetCumule: recetteTotale - chargesTotal,
      creancesEnCoursTotal: creancesEnCoursTotal,
      creancesRecouvreesTotal: creancesRecouvreesTotal,
      nbJoursTravailles: nbJoursTravailles,
      epargneTotal: epargnePlage(startKey, endKey),
      soldeNet: recetteTotale - chargesTotal - epargnePlage(startKey, endKey),
      ticketMoyen: nbClients > 0 ? Math.round(recetteClients / nbClients) : 0,
      moyenneJour: nbJoursTravailles > 0 ? Math.round((recetteTotale - chargesTotal) / nbJoursTravailles) : 0
    };
  }

  // Première date avec des données (borne la navigation « ‹ » de Mon état et Partager).
  function premiereDateDonnees(){
    var cles = Object.keys(state.jours).filter(function(k){ return jourADesDonnees(state.jours[k]); }).sort();
    return cles.length ? cles[0] : null;
  }

  function precedentPossible(mode, offset){
    var premiere = premiereDateDonnees();
    if(!premiere) return false;
    var b = bornesPeriode(mode, offset);
    return dateToKey(b.debut) > premiere;
  }

  // ---------- Mon objectif (F8) ----------

  function trouverModeleObjectif(id){
    for(var i=0;i<OBJECTIF_MODELES.length;i++){
      if(OBJECTIF_MODELES[i].id === id) return OBJECTIF_MODELES[i];
    }
    return null;
  }

  function jourADesDonnees(jour){
    return !!jour && (jour.recette > 0 || (jour.charges && jour.charges.length > 0));
  }

  // Cherche, en remontant semaine par semaine, les dernières semaines qui
  // contiennent réellement au moins un jour saisi (pas des semaines calendaires vides).
  function semainesRecentesAvecDonnees(limite){
    var resultats = [];
    var offset = 0;
    var essais = 0;
    while(resultats.length < limite && essais < 52){
      var b = bornesPeriode("semaine", offset);
      var startKey = dateToKey(b.debut);
      var endKey = dateToKey(b.fin);
      var aDesDonnees = Object.keys(state.jours).some(function(k){
        return k >= startKey && k <= endKey && jourADesDonnees(state.jours[k]);
      });
      if(aDesDonnees) resultats.push(offset);
      offset -= 1;
      essais += 1;
    }
    return resultats;
  }

  // Solde net moyen réel par semaine, sur les dernières semaines saisies.
  // Retourne null si aucune donnée n'est encore disponible.
  function soldeNetMoyenHebdo(){
    var semaines = semainesRecentesAvecDonnees(NB_SEMAINES_MOYENNE);
    if(semaines.length === 0) return null;
    var total = 0;
    semaines.forEach(function(offset){
      total += calculerEtat("semaine", offset).soldeNetCumule;
    });
    return total / semaines.length;
  }

  // Montant estimé mis de côté pour l'objectif actif depuis sa création :
  // le pourcentage choisi appliqué au solde net réel de chaque jour positif.
  // V1.2 : montant mis de côté depuis la création de l'objectif (recalculé, jamais stocké).
  function montantEpargneEstime(obj){
    if(!obj) return 0;
    return epargnePlage(obj.dateCreation, todayKey());
  }

  // Recette moyenne par jour travaillé sur les 4 dernières semaines saisies (null si aucune donnée).
  function recetteMoyenneJourTravaille(){
    var semaines = semainesRecentesAvecDonnees(NB_SEMAINES_MOYENNE);
    if(semaines.length === 0) return null;
    var rec = 0, jours = 0;
    semaines.forEach(function(off){
      var e = calculerEtat("semaine", off);
      rec += e.recetteTotale; jours += e.nbJoursTravailles;
    });
    return jours > 0 ? rec / jours : null;
  }

  function estimationEpargneJour(mode, pourcentage, montantJour){
    if(mode === "manuel") return montantJour > 0 ? montantJour : 0;
    var moy = recetteMoyenneJourTravaille();
    return moy ? Math.round(moy * pourcentage / 100) : 0;
  }

  function formatJoursTravailles(n){
    if(n == null) return "durée non estimable pour l’instant";
    if(n <= 0) return "objectif atteint";
    if(n === 1) return "environ 1 jour de travail";
    if(n <= 60) return "environ " + n + " jours de travail";
    var mois = Math.round(n / 26);
    return "environ " + mois + " mois de travail";
  }

  function calculerScenarios(montantCible, montantDejaEpargne, soldeHebdoMoyen){
    var montantRestant = Math.max(0, montantCible - montantDejaEpargne);
    return SCENARIOS_OBJECTIF.map(function(sc){
      var montantParSemaine = soldeHebdoMoyen > 0 ? Math.round(soldeHebdoMoyen * sc.pourcentage / 100) : 0;
      var semaines = montantParSemaine > 0 ? Math.ceil(montantRestant / montantParSemaine) : null;
      return {
        pourcentage: sc.pourcentage,
        nom: sc.nom,
        montantParSemaine: montantParSemaine,
        semaines: semaines
      };
    });
  }

  function formatDuree(semaines){
    if(semaines == null) return "durée non estimable pour l’instant";
    if(semaines <= 0) return "objectif atteint";
    if(semaines === 1) return "1 semaine";
    if(semaines < 9) return semaines + " semaines";
    var mois = Math.round(semaines / 4.345);
    if(mois < 1) mois = 1;
    if(mois < 24) return "environ " + mois + " mois";
    var ans = Math.round(mois / 12);
    return "environ " + ans + (ans > 1 ? " ans" : " an");
  }

  function sauvegarderAvecChoixDossier(){
    var nom = "mondjai-salonh-sauvegarde-" + todayKey() + ".json";
    if(typeof window.showSaveFilePicker === "function"){
      var donnees = JSON.stringify(state, null, 2);

      }).then(function(handle){
        return handle.createWritable().then(function(w){

        });
      }).then(function(){
        marquerSauvegardeFaite();
        afficherToast("Sauvegarde enregistrée.");
      }).catch(function(err){
        if(err && err.name === "AbortError") return;
        if(telechargerSauvegarde()) afficherToast("Sauvegarde téléchargée.");

  function telechargerSauvegarde(){
    try{
      var donnees = JSON.stringify(state, null, 2);
      var blob = new Blob([donnees], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "mondjai-salonh-sauvegarde-" + todayKey() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      marquerSauvegardeFaite();
      return true;
    }catch(e){
      return false;
    }

  // --- Redessin partiel (Sprint 7A) ---

  function premiereClasse(n){
    var c = n.getAttribute("class");
    if(!c) return "";
    c = c.replace(/^\s+/, "");
    var i = c.indexOf(" ");
    return i === -1 ? c : c.slice(0, i);
  }

  // Deux nœuds « de même nature » sont mis à jour sur place ; sinon l'ancien est remplacé.
  function memeNature(a, b){
    if(a.nodeType !== b.nodeType) return false;
    if(a.nodeType !== 1) return true;
    if(a.tagName !== b.tagName) return false;
    if((a.getAttribute("id") || "") !== (b.getAttribute("id") || "")) return false;
    if(a.tagName === "INPUT" && (a.getAttribute("type") || "") !== (b.getAttribute("type") || "")) return false;
    return premiereClasse(a) === premiereClasse(b);
  }

  function synchroniserAttributs(a, b){
    var i, at;
    for(i = a.attributes.length - 1; i >= 0; i--){
      at = a.attributes[i];
      if(!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    }
    for(i = 0; i < b.attributes.length; i++){
      at = b.attributes[i];
      if(a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    }
  }

  function morphNoeud(a, b){
    if(a.nodeType !== 1){
      if(a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
      return;
    }
    synchroniserAttributs(a, b);
    if(a.tagName === "INPUT"){
      if((a.getAttribute("type") || "").toLowerCase() !== "file"){
        var v = b.getAttribute("value");
        if(v === null) v = "";
        if(a.value !== v) a.value = v;
      }
      return;
    }
    if(a.tagName === "CANVAS") return; // dessiné à part (Partager)
    morphEnfants(a, b);
  }

  // Met à jour les enfants de `parent` d'après ceux de `modele`, entre deux bornes (exclues).
  function morphPlage(parent, ancien, finAncien, nouveau, finNouveau){
    while(nouveau && nouveau !== finNouveau){
      var suivantNouveau = nouveau.nextSibling;
      if(!ancien || ancien === finAncien){
        parent.insertBefore(nouveau, finAncien || null);
      }else if(memeNature(ancien, nouveau)){
        morphNoeud(ancien, nouveau);
        ancien = ancien.nextSibling;
      }else{
        var suivantAncien = ancien.nextSibling;
        parent.replaceChild(nouveau, ancien);
        ancien = suivantAncien;
      }
      nouveau = suivantNouveau;
    }
    while(ancien && ancien !== finAncien){
      var s = ancien.nextSibling;
      parent.removeChild(ancien);
      ancien = s;
    }
  }

  function dernierMenu(parent){
    for(var n = parent.lastChild; n; n = n.previousSibling){ if(n.nodeType === 1 && n.tagName === "NAV") return n; }
    return null;
  }

  // Le menu du bas sert de repère : l'écran (avant lui) et la feuille ou le message (après lui)
  // sont comparés séparément, pour que le menu reste en place quand on change d'onglet.
  function morphEnfants(parent, modele){
    var menuAncien = parent === app ? dernierMenu(parent) : null;
    var menuNouveau = menuAncien ? dernierMenu(modele) : null;
    if(menuAncien && menuNouveau && memeNature(menuAncien, menuNouveau)){
      var apresNouveau = menuNouveau.nextSibling;
      morphPlage(parent, parent.firstChild, menuAncien, modele.firstChild, menuNouveau);
      morphNoeud(menuAncien, menuNouveau);
      morphPlage(parent, menuAncien.nextSibling, null, apresNouveau, null);
    }else{

    }

  // ---------- Bouton retour du téléphone (V1.1, repris de Trépor Sprint 5A) ----------
  // Une seule entrée d'historique armée à la fois : le retour ferme la couche la plus
  // profonde (fenêtre → écran secondaire → sous-étape → onglet), jamais l'application
  // tant qu'on n'est pas revenu sur « Aujourd'hui ».

  var historiqueArme = false;
  var ignorerProchainPop = false;

  function porteEntreeActive(){
    return !state.config.codeAccesOk || ui.verrouille || !state.config.onboardingComplete;
  }

  function uiProfonde(){
    if(porteEntreeActive()) return false;
    if(ui.modal) return true;
    if(ui.page && ui.page !== "jour") return true;
    if(ui.jourSelection) return true;
    return false;
  }

  function syncHistorique(){
    if(!window.history || !history.pushState) return;
    var profonde = uiProfonde();
    if(profonde && !historiqueArme){
      try{ history.pushState({ salonh:1 }, ""); historiqueArme = true; }catch(e){}
    }else if(!profonde && historiqueArme){
      historiqueArme = false;
      ignorerProchainPop = true;
      try{ history.back(); }catch(e){ ignorerProchainPop = false; }
    }
  }

  function retourArriere(){
    if(ui.modal){
      if(ui.modal === "client-edit"){ ui.modal = "clients-jour"; }
      else if(ui.chargeRetour && ui.modal !== ui.chargeRetour){ ui.modal = ui.chargeRetour; }
      else { ui.modal = null; ui.chargeRubriqueId = null; ui.chargeEditId = null; ui.chargeRetour = null; }
      return;
    }
    // Sprint 7D : sous-niveau → écran secondaire (un à la fois) → autre onglet → Aujourd'hui.
    if(ui.page === "reglages"){
      if(ui.ajoutRubriquePerso){ ui.ajoutRubriquePerso = false; return; }
      if(ui.reglagesPinEtape){ ui.reglagesPinEtape = null; ui.pinSaisie = ""; return; }
    }
    if(ui.page === "objectif"){
      if(ui.objConfirmSuppr){ ui.objConfirmSuppr = false; return; }
      if(ui.objDraft && ui.objDraft.edition){ ui.objDraft = null; return; }
      if(ui.objDraft && ui.objDraft.step === "form"){ ui.objDraft.step = "modele"; return; }
    }
    if(ui.page === "etat" && ui.etatSemaineOuverte){ ui.etatSemaineOuverte = null; return; }
    if(ui.page && !estOnglet(ui.page)){
      if(ui.page === "jour-detail") ui.historiqueSelection = null;
      retourSecondaire(); return;
    }
    if(ui.page && ui.page !== "jour"){ allerOnglet("jour"); return; }
    if(ui.jourSelection){ ui.jourSelection = null; return; }
  }

  var ONGLETS = [

  function estOnglet(page){
    for(var i = 0; i < ONGLETS.length; i++){ if(ONGLETS[i].id === page) return true; }

  // Pile des écrans traversés : le premier est toujours un onglet ; chaque retour en dépile un.

  function ouvrirSecondaire(page){
    var actuelle = ui.page || "jour";
    if(actuelle === page) return;
    if(!ui.pile) ui.pile = [];

    else ui.pile.push(actuelle);
    ui.page = page;
    ui.pagePrecedente = ui.pile[0];
    ui.modal = null;

    ui.page = (ui.pile && ui.pile.length) ? ui.pile.pop() : "jour";
    if(ui.page === "jour-detail" && !ui.historiqueSelection) ui.page = "etat";
    ui.modal = null;

              '<div class="muted" style="margin-top:6px;">' + (f === "jour" ? "Ajouté tout seul à votre premier client de chaque journée." : "Un rappel « Loyer dû » s’affiche à la date de paiement, jusqu’à ce que vous notiez le paiement.") + '</div></div>';
    return html;
  }

  function loyerSaisieValide(montantStr){
    if(!(parseMontant(montantStr) > 0)) return false;
    if(ui.loyerFreqSaisie === "mois"){ var n = parseMontant(ui.loyerJourSaisie); return n >= 1 && n <= 31; }

  function appliquerLoyerSaisie(montantStr){
    state.config.cotisationHabituelle = parseMontant(montantStr);
    state.config.loyerFrequence = ui.loyerFreqSaisie;

  // --- Ecran du jour ---

  // V1.2 (Sprint 6A) : disposition MonDjai/Trépor — Recette du jour en tête, Charges et
  // Épargne côte à côte, Solde net du jour (recette − charges − épargne) en bas.
  // ---------- Sprint 7E : Aujourd'hui en cases ----------
  // Ordre décidé le 29/09/2026 : [Recette du jour] → [Charges | Épargne] → [Solde net du jour],
  // puis « Ce mois-ci » et le bouton « + » (une charge en 3 taps), puis les avis.
  // Les cases occupent la hauteur restante, MESURÉE après chaque rendu (majHauteurCases) : sans avis,
  // tout tient à 390×844 sans défiler ; avec des avis, les cases se resserrent jusqu'à leur hauteur minimale.
  function renderJour(){
    var key = jourSaisieKey();
    var estAujourdhui = key === todayKey();
    var jour = lireJour(key);
    var totalCharges = totalChargesJour(jour);
    var epargne = epargneDuJour(key);
    var soldeBrut = jour.recette - totalCharges;
    var solde = soldeBrut - epargne;

    var html = "";
    html += brandHeader(estAujourdhui ? todayLabel() : formatDateLabel(key));

    if(estAujourdhui){
      html += '<div class="date-row"><span></span>' +
                '<label class="date-link">🗓️ Saisir un jour passé' +
                  '<input type="date" id="input-jour-saisie" max="' + todayKey() + '" value="' + key + '">' +
                '</label></div>';
    }else{
      html += '<div class="retro-banner"><span>Vous complétez le <strong>' + formatDateLabel(key).replace(/ \d{4}$/, "") + '</strong></span>' +
                '<button type="button" data-action="revenir-aujourdhui">↺ Revenir à aujourd’hui</button></div>';
    }

    html += '<div class="blocks-stack" data-test="cases">';

    // 1. Recette du jour : grande case, « + Recette » ou « Modifier »
    var nbc = nbClientsJour(jour);
    var noteeRecette = jour.recetteSaisie != null || jour.recette > 0;
    html += '<button type="button" class="dash-block recette dash-zone' + (jour.recette > 0 ? " set" : "") + '" data-action="ouvrir-recette" data-test="case-recette">' +
              '<span class="dash-ico">💰</span>' +
              '<span class="dash-montant' + (jour.recette > 0 ? "" : " muted-montant") + '">' + (jour.recette > 0 ? formatFCFA(jour.recette) : "À saisir") + '</span>' +
              '<span class="dash-label">Recette ' + (estAujourdhui ? "du jour" : "de ce jour") + (nbc ? " · " + nbc + (nbc > 1 ? " clients" : " client") : "") + '</span>' +
              '<span class="case-pill' + (noteeRecette ? " case-pill-2" : "") + '">' + (noteeRecette ? "✏️ Modifier" : "+ Recette") + '</span>' +
            '</button>';

    // 2. Charges | Épargne
    html += '<div class="blocks-row">';
    html += '<button type="button" class="dash-block dash-zone" data-action="ouvrir-charges-jour" data-test="case-charges">' +
              '<span class="dash-ico">🧾</span>' +
              '<span class="dash-montant">' + formatFCFA(totalCharges) + '</span>' +
              '<span class="dash-label">Charges' + (jour.charges.length ? " (" + jour.charges.length + ")" : "") + '</span>' +
              '<span class="case-pill case-pill-2">+ Charge</span>' +
            '</button>';
    var obj = state.objectif;
    if(obj){
      var cumul = montantEpargneEstime(obj);
      var pct = obj.montantCible > 0 ? Math.min(100, Math.round(cumul / obj.montantCible * 100)) : null;
      html += '<button type="button" class="dash-block dash-zone" data-action="ouvrir-objectif" data-test="case-epargne">' +
                '<span class="dash-ico">' + (obj.icone || "💰") + '</span>' +
                '<span class="dash-montant">' + formatFCFA(epargne) + '</span>' +
                '<span class="dash-label">Épargne</span>' +
                (pct !== null ? '<span class="mini-jauge"><span class="jauge-track"><span class="jauge-fill" style="display:block;width:' + pct + '%;"></span></span><span class="mini-jauge-txt">' + pct + '% · ' + formatFCFA(cumul) + '</span></span>'
                              : '<span class="mini-jauge-txt">' + formatFCFA(cumul) + ' mis de côté</span>') +
              '</button>';
    }else{
      html += '<button type="button" class="dash-block dash-zone" data-action="ouvrir-objectif" data-test="case-epargne">' +
                '<span class="dash-ico">🔐</span>' +
                '<span class="dash-montant muted-montant">Aucun</span>' +
                '<span class="dash-label">Épargne</span>' +
                '<span class="mini-jauge-txt accent">Définir un objectif ›</span>' +
              '</button>';
    }
    html += '</div>';

    // 3. Solde net du jour (inchangé)
    html += '<div class="card solde-card solde-bas">';
    html += '<div class="solde-label">SOLDE NET ' + (estAujourdhui ? "DU JOUR" : "DE CE JOUR") + '</div>';
    html += '<div class="solde-value ' + (solde < 0 ? "perte" : "positif") + '">' + formatFCFA(solde) + '</div>';
    html += '<div class="solde-formule">Recette − charges − épargne</div>';
    if(soldeBrut < 0){
      html += '<div class="perte-bandeau">Jour à perte : ' + formatFCFA(Math.abs(soldeBrut)) + '</div>';
    }
    html += '</div>';
    html += '</div>';   // fin des cases

    // 4. « Ce mois-ci : … F » (solde net du mois en cours, jusqu'à aujourd'hui) et le bouton « + »,
    //    posé dans son propre couloir à droite : il ne recouvre jamais un montant ni un bouton.
    var bm = bornesPeriode("mois", 0);
    var mois = calculerPlage(dateToKey(bm.debut), dateToKey(bm.fin));
    html += '<div class="ligne-mois">' +
              '<button type="button" class="ce-mois" data-action="ouvrir-ce-mois" data-test="ce-mois">Ce mois-ci : <strong class="' + (mois.soldeNet < 0 ? "perte" : "positif") + '">' + formatFCFA(mois.soldeNet) + '</strong> ›</button>' +
              '<button type="button" class="fab-charge" data-action="plus-charge" data-test="plus-charge" aria-label="Noter une charge">+</button>' +
            '</div>';

    // 5. Avis (ordre du cahier § 9.2) : Loyer dû, jauge du loyer, rappel de saisie, sauvegarde, installation.
    var avis = "";
    var echeance = estAujourdhui ? loyerDu() : null;
    if(echeance){
      avis += '<div class="loyer-banner"><span>🔑 <strong>Loyer de place dû</strong><br>' +
                (echeance === todayKey() ? "Aujourd’hui" : "Depuis le " + formatDateCourte(echeance)) + ' · ' + formatFCFA(state.config.cotisationHabituelle) + '</span>' +
                '<span class="install-actions"><button type="button" class="btn-sm btn-sm-payer" data-action="loyer-noter">Noter le paiement</button>' +
                '<button type="button" class="btn-sm btn-sm-annuler" data-action="loyer-plus-tard">Plus tard</button></span></div>';
    }
    if(estAujourdhui) avis += renderJaugeLoyer();
    if(estAujourdhui) avis += renderRappelSaisie();
    if(rappelSauvegardeActif()){
      avis += '<div class="soft-msg rappel-sauvegarde">' +
                'Sauvegardez vos données : elles ne vivent que sur ce téléphone.' +
                '<div class="btn-row" style="margin-top:10px;">' +
                  '<button type="button" class="btn-sm btn-sm-payer" data-action="sauvegarder-donnees">Sauvegarder maintenant</button>' +
                  '<button type="button" class="btn-sm btn-sm-annuler" data-action="rappel-plus-tard">Plus tard</button>' +
                "</div>" +
              "</div>";
    }
    if(estAujourdhui) avis += renderCarteInstallation();
    if(avis) html += '<div class="avis-jour" data-test="avis">' + avis + '</div>';
    return html;
  }

  // Hauteur des cases : place réellement disponible entre le haut des cases et le bas de l'écran (moins la
  // marge réservée au menu du bas, la ligne « Ce mois-ci » et les avis) ; jamais moins que la somme des
  // hauteurs minimales des cases (le contenu n'est jamais rogné : avec beaucoup d'avis, la page défile).
  var CASES_ECART_PX = 10;             // espace entre deux cases, et entre les cases et la ligne suivante
  function majHauteurCases(){
    var racine = document.documentElement;
    var pile = app.querySelector(".blocks-stack");
    if(!pile || (ui.page || "jour") !== "jour" || ui.verrouille || !state.config.onboardingComplete){
      if(racine.style.getPropertyValue("--hauteur-cases")) racine.style.removeProperty("--hauteur-cases");
      return;
    }
    var cs = function(e){ return window.getComputedStyle(e); };
    var hFenetre = window.innerHeight || racine.clientHeight;
    var basReserve = parseFloat(cs(app).paddingBottom) || 0;           // place du menu du bas (et du bandeau de mise à jour)
    var haut = pile.getBoundingClientRect().top + (window.pageYOffset || 0);
    var apres = 0;
    for(var n = pile.nextElementSibling; n; n = n.nextElementSibling){
      if(n.tagName === "NAV" || aLaClasse(n, "overlay") || aLaClasse(n, "toast")) continue;
      apres += n.getBoundingClientRect().height + (parseFloat(cs(n).marginTop) || 0) + (parseFloat(cs(n).marginBottom) || 0);
    }
    // Minimum : case Recette + rangée Charges | Épargne (hauteurs minimales CSS) + solde (hauteur naturelle) + écarts.
    var enfants = pile.children, mini = CASES_ECART_PX * Math.max(0, enfants.length - 1);
    for(var i = 0; i < enfants.length; i++){
      var m = parseFloat(cs(enfants[i]).minHeight) || 0;
      mini += aLaClasse(enfants[i], "solde-card") ? enfants[i].offsetHeight : m;
    }
    var h = Math.floor(hFenetre - basReserve - haut - apres);
    var val = Math.ceil(Math.max(mini, h)) + "px";
    if(racine.style.getPropertyValue("--hauteur-cases") !== val) racine.style.setProperty("--hauteur-cases", val);
  }

  // ---------- Sprint 7E : jauge du loyer (semaine ou mois) ----------
  // Recettes depuis la dernière échéance comparées au montant du loyer. Simple repère : rien n'est déduit.
  // Pourcentage arrondi à l'inférieur ; jamais 100 % avant que le loyer soit couvert.
  function etatJaugeLoyer(){
    var cfg = state.config;
    if(cfg.statut !== "locataire" || !(cfg.cotisationHabituelle > 0)) return null;
    if(cfg.loyerFrequence !== "semaine" && cfg.loyerFrequence !== "mois") return null;
    var rub = findRubrique("cotisation");
    if(!rub || !rub.actif) return null;
    var ech = derniereEcheanceLoyer();
    if(!ech) return null;
    var aujourdhui = todayKey(), recettes = 0;
    Object.keys(state.jours).forEach(function(k){ if(k >= ech && k <= aujourdhui) recettes += state.jours[k].recette || 0; });
    var loyer = cfg.cotisationHabituelle;
    var couvert = recettes >= loyer;
    var pct = couvert ? 100 : Math.min(99, Math.floor(recettes / loyer * 100));
    return { echeance: ech, recettes: recettes, loyer: loyer, couvert: couvert, pct: pct, reste: Math.max(0, loyer - recettes), frequence: cfg.loyerFrequence };
  }
  function renderJaugeLoyer(){
    var j = etatJaugeLoyer();
    if(!j) return "";
    return '<div class="card jauge-loyer" data-test="jauge-loyer">' +
             '<div class="jl-tete"><span>🔑 Loyer ' + (j.frequence === "semaine" ? "de la semaine" : "du mois") + ' à couvrir</span><strong>' + j.pct + ' %</strong></div>' +
             '<div class="jauge-track"><div class="jauge-fill' + (j.couvert ? " ok" : "") + '" style="width:' + j.pct + '%;"></div></div>' +
             '<div class="jl-pied">' + (j.couvert ? '<span class="jl-ok">Loyer couvert ✓</span>' : "encore " + formatFCFA(j.reste) + " à couvrir") +
               ' · ' + formatFCFA(j.recettes) + ' sur ' + formatFCFA(j.loyer) + '</div>' +
           '</div>';
  }

  // ---------- Sprint 7E : rappel doux de saisie ----------
  // À l'ouverture : la veille n'a ni recette ni charge, n'est pas un jour de repos choisi, n'est pas
  // avant la date d'installation, et le rappel n'a pas déjà été montré aujourd'hui. Montré une fois
  // par jour (meta.rappelSaisieVu, écrit à l'affichage) ; la carte reste jusqu'à une réponse.
  var JOURS_REPOS_LIBELLES = ["Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam.", "Dim."];   // index 0 = lundi
  function rappelSaisieActif(){ return state.config.rappelSaisie !== false; }   // absent = activé
  function joursRepos(){ return Array.isArray(state.config.joursRepos) ? state.config.joursRepos : []; }
  function cleVeille(){
    var d = parseDateKey(todayKey());
    return dateToKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1));
  }
  function jourNote(cle){
    var j = state.jours[cle];
    return !!j && (j.recetteSaisie != null || j.recette > 0 || (j.charges && j.charges.length > 0) || (j.clients && j.clients.length > 0));
  }
  function rappelSaisieDu(){
    if(!rappelSaisieActif()) return false;
    var hier = cleVeille();
    if(!state.meta.creation || hier < state.meta.creation) return false;
    if(jourNote(hier)) return false;
    var jsem = (parseDateKey(hier).getDay() + 6) % 7;   // 0 = lundi
    if(joursRepos().indexOf(jsem) !== -1) return false;
    return true;
  }
  var rappelSession = null;   // null = pas encore décidé pour cette ouverture ; true / false ensuite
  function renderRappelSaisie(){
    if(rappelSession === null){
      rappelSession = state.meta.rappelSaisieVu !== todayKey() && rappelSaisieDu();
      if(rappelSession){ state.meta.rappelSaisieVu = todayKey(); saveState(); }
    }
    if(!rappelSession || jourNote(cleVeille()) || !rappelSaisieActif()) return "";
    return '<div class="card rappel-saisie" data-test="rappel-saisie">' +
             '<div class="rs-titre">📝 Hier n’est pas noté</div>' +
             '<div class="btn-row" style="margin-top:10px;">' +
               '<button type="button" class="btn-sm btn-sm-payer" data-action="rappel-saisir-hier">Saisir hier</button>' +
               '<button type="button" class="btn-sm btn-sm-annuler" data-action="rappel-pas-travaille">Je n’ai pas travaillé</button>' +
             '</div>' +
           '</div>';
  }

  // ---------- Sprint 7E : étiquettes facultatives des charges ----------
  var ETIQUETTES_PROPOSEES = {
    consommables: ["Gel", "Mousse", "Lotion", "Huile", "Parfum"],
    entretien: ["Tondeuse", "Rasoir", "Ciseaux", "Sèche-cheveux"],
    transport: ["Taxi", "Woro-woro", "Gbaka", "Moto-taxi"]
  };
  var ETIQUETTES_PERSO_MAX = 6;        // étiquettes « + Autre » gardées par rubrique (les plus récentes)
  var ETIQUETTE_LONGUEUR_MAX = 24;     // caractères
  function etiquettesProposees(rubId){
    if(!ETIQUETTES_PROPOSEES[rubId]) return null;
    var perso = (state.config.etiquettesPerso && Array.isArray(state.config.etiquettesPerso[rubId])) ? state.config.etiquettesPerso[rubId] : [];
    var l = ETIQUETTES_PROPOSEES[rubId].slice();
    perso.forEach(function(e){ if(l.indexOf(e) === -1) l.push(e); });
    return l;
  }
  function memoriserEtiquette(rubId, etiquette){
    if(!etiquette || !ETIQUETTES_PROPOSEES[rubId] || ETIQUETTES_PROPOSEES[rubId].indexOf(etiquette) !== -1) return;
    if(!state.config.etiquettesPerso || typeof state.config.etiquettesPerso !== "object") state.config.etiquettesPerso = {};
    var l = Array.isArray(state.config.etiquettesPerso[rubId]) ? state.config.etiquettesPerso[rubId].slice() : [];
    l = l.filter(function(e){ return e !== etiquette; });
    l.push(etiquette);
    while(l.length > ETIQUETTES_PERSO_MAX) l.shift();
    state.config.etiquettesPerso[rubId] = l;
  }
  function nettoyerEtiquette(s){ return String(s || "").replace(/\s+/g, " ").replace(/^\s+|\s+$/g, "").slice(0, ETIQUETTE_LONGUEUR_MAX); }
  // Pastilles sous le montant (saisie et modification d'une charge) ; « + Autre » ouvre un petit champ.
  function renderPastillesEtiquettes(rubId, choisie){

      html += '<button type="button" class="quick-chip etiq' + (choisie === e ? " etiq-on" : "") + '" data-action="choisir-etiquette" data-etiquette="' + escapeHtml(e) + '" aria-pressed="' + (choisie === e ? "true" : "false") + '">' + escapeHtml(e) + '</button>';

      html += '<button type="button" class="quick-chip etiq etiq-autre" data-action="etiquette-autre">+ Autre</button>';

    html += '</div>';

      html += '<div class="etiq-autre-ligne"><input type="text" id="input-etiquette-autre" maxlength="' + ETIQUETTE_LONGUEUR_MAX + '" placeholder="Ex. Savon" value="' + escapeHtml(ui.etiquetteAutreSaisie) + '">' +
              '<button type="button" class="btn-sm btn-sm-payer" data-action="valider-etiquette-autre"' + (nettoyerEtiquette(ui.etiquetteAutreSaisie) ? "" : " disabled") + '>OK</button></div>';

  function libelleCharge(c, nomRubrique){

  function formatHeure(ts){
    try{
      var d = new Date(ts);
      return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }catch(e){
      return "";
    }
  }

  // --- Ecran Mes créances ---

  // --- Ecran Mon état ---

  // V1.1 : Mon état regroupe les chiffres ET l'historique (ancien onglet Historique),
  // sur le modèle Trépor Sprint 7B : Jour (‹ › jour par jour), Semaine (→ jours),
  // Mois (→ semaines → jours). La flèche « ‹ » s'arrête à la première journée enregistrée.

  function renderEtat(){
    var mode = ui.etatMode;
    var offset = ui.etatOffset;
    var html = "";
    html += brandHeader("Mon état");

    if(mode === "mois" && ui.etatSemaineOuverte){
      return html + renderEtatSemaineDepuisMois(ui.etatSemaineOuverte);
    }

    html += '<div class="etat-tabs">';
    [["jour","Jour"],["semaine","Semaine"],["mois","Mois"]].forEach(function(m){
      html += '<button type="button" class="etat-tab' + (mode === m[0] ? " active" : "") + '" data-action="etat-mode" data-mode="' + m[0] + '">' + m[1] + '</button>';
    });
    html += "</div>";

    html += '<div class="etat-period-nav">';
    html += '<button type="button" data-action="etat-precedent" aria-label="Période précédente"' + (precedentPossible(mode, offset) ? "" : " disabled") + '>‹</button>';
    html += '<div class="etat-period-label">' + labelPeriode(mode, offset) + '</div>';
    html += '<button type="button" data-action="etat-suivant" aria-label="Période suivante"' + (offset >= 0 ? " disabled" : "") + '>›</button>';
    html += "</div>";

    var b = bornesPeriode(mode, offset);
    var startKey = dateToKey(b.debut), endKey = dateToKey(b.fin);
    var e = calculerPlage(startKey, endKey);

    if(mode === "jour"){
      html += renderResumeJour(startKey, true);
      html += lienMesCharges();   // Sprint 7D
      return html;
    }

    // V1.2 : 1. Solde net · 2. Recette − charges − épargne · 3. détail des charges et de l'épargne
    html += renderResumePeriode(e, mode === "semaine" ? "de la semaine" : "du mois");
    html += renderChargesParRubrique(e);
    html += lienMesCharges();   // Sprint 7D
    html += renderEpargneDetail(e, startKey, endKey);

    if(mode === "semaine"){
      html += '<div class="section-title" style="margin-top:18px;">Jours de la semaine</div>';
      html += renderListeJours(startKey, endKey);
    }else{
      html += '<div class="section-title" style="margin-top:18px;">Semaines du mois</div>';
      html += renderListeSemaines(b.debut, b.fin);
    }
    return html;
  }

  // Sprint 7D : Mon état → Mes charges (deux taps depuis le menu).
  function lienMesCharges(){
    return '<button type="button" class="settings-link-row lien-mes-charges" data-action="ouvrir-mes-charges" data-test="lien-mes-charges">🧾 Mes charges du mois<span class="settings-chevron">›</span></button>';
  }

  function renderSoldeCarte(titre, recette, charges, epargne, nbClients){
    var solde = recette - charges - epargne;
    var html = '<div class="card solde-card">';
    html += '<div class="solde-label">' + titre + '</div>';
    html += '<div class="solde-value ' + (solde < 0 ? "perte" : "positif") + '">' + formatFCFA(solde) + '</div>';
    if(recette - charges < 0){
      html += '<div class="perte-bandeau">À perte : ' + formatFCFA(Math.abs(recette - charges)) + '</div>';
    }
    html += '<div class="solde-mini-stats">' +
              '<div><div class="v">' + formatFCFA(recette) + '</div><div class="l">Recette' + (nbClients ? " (" + nbClients + (nbClients > 1 ? " clients)" : " client)") : "") + '</div></div>' +
              '<div><div class="v">' + formatFCFA(charges) + '</div><div class="l">Charges</div></div>' +
              '<div><div class="v">' + (state.objectif ? formatFCFA(epargne) : "Aucun") + '</div><div class="l">Épargne</div></div>' +
            '</div>';
    html += '</div>';
    return html;
  }

  function renderResumePeriode(e, suffixe){
    return renderSoldeCarte("SOLDE NET " + (suffixe || "").toUpperCase(), e.recetteTotale, e.chargesTotal, e.epargneTotal, e.nbClients);
  }

  function renderEpargneDetail(e, startKey, endKey){
    var html = '<div class="section-title" style="margin-top:18px;">Épargne</div>';
    var obj = state.objectif;
    if(!obj){
      return html + '<button type="button" class="epargne-row" data-action="ouvrir-objectif"><span class="nom">Aucun objectif<span class="sub">Définir un objectif d’épargne ›</span></span></button>';
    }
    var rythme = obj.mode === "manuel" ? formatFCFA(obj.montantJour) + " par jour travaillé" : obj.pourcentage + " % de la recette";
    var jours = 0;
    Object.keys(state.jours).forEach(function(k){ if(k >= startKey && k <= endKey && epargneDuJour(k) > 0) jours++; });
    html += '<button type="button" class="epargne-row" data-action="ouvrir-objectif">' +
              '<span style="font-size:24px;">' + (obj.icone || "💰") + '</span>' +
              '<span class="nom">' + escapeHtml(obj.nom) + '<span class="sub">' + rythme + (jours ? " · " + jours + (jours > 1 ? " jours" : " jour") : "") + '</span></span>' +
              '<span class="val">' + formatFCFA(e.epargneTotal) + '</span>' +
            '</button>';
    return html;
  }

  function renderChargesParRubrique(e){
    var html = '<div class="section-title" style="margin-top:18px;">Charges par rubrique</div>';
    var rubriqueIds = Object.keys(e.chargesParRubrique);
    if(rubriqueIds.length === 0){
      return html + '<div class="card"><div class="empty-note">Aucune charge sur cette période.</div></div>';
    }
    rubriqueIds.sort(function(a,b){
      if(a === "cotisation") return -1;
      if(b === "cotisation") return 1;
      return e.chargesParRubrique[b] - e.chargesParRubrique[a];
    });
    html += '<div class="charge-list">';
    rubriqueIds.forEach(function(rid){
      var r = findRubrique(rid);
      var icone = r ? r.icone : "❓";
      var couleur = r ? r.couleur : "#8a94a6";
      var nom = r ? r.nom : "Rubrique supprimée";
      html += '<div class="rubrique-stat-row">' +
                '<span class="charge-icon" style="background:' + couleur + '22;color:' + couleur + ';">' + icone + "</span>" +
                '<span class="rubrique-stat-nom">' + escapeHtml(nom) + '</span>' +
                '<span class="rubrique-stat-montant">' + formatFCFA(e.chargesParRubrique[rid]) + '</span>' +
              "</div>";
    });
    html += "</div>";
    return html;
  }

  // Liste des jours d'une plage (du plus récent au plus ancien), chacun cliquable vers son détail.
  function renderListeJours(startKey, endKey){
    var today = todayKey();
    var d = parseDateKey(endKey);
    var debut = parseDateKey(startKey);
    var html = '<div class="hist-list">';
    while(d >= debut){
      var k = dateToKey(d);
      var j = state.jours[k];
      var futur = k > today;
      var aDonnees = !!j && (jourADesDonnees(j) || j.clients.length > 0);
      var solde = j ? j.recette - totalChargesJour(j) - epargneDuJour(k) : 0;
      var sousTitre = futur ? "À venir" : (aDonnees ? j.clients.length + (j.clients.length > 1 ? " clients · " : " client · ") + j.charges.length + (j.charges.length > 1 ? " charges" : " charge") : "Rien d’enregistré");
      html += '<button type="button" class="hist-row' + (futur ? " futur" : "") + (aDonnees ? "" : " vide") + '"' + (futur ? " disabled" : ' data-action="voir-jour-detail" data-key="' + k + '"') + '>' +
                '<span>' +
                  '<span class="hist-date">' + formatDateLabel(k).replace(/ \d{4}$/, "") + (j && j.saisiApresCoup ? '<span class="retro-tag">saisi après coup</span>' : "") + '</span><br>' +
                  '<span class="hist-sub">' + sousTitre + '</span>' +
                '</span>' +
                '<span class="hist-solde ' + (solde < 0 ? "perte" : "positif") + '">' + (aDonnees ? formatFCFA(solde) : "—") + (futur ? "" : '<span class="hist-chevron">›</span>') + '</span>' +
              '</button>';
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    }
    html += "</div>";
    return html;
  }

  // Semaines civiles (lundi → dimanche) qui recoupent le mois, de la plus récente à la plus ancienne.
  function renderListeSemaines(debutMois, finMois){
    var today = todayKey();
    var lundis = [];
    var l = lundiDeLaSemaine(debutMois);
    while(l <= finMois){
      lundis.push(new Date(l.getTime()));
      l = new Date(l.getFullYear(), l.getMonth(), l.getDate() + 7);
    }
    lundis.reverse();
    var html = '<div class="hist-list">';
    lundis.forEach(function(lundi){
      var dim = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
      var sk = dateToKey(lundi), ek = dateToKey(dim);
      var futur = sk > today;
      var e = calculerPlage(sk, ek);
      var aDonnees = e.nbJoursTravailles > 0 || e.nbClients > 0;
      html += '<button type="button" class="hist-row' + (futur ? " futur" : "") + (aDonnees ? "" : " vide") + '"' + (futur ? " disabled" : ' data-action="etat-ouvrir-semaine" data-key="' + sk + '"') + '>' +
                '<span>' +
                  '<span class="hist-date">Du ' + formatDateCourte(sk) + ' au ' + formatDateCourte(ek) + '</span><br>' +
                  '<span class="hist-sub">' + (futur ? "À venir" : (aDonnees ? e.nbClients + (e.nbClients > 1 ? " clients · " : " client · ") + e.nbJoursTravailles + (e.nbJoursTravailles > 1 ? " jours travaillés" : " jour travaillé") : "Rien d’enregistré")) + '</span>' +
                '</span>' +
                '<span class="hist-solde ' + (e.soldeNet < 0 ? "perte" : "positif") + '">' + (aDonnees ? formatFCFA(e.soldeNet) : "—") + (futur ? "" : '<span class="hist-chevron">›</span>') + '</span>' +
              '</button>';
    });
    html += "</div>";
    return html;
  }

  function renderEtatSemaineDepuisMois(lundiKey){
    var lundi = parseDateKey(lundiKey);
    var dim = new Date(lundi.getFullYear(), lundi.getMonth(), lundi.getDate() + 6);
    var sk = lundiKey, ek = dateToKey(dim);
    var e = calculerPlage(sk, ek);
    var html = '<button type="button" class="back-link" data-action="etat-fermer-semaine">‹ Retour aux semaines</button>';
    html += '<div class="etat-period-label" style="margin-bottom:14px;text-align:left;">Semaine du ' + formatDateCourte(sk) + ' au ' + formatDateCourte(ek) + '</div>';
    html += renderResumePeriode(e, "de la semaine");
    html += renderChargesParRubrique(e);
    html += renderEpargneDetail(e, sk, ek);
    html += '<div class="section-title" style="margin-top:18px;">Jours de la semaine</div>';
    html += renderListeJours(sk, ek);
    return html;
  }

  // Résumé d'une journée, en lecture seule (vue Jour de Mon état et détail d'un jour).
  function renderResumeJour(key, avecLienSaisie){
    var jour = lireJour(key);
    var e = calculerPlage(key, key);
    var html = renderSoldeCarte("SOLDE NET DU JOUR", jour.recette, totalChargesJour(jour), epargneDuJour(key), nbClientsJour(jour));
    if(jour.saisiApresCoup){
      html += '<div class="muted" style="margin:-4px 0 12px 2px;">Journée saisie après coup.</div>';
    }
    if(jour.modifieLe){
      html += renderModifieLe(jour, "Recette modifiée le ").replace('class="modifie-le"', 'class="modifie-le" style="margin:-4px 0 12px 2px;"');
    }
    if(avecLienSaisie){
      html += '<button type="button" class="btn btn-secondary" style="margin-bottom:6px;" data-action="completer-jour" data-key="' + key + '">✏️ Compléter ou corriger ce jour</button>';
    }
    html += renderChargesParRubrique(e);
    html += renderEpargneDetail(e, key, key);
    return html;
  }

  // --- Ecran Mon objectif (F8) ---

  // V1.2 (Sprint 6B) : modèle d'objectif de MonDjai/Coiffure, intitulés Salon H.
  // Un seul objectif actif ; 2 emplacements supplémentaires floutés, réservés à l'abonnement.

  function nouveauBrouillonObjectif(){

  }

  function renderObjectif(){
    var html = "";
    html += brandHeader("Objectif d’épargne");
    html += lienRetour();   // Sprint 7D : écran secondaire
    html += '<div class="zahe">' + escapeHtml(MESSAGE_EPARGNE) + '</div>';

      html += renderObjectifBrouillon();
    }else if(!state.objectif){
      ui.objDraft = nouveauBrouillonObjectif();

  function renderEmplacementsVerrouilles(){

              '</button>';

                  '<strong>' + escapeHtml(m.nom) + '</strong>' +
                  '<span class="d">' + escapeHtml(m.description) + '</span>' +
                  '<span class="m">Suggestion : ' + formatFCFA(m.montantSuggere) + '</span>' +
                '</button>';

    html += '<div class="mode-tabs">' +
              '<button type="button" class="mode-tab' + (d.mode === "auto" ? " active" : "") + '" data-action="obj-mode" data-mode="auto">Auto (%)</button>' +
              '<button type="button" class="mode-tab' + (d.mode === "manuel" ? " active" : "") + '" data-action="obj-mode" data-mode="manuel">Manuel (montant)</button>' +
            '</div>';

      html += '<div class="pct-row">';

        html += '<button type="button" class="pct-card' + (d.pourcentage === sc.pourcentage ? " selected" : "") + '" data-action="obj-pct" data-pourcentage="' + sc.pourcentage + '">' +

                  (moy ? '<span class="x">≈ ' + formatFCFA(Math.round(moy * sc.pourcentage / 100)) + '/jour</span>' : "") +
                '</button>';
      });
      html += '</div>';

    }else{
      html += '<div class="field" style="margin-top:0;"><label>Montant mis de côté chaque jour travaillé *</label>' +
                '<div class="amount-field"><input type="tel" inputmode="numeric" id="input-obj-montant-jour" placeholder="Ex. 200" value="' + escapeHtml(d.montantJour) + '"><span class="amount-suffix">F</span></div></div>';
    }
    html += '<div class="field"><label>Montant visé (pour la jauge)</label>' +
              '<div class="amount-field"><input type="tel" inputmode="numeric" id="input-obj-cible" placeholder="Ex. 45 000" value="' + escapeHtml(d.cible) + '"><span class="amount-suffix">F</span></div></div>';

  function roundRectCompat(ctx, x, y, w, h, r){
    ctx.beginPath();
    if(ctx.roundRect){
      ctx.roundRect(x, y, w, h, r);
    }else{
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
  }

  function ajusterTaillePolice(ctx, texte, largeurMax, tailleDepart){
    var taille = tailleDepart;
    while(taille > 34){
      ctx.font = "800 " + taille + "px -apple-system,Helvetica,Arial,sans-serif";
      if(ctx.measureText(texte).width <= largeurMax) break;
      taille -= 4;
    }
    return taille;
  }

  var POLICE = "-apple-system,Helvetica,Arial,sans-serif";

  function dessinerImagePartage(canvas, d){
    canvas.width = 1080; canvas.height = 1350;
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height, marge = 80;
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#161b25"); grad.addColorStop(1, "#0d0f14");
    ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);

    // En-tête (net)
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#f5a623"; ctx.font = "700 40px " + POLICE;
    ctx.fillText("✂️ MonDjai / Salon H", w/2, 120);
    ctx.fillStyle = "#b7bfcc"; ctx.font = "500 30px " + POLICE;
    ctx.fillText(d.titre, w/2, 172);
    ctx.fillStyle = "#b7bfcc"; ctx.font = "700 28px " + POLICE;
    ctx.fillText("SOLDE NET", w/2, 262);
    ctx.fillStyle = d.solde < 0 ? "#ff6b5e" : "#f5f6f8";
    var texteSolde = formatFCFAImage(d.solde);
    ctx.font = "800 " + ajusterTaillePolice(ctx, texteSolde, w - marge*2, 120) + "px " + POLICE;
    ctx.fillText(texteSolde, w/2, 380);

    // Détail (flouté ensuite)
    var y = 520, col = (w - marge*2) / 3;
    [["Recette", d.recette, "#34b37e"], ["Charges", d.charges, "#ff6b5e"], ["Épargne", d.epargne, "#f5a623"]].forEach(function(c, i){
      var cx = marge + col*i + col/2;
      ctx.fillStyle = "#b7bfcc"; ctx.font = "500 28px " + POLICE; ctx.fillText(c[0], cx, y);
      ctx.fillStyle = c[2]; ctx.font = "800 40px " + POLICE; ctx.fillText(formatFCFAImage(c[1]), cx, y + 58);
    });
    ctx.fillStyle = "#b7bfcc"; ctx.font = "500 26px " + POLICE;
    ctx.fillText(d.nbClients + (d.nbClients > 1 ? " clients" : " client"), w/2, y + 120);

    ctx.strokeStyle = "#2a3040"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(marge, 700); ctx.lineTo(w - marge, 700); ctx.stroke();
    var ids = Object.keys(d.chargesParRubrique).sort(function(a,b){ return d.chargesParRubrique[b] - d.chargesParRubrique[a]; }).slice(0, 6);
    ctx.textAlign = "left";
    ids.forEach(function(rid, i){
      var r = findRubrique(rid);
      var yy = 770 + i*62;
      ctx.fillStyle = "#f5f6f8"; ctx.font = "500 30px " + POLICE;
      ctx.fillText((r ? r.icone + "  " + r.nom : "Rubrique supprimée"), marge, yy);
      ctx.textAlign = "right"; ctx.fillStyle = "#ff6b5e"; ctx.font = "700 30px " + POLICE;
      ctx.fillText(formatFCFAImage(d.chargesParRubrique[rid]), w - marge, yy);
      ctx.textAlign = "left";
    });
    ctx.textAlign = "center";
    ctx.fillStyle = "#6b7385"; ctx.font = "400 24px " + POLICE;
    ctx.fillText("Généré le " + formatDateCourte(todayKey()) + " avec MonDjai/Salon H · document informatif, non certifié", w/2, h - 50);
  }

  // Image exportée = même rendu que l'aperçu : haut net, bas réellement flouté + mention.
  function construireCanvasExport(){
    var src = document.getElementById("partage-canvas");
    var w = src.width, h = src.height;
    var out = document.createElement("canvas"); out.width = w; out.height = h;
    var ctx = out.getContext("2d");
    ctx.drawImage(src, 0, 0);
    var flou = document.createElement("canvas"); flou.width = w; flou.height = h;
    var fx = flou.getContext("2d");
    var filtreOk = typeof fx.filter === "string";
    if(filtreOk){
      fx.filter = "blur(28px)";
      fx.drawImage(src, 0, 0);
      fx.filter = "none";
    }
    if(!filtreOk || fx.getImageData(w/2|0, (h*0.45)|0, 1, 1).data[3] === 0){
      var petit = document.createElement("canvas"); petit.width = Math.ceil(w/14); petit.height = Math.ceil(h/14);
      var px = petit.getContext("2d"); px.imageSmoothingEnabled = true;
      px.drawImage(src, 0, 0, petit.width, petit.height);
      fx.clearRect(0, 0, w, h); fx.imageSmoothingEnabled = true;
      fx.drawImage(petit, 0, 0, w, h);
    }
    fx.globalCompositeOperation = "destination-in";
    var g = fx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(PARTAGE_FLOU_DEBUT, "rgba(0,0,0,0)");
    g.addColorStop(PARTAGE_FLOU_PLEIN, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,1)");
    fx.fillStyle = g; fx.fillRect(0, 0, w, h);
    fx.globalCompositeOperation = "source-over";
    ctx.drawImage(flou, 0, 0);
    // Mention d'abonnement
    var texte = "Abonnez-vous pour plus de fonctionnalités";
    ctx.font = "800 38px " + POLICE;
    var tw = ctx.measureText(texte).width, bw = tw + 80, bh = 84, bx = (w - bw)/2, by = h*PARTAGE_BADGE_Y - bh/2;
    ctx.fillStyle = "#2a1f0e"; roundRectCompat(ctx, bx, by, bw, bh, 42); ctx.fill();
    ctx.strokeStyle = "#6a4d12"; ctx.lineWidth = 3; roundRectCompat(ctx, bx, by, bw, bh, 42); ctx.stroke();
    ctx.fillStyle = "#f5a623"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(texte, w/2, by + bh/2 + 2);
    return out;
  }

  function genererEtPartagerImage(telechargerSeulement){
    var src = document.getElementById("partage-canvas");
    if(!src) return;
    var canvas = construireCanvasExport();
    if(!canvas.toBlob) return;
    var nomFichier = nomFichierPartage();
    canvas.toBlob(function(blob){
      if(!blob) return;
      if(telechargerSeulement){ telechargerBlobImage(blob, nomFichier); return; }
      var fichier = null;
      try{ fichier = new File([blob], nomFichier, { type: "image/png" }); }catch(e){ fichier = null; }
      if(fichier && window.navigator && navigator.canShare && navigator.share && navigator.canShare({ files: [fichier] })){
        navigator.share({ files: [fichier], title: "MonDjai/Salon H" }).catch(function(err){
          if(err && err.name === "AbortError") return;
          telechargerBlobImage(blob, nomFichier);
        });
      }else{
        telechargerBlobImage(blob, nomFichier);
      }
    }, "image/png");
  }

  function telechargerBlobImage(blob, nomFichier){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = nomFichier;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // Lu localement dans le cache du téléphone (aucun appel réseau).
  function verifierHorsLigne(){
    function fixer(txt){ etatHorsLigne = txt; majEtatHorsLigne(); }
    try{
      if(!("caches" in window) || !("serviceWorker" in navigator)){ fixer("non pris en charge par ce navigateur"); return; }
      var urlIndex = window.location.href.split("#")[0].split("?")[0].replace(/[^\/]*$/, "") + "index.html";
      caches.keys().then(function(cles){
        var courant = cles.indexOf(NOM_CACHE) !== -1;
        var ancien = null;
        cles.forEach(function(k){
          if(k === NOM_CACHE) return;
          PREFIXES_CACHE_SALONH.forEach(function(p){ if(k.indexOf(p) === 0) ancien = k; });
        });
        if(!courant && !ancien){ fixer("pas encore (ouvrez-la une fois avec internet)"); return; }
        return caches.open(courant ? NOM_CACHE : ancien).then(function(cache){
          return cache.match(urlIndex);
        }).then(function(rep){
          fixer(rep ? (courant ? "prêt (" + NOM_CACHE + ")" : "prêt (version précédente)") : "pas encore (ouvrez-la une fois avec internet)");
        });
      }).catch(function(){ fixer("état inconnu"); });
    }catch(e){ fixer("état inconnu"); }
  }

    if(!ref) return -1;
    for(var i=0;i<jour.clients.length;i++){

      var n = parseInt(ref.slice(4), 10);

    }
    return -1;
  }

  // ---------- Sprint 7D : Mes charges (écran secondaire) ----------
  // Mois en cours par défaut, ‹ › bornés (premiereDateDonnees / mois en cours). Les totaux viennent de
  // calculerPlage() : ce sont exactement ceux de Mon état › Mois. Aucun deuxième calcul.
  var MC_NB_CHARGES_PLUS_GROSSES = 5;   // Mes habitudes : « 5 plus grosses charges »

  // Liste à plat des charges d'une plage de dates : [{ cle:'AAAA-MM-JJ', c:charge }], du plus ancien au plus récent.
  function chargesDePlage(startKey, endKey){
    var l = [];
    Object.keys(state.jours).sort().forEach(function(k){
      if(k >= startKey && k <= endKey){
        (state.jours[k].charges || []).slice().sort(function(a, c){ return (a.ts || 0) - (c.ts || 0); }).forEach(function(c){ l.push({ cle:k, c:c }); });
      }
    });
    return l;
  }

  function moisAvecArticle(label){
    // « Charges d’octobre 2026 », « Charges de novembre 2026 »
    var m = label.charAt(0).toLowerCase() + label.slice(1);

  }

    var dernier = payes.length ? payes[payes.length - 1].cle : null;
    if(off === 0 && cfg.cotisationHabituelle > 0){
      var ech = derniereEcheanceLoyer();
      var avantInstallation = !!(ech && state.meta.creation && ech < state.meta.creation);
      if(ech && !avantInstallation && !loyerNoteDepuis(ech)) return "À payer le " + formatDateCourte(ech);

  var JOURS_COURTS = ["Lun.", "Mar.", "Mer.", "Jeu.", "Ven.", "Sam.", "Dim."];

  function barreHabitude(pct){

      // 4. Les 5 plus grosses charges
      var grosses = chargesDePlage(sk, ek).sort(function(x, y){ return y.c.montant - x.c.montant || (x.cle < y.cle ? 1 : x.cle > y.cle ? -1 : 0); }).slice(0, MC_NB_CHARGES_PLUS_GROSSES);

                  '<span class="rubrique-stat-montant">' + formatFCFA(x.c.montant) + '</span>' +

      // Sprint 7E : par étiquette (seulement si des charges en portent une)

        html += "</div>";

    return html;

  // ---------- Sprint 7D : export Excel (point à trancher 6 : A, décision du 31/10/2026) ----------
  // Un fichier .xlsx est un .zip de fichiers XML : petit assembleur ZIP « stocké » (sans compression)
  // et XML minimal d'un classeur à un onglet. Mécanisme de MonDjai/Salaire (7D), sans bibliothèque,
  // sans réseau. Contenu : la période affichée dans Télécharger (Jour, Semaine ou Mois), mêmes chiffres
  // que l'image (calculerPlage). Montants écrits en texte « 12 000 F » (espace garanti pour les
  // milliers, quel que soit le tableur) ; dates en vraies dates Excel (jj/mm/aaaa).
  function xlsOctets(str){
    var out = [];
    for(var i = 0; i < str.length; i++){
      var c = str.charCodeAt(i);
      if(c >= 0xD800 && c <= 0xDBFF && i + 1 < str.length){
        var c2 = str.charCodeAt(i + 1);
        if(c2 >= 0xDC00 && c2 <= 0xDFFF){ c = ((c - 0xD800) << 10) + (c2 - 0xDC00) + 0x10000; i++; }
      }
      if(c < 0x80) out.push(c);
      else if(c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 0x3F));
      else if(c < 0x10000) out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));
      else out.push(0xF0 | (c >> 18), 0x80 | ((c >> 12) & 0x3F), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));
    }
    return new Uint8Array(out);
  }
  function xlsEsc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function xlsCol(n){ var s = "", k = n + 1; while(k > 0){ var m = (k - 1) % 26; s = String.fromCharCode(65 + m) + s; k = Math.floor((k - 1) / 26); } return s; }
  function xlsSerieDate(cle){
    var p = String(cle).split("-");
    return Math.round((Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) - Date.UTC(1899, 11, 30)) / 86400000);
  }
  var XLS_CRC = (function(){
    var t = [];
    for(var n = 0; n < 256; n++){ var c = n; for(var k = 0; k < 8; k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); } t[n] = c >>> 0; }
    return t;
  })();
  function xlsCrc32(b){ var c = 0xFFFFFFFF; for(var i = 0; i < b.length; i++){ c = XLS_CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); } return (c ^ 0xFFFFFFFF) >>> 0; }
  function xlsU16(a, n){ a.push(n & 0xFF, (n >>> 8) & 0xFF); }
  function xlsU32(a, n){ a.push(n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF); }
  function xlsConcat(tab){
    var total = 0; tab.forEach(function(a){ total += a.length; });
    var out = new Uint8Array(total), p = 0;
    tab.forEach(function(a){ out.set(a, p); p += a.length; });
    return out;
  }
  function xlsZip(fichiers){
    var d = new Date();
    var heure = ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | (Math.floor(d.getSeconds() / 2) & 0x1F);
    var jour = (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0xF) << 5) | (d.getDate() & 0x1F);
    var locaux = [], centraux = [], offset = 0;
    fichiers.forEach(function(f){
      var nom = xlsOctets(f.nom), data = f.octets, crc = xlsCrc32(data);
      var l = [];

      xlsU32(l, crc); xlsU32(l, data.length); xlsU32(l, data.length); xlsU16(l, nom.length); xlsU16(l, 0);
      var local = xlsConcat([new Uint8Array(l), nom, data]);

      var c = [];
      xlsU32(c, 0x02014b50); xlsU16(c, 20); xlsU16(c, 20); xlsU16(c, 0); xlsU16(c, 0); xlsU16(c, heure); xlsU16(c, jour);
      xlsU32(c, crc); xlsU32(c, data.length); xlsU32(c, data.length); xlsU16(c, nom.length);
      xlsU16(c, 0); xlsU16(c, 0); xlsU16(c, 0); xlsU16(c, 0); xlsU32(c, 0); xlsU32(c, offset);

  // Données de l'export : la période affichée dans Télécharger (mêmes calculs que l'image).
